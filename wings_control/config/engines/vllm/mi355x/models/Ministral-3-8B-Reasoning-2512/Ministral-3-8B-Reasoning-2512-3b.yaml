# 来源追溯
upstream_sources:
  - id: vllm_recipe_ministral-3-reasoning
    kind: official_recipe
    repo: recipes
    file: models/mistralai/Ministral-3-8B-Reasoning-2512.yaml
    url: "https://recipes.vllm.ai/mistralai/Ministral-3-8B-Reasoning-2512"
    date_updated: 2026-05-06
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Ministral-3-Reasoning  # 模型名称
  slug: ministral-3-reasoning  # 模型标识
  provider: Mistral AI  # 提供者/厂商
  description: "Ministral 3 Reasoning family (3B/8B/14B) with BF16 weights, vision support, and 256K context"  # 模型描述
  model_id: mistralai/Ministral-3-3B-Reasoning-2512  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 8B  # 总参数量
  active_parameters: 8B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 8  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.11.0"  # 最低引擎版本要求
  date_updated: 2026-05-06  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)ministral[-.]?3[-.]?reasoning"
  variant_name: Ministral-3-8B-Reasoning-2512-3b

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2304
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Mistral tool-call parser with automatic tool choice
    args: [--enable-auto-tool-choice, --tool-call-parser, mistral]
  reasoning:
    description: "Mistral reasoning parser extracts <think>...</think> into message.reasoning"
    args: [--reasoning-parser, mistral]
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only.
    args: [--mm-encoder-tp-mode, data]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_ministral-3-reasoning#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: mistralai/Ministral-3-3B-Reasoning-2512
          tokenizer_mode: mistral
          config_format: mistral
          load_format: mistral
          tensor_parallel_size: 1
          no_enable_prefix_caching: true
        env:
          VLLM_ROCM_USE_AITER: 1
          SAFETENSORS_FAST_GPU: 1
  multi_node:
    source_ref: "vllm_recipe_ministral-3-reasoning#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: mistralai/Ministral-3-3B-Reasoning-2512
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            no_enable_prefix_caching: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            SAFETENSORS_FAST_GPU: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: mistralai/Ministral-3-3B-Reasoning-2512
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            no_enable_prefix_caching: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            SAFETENSORS_FAST_GPU: 1
