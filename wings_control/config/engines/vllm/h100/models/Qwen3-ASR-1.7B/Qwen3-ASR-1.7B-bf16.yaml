# 模型基本信息
model:
  name: Qwen3-ASR-1.7B  # 模型名称
  slug: qwen3-asr-1.7b  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: "Speech-to-text model supporting 11 languages, multiple accents, and singing voice with customizable text-context prompting."  # 模型描述
  model_id: Qwen/Qwen3-ASR-1.7B  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 2.3B  # 总参数量
  active_parameters: 2.3B  # 激活参数量（MoE 模型）
  context_length: 65536  # 最大上下文长度
  vram_minimum_gb: 4  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.12.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?asr[-.]?1.7b"
  variant_name: Qwen3-ASR-1.7B-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 640
  multi_node: false

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_qwen3-asr-1.7b#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3-ASR-1.7B
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_qwen3-asr-1.7b#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: Qwen/Qwen3-ASR-1.7B
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: Qwen/Qwen3-ASR-1.7B
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
