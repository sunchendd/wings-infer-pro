# vLLM 0.31.0 / RTX PRO 5000 72GB unified recipe and SmartAccel.
schema: v2
profile:
  engine: vllm
  version: v0.31.0
  hardware:
  - RTX-PRO-5000-72GB-Blackwell_72G
  model: Qwen3.5-397B-A17B-NVFP4
upstream_sources:
- id: qwen3.5-397b_nvfp4_manual
  kind: manual
  repo: null
  file: null
  url: https://huggingface.co/nvidia/Qwen3.5-397B-A17B-NVFP4
  date_updated: 2026-07-14
  note: 手工录入
model:
  name: Qwen3.5-397B
  slug: qwen3.5-397b
  provider: Qwen
  description: Multimodal MoE model with gated delta networks architecture, 397B total / 17B active parameters,
    up to 262K context（NVFP4 量化）
  model_id: nvidia/Qwen3.5-397B-A17B-NVFP4
  architecture: moe
  parameter_count: 397B
  active_parameters: 17B
  context_length: 262144
  vram_minimum_gb: 384
  tasks:
  - multimodal
  - text
  min_engine_version: 0.31.0
  date_updated: 2026-07-14
  match:
  - name_pattern: (?i)qwen3.5[-.]?397b
  variant_name: Qwen3.5-397B-A17B-NVFP4
hardware_profile:
  gpu_count: 8
  vram_gb: 576
  multi_node: true
features:
  tool_calling:
    description: Enable tool calling with the Qwen3 chat-template tool parser.
    args:
    - --tool-call-parser
    - qwen3_coder
    - --enable-auto-tool-choice
  reasoning:
    description: Enable reasoning/thinking mode with the Qwen3 reasoning parser.
    args:
    - --reasoning-parser
    - qwen3
  kv_offloading:
    description: KV cache native offloading to reduce GPU memory usage.
    args:
    - --kv_offloading_backend
    - native
    - --kv_offloading_size
    - '200'
  spec_decoding:
    description: Multi-Token Prediction speculative decoding with 3 speculative tokens.
    args:
    - --speculative-config
    - '{"method":"mtp", "num_speculative_tokens":3}'
scenarios:
  standalone:
    source_ref: qwen3.5-397b_nvfp4_manual#single_node_tp
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: nvidia/Qwen3.5-397B-A17B-NVFP4
          host: 0.0.0.0
          port: 5684
          trust_remote_code: true
          kv_cache_dtype: fp8
          tensor_parallel_size: 8
          mm_encoder_tp_mode: data
          enable_prefix_caching: true
          kernel_config:
            moe_backend: flashinfer_cutlass
        env:
          VLLM_DEEP_GEMM_WARMUP: skip
          VLLM_USE_DEEP_GEMM: 0
          NCCL_P2P_LEVEL: SYS
          NCCL_SHM_DISABLE: 1
  multi_node:
    source_ref: qwen3.5-397b_nvfp4_manual#multi_node_tp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:
          engine_config:
            model: nvidia/Qwen3.5-397B-A17B-NVFP4
            host: 0.0.0.0
            port: 5684
            trust_remote_code: true
            kv_cache_dtype: fp8
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            mm_encoder_tp_mode: data
            enable_prefix_caching: true
            kernel_config:
              moe_backend: flashinfer_cutlass
          env:
            VLLM_DEEP_GEMM_WARMUP: skip
            VLLM_USE_DEEP_GEMM: 0
            NCCL_P2P_LEVEL: SYS
            NCCL_SHM_DISABLE: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:
          engine_config:
            model: nvidia/Qwen3.5-397B-A17B-NVFP4
            host: 0.0.0.0
            port: 5684
            trust_remote_code: true
            kv_cache_dtype: fp8
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            mm_encoder_tp_mode: data
            enable_prefix_caching: true
            kernel_config:
              moe_backend: flashinfer_cutlass
          env:
            VLLM_DEEP_GEMM_WARMUP: skip
            VLLM_USE_DEEP_GEMM: 0
            NCCL_P2P_LEVEL: SYS
            NCCL_SHM_DISABLE: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: mtp
          cli_params:
            speculative_config:
              method: mtp
              num_speculative_tokens: 3
          envs: {}
        kv_offload:
        - name: cpu
          cli_params:
            kv_offloading_backend: native
            kv_offloading_size: '{memory_capacity_gb}'
          envs: {}
        sparse:
        - name: performance_first
          cli_params:
            kv_cache_dtype: fp8
          envs: {}
        - name: accuracy_first
          cli_params:
            kv_cache_dtype: fp8
          envs: {}
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: mtp
          cli_params:
            speculative_config:
              method: mtp
              num_speculative_tokens: 3
          envs: {}
        kv_offload:
        - name: cpu
          cli_params:
            kv_offloading_backend: native
            kv_offloading_size: '{memory_capacity_gb}'
          envs: {}
        sparse:
        - name: performance_first
          cli_params:
            kv_cache_dtype: fp8
          envs: {}
        - name: accuracy_first
          cli_params:
            kv_cache_dtype: fp8
          envs: {}
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: prefill
          index: 0
          sparse:
          - name: performance_first
            cli_params:
              kv_cache_dtype: fp8
            envs: {}
          - name: accuracy_first
            cli_params:
              kv_cache_dtype: fp8
            envs: {}
        - role: decode
          index: 0
          decoding:
          - name: mtp
            cli_params:
              speculative_config:
                method: mtp
                num_speculative_tokens: 3
            envs: {}
          sparse:
          - name: performance_first
            cli_params:
              kv_cache_dtype: fp8
            envs: {}
          - name: accuracy_first
            cli_params:
              kv_cache_dtype: fp8
            envs: {}
