# SmartAccel 加速配置(decoding=suffix / kv_offload=cpu_disk)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: MiniMax-M2.7
  variant_name: "MiniMax-M2.7-nvfp4"
  match:
    - name_pattern: "(?i)minimax[-.]?m2[-.]?7"
smart_accel:
  decoding:
    - name: suffix
      cli_params:
        speculative_config:
          method: suffix
          num_speculative_tokens: 10
      envs: {}
  kv_offload:
    - name: cpu_disk
      packages:
        lmcache: v0.3.15
      cli_params:
        kv_transfer_config:
          kv_connector: LMCacheConnectorV1
          kv_role: kv_both
          kv_load_failure_policy: recompute
      envs:
        LMCACHE_LOCAL_CPU: "True"
        LMCACHE_MAX_LOCAL_CPU_SIZE: "15"
        LMCACHE_CHUNK_SIZE: "256"
        LMCACHE_EXTRA_CONFIG: '{"use_odirect": true}'
        LMCACHE_PRE_CACHING_HASH_ALGORITHM: "sha256_cbor_64bit"
        LMCACHE_LOCAL_DISK: "{disk_path}"
        LMCACHE_MAX_LOCAL_DISK_SIZE: "{= disk_capacity_gb // tp_size}"  # 磁盘总容量(KV_DISK_OFFLOAD_SIZE)÷ TP 平摊到每 rank(对齐老 afb7e73)
