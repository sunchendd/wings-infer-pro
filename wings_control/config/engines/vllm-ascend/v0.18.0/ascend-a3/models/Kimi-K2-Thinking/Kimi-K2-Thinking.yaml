# 来源追溯
upstream_sources:
  - id: vllm_ascend_kimi-k2-thinking
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/Kimi-K2-Thinking.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.18.0/docs/source/tutorials/models/Kimi-K2-Thinking.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: Kimi-K2-Thinking  # 模型名称
  provider: moonshotai  # 提供者/厂商
  model_id: moonshotai/Kimi-K2-Thinking  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.18.0  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)kimi[-.]?k2[-.]?thinking"
  variant_name: Kimi-K2-Thinking  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_kimi-k2-thinking#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: "moonshotai/Kimi-K2-Thinking"
          tensor_parallel_size: 16
          port: 8000
          max_model_len: 8192
          max_num_batched_tokens: 8192
          max_num_seqs: 12
          gpu_memory_utilization: 0.9
          trust_remote_code: true
          enable_expert_parallel: true
          enable_prefix_caching: false
        env:
          VLLM_USE_MODELSCOPE: "True"
          HCCL_BUFFSIZE: 1024
          TASK_QUEUE_ENABLE: 1
          OMP_PROC_BIND: "false"
          HCCL_OP_EXPANSION_MODE: AIV
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
