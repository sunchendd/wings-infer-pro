model:
  name: GLM-5.3
  variant_name: GLM-5.3-w8a8c8-128k-4node
  match:
  - name_pattern: (?i)^GLM\-5\.3\-w8a8c8\-128k\-4node$
smart_accel:
  pd_disaggregation:
    source_ref: vllm_ascend_glm-5.3_w8a8c8_128k_4node_a3_manual#pd_cluster
    match: {distributed: true, pd_role: null}
    strategies:
      pd_cluster:
        default_strategy: true
        nodes:
        - role: prefill
          index: 0
          sparse:
          - name: performance_first
            cli_params: {hf_overrides: {use_index_cache: true, index_topk_freq: 8}}
            envs: {}
          - name: accuracy_first
            cli_params: {hf_overrides: {use_index_cache: true, index_topk_freq: 4}}
            envs: {}
        - role: decode
          index: 0
          decoding:
          - name: mtp
            cli_params:
              speculative_config: {num_speculative_tokens: 3, method: deepseek_mtp, enforce_eager: true}
            envs: {}
          sparse:
          - name: performance_first
            cli_params: {hf_overrides: {use_index_cache: true, index_topk_freq: 8}}
            envs: {}
          - name: accuracy_first
            cli_params: {hf_overrides: {use_index_cache: true, index_topk_freq: 4}}
            envs: {}
