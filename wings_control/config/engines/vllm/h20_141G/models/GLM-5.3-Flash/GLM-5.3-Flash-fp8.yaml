upstream_sources:
  - id: glm53_flash_h20_mtp3_cpu_offload_20260920
    kind: manual
    repo: null
    file: null
    url: null
    note: User-provided standalone vLLM command for NVIDIA H20 x8.

model:
  name: GLM-5.3-Flash
  provider: GLM (Z-AI)
  model_id: null
  min_engine_version: glm-5.3-flash
  match:
    - name_pattern: "(?i)^glm[-.]?5[-.]?3[-.]?flash$"
  variant_name: GLM-5.3-Flash

hardware_profile:
  gpu_count: 8
  vram_gb: 1128
  multi_node: false

features:
  tool_calling:
    description: GLM-4.7 tool call parser with automatic tool choice.
    args: [--tool-call-parser, glm47, --enable-auto-tool-choice]
  reasoning:
    description: GLM-4.5 reasoning parser.
    args: [--reasoning-parser, glm45]
  spec_decoding:
    description: MTP speculative decoding with three speculative tokens.
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":3}"]
  kv_offloading:
    description: SimpleCPUOffloadConnector with 32 GiB per tensor-parallel rank.
    args: [--kv-transfer-config, "{\"kv_connector\":\"SimpleCPUOffloadConnector\",\"kv_role\":\"kv_both\",\"kv_connector_extra_config\":{\"cpu_bytes_to_use_per_rank\":34359738368,\"lazy_offload\":false}}"]

scenarios:
  standalone:
    source_ref: "glm53_flash_h20_mtp3_cpu_offload_20260920#single_node_tp8"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Single-Node Tensor Parallel
        orientation: throughput
        default_strategy: true
        engine_config:
          model: /models
          host: "0.0.0.0"
          tensor_parallel_size: 8
          no_enable_flashinfer_autotune: true
          max_num_seqs: 512
          gpu_memory_utilization: 0.92
          enable_expert_parallel: true
          enable_prefix_caching: true
        env: {}
