# 来源追溯
upstream_sources:
  - id: vllm_ascend_meta-llama-3-8b_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/meta-llama/Meta-Llama-3-8B"
    note: 用户提供 vLLM Ascend 启动命令，手工录入。

# 模型基本信息
model:
  name: Meta-Llama-3-8B  # 模型名称
  provider: Meta  # 提供者/厂商
  model_id: meta-llama/Meta-Llama-3-8B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)meta[-.]?llama[-.]?3[-.]?8b"
  variant_name: Meta-Llama-3-8B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_meta-llama-3-8b_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: meta-llama/Meta-Llama-3-8B
          trust_remote_code: true
          max_model_len: 4096
          host: "0.0.0.0"
          port: 17000
        env: {}
