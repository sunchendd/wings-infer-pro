# SmartAccel 加速配置(scenario 嵌套结构,对齐 wings_control scenarios,见 smart-yaml.md §1.1)。
# 每 scenario 带 source_ref(来源追溯)+ match(作者自检,loader 不读)+ strategies;
# PD 分离用 strategies.pd_cluster.nodes[].role 区分 P/D。
# 缺特性键即该场景不产出:P 节点(standalone.prefill)仅 sparse;D 节点(decode)有 decoding+sparse;
# PD 两节点都不声明 kv_offload(不支持卸载)。standalone/multi_node 三特性全声明。
# topology 路由(yaml_loader._route_smart_accel_block):
#   standalone/None → standalone.strategies.single_node
#   multi_node      → multi_node.strategies.multi_node_dp
#   pd_prefill      → pd_disaggregation.strategies.pd_cluster.nodes[role=prefill]
#   pd_decode       → pd_disaggregation.strategies.pd_cluster.nodes[role=decode]
smart_accel:
  standalone:
    source_ref: smart_accel_all_features_test#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: draft_model
          requires_model_path: true
          cli_params:
            speculative_config:
              model: $path
              num_speculative_tokens: 4
          envs: {}
        - name: eagle3
          requires_model_path: true
          draft_arch:
          - eagle3
          cli_params:
            speculative_config:
              method: eagle3
              model: $path
              num_speculative_tokens: 3
              enforce_eager: true
          envs:
            EARS_TOLERANCE: '0.3'
        - name: mtp
          cli_params:
            speculative_config:
              method: mtp
              num_speculative_tokens: 2
          envs:
            EARS_TOLERANCE: '0.3'
        - name: eagle
          requires_model_path: true
          draft_arch:
          - eagle
          cli_params:
            speculative_config:
              model: $path
              method: eagle
              num_speculative_tokens: 3
              max_model_len: '65536'
          envs: {}
        - name: dflash
          requires_model_path: true
          draft_arch:
          - dflash
          cli_params:
            speculative_config:
              model: $path
              method: dflash
              num_speculative_tokens: 7
          envs: {}
        - name: suffix
          cli_params:
            speculative_config:
              method: suffix
              num_speculative_tokens: 16
              suffix_lookup_max_len: 3
          envs: {}
        sparse:
        - name: performance_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
        kv_offload:
        - name: cpu
          cli_params:
            kv_transfer_config:
              kv_connector: OffloadingConnector
              kv_role: kv_both
              kv_connector_extra_config:
                num_cpu_blocks: '{mem_gb_to_blocks}'
          envs:
            KV_OFFLOAD_CPU_ONLY: '1'
        - name: cpu
          cli_params:
            kv_transfer_config:
              kv_connector: AscendStoreConnector
              kv_role: kv_both
              kv_load_failure_policy: recompute
              kv_connector_extra_config:
                lookup_rpc_port: '1'
                backend: mooncake
          envs:
            MOONCAKE_CONFIG_PATH: /shared-volume/mooncake.json
            LD_LIBRARY_PATH: /usr/local/lib:${LD_LIBRARY_PATH:-}
          files:
          - path: mooncake.json
            mode: '0755'
            scope: all
            content: |
              {
                "local_hostname": "{rank_ip}",
                "metadata_server": "P2PHANDSHAKE",
                "protocol": "ascend",
                "device_name": "",
                "master_server_address": "{master_ip}:50088",
                "global_segment_size": "{= memory_capacity_gb // gpu_count}GB",
                "preferred_segment": false,
                "prefer_alloc_in_same_node": true
              }
          - path: start_kv_serve.sh
            mode: '0755'
            scope: master
            content: |
              #!/usr/bin/env bash
              # mooncake_master daemon(仅 master 起;framework 自动 bash <path> &)。
              /usr/local/bin/mooncake_master --port 50088 \
                  --eviction_high_watermark_ratio 0.9 \
                  --eviction_ratio 0.1 \
                  --default_kv_lease_ttl 11000
        - name: cpu
          cli_params:
            kv_transfer_config:
              kv_connector: AscendStoreConnector
              kv_role: kv_both
              kv_load_failure_policy: recompute
              kv_connector_extra_config:
                lookup_rpc_port: '0'
                backend: memcache
          envs:
            MMC_META_CONFIG_PATH: /shared-volume/mmc_meta.conf
            MMC_LOCAL_CONFIG_PATH: /shared-volume/mmc_local.conf
          files:
          - path: mmc_local.conf
            mode: '0755'
            scope: all
            content: |
              ock.mmc.meta_service_url = tcp://{master_ip}:15000
              ock.mmc.local_service.config_store_url = tcp://{rank_ip}:16000
              ock.mmc.log_level = info
              ock.mmc.local_service.world_size = 256
              ock.mmc.local_service.protocol = device_rdma
              ock.mmc.local_service.dram.size = {= memory_capacity_gb // gpu_count}GB
          - path: mmc_meta.conf
            mode: '0755'
            scope: master
            content: |
              ock.mmc.meta_service_url = tcp://{master_ip}:15000
              ock.mmc.meta_service.config_store_url = tcp://{rank_ip}:16000
              ock.mmc.log_level = info
          - path: start_kv_serve.sh
            mode: '0755'
            content: |
              #!/usr/bin/env bash
              # MetaService daemon(仅 master 起;framework 自动 bash <path> &)。
              python -c "from memcache_hybrid import MetaService; MetaService.main()"
        # ─ lmcache_mp(vllm lmcache MP 分离部署,方法四;独立 lmcache server,类似 mooncake daemon 模式)。
        #   connector=LMCacheMPConnector + cli_params.kv_connector_extra_config(lmcache.mp.port/mq_timeout);
        #   独立 lmcache server 由 files.start_kv_serve.sh 声明(仅 master bash &,不监听端口)。
        #   server 的 L1 配置(--l1-size-gb 等)是 server flag,放 daemon 脚本 content;不进 cli_params。
        #   测试 lmcache 命中时建议关 prefix caching(--no-enable-prefix-caching),避免 prefix cache 干扰。
        - name: cpu
          cli_params:
            kv_transfer_config:
              kv_connector: LMCacheMPConnector
              kv_role: kv_both
              kv_connector_extra_config:
                lmcache.mp.port: 5555
                lmcache.mp.mq_timeout: 300
          envs: {}
          files:
          - path: start_kv_serve.sh
            mode: '0755'
            scope: master
            content: |
              #!/usr/bin/env bash
              # lmcache server daemon(仅 master 起;framework 自动 bash <path> &)。
              # L1/L2 容量、worker 数、eviction 策略等都是 server flag,按部署调参。
              lmcache server \
                --port 5555 \
                --http-port 7899 \
                --l1-size-gb {memory_capacity_gb} \
                --l1-init-size-gb 20 \
                --max-gpu-workers 1 \
                --max-cpu-workers 8 \
                --chunk-size 1024 \
                --l1-align-bytes 16384 \
                --eviction-trigger-watermark 0.85 \
                --eviction-ratio 0.10 \
                --eviction-policy LRU \
                --supported-transfer-mode lmcache_driven
        - name: disk
          cli_params:
            kv_transfer_config:
              kv_connector: LMCacheConnectorV1
              kv_role: kv_both
              kv_connector_extra_config:
                local_disk: '{disk_path}'
                max_local_disk_size: '{disk_capacity_gb}'
          envs:
            LMCACHE_CONFIG_FILE: /shared-volume/lmcache_config.yaml
            LMCACHE_LOCAL_DISK: '{disk_path}'
            LMCACHE_MAX_LOCAL_DISK_SIZE: '{disk_capacity_gb}'
          files:
          - name: lmcache_config.yaml
            mode: '0755'
            content: |
              chunk_size: 256               # yaml 暴露配置,默认 256(MaaS 不传)
              local_disk: {disk_path}
              max_local_disk_size: {disk_capacity_gb}
              extra_config:
                wings:
                  qat:                      # disk 命中即给;enabled 随 qat 开关
                    enabled: {qat_enabled}
                    module_name: kv_agent
                    instance_num: {qat_device_count}
                    loss_level: {qat_compression_level}
                    log_enabled: 1
        - name: cpu_disk
          cli_params:
            kv_transfer_config:
              kv_connector: LMCacheConnectorV1
              kv_role: kv_both
              kv_connector_extra_config:
                local_cpu: true
                max_local_cpu_size: '{memory_capacity_gb}'
                local_disk: '{disk_path}'
                max_local_disk_size: '{disk_capacity_gb}'
          envs:
            LMCACHE_CONFIG_FILE: /shared-volume/lmcache_config.yaml
            LMCACHE_LOCAL_CPU: 'true'
            LMCACHE_MAX_LOCAL_CPU_SIZE: '{memory_capacity_gb}'
            LMCACHE_LOCAL_DISK: '{disk_path}'
            LMCACHE_MAX_LOCAL_DISK_SIZE: '{disk_capacity_gb}'
          files:
          - name: lmcache_config.yaml
            mode: '0755'
            content: |
              chunk_size: 256
              local_cpu: true
              max_local_cpu_size: {memory_capacity_gb}
              local_disk: {disk_path}
              max_local_disk_size: {disk_capacity_gb}
              extra_config:
                wings:
                  qat:
                    enabled: {qat_enabled}
                    module_name: kv_agent
                    instance_num: {qat_device_count}
                    loss_level: {qat_compression_level}
                    log_enabled: 1
        custom_features:
        - name: Mamba prefix caching
          cli_params:
            mamba_cache: true
          envs: {}
  multi_node:
    source_ref: smart_accel_all_features_test#multi_node
    match:
