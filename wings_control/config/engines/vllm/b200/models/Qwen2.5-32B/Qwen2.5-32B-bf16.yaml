# 来源追溯
upstream_sources:
  - id: vllm_recipe_qwen2.5-32b
    kind: official_recipe
    repo: recipes
    file: models/Qwen/Qwen2.5-32B.yaml
    url: "https://recipes.vllm.ai/Qwen/Qwen2.5-32B"
    date_updated: 2026-06-04
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Qwen2.5-32B  # 模型名称
  slug: qwen2.5-32b  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: Qwen2.5 32B dense base (pretrained) language model for text completion — verified on TPU v6e (Trillium).  # 模型描述
  model_id: Qwen/Qwen2.5-32B  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 32B  # 总参数量
  active_parameters: 32B  # 激活参数量（MoE 模型）
  context_length: 131072  # 最大上下文长度
  vram_minimum_gb: 77  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.6.2"  # 最低引擎版本要求
  date_updated: 2026-06-04  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen2.5[-.]?32b"
  variant_name: Qwen2.5-32B-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 1440
  multi_node: false

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_qwen2.5-32b#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/Qwen2.5-32B
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_qwen2.5-32b#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: Qwen/Qwen2.5-32B
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: Qwen/Qwen2.5-32B
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
