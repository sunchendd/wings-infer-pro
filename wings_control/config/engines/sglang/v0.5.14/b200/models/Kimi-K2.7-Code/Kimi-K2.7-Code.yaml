# 来源追溯
upstream_sources:
  - id: sglang_kimi-k2.7-code
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Moonshotai/Kimi-K2.7-Code.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Moonshotai/Kimi-K2.7-Code.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Kimi-K2.7-Code  # 模型名称
  provider: moonshotai  # 提供者/厂商
  model_id: moonshotai/Kimi-K2.7-Code  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)kimi[-.]?k2.7[-.]?code"
  variant_name: Kimi-K2.7-Code  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1440  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, kimi_k2]
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, kimi_k2]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_kimi-k2.7-code#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: moonshotai/Kimi-K2.7-Code
          model_path: moonshotai/Kimi-K2.7-Code
          tp: 8
          trust_remote_code: true
          host: "0.0.0.0"
          port: 30000
        env: {}
        default_strategy: true
