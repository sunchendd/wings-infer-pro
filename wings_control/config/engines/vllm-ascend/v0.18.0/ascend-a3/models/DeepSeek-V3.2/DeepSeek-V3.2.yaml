              trust_remote_code: true
              max_num_seqs: 4
              gpu_memory_utilization: 0.95
              no_enable_prefix_caching: true
              async_scheduling: true
              quantization: ascend
              kv_transfer_config:
                kv_connector: MooncakeLayerwiseConnector
                kv_role: kv_consumer
