# SmartAccel 加速配置(无 smart-accel 特性(embedding/pooling 模型))
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: Jina Embeddings v5 Text Small
  variant_name: "jina-embeddings-v5-text-small-classification"
  match:
    - name_pattern: "(?i)jina[-.]?embeddings[-.]?v5[-.]?text[-.]?small"
smart_accel: {}
