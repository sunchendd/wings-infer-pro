# 来源追溯
upstream_sources:
  - id: vllm_recipe_llama3.3-70b
    kind: official_recipe
    repo: recipes
    file: models/meta-llama/Llama-3.3-70B-Instruct.yaml
    url: "https://recipes.vllm.ai/meta-llama/Llama-3.3-70B-Instruct"
    date_updated: 2026-04-16
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Llama-3.3-70B  # 模型名称
  slug: llama3.3-70b  # 模型标识
  provider: Meta  # 提供者/厂商
  description: Llama 3.3 70B dense model with NVIDIA FP8/FP4 quantized variants for Hopper and Blackwell GPUs  # 模型描述
  model_id: meta-llama/Llama-3.3-70B-Instruct  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 70B  # 总参数量
  active_parameters: 70B  # 激活参数量（MoE 模型）
  context_length: 131072  # 最大上下文长度
  vram_minimum_gb: 170  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.12.0"  # 最低引擎版本要求
  date_updated: 2026-04-16  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)llama3.3[-.]?70b"
  variant_name: Llama-3.3-70B-Instruct-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 640
  multi_node: false

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_llama3.3-70b#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: meta-llama/Llama-3.3-70B-Instruct
          tensor_parallel_size: 8
          async_scheduling: true
          no_enable_prefix_caching: true
          max_num_batched_tokens: 8192
        env: {}
  multi_node:
    source_ref: "vllm_recipe_llama3.3-70b#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: meta-llama/Llama-3.3-70B-Instruct
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            async_scheduling: true
            no_enable_prefix_caching: true
            max_num_batched_tokens: 8192
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: meta-llama/Llama-3.3-70B-Instruct
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            async_scheduling: true
            no_enable_prefix_caching: true
            max_num_batched_tokens: 8192
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: meta-llama/Llama-3.3-70B-Instruct
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            async_scheduling: true
            no_enable_prefix_caching: true
            max_num_batched_tokens: 8192
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: meta-llama/Llama-3.3-70B-Instruct
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            async_scheduling: true
            no_enable_prefix_caching: true
            max_num_batched_tokens: 8192
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
