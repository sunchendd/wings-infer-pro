# 来源追溯
upstream_sources:
  - id: sglang_nvidia-nemotron3-super
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/NVIDIA/Nemotron3-Super.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/NVIDIA/Nemotron3-Super.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: NVIDIA Nemotron3-Super  # 模型名称
  provider: nvidia  # 提供者/厂商
  model_id: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)nvidia[-.]?nemotron3[-.]?super"
  variant_name: NVIDIA Nemotron3-Super  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, qwen3_coder]
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, nemotron_3]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_nvidia-nemotron3-super#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
          model_path: nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16
          host: "0.0.0.0"
          port: 5000
          trust_remote_code: true
          tp: 4
        env: {}
        default_strategy: true
