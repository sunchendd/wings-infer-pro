# SmartAccel 加速配置(decoding=suffix;vLLM 0.23.0 不支持 lmcache/KV 卸载,故无 kv_offload)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: Qwen-AgentWorld-35B-A3B
  variant_name: "Qwen-AgentWorld-35B-A3B"
  match:
    - name_pattern: "(?i)qwen[-.]?agentworld[-.]?35b[-.]?a3b"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: suffix
          cli_params:
            speculative_config:
              method: suffix
              num_speculative_tokens: 32
          envs: {}
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: suffix
          cli_params:
            speculative_config:
              method: suffix
              num_speculative_tokens: 32
          envs: {}
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: decode
          index: 0
          decoding:
          - name: suffix
            cli_params:
              speculative_config:
                method: suffix
                num_speculative_tokens: 32
            envs: {}
