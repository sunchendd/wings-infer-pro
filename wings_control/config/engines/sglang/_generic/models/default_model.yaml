# 未知硬件的最小保底配置，仅用于尽力拉起，不代表硬件已通过验收。
hardware:
  generic: true

engine:
  name: sglang

scenarios:
  standalone:
    strategies:
      generic:
        default_strategy: true
        engine_config:
          trust_remote_code: true
          context_length: 4096
          tp_size: 1

  multi_node:
    strategies:
      generic:
        default_strategy: true
        head:
          engine_config:
            trust_remote_code: true
            context_length: 4096
            tp_size: 2
            nnodes: 2
            node_rank: 0
            dist_init_addr: "${HEAD_IP}:5000"
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:
          engine_config:
            trust_remote_code: true
            context_length: 4096
            tp_size: 2
            nnodes: 2
            node_rank: 1
            dist_init_addr: "${HEAD_IP}:5000"
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
