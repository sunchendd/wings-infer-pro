# SmartAccel 三特性加速配置
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: Qwen3.5-397B-A17B
  variant_name: "Qwen3.5-397B-A17B-nvfp4"
  match:
    - name_pattern: "(?i)qwen3[-.]?5[-.]?397b[-.]?a17b"
smart_accel:
  decoding:
    - name: mtp
      priority: 2
      cli_params:
        speculative_config:
          method: mtp
          num_speculative_tokens: 3
      envs: {}
    - name: suffix
      priority: 1
      packages:
        arctic-inference: 0.1.1
      cli_params:
        speculative_config:
          method: suffix
          num_speculative_tokens: 16
      envs: {}
  kv_offload:
    - name: cpu
      cli_params:
        kv_transfer_config:
          kv_connector: OffloadingConnector
          kv_role: kv_both
          kv_connector_extra_config:
            # 原生 vLLM(CUDA)≥v0.14 读 cpu_bytes_to_use(字节,全 TP 合计),
            # 静默忽略 num_cpu_blocks;此处 rtx_pro_5000 为 NVIDIA/CUDA,故用字节。
            cpu_bytes_to_use: "{mem_gb_to_bytes}"
      envs: {}
