# vLLM 0.31.0 / RTX PRO 5000 72GB unified recipe and SmartAccel.
schema: v2
profile:
  engine: vllm
  version: v0.31.0
  hardware:
  - RTX-PRO-5000-72GB-Blackwell_72G
  model: DeepSeek-V4-Pro-0813
upstream_sources:
- id: dsv4_pro_patch_vllm0280_sm120_tp16
  kind: manual
  repo: null
  file: dsv4_pro_patch/deployment/perf_start_v4pro_tp16ep_lmcache_mp.sh
  url: null
  note: DeepSeek V4 Pro 单机 16 卡 TP16+EP16+LMCache MP 实测配置，补丁已移植至 vLLM 0.28.0。
model:
  name: DeepSeek-V4-Pro-0813
  slug: deepseek-v4-pro-0813
  provider: DeepSeek
  description: DeepSeek V4 Pro MoE model using the 0813 patched SM120 checkpoint.
  model_id: deepseek-ai/DeepSeek-V4-Pro
  architecture: moe
  parameter_count: 1600B
  active_parameters: 49B
  context_length: 1048576
  vram_minimum_gb: 960
  tasks:
  - text
  min_engine_version: 0.31.0
  match:
  - name_pattern: (?i)deepseek[-.]?v4[-.]?pro[-.]?0813
  variant_name: DeepSeek-V4-Pro-0813
hardware_profile:
  gpu_count: 16
  vram_gb: 1152
  multi_node: false
features:
  tool_calling:
    description: Enable DeepSeek V4 tool calling.
    args:
    - --tokenizer-mode
    - deepseek_v4
    - --enable-auto-tool-choice
    - --tool-call-parser
    - deepseek_v4
  reasoning:
    description: Enable DeepSeek V4 reasoning parsing.
    args:
    - --reasoning-parser
    - deepseek_v4
  spec_decoding:
    description: Enable the validated D-Spark probabilistic decoding configuration.
    args:
    - --speculative-config
    - '{"method":"dspark","num_speculative_tokens":5,"draft_sample_method":"probabilistic"}'
  lmcache:
    description: Enable the patched LMCache MP native-pointer connector.
    kv_transfer:
      description: Connect vLLM to the colocated LMCache MP server.
      args:
      - --kv-transfer-config
      - '{"kv_connector":"LMCacheMPConnector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.port":5555,"lmcache.mp.mq_timeout":300,"lmcache.mp.sync_retrieve_before_forward":true}}'
  sparse_index:
    description: Use the validated MXFP4 indexer cache performance mode.
    args:
    - --no-enable-flashinfer-autotune
    - --hf-overrides
    - '{"use_index_cache":true,"index_topk_freq":8}'
scenarios:
  standalone:
    source_ref: dsv4_pro_patch_vllm0280_sm120_tp16#single_node_tep
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: throughput
        default_strategy: true
        engine_config:
          model: deepseek-ai/DeepSeek-V4-Pro
          host: 0.0.0.0
          port: 8000
          trust_remote_code: true
          tensor_parallel_size: 16
          enable_expert_parallel: true
          enable_ep_weight_filter: true
          max_model_len: 150000
          block_size: 256
          gpu_memory_utilization: 0.92
          kv_cache_memory_bytes: 5583457485
          kv_cache_dtype: fp8
          max_num_seqs: 256
          attention_config:
            indexer_kv_dtype: mxfp4
          max_num_batched_tokens: 2048
          compilation_config:
            mode: 0
            cudagraph_mode: FULL_DECODE_ONLY
            max_cudagraph_capture_size: 64
        env:
          NCCL_P2P_LEVEL: SYS
          NCCL_SHM_DISABLE: 1
          NCCL_CUMEM_ENABLE: 0
          VLLM_USE_BREAKABLE_CUDAGRAPH: 1
          LD_LIBRARY_PATH: /usr/local/lib/python3.12/dist-packages/torch/lib:/usr/local/lib/python3.12/dist-packages/nvidia/cu13/lib:${LD_LIBRARY_PATH:-}
smart_accel:
  standalone:
    source_ref: dsv4_pro_patch/deployment/perf_start_v4pro_tp16ep_lmcache_mp.sh#vllm-v0.28.0-port
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: dspark
          packages:
            flashinfer-sm120: 0.7.0.post1+sm120.1
          cli_params:
            speculative_config:
              method: dspark
              num_speculative_tokens: 5
              draft_sample_method: probabilistic
          envs: {}
        kv_offload:
        - name: cpu
          packages:
            lmcache: 0.5.5+sm120.mp
            flashinfer-sm120: 0.7.0.post1+sm120.1
          cli_params:
            kv_transfer_config:
              kv_connector: LMCacheMPConnector
              kv_role: kv_both
              kv_connector_extra_config:
                lmcache.mp.port: 5555
                lmcache.mp.mq_timeout: 300
                lmcache.mp.sync_retrieve_before_forward: true
          envs: {}
          files:
          - path: start_kv_serve.sh
            mode: '0755'
            scope: master
            content: "#!/usr/bin/env bash\nexport LD_LIBRARY_PATH=\"/usr/local/lib/python3.12/dist-packages/torch/lib:/usr/local/lib/python3.12/dist-packages/nvidia/cu13/lib:${LD_LIBRARY_PATH:-}\"\
              \nexec lmcache server \\\n  --port 5555 \\\n  --http-port 8080 \\\n  --l1-size-gb {memory_capacity_gb}\
              \ \\\n  --l1-init-size-gb 20 \\\n  --max-gpu-workers 1 \\\n  --max-cpu-workers 8 \\\n  --chunk-size\
              \ 1024 \\\n  --l1-align-bytes 16384 \\\n  --eviction-trigger-watermark 0.85 \\\n  --eviction-ratio\
              \ 0.10 \\\n  --eviction-policy LRU \\\n  --supported-transfer-mode lmcache_driven\n"
        sparse:
        - name: performance_first
          packages:
            flashinfer-sm120: 0.7.0.post1+sm120.1
          cli_params:
            kv_cache_dtype: fp8
            no_enable_flashinfer_autotune: true
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          packages:
            flashinfer-sm120: 0.7.0.post1+sm120.1
          cli_params:
            kv_cache_dtype: fp8
            no_enable_flashinfer_autotune: true
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
