# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwen3-embedding-0.6b_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B"
    note: 用户提供 vLLM Ascend 启动命令，手工录入。

# 模型基本信息
model:
  name: Qwen3-Embedding-0.6B  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3-Embedding-0.6B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?embedding[-.]?0.6b"
  variant_name: Qwen3-Embedding-0.6B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen3-embedding-0.6b_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3-Embedding-0.6B
          runner: pooling
          host: "0.0.0.0"
          port: 8888
          enforce_eager: true
        env: {}

  multi_node:
    source_ref: "vllm_ascend_qwen3-embedding-0.6b_manual#multi_node_dp_across"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        display_name: "Multi-Node Data Parallel (DP-ACROSS)"
        orientation: throughput
        default_strategy: true
        head:
          engine_config:
            model: Qwen/Qwen3-Embedding-0.6B
            runner: pooling
            host: "0.0.0.0"
            port: 8888
            enforce_eager: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"
        worker:
          engine_config:
            model: Qwen/Qwen3-Embedding-0.6B
            runner: pooling
            host: "0.0.0.0"
            port: 8888
            enforce_eager: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
            headless: true
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"
