# 来源追溯
upstream_sources:
  - id: wings_accel_vllm028_sm120_tp4
    kind: manual
    repo: null
    file: wings-accel/docs/vllm-v0.28.0-sm120-tp4dp4.md
    url: https://huggingface.co/deepseek-ai/DeepSeek-V4-Flash
    note: wings-accel vLLM v0.28.0 SM120 TP4×DP4×EP 实测交付基线。

# 模型基本信息
model:
  name: DeepSeek-V4-Flash-0731
  slug: deepseek-v4-flash-0731
  provider: DeepSeek
  description: DeepSeek V4 Flash MoE model configured from the 0731 deployment command.
  model_id: deepseek-ai/DeepSeek-V4-Flash
  architecture: moe
  parameter_count: 284B
  active_parameters: 13B
  context_length: 1048576
  vram_minimum_gb: 288
  tasks: [text]
  min_engine_version: "0.28.0"
  match:
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?flash[-.]?0731"
  variant_name: DeepSeek-V4-Flash-0731

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 576
  multi_node: true  # 支持单节点及多节点场景
features:
  tool_calling:
    description: Enable tool calling with the DeepSeek V4 chat template tool parser.
    args: [--tokenizer-mode, deepseek_v4, --tool-call-parser, deepseek_v4, --enable-auto-tool-choice]
  reasoning:
    description: Enable reasoning/thinking mode via the DeepSeek V4 reasoning parser.
    args: [--reasoning-parser, deepseek_v4]
  spec_decoding:
    description: Dspark speculative decoding with five speculative tokens and greedy draft sampling.
    args: [--speculative_config, "{\"method\":\"dspark\", \"num_speculative_tokens\":5, \"draft_sample_method\": \"greedy\"}"]
  sparse_index:
    description: Enable FlashInfer autotuning and configure the DeepSeek sparse index cache.
    args: [--enable-flashinfer-autotune, --hf-overrides, "{\"use_index_cache\":true,\"index_topk_freq\":4,\"index_skip_topk_offset\":2}"]
  lmcache:
    description: LMCache MP KV cache acceleration for the SM120 delivery.
    kv_transfer:
      description: Connect vLLM to the colocated LMCache multiprocess server.
      args: [--kv-transfer-config, "{\"kv_connector\":\"LMCacheMPConnector\",\"kv_role\":\"kv_both\",\"kv_connector_extra_config\":{\"lmcache.mp.port\":5555,\"lmcache.mp.sync_retrieve_before_forward\":true,\"lmcache.mp.mq_timeout\":300}}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "wings_accel_vllm028_sm120_tp4#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor + Expert Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: deepseek-ai/DeepSeek-V4-Flash
          host: "0.0.0.0"
          port: 17000
          kv_cache_dtype: fp8
          block_size: 256
          tensor_parallel_size: 4
          gpu_memory_utilization: 0.80
          max_model_len: 140000
          enable_prefix_caching: true
          compilation_config:
            cudagraph_mode: FULL_AND_PIECEWISE
            custom_ops: [all]
          async_scheduling: true
          enable_expert_parallel: true
          attention_backend: FLASHINFER_MLA_SPARSE_DSV4
          all2all_backend: deepep_high_throughput
        env:
          NCCL_P2P_LEVEL: SYS
          NCCL_SHM_DISABLE: 1

  multi_node:
    source_ref: deepseek-v4-flash-0731_manual#multi_node_tp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:
          engine_config:
            model: deepseek-ai/DeepSeek-V4-Flash
            host: 0.0.0.0
            port: 5685
            kv_cache_dtype: fp8
            block_size: 256
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            gpu_memory_utilization: 0.8
            max_model_len: 1048576
            enable_prefix_caching: true
            compilation_config:
              cudagraph_mode: FULL_AND_PIECEWISE
              custom_ops: [all]
            async_scheduling: true
            enable_expert_parallel: true
            attention_backend: FLASHINFER_MLA_SPARSE_DSV4
            all2all_backend: deepep_high_throughput
          env:
            NCCL_P2P_LEVEL: SYS
            NCCL_SHM_DISABLE: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:
          engine_config:
            model: deepseek-ai/DeepSeek-V4-Flash
            host: 0.0.0.0
            port: 5685
            kv_cache_dtype: fp8
            block_size: 256
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            gpu_memory_utilization: 0.8
            max_model_len: 1048576
            enable_prefix_caching: true
            compilation_config:
              cudagraph_mode: FULL_AND_PIECEWISE
              custom_ops: [all]
            async_scheduling: true
            enable_expert_parallel: true
            attention_backend: FLASHINFER_MLA_SPARSE_DSV4
            all2all_backend: deepep_high_throughput
          env:
            NCCL_P2P_LEVEL: SYS
            NCCL_SHM_DISABLE: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
