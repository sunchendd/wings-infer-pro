# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwen3-32b
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/Qwen3-Dense.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.21.0rc/docs/source/tutorials/models/Qwen3-Dense.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: Qwen3-32B  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3-32B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?32b"
  variant_name: Qwen3-32B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 支持单节点及多节点场景

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen3-32b#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3-32B
          served_model_name: qwen3
          trust_remote_code: true
          distributed_executor_backend: mp
          tensor_parallel_size: 4
          max_model_len: 5500
          max_num_batched_tokens: 40960
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          additional_config:
            pa_shape_list: [48, 64, 72, 80]
            weight_prefetch_config:
              enabled: true
          port: 8113
          block_size: 128
          gpu_memory_utilization: 0.9
        env:
          TASK_QUEUE_ENABLE: 1
          HCCL_OP_EXPANSION_MODE: AIV

  multi_node:
    source_ref: vllm_ascend_qwen3-32b#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        head:
          engine_config:
            model: Qwen/Qwen3-32B
            served_model_name: qwen3
            trust_remote_code: true
            distributed_executor_backend: mp
            tensor_parallel_size: 8
            max_model_len: 5500
            max_num_batched_tokens: 40960
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            additional_config:
              pa_shape_list: [48, 64, 72, 80]
              weight_prefetch_config:
                enabled: true
            port: 8113
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: $local_ip
            data_parallel_rpc_port: 12321
            block_size: 128
            gpu_memory_utilization: 0.9
          env:
            TASK_QUEUE_ENABLE: 1
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
        worker:
          engine_config:
            model: Qwen/Qwen3-32B
            served_model_name: qwen3
            trust_remote_code: true
            distributed_executor_backend: mp
            tensor_parallel_size: 8
            max_model_len: 5500
            max_num_batched_tokens: 40960
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            additional_config:
              pa_shape_list: [48, 64, 72, 80]
              weight_prefetch_config:
                enabled: true
            port: 8113
            headless: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 12321
            block_size: 128
            gpu_memory_utilization: 0.9
          env:
            TASK_QUEUE_ENABLE: 1
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
