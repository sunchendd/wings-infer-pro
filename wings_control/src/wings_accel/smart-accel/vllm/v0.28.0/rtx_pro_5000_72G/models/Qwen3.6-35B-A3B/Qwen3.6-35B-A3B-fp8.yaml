# SmartAccel configuration for one vLLM v0.28.0 SM120 TP4 replica.
model:
  name: Qwen3.6-35B-A3B
  variant_name: "Qwen3.6-35B-A3B-fp8"
  match:
    - name_pattern: "(?i)qwen3.6[-.]?35b[-.]?a3b"
smart_accel:
  standalone:
    source_ref: start_qwen36_35b_lmcache_router.sh#tp4-worker
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
          - name: mtp
            cli_params:
              speculative_config:
                method: mtp
                num_speculative_tokens: 4
                moe_backend: triton
            envs: {}
        kv_offload:
          - name: cpu
            packages:
              lmcache: 0.5.4+sm120.mp
            cli_params:
              kv_transfer_config:
                kv_connector: LMCacheMPConnector
                kv_role: kv_both
                kv_connector_extra_config:
                  lmcache.mp.port: 5556
                  lmcache.mp.mq_timeout: 300
            envs: {}
            files:
              - path: start_kv_serve.sh
                mode: "0755"
                scope: master
                content: |
                  #!/usr/bin/env bash
                  exec lmcache server \
                    --port 5556 \
                    --http-port 8081 \
                    --l1-size-gb {memory_capacity_gb} \
                    --l1-init-size-gb 20 \
                    --max-gpu-workers 1 \
                    --max-cpu-workers 8 \
                    --chunk-size 1088 \
                    --l1-align-bytes 16384 \
                    --eviction-trigger-watermark 0.85 \
                    --eviction-ratio 0.10 \
                    --eviction-policy LRU \
                    --supported-transfer-mode lmcache_driven
