# 来源追溯
upstream_sources:
  - id: vllm_recipe_minimax-m2.5
    kind: official_recipe
    repo: recipes
    file: models/MiniMaxAI/MiniMax-M2.5.yaml
    url: "https://recipes.vllm.ai/MiniMaxAI/MiniMax-M2.5"
    date_updated: 2026-05-18
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: MiniMax-M2.5  # 模型名称
  slug: minimax-m2.5  # 模型标识
  provider: MiniMax  # 提供者/厂商
  description: "MiniMax M2.5 MoE language model (230B total / 10B active) for coding, agent toolchains, and long-context reasoning — native FP8 checkpoint"  # 模型描述
  model_id: MiniMaxAI/MiniMax-M2.5  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 230B  # 总参数量
  active_parameters: 10B  # 激活参数量（MoE 模型）
  context_length: 196608  # 最大上下文长度
  vram_minimum_gb: 276  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.20.2"  # 最低引擎版本要求
  date_updated: 2026-05-18  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)minimax[-.]?m2.5"
  variant_name: MiniMax-M2.5-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 640
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: MiniMax M2 tool call parser with automatic tool choice
    args: [--tool-call-parser, minimax_m2, --enable-auto-tool-choice]
  reasoning:
    description: MiniMax M2 reasoning parser for chain-of-thought extraction
    args: [--reasoning-parser, minimax_m2]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_minimax-m2.5#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: MiniMaxAI/MiniMax-M2.5
          trust_remote_code: true
          enable_expert_parallel: true
          data_parallel_size: 8
          compilation_config:
            cudagraph_mode: PIECEWISE
          max_num_seqs: 512
          max_num_batched_tokens: 32768
          kv_cache_dtype: fp8
          moe_backend: triton
          attention_backend: FLASHINFER
          enable_flashinfer_autotune: true
        env:
          PYTHONNOUSERSITE: 1
          VLLM_USE_DEEP_GEMM: 0
          VLLM_BLOCKSCALE_FP8_GEMM_FLASHINFER: 0
          VLLM_FLOAT32_MATMUL_PRECISION: high
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: MiniMaxAI/MiniMax-M2.5
          trust_remote_code: true
