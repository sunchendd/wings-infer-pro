# SmartAccel 加速配置(decoding=qwen3_5_mtp / kv_offload=cpu)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: Qwen3.5-27B
  variant_name: "Qwen3.5-27B-bf16"
  match:
    - name_pattern: "(?i)qwen3[-.]?5[-.]?27b"
smart_accel:
  decoding:
    - name: qwen3_5_mtp
      cli_params:
        speculative_config:
          method: qwen3_5_mtp
          num_speculative_tokens: 2
      envs: {}
  kv_offload:
    - name: cpu
      cli_params:
        kv_transfer_config:
          kv_connector: OffloadingConnector
          kv_role: kv_both
          kv_connector_extra_config:
            cpu_bytes_to_use: "{mem_gb_to_bytes}"
      envs: {}
