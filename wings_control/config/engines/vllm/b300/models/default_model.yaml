# 硬件 + 引擎公共默认值
# 该文件由 wings-config update yaml --engine recipes 自动生成

hardware:
  gpu_count: 8  # 单节点 GPU 数量
  vram_gb: 2144  # 单节点总显存(GB)
  multi_node: false  # 是否支持多节点
  description: NVIDIA B300 SXM 268 GB HBM3e · 8-GPU HGX B300 node (Blackwell Ultra)  # 描述

engine:
  name: vllm  # 推理引擎
  version: v0.19.0  # 引擎版本

