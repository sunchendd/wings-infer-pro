# 来源追溯
upstream_sources:
  - id: vllm_recipe_translategemma-27b-it
    kind: official_recipe
    repo: recipes
    file: models/Google/translategemma-27b-it.yaml
    url: "https://recipes.vllm.ai/Google/translategemma-27b-it"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: TranslateGemma 27B IT  # 模型名称
  slug: translategemma-27b-it  # 模型标识
  provider: Google  # 提供者/厂商
  description: Lightweight open translation model from Google (based on Gemma 3) supporting 55 languages. Served via the vLLM-optimized Infomaniak-AI checkpoint.  # 模型描述
  model_id: google/translategemma-4b-it  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 27B  # 总参数量
  active_parameters: 27B  # 激活参数量（MoE 模型）
  context_length: 131072  # 最大上下文长度
  vram_minimum_gb: 10  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.14.1"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)translategemma[-.]?27b[-.]?it"
  variant_name: translategemma-27b-it-small_4b

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2144
  multi_node: false

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_translategemma-27b-it#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: google/translategemma-4b-it
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_translategemma-27b-it#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: google/translategemma-4b-it
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: google/translategemma-4b-it
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
