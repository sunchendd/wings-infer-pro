# SmartAccel 加速配置(decoding=deepseek_mtp / sparse)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# 0day 验证补:sparse(indexcache perf=4/acc=8)。
model:
  name: DeepSeek-V4-Pro
  variant_name: "DeepSeek-V4-Pro-w4a8-mtp"
  match:
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?pro"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: deepseek_mtp
          cli_params:
            speculative_config:
              method: deepseek_mtp
              num_speculative_tokens: 1
          envs: {}
        sparse:
        - name: performance_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: deepseek_mtp
          cli_params:
            speculative_config:
              method: deepseek_mtp
              num_speculative_tokens: 1
          envs: {}
        sparse:
        - name: performance_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: prefill
          index: 0
          sparse:
          - name: performance_first
            cli_params:
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 8
            envs: {}
          - name: accuracy_first
            cli_params:
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 4
            envs: {}
        - role: decode
          index: 0
          decoding:
          - name: deepseek_mtp
            cli_params:
              speculative_config:
                method: deepseek_mtp
                num_speculative_tokens: 1
            envs: {}
          sparse:
          - name: performance_first
            cli_params:
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 8
            envs: {}
          - name: accuracy_first
            cli_params:
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 4
            envs: {}
