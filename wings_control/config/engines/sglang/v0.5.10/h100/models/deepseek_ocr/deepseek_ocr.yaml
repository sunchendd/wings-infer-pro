# 来源追溯
upstream_sources:
  - id: sglang_deepseek-ocr
    kind: official_doc
    repo: sglang
    file: docs/basic_usage/deepseek_ocr.md
    url: "https://github.com/sgl-project/sglang/blob/main/docs/basic_usage/deepseek_ocr.md"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: DeepSeek-OCR-2  # 模型名称
  provider: deepseek-ai  # 提供者/厂商
  model_id: deepseek-ai/DeepSeek-OCR-2  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.10  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)deepseek[-.]?ocr"
  variant_name: DeepSeek-OCR-2  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 640  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_deepseek-ocr#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: deepseek-ai/DeepSeek-OCR-2
          model_path: deepseek-ai/DeepSeek-OCR-2
          trust_remote_code: true
          host: "0.0.0.0"
          port: 30000
        env: {}
        default_strategy: true
