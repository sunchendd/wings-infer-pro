# 来源追溯
upstream_sources:
  - id: vllm_qwen3-embedding-0.6b_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/Qwen/Qwen3-Embedding-0.6B"
    date_updated: 2026-07-17
    note: 用户提供 vLLM 启动命令，手工录入。

# 模型基本信息
model:
  name: Qwen3-Embedding-0.6B  # 模型名称
  slug: qwen3-embedding-0.6b  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: "Qwen3 text embedding model (0.6B) for dense retrieval and semantic representation."  # 模型描述
  model_id: Qwen/Qwen3-Embedding-0.6B  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 0.6B  # 总参数量
  active_parameters: 0.6B  # 激活参数量
  context_length: 32768  # 最大上下文长度
  vram_minimum_gb: null  # 待补充：最低显存需求(GB)
  tasks: [embedding]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-07-17  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?embedding[-.]?0.6b"
  variant_name: Qwen3-Embedding-0.6B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 1  # 单节点 GPU 数量
  vram_gb: 48  # 单节点总显存(GB)
  multi_node: true  # 仅支持单节点

# 可选功能列表
features:
  kv_offloading:
    description: KV cache native offloading to reduce GPU memory usage.
    args: [--kv-offloading-backend, native, --kv-offloading-size, "20"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_qwen3-embedding-0.6b_manual#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3-Embedding-0.6B
          trust_remote_code: true
          port: 18000
          gpu_memory_utilization: 0.9
          kv_cache_dtype: fp8
          tensor_parallel_size: 1
        env: {}

  multi_node:
    source_ref: "vllm_qwen3-embedding-0.6b_manual#multi_node_dp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        display_name: "Multi-Node Data Parallel"
        orientation: throughput
        default_strategy: true
        head:
          engine_config:
            model: Qwen/Qwen3-Embedding-0.6B
            trust_remote_code: true
            port: 18000
            gpu_memory_utilization: 0.9
            kv_cache_dtype: fp8
            tensor_parallel_size: 1
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"
        worker:
          engine_config:
            model: Qwen/Qwen3-Embedding-0.6B
            trust_remote_code: true
            port: 18000
            gpu_memory_utilization: 0.9
            kv_cache_dtype: fp8
            tensor_parallel_size: 1
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
            headless: true
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"