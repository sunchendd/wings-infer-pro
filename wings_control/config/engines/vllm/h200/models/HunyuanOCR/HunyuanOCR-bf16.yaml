# 来源追溯
upstream_sources:
  - id: vllm_recipe_hunyuan-ocr
    kind: official_recipe
    repo: recipes
    file: models/tencent/HunyuanOCR.yaml
    url: "https://recipes.vllm.ai/tencent/HunyuanOCR"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: HunyuanOCR  # 模型名称
  slug: hunyuan-ocr  # 模型标识
  provider: Hunyuan (Tencent)  # 提供者/厂商
  description: Tencent Hunyuan end-to-end OCR expert VLM (~1B) for online OCR serving with an OpenAI-compatible API  # 模型描述
  model_id: tencent/HunyuanOCR  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 1B  # 总参数量
  active_parameters: 1B  # 激活参数量（MoE 模型）
  context_length: 32768  # 最大上下文长度
  vram_minimum_gb: 2  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.11.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)hunyuan[-.]?ocr"
  variant_name: HunyuanOCR-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 1128
  multi_node: false

# 可选功能列表
features:
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only.
    args: [--mm-encoder-tp-mode, data]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_hunyuan-ocr#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: tencent/HunyuanOCR
          no_enable_prefix_caching: true
          mm_processor_cache_gb: 0
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_hunyuan-ocr#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: tencent/HunyuanOCR
            no_enable_prefix_caching: true
            mm_processor_cache_gb: 0
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: tencent/HunyuanOCR
            no_enable_prefix_caching: true
            mm_processor_cache_gb: 0
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
