# 来源追溯
upstream_sources:
  - id: sglang_gpt-oss
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/OpenAI/GPT-OSS.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/OpenAI/GPT-OSS.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: GPT-OSS  # 模型名称
  provider: openai  # 提供者/厂商
  model_id: openai/gpt-oss-20b  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)gpt[-.]?oss"
  variant_name: GPT-OSS  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1440  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, gpt-oss]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_gpt-oss#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: openai/gpt-oss-120b
          tp: 8
        env: {}
        default_strategy: true
