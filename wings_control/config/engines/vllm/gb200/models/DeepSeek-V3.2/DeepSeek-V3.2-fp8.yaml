# 来源追溯
upstream_sources:
  - id: vllm_recipe_deepseek-v3.2
    kind: official_recipe
    repo: recipes
    file: models/deepseek-ai/DeepSeek-V3.2.yaml
    url: "https://recipes.vllm.ai/deepseek-ai/DeepSeek-V3.2"
    date_updated: 2026-04-01
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: DeepSeek-V3.2  # 模型名称
  slug: deepseek-v3.2  # 模型标识
  provider: DeepSeek  # 提供者/厂商
  description: "DeepSeek V3.2 MoE model with MLA attention, sparse attention, and scalable RL for strong reasoning and agent capabilities."  # 模型描述
  model_id: deepseek-ai/DeepSeek-V3.2  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 671B  # 总参数量
  active_parameters: 37B  # 激活参数量（MoE 模型）
  context_length: 163840  # 最大上下文长度
  vram_minimum_gb: 805  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.18.0"  # 最低引擎版本要求
  date_updated: 2026-04-01  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)deepseek[-.]?v3.2"
  variant_name: DeepSeek-V3.2-fp8

# 硬件信息
hardware_profile:
  gpu_count: 4
  vram_gb: 768
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Enable tool calling with DeepSeek V3.2 chat template support.
    args: [--tokenizer-mode, deepseek_v32, --tool-call-parser, deepseek_v32, --enable-auto-tool-choice]
  reasoning:
    description: Enable reasoning/thinking mode with the DeepSeek V3 reasoning parser.
    args: [--reasoning-parser, deepseek_v3]
  spec_decoding:
    description: Multi-Token Prediction speculative decoding with 3 speculative tokens.
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":3}"]

# 部署场景
scenarios:
  multi_node:
    source_ref: "vllm_recipe_deepseek-v3.2#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2
            trust_remote_code: true
            kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 8
            data_parallel_size_local: 4
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2
            trust_remote_code: true
            kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 8
            data_parallel_size_local: 4
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 4
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2
            trust_remote_code: true
            kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2
            trust_remote_code: true
            kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2
            trust_remote_code: true
            kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2
            trust_remote_code: true
            kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2
            trust_remote_code: true
            kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
            tensor_parallel_size: 4
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2
            trust_remote_code: true
            kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
            tensor_parallel_size: 4
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
  pd_disaggregation:
    source_ref: "vllm_recipe_deepseek-v3.2#pd_cluster"
    match:
      distributed: true
      pd_role: null
    # PD分离：1P×1D  # 根据官网默认配置
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill  # P1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: deepseek-ai/DeepSeek-V3.2
              trust_remote_code: true
              kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
              port: 8001
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_producer
                kv_load_failure_policy: fail
              enforce_eager: true
              tensor_parallel_size: 4
            env:
              VLLM_USE_NCCL_SYMM_MEM: 1
              NCCL_CUMEM_ENABLE: 1
              NCCL_MNNVL_ENABLE: 1
              NCCL_NVLS_ENABLE: 1
              UCX_NET_DEVICES: all
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5557
              VLLM_NIXL_SIDE_CHANNEL_HOST: $PREFILL_NODE_1
          - role: decode  # D1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: deepseek-ai/DeepSeek-V3.2
              trust_remote_code: true
              kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
              port: 8002
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_consumer
                kv_load_failure_policy: fail
              compilation_config:
                cudagraph_mode: FULL_DECODE_ONLY
              tensor_parallel_size: 4
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5558
              VLLM_NIXL_SIDE_CHANNEL_HOST: $DECODE_NODE_1
