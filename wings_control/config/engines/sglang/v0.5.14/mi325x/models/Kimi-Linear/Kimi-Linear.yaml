# 来源追溯
upstream_sources:
  - id: sglang_kimi-linear
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Moonshotai/Kimi-Linear.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Moonshotai/Kimi-Linear.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Kimi-Linear  # 模型名称
  provider: moonshotai  # 提供者/厂商
  model_id: moonshotai/Kimi-Linear-48B-A3B-Instruct  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)kimi[-.]?linear"
  variant_name: Kimi-Linear  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 2048  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_kimi-linear#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: moonshotai/Kimi-Linear-48B-A3B-Instruct
          model_path: moonshotai/Kimi-Linear-48B-A3B-Instruct
          tokenizer_path: moonshotai/Kimi-Linear-48B-A3B-Instruct
          tp: 4
          trust_remote_code: true
        env:
          SGLANG_ROCM_FUSED_DECODE_MLA: 0
        default_strategy: true
