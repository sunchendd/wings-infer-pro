# 来源追溯
upstream_sources:
  - id: sglang_ministral-3
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Mistral/Ministral-3.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Mistral/Ministral-3.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Ministral-3  # 模型名称
  provider: mistralai  # 提供者/厂商
  model_id: mistralai/Ministral-3-14B-Instruct-2512  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)ministral[-.]?3"
  variant_name: Ministral-3  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_ministral-3#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: mistralai/Ministral-3-14B-Instruct-2512
          model_path: mistralai/Ministral-3-14B-Instruct-2512
          tp: 1
          trust_remote_code: true
        env: {}
        default_strategy: true
