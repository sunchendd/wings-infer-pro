# 来源追溯
upstream_sources:
  - id: vllm_recipe_seed-oss-36b
    kind: official_recipe
    repo: recipes
    file: models/ByteDance-Seed/Seed-OSS-36B-Instruct.yaml
    url: "https://recipes.vllm.ai/ByteDance-Seed/Seed-OSS-36B-Instruct"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Seed-OSS-36B  # 模型名称
  slug: seed-oss-36b  # 模型标识
  provider: Seed (ByteDance)  # 提供者/厂商
  description: ByteDance Seed-OSS 36B dense model with unique 'thinking budget' control and 512K context support  # 模型描述
  model_id: ByteDance-Seed/Seed-OSS-36B-Instruct  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 36B  # 总参数量
  active_parameters: 36B  # 激活参数量（MoE 模型）
  context_length: 524288  # 最大上下文长度
  vram_minimum_gb: 86  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.11.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)seed[-.]?oss[-.]?36b"
  variant_name: Seed-OSS-36B-Instruct-bf16

# 硬件信息
hardware_profile:
  gpu_count: 4
  vram_gb: 1152
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Seed-OSS tool-call parser with automatic tool choice
    args: [--enable-auto-tool-choice, --tool-call-parser, seed_oss]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_seed-oss-36b#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: ByteDance-Seed/Seed-OSS-36B-Instruct
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_seed-oss-36b#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: ByteDance-Seed/Seed-OSS-36B-Instruct
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: ByteDance-Seed/Seed-OSS-36B-Instruct
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
