  variant_name: Nemotron-3-Nano-Omni-30B-A3B-Reasoning-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2144
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Qwen3 Coder tool-call parser with automatic tool choice
    args: [--enable-auto-tool-choice, --tool-call-parser, qwen3_coder]
  reasoning:
    description: "Nemotron v3 reasoning parser (chain-of-thought with <think> tags)"
    args: [--reasoning-parser, nemotron_v3]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_nemotron-3-nano-omni-30b-a3b-reasoning#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-FP8
          trust_remote_code: true
          max_model_len: 131072
          media_io_kwargs:
            video:
              num_frames: 512
              fps: 1
          video_pruning_rate: 0.5
          kv_cache_dtype: fp8
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_nemotron-3-nano-omni-30b-a3b-reasoning#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-FP8
            trust_remote_code: true
            max_model_len: 131072
            media_io_kwargs:
              video:
                num_frames: 512
                fps: 1
            video_pruning_rate: 0.5
            kv_cache_dtype: fp8
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-FP8
            trust_remote_code: true
            max_model_len: 131072
