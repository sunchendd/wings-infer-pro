# SmartAccel configuration for the wings-accel vLLM v0.28.0 SM120 TP4 delivery.
model:
  name: DeepSeek-V4-Flash
  variant_name: "DeepSeek-V4-Flash-0731"
  match:
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?flash-0731"
smart_accel:
  standalone:
    source_ref: wings-accel/docs/vllm-v0.28.0-sm120-tp4dp4.md#runtime-baseline
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
          - name: dspark
            packages:
              flashinfer-sm120: 9dc1b249-tp4
            cli_params:
              speculative_config:
                method: dspark
                num_speculative_tokens: 5
                draft_sample_method: greedy
            envs: {}
        kv_offload:
          - name: cpu
            packages:
              lmcache: v0.5.4-sm120-mp
              flashinfer-sm120: 9dc1b249-tp4
            cli_params:
              kv_transfer_config:
                kv_connector: LMCacheMPConnector
                kv_role: kv_both
                kv_connector_extra_config:
                  lmcache.mp.port: 5555
                  lmcache.mp.sync_retrieve_before_forward: true
                  lmcache.mp.mq_timeout: 300
            envs: {}
            files:
              - path: start_kv_serve.sh
                mode: "0755"
                scope: master
                content: |
                  #!/usr/bin/env bash
                  exec lmcache server \
                    --port 5555 \
                    --http-port 8080 \
                    --l1-size-gb {memory_capacity_gb} \
                    --l1-init-size-gb 20 \
                    --max-gpu-workers 1 \
                    --max-cpu-workers 8 \
                    --chunk-size 1024 \
                    --l1-align-bytes 16384 \
                    --eviction-trigger-watermark 0.85 \
                    --eviction-ratio 0.10 \
                    --eviction-policy LRU \
                    --supported-transfer-mode lmcache_driven
        sparse:
          - name: performance_first
            packages:
              flashinfer-sm120: 9dc1b249-tp4
            cli_params:
              kv_cache_dtype: fp8
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 8
                index_skip_topk_offset: 2
            envs: {}
          - name: accuracy_first
            packages:
              flashinfer-sm120: 9dc1b249-tp4
            cli_params:
              kv_cache_dtype: fp8
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 4
                index_skip_topk_offset: 2
            envs: {}
