# Mooncake runtime environment defaults, separated by the process that consumes
# them. wings-control renders client.env and master.env from their respective
# mappings; engine values are exported in start_command.sh immediately before
# vLLM is launched. MaaS values with identical names and resolved SmartAccel
# overrides retain their existing precedence for the role that owns them.
client:
  ENABLE_KV_OFFLOAD: "false"
  ENABLE_DISTRIBUTED_KV_OFFLOAD: "false"
  ENABLE_KV_DISK_OFFLOAD: "false"
  ENABLE_KV_MEM_OFFLOAD: "false"
  KV_DISK_OFFLOAD_PATH: /mnt/kvcache_offload
  KV_DISK_OFFLOAD_SIZE: "11"
  KV_MEM_OFFLOAD_SIZE: "11"
  KV_LOCAL_BUFFER_SIZE: "12GB"
  KV_PROTOCOL: "rdma"
  SERVING_CONFIG_ID: ""
  MC_STORE_CLIENT_MIN_PORT: 20000
  MC_STORE_CLIENT_MAX_PORT: 32767
  MC_TCP_ENABLE_CONNECTION_POOL: 1

master:
  MOONCAKE_MASTER_PORT: "50051"
  MOONCAKE_MASTER_EVICTION_HIGH_WATERMARK_RATIO: "0.9"
  MOONCAKE_MASTER_EVICTION_RATIO: "0.1"
  MOONCAKE_MASTER_DEFAULT_KV_LEASE_TTL: "11000"
  MOONCAKE_MASTER_LOG_PATH: /var/log/wings

engine:
  MOONCAKE_CONFIG_PATH: "/shared-volume/distributed_offload/mooncake_cuda/mooncake.json"
  MC_TCP_ENABLE_CONNECTION_POOL: 1