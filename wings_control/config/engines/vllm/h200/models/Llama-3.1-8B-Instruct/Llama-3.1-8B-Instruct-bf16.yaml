# 来源追溯
upstream_sources:
  - id: vllm_recipe_llama-3.1-8b-instruct
    kind: official_recipe
    repo: recipes
    file: models/meta-llama/Llama-3.1-8B-Instruct.yaml
    url: "https://recipes.vllm.ai/meta-llama/Llama-3.1-8B-Instruct"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Llama-3.1-8B-Instruct  # 模型名称
  slug: llama-3.1-8b-instruct  # 模型标识
  provider: Meta  # 提供者/厂商
  description: Meta's Llama 3.1 8B dense instruction-tuned language model with 128K context  # 模型描述
  model_id: meta-llama/Llama-3.1-8B-Instruct  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 8B  # 总参数量
  active_parameters: 8B  # 激活参数量（MoE 模型）
  context_length: 131072  # 最大上下文长度
  vram_minimum_gb: 20  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.6.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)llama[-.]?3.1[-.]?8b[-.]?instruct"
  variant_name: Llama-3.1-8B-Instruct-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 1128
  multi_node: false

# 可选功能列表
features:
  spec_decoding:
    description: "EAGLE3 speculative decoding (requires vLLM >= 0.9.0)"
    args: [--speculative-config, "{\"model\":\"RedHatAI/Llama-3.1-8B-Instruct-speculator.eagle3\",\"method\":\"eagle3\",\"num_speculative_tokens\":3}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_llama-3.1-8b-instruct#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: meta-llama/Llama-3.1-8B-Instruct
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_llama-3.1-8b-instruct#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: meta-llama/Llama-3.1-8B-Instruct
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: meta-llama/Llama-3.1-8B-Instruct
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
