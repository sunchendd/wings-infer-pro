# 来源追溯
upstream_sources:
  - id: vllm_ascend_glm-5.2_w4a8_manual
    kind: manual
    repo: null
    file: null
    url: "https://modelscope.cn/models/Apsara-Stack/GLM-5.2-W4A8"
    note: 用户提供 vLLM Ascend 启动命令，手工录入；命令本地路径包含 w8a8，按用户说明记录为 w4a8。

# 模型基本信息
model:
  name: GLM-5.2  # 模型名称
  provider: Apsara-Stack  # 提供者/厂商
  model_id: Apsara-Stack/GLM-5.2-W4A8  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?5.2"
  variant_name: GLM-5.2-w4a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"num_speculative_tokens\":3,\"method\":\"deepseek_mtp\"}"]
  memcache_offloading:
    description: Enable MemCache-backed KV transfer/offloading for prefill/decode cache sharing.
    args: [--kv-transfer-config, "{\"kv_connector\":\"AscendStoreConnector\",\"kv_role\":\"kv_both\",\"kv_load_failure_policy\":\"recompute\",\"kv_connector_extra_config\":{\"lookup_rpc_port\":\"0\",\"backend\":\"memcache\"}}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_glm-5.2_w4a8_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Apsara-Stack/GLM-5.2-W4A8
          served_model_name: GLM-5.2
          port: 8100
          trust_remote_code: true
          tensor_parallel_size: 16
          max_num_seqs: 48
          max_model_len: 40000
          max_num_batched_tokens: 4096
          gpu_memory_utilization: 0.9
          quantization: ascend
          async_scheduling: true
          additional_config:
            enable_npugraph_ex: true
            fuse_muls_add: true
            multistream_overlap_shared_expert: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          block_size: 128
        env:
          MMC_LOCAL_CONFIG_PATH: "/shared-volume/mmc_local.conf"
          ACL_OP_INIT_MODE: 1
          PYTHONHASHSEED: 0
          HCCL_BUFFSIZE: 1024
          OMP_PROC_BIND: "false"
          OMP_NUM_THREADS: 10
          VLLM_USE_V1: 1
          HCCL_OP_EXPANSION_MODE: AIV
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          VLLM_ASCEND_BALANCE_SCHEDULING: 1
          VLLM_ASCEND_ENABLE_MLAPO: 1
          VLLM_VERSION: 0.21.0
          LOG_PREFIX_CACHE_STATS_PER_REQUEST: 1
