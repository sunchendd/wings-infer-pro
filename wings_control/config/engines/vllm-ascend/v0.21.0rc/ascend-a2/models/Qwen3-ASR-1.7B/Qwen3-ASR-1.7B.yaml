# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwen3-asr-1.7b
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/Qwen3-ASR-1.7B.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.21.0rc/docs/source/tutorials/models/Qwen3-ASR-1.7B.md"
