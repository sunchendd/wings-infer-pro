# 来源追溯
upstream_sources:
  - id: vllm_recipe_minicpm5-1b
    kind: official_recipe
    repo: recipes
    file: models/openbmb/MiniCPM5-1B.yaml
    url: "https://recipes.vllm.ai/openbmb/MiniCPM5-1B"
    date_updated: 2026-06-02
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: MiniCPM5-1B  # 模型名称
  slug: minicpm5-1b  # 模型标识
  provider: MiniCPM (OpenBMB)  # 提供者/厂商
  description: "MiniCPM5-1B — dense 1B on-device LLM with hybrid Think/No-Think reasoning, native 128K context, and strong agentic tool use, built on the standard Llama architecture"  # 模型描述
  model_id: openbmb/MiniCPM5-1B  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 1.1B  # 总参数量
  active_parameters: 1.1B  # 激活参数量（MoE 模型）
  context_length: 131072  # 最大上下文长度
  vram_minimum_gb: 3  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.21.0"  # 最低引擎版本要求
  date_updated: 2026-06-02  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)minicpm5[-.]?1b"
  variant_name: MiniCPM5-1B-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2144
  multi_node: false

# 可选功能列表
features:
  reasoning:
    description: "Enable hybrid deep-thinking mode — the chat template wraps a <think> block before the answer. Recommended sampling shifts to temperature=0.9, top_p=0.95. Leave off for fast No-Think responses (temperature=0.7)."
    args: [--default-chat-template-kwargs, "{\"enable_thinking\": true}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_minicpm5-1b#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: openbmb/MiniCPM5-1B
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_minicpm5-1b#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: openbmb/MiniCPM5-1B
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: openbmb/MiniCPM5-1B
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
