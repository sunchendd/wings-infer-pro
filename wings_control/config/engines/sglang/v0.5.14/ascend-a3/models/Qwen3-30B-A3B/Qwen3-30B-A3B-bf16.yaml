# 来源追溯
upstream_sources:
  - id: sglang_qwen3-30b-a3b
    kind: official_doc
    repo: sglang
    file: docs_new/docs/hardware-platforms/ascend-npus/best_practice/qwen3_30b_a3b.mdx
    url: "https://github.com/sgl-project/sglang/blob/v0.5.14/docs_new/docs/hardware-platforms/ascend-npus/best_practice/qwen3_30b_a3b.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen3-30B-A3B  # 模型名称
  provider: ""  # 提供者/厂商
  model_id: Qwen3-30B-A3B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?30b[-.]?a3b"
  variant_name: Qwen3-30B-A3B-bf16  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-draft-model-quantization, unquant, --speculative-algorithm, EAGLE3, --speculative-draft-model-path, $DRAFT_MODEL_PATH, --speculative-num-steps, 7, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 8]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen3-30b-a3b#single_node_pd-mixed_high_throughput"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_pd-mixed_high_throughput:
        display_name: Qwen3-30B-A3B BF16 1P IN1K OUT100
        orientation: throughput
        engine_config:
          model: $MODEL_PATH
          model_path: $MODEL_PATH
          host: "127.0.0.1"
          port: 6688
          trust_remote_code: true
          nnodes: 1
          node_rank: 0
          attention_backend: ascend
          device: npu
          max_running_requests: 168
          disable_radix_cache: true
          chunked_prefill_size: -1
          max_prefill_tokens: 8300
          tp_size: 2
          enable_dp_attention: true
          dp_size: 2
          mem_fraction_static: 0.85
          cuda_graph_bs: 1
          dtype: bfloat16
        env:
          ASCEND_LAUNCH_BLOCKING: 0
          DP_ROUND_ROBIN: 1
          GLOO_SOCKET_IFNAME: "<network-interface>"
          HCCL_ALGO: "level0:NA;level1:ring"
          HCCL_SOCKET_IFNAME: "<network-interface>"
          INF_NAN_MODE_FORCE_DISABLE: 1
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:False"
          SGLANG_ALLOW_OVERWRITE_LONGER_CONTEXT_LEN: 1
          SGLANG_ENABLE_OVERLAP_PLAN_STREAM: 1
          SGLANG_ENABLE_SPEC_V2: 1
          SGLANG_PREFILL_DELAYER_MAX_DELAY_PASSES: 200
          SGLANG_SCHEDULER_DECREASE_PREFILL_IDLE: 1
          SGLANG_USE_MAX_DP_ATT: 1
          STREAMS_PER_DEVICE: 32
        system_setup:
          sysctls:
            vm.swappiness: 0
            kernel.numa_balancing: 0
            kernel.sched_migration_cost_ns: 50000
          sysfs_writes:
            - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
              value: performance
          commands: [MODEL_PATH=/path/to/model-weights, DRAFT_MODEL_PATH=/path/to/draft-model-weights, unset https_proxy, unset http_proxy, unset HTTPS_PROXY, unset HTTP_PROXY, unset ASCEND_LAUNCH_BLOCKING, source /usr/local/Ascend/ascend-toolkit/set_env.sh, source /usr/local/Ascend/nnal/atb/set_env.sh]
        default_strategy: true
