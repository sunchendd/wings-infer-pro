# 来源追溯
upstream_sources:
  - id: vllm_recipe_Qwen3.6-27b
    kind: official_recipe
    repo: recipes
    file: models/Qwen/Qwen3.6-27B.yaml
    url: "https://recipes.vllm.ai/Qwen/Qwen3.6-27B"
    date_updated: 2026-07-02
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Qwen3.6-27B  # 模型名称
  slug: Qwen3.6-27b  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: "Qwen3.6 dense multimodal model (27B) with gated delta networks hybrid attention, MTP, and 262K context"  # 模型描述
  model_id: Qwen/Qwen3.6-27B-FP8  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 27B  # 总参数量
  active_parameters: 27B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 33  # 最低显存需求(GB)
  tasks: [multimodal, text]  # 支持的任务类型
  min_engine_version: "0.17.0"  # 最低引擎版本要求
  date_updated: 2026-07-02  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)Qwen3.6[-.]?27b"
  variant_name: Qwen3.6-27B-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2144
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool choice with Qwen3 Coder parser
    args: [--enable-auto-tool-choice, --tool-call-parser, qwen3_coder]
  reasoning:
    description: Enable chain-of-thought reasoning with Qwen3 parser
    args: [--reasoning-parser, qwen3]
  spec_decoding:
    description: Multi-token prediction speculative decoding for lower latency
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":1}"]
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only.
    args: [--mm-encoder-tp-mode, data]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_Qwen3.6-27b#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3.6-27B-FP8
          trust_remote_code: true
          max_num_seqs: 512
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_Qwen3.6-27b#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: Qwen/Qwen3.6-27B-FP8
            trust_remote_code: true
            max_num_seqs: 512
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: Qwen/Qwen3.6-27B-FP8
            trust_remote_code: true
            max_num_seqs: 512
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
