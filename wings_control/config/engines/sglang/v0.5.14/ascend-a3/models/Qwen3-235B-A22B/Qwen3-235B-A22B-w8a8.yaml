# 来源追溯
upstream_sources:
  - id: sglang_qwen3-235b-a22b
    kind: official_doc
    repo: sglang
    file: docs_new/docs/hardware-platforms/ascend-npus/best_practice/qwen3_235b_a22b.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/docs/hardware-platforms/ascend-npus/best_practice/qwen3_235b_a22b.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen3-235B-A22B  # 模型名称
  provider: ""  # 提供者/厂商
  model_id: Qwen3-235B-A22B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?235b[-.]?a22b"
  variant_name: Qwen3-235B-A22B-w8a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algorithm, EAGLE3, --speculative-draft-model-path, $DRAFT_MODEL_PATH, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4, --speculative-draft-model-quantization, unquant]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen3-235b-a22b#single_node_pd-mixed"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_pd-mixed:
        display_name: Qwen3-235B-A22B W8A8 8P IN3K5 OUT1K5 50.1ms
        orientation: latency
        nodes:
          - role: mixed
            index: 0
            engine_config:
              model: $MODEL_PATH
              model_path: $MODEL_PATH
              host: "127.0.0.1"
              port: 6688
              trust_remote_code: true
              nnodes: 1
              node_rank: 0
              attention_backend: ascend
              device: npu
              quantization: modelslim
              max_running_requests: 432
              context_length: 8192
              dtype: bfloat16
              chunked_prefill_size: 94208
              max_prefill_tokens: 458880
              sampling_backend: ascend
              ep_dispatch_algorithm: static
              init_expert_location: /root/.cache/modelscope/hub/models/hot_map/235B_3_5k_decode.pt
              disable_radix_cache: true
              moe_a2a_backend: ascend_fuseep
              tp: 16
              dp_size: 16
              enable_dp_attention: true
              enable_dp_lm_head: true
              mem_fraction_static: 0.8
              cuda_graph_bs: 1
            env:
              GLOO_SOCKET_IFNAME: "<network-interface>"
              HCCL_BUFFSIZE: 570
              HCCL_OP_EXPANSION_MODE: AIV
              HCCL_SOCKET_IFNAME: "<network-interface>"
              PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
              SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: 188416
              SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: 600
              SGLANG_ENABLE_OVERLAP_PLAN_STREAM: 1
              SGLANG_ENABLE_SPEC_V2: 1
              SGLANG_NPU_FUSED_MOE_MODE: 2
              SGLANG_NPU_PROFILING: 0
              SGLANG_NPU_PROFILING_BS: 27
              SGLANG_PREFILL_DELAYER_MAX_DELAY_PASSES: 100
              SGLANG_SCHEDULER_DECREASE_PREFILL_IDLE: 1
            system_setup:
              sysctls:
                vm.swappiness: 0
                kernel.numa_balancing: 0
                kernel.sched_migration_cost_ns: 50000
              sysfs_writes:
                - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
                  value: performance
              commands: [MODEL_PATH=/path/to/model-weights, DRAFT_MODEL_PATH=/path/to/draft-model-weights, unset https_proxy, unset http_proxy, unset HTTPS_PROXY, unset HTTP_PROXY, unset ASCEND_LAUNCH_BLOCKING, source /usr/local/Ascend/ascend-toolkit/set_env.sh, source /usr/local/Ascend/nnal/atb/set_env.sh]
        default_strategy: true
