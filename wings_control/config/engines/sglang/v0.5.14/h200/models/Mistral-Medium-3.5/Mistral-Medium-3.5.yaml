# 来源追溯
upstream_sources:
  - id: sglang_mistral-medium-3.5
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Mistral/Mistral-Medium-3.5.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Mistral/Mistral-Medium-3.5.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Mistral Medium 3.5  # 模型名称
  provider: mistralai  # 提供者/厂商
  model_id: mistralai/Mistral-Medium-3.5-128B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)mistral[-.]?medium[-.]?3.5"
  variant_name: Mistral Medium 3.5  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, mistral]
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, mistral]
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algorithm, EAGLE, --speculative-draft-model-path, mistralai/Mistral-Medium-3.5-128B-EAGLE, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_mistral-medium-3.5#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: mistralai/Mistral-Medium-3.5-128B
          model_path: mistralai/Mistral-Medium-3.5-128B
          tp: 4
          dtype: bfloat16
          port: 30000
        env: {}
        default_strategy: true
