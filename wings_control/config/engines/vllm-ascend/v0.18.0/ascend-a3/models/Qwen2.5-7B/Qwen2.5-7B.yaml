# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwen2.5-7b
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/Qwen2.5-7B.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.18.0/docs/source/tutorials/models/Qwen2.5-7B.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: Qwen2.5-7B  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen2.5-7B-Instruct  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.18.0  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen2.5[-.]?7b"
  variant_name: Qwen2.5-7B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen2.5-7b#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: "${MODEL_PATH}"
          host: "0.0.0.0"
          port: 8000
          served_model_name: qwen-2.5-7b-instruct
          trust_remote_code: true
          max_model_len: 32768
        env:
          MODEL_PATH: ./Qwen2.5-7B-Instruct
