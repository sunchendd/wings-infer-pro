  provider: Eco-Tech
  model_id: Eco-Tech/GLM-5.1-w4a8
  min_engine_version: v0.23.0
  match:
  - name_pattern: (?i)glm[-.]?5.1
  variant_name: GLM-5.1-w4a8
hardware_profile:
  gpu_count: 8
  vram_gb: 512
  multi_node: true
features:
  sparse_index:
    description: Enable sparse index cache for long-context inference.
    args:
    - --hf-overrides
    - '{"use_index_cache":true,"index_topk_freq":4}'
scenarios:
  standalone:
    source_ref: vllm_ascend_glm-5.1#single_node
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: /root/.cache/modelscope/hub/models/vllm-ascend/GLM5-w4a8
          host: "0.0.0.0"
          port: 8077
          data_parallel_size: 1
          tensor_parallel_size: 8
          enable_expert_parallel: true
          seed: 1024
          served_model_name: glm-5
          max_num_seqs: 8
          max_model_len: 32768
          max_num_batched_tokens: 4096
          trust_remote_code: true
          gpu_memory_utilization: 0.95
          quantization: ascend
          enable_chunked_prefill: true
          enable_prefix_caching: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          additional_config:
            multistream_overlap_shared_expert: true
          speculative_config:
            num_speculative_tokens: 3
            method: deepseek_mtp
            enforce_eager: true
        env:
          HCCL_OP_EXPANSION_MODE: AIV
          OMP_PROC_BIND: 'false'
          OMP_NUM_THREADS: 1
          HCCL_BUFFSIZE: 200
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          VLLM_ASCEND_BALANCE_SCHEDULING: 1
          VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
