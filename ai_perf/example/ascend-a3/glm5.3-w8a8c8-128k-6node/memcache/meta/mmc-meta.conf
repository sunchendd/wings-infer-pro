ock.mmc.meta_service_url = tcp://@META_HOST@:5000

ock.mmc.meta_service.config_store_url = tcp://@META_HOST@:6000

ock.mmc.meta_service.metrics_url = http://@META_HOST@:8900

ock.mmc.log_level = info

## Begin DRAM eviction early to leave headroom for concurrent large KV puts
ock.mmc.evict_threshold_high = 70
ock.mmc.evict_threshold_low = 60

## Under severe DRAM pressure, favor prompt reclamation over rewarming
ock.mmc.rewarm.dram_watermark = 95
