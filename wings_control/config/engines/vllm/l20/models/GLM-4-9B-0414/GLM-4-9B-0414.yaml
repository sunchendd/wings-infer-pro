upstream_sources:
  - id: vllm_glm-4-9b-0414_manual
    kind: manual
    repo: null
    file: null
    url: https://huggingface.co/ZhipuAI/GLM-4-9B-0414
    date_updated: "2026-07-27"
    note: User-provided vLLM OpenAI API server command.

model:
  name: GLM-4-9B-0414
  slug: glm-4-9b-0414
  provider: ZhipuAI
  description: GLM-4 9B dense language model checkpoint released by ZhipuAI.
  model_id: ZhipuAI/GLM-4-9B-0414
  model_path: null
  architecture: dense
  parameter_count: 9B
  active_parameters: 9B
  context_length: 4096
  vram_minimum_gb: 48
  tasks:
    - text
  min_engine_version: 0.23.0
  match:
    - name_pattern: (?i)glm[-.]?4[-.]?9b[-.]?0414
  variant_name: GLM-4-9B-0414

hardware_profile:
  name: l20
  display_name: L20
  gpu_count: 1
  vram_gb: 48
  multi_node: true

features:
  tool_calling:
    description: Hermes tool-call parser.
    args:
      - --tool-call-parser
      - hermes

scenarios:
  standalone:
    source_ref: vllm_glm-4-9b-0414_manual#single_node
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        description: Single-node OpenAI-compatible API server.
        default_strategy: true
        engine_config:
          model: ZhipuAI/GLM-4-9B-0414
          trust_remote_code: true
          dtype: bfloat16
          max_model_len: 4096
          tensor_parallel_size: 1
          gpu_memory_utilization: 0.9
          host: "0.0.0.0"
          port: 17000
        env: {}

  multi_node:
    source_ref: "vllm_glm-4-9b-0414_manual#multi_node_dp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        display_name: "Multi-Node Data Parallel"
        orientation: throughput
        default_strategy: true
        head:
          engine_config:
            model: ZhipuAI/GLM-4-9B-0414
            trust_remote_code: true
            dtype: bfloat16
            max_model_len: 4096
            tensor_parallel_size: 1
            gpu_memory_utilization: 0.9
            host: 0.0.0.0
            port: 17000
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"
        worker:
          engine_config:
            model: ZhipuAI/GLM-4-9B-0414
            trust_remote_code: true
            dtype: bfloat16
            max_model_len: 4096
            tensor_parallel_size: 1
            gpu_memory_utilization: 0.9
            host: 0.0.0.0
            port: 17000
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
            headless: true
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"