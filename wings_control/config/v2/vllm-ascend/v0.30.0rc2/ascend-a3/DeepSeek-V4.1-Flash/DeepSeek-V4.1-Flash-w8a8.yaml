schema: v2
profile:
  engine: vllm-ascend
  version: "v0.30.0rc2"
  hardware: {Ascend910C_64G}
  model: DeepSeek-V4.1-Flash-w8a8
  cpu_arch: {aarch64}

upstream_sources:
  - id: vllm_ascend_deepseek_v41_flash_w8a8_910c_v030rc2_manual
    kind: manual
    repo: null
    file: null
    url: null
    note: Single-node Ascend 910C launch command supplied for vLLM-Ascend v0.30.0rc2. The engine image must initialize CANN and ATB before invoking Wings; runtime device visibility, RANK_IP, CANN_VERSION, and ATB_CXX_ABI remain deployment inputs.

model:
  name: DeepSeek-V4.1-Flash
  provider: Eco-Tech
  model_id: Eco-Tech/DeepSeek-V4.1-Flash-w8a8
  min_engine_version: v0.30.0rc2
  match:
    - name_pattern: "(?i)^deepseek[-.]v4[.]1-flash-w8a8$"
  variant_name: DeepSeek-V4.1-Flash-w8a8

hardware_profile:
  gpu_count: 16
  vram_gb: 1024
  multi_node: false

features:
  tool_calling:
    description: Enable DeepSeek V4.1 automatic tool calling.
    args: [--tokenizer-mode, deepseek_v41, --tool-call-parser, deepseek_v41, --enable-auto-tool-choice]
  reasoning:
    description: Enable the DeepSeek V4.1 reasoning parser.
    args: [--reasoning-parser, deepseek_v41]
  spec_decoding:
    description: Enable DSpark speculative decoding with five speculative tokens.
    args: [--speculative-config, "{\"method\":\"dspark\",\"num_speculative_tokens\":5,\"enforce_eager\":true}"]

scenarios:
  standalone:
    source_ref: "vllm_ascend_deepseek_v41_flash_w8a8_910c_v030rc2_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Ascend 910C single node DP=4 / TP=4
        default_strategy: true
        engine_config:
          model: /model
          host: "0.0.0.0"
          port: 8900
          served_model_name: dsv41
          data_parallel_size: 4
          tensor_parallel_size: 4
          enable_expert_parallel: true
          max_model_len: 150000
          max_num_batched_tokens: 8192
          max_num_seqs: 32
          gpu_memory_utilization: 0.9
          block_size: 128
          safetensors_load_strategy: lazy
          model_loader_extra_config:
            enable_multithread_load: true
            num_threads: 128
          quantization: ascend
          enable_prefix_caching: true
          enable_chunked_prefill: true
          no_disable_hybrid_kv_cache_manager: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          async_scheduling: true
          engram_config:
            cpu_offload: true
            dp_shared_memory: true
          additional_config:
            ascend_compilation_config:
              enable_npugraph_ex: true
              enable_static_kernel: false
            enable_cpu_binding: true
            enable_fused_mc2: 1
            enable_dsa_cp: true
            enable_flashcomm1: true
            enable_shared_expert_dp: true
        env:
          GLOO_SOCKET_IFNAME: $IFACE_NAME
          TP_SOCKET_IFNAME: $IFACE_NAME
          VLLM_SERVER_DEV_MODE: "0"
          PYTHONHASHSEED: "0"
          VLLM_USE_V2_MODEL_RUNNER: "0"
          VLLM_ENGINE_READY_TIMEOUT_S: "36000"
          HCCL_BUFFSIZE: "1024"
          HCCL_OP_EXPANSION_MODE: AIV

smart_accel:
  standalone:
    source_ref: "vllm_ascend_deepseek_v41_flash_w8a8_910c_v030rc2_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
          - name: dspark
            cli_params:
              speculative_config:
                method: dspark
                num_speculative_tokens: 5
                enforce_eager: true
            envs: {}
