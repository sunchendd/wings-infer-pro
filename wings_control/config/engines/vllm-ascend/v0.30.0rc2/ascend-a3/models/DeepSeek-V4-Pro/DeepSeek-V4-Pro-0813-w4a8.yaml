model:
  name: DeepSeek-V4-Pro
  provider: Eco-Tech
  model_id: Eco-Tech/DeepSeek-V4-Pro-0813-w4a8
  min_engine_version: v0.30.0rc2
  match:
  - name_pattern: (?i)^deepseek[-.]?v4[-.]?pro[-.]?0813[-.]?w4a8$
  variant_name: DeepSeek-V4-Pro-0813-w4a8
hardware_profile:
  gpu_count: 16
  vram_gb: 1024
  multi_node: true
features:
  tool_calling:
    description: Enable automatic tool/function calling via the DeepSeek-V4 tool-call parser.
    args:
    - --tokenizer-mode
    - deepseek_v4
    - --tool-call-parser
    - deepseek_v4
    - --enable-auto-tool-choice
  reasoning:
    description: Enable the DeepSeek-V4 reasoning-content parser.
    args:
    - --reasoning-parser
    - deepseek_v4
  spec_decoding:
    description: Enable DSpark speculative decoding with the checkpoint-integrated draft weights.
    args:
    - --speculative-config
    - '{"method":"dspark","num_speculative_tokens":5,"enforce_eager":true}'
  sparse_index:
    description: Configure the DeepSeek sparse index cache.
    args:
    - --hf-overrides
    - '{"use_index_cache":true,"index_topk_freq":4}'
scenarios:
  multi_node:
