upstream_sources:
- id: ascend_qwen3-embedding-0.6b
  kind: official_doc
  repo: vllm-ascend
  file: docs/source/tutorials/models/Qwen3-Embedding.md
  url: https://github.com/vllm-project/vllm-ascend/blob/9e1cab90c0a8ec49369eb9aa1e8f387dbe5e4f1d/docs/source/tutorials/models/Qwen3-Embedding.md
  note: A2/A3 pooling example. PD and generation acceleration do not apply. Target v0.26.0rc1; command validation only, no hardware execution.
model:
  name: Qwen3-Embedding-0.6B
  provider: Qwen
  model_id: Qwen/Qwen3-Embedding-0.6B
  min_engine_version: v0.26.0rc1
  match:
  - name_pattern: (?i)^(?:Qwen/)?Qwen3-Embedding-0\.6B$
  variant_name: Qwen3-Embedding-0.6B
hardware_profile:
  gpu_count: 8
  vram_gb: 512
  multi_node: true
scenarios:
  standalone:
    source_ref: ascend_qwen3-embedding-0.6b#single_node
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3-Embedding-0.6B
          served_model_name: Qwen/Qwen3-Embedding-0.6B
          runner: pooling
          port: 8000
          enforce_eager: true
          max_model_len: 1024
          host: "0.0.0.0"
        env: {}

  multi_node:
    source_ref: "ascend_qwen3-embedding-0.6b#multi_node_dp_across"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        display_name: "Multi-Node Data Parallel (DP-ACROSS)"
        orientation: throughput
        default_strategy: true
        head:
          engine_config:
            model: Qwen/Qwen3-Embedding-0.6B
            served_model_name: Qwen/Qwen3-Embedding-0.6B
            runner: pooling
            port: 8000
            enforce_eager: true
            max_model_len: 1024
            host: "0.0.0.0"
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"
        worker:
          engine_config:
            model: Qwen/Qwen3-Embedding-0.6B
            served_model_name: Qwen/Qwen3-Embedding-0.6B
            runner: pooling
            port: 8000
            enforce_eager: true
            max_model_len: 1024
            host: "0.0.0.0"
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
            headless: true
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"
