# 来源追溯
upstream_sources:
  - id: sglang_devstral-2
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Mistral/Devstral-2.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Mistral/Devstral-2.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Devstral-2-123B-Instruct-2512  # 模型名称
  provider: collections  # 提供者/厂商
  model_id: collections/mistralai  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)devstral[-.]?2"
  variant_name: Devstral-2-123B-Instruct-2512  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, mistral]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_devstral-2#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: mistralai/Devstral-2-123B-Instruct-2512
          tp: 2
        env: {}
        default_strategy: true
