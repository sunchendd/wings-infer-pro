# 来源追溯
upstream_sources:
  - id: vllm_recipe_mistral-small-4-119b
    kind: official_recipe
    repo: recipes
    file: models/mistralai/Mistral-Small-4-119B-2603.yaml
    url: "https://recipes.vllm.ai/mistralai/Mistral-Small-4-119B-2603"
    date_updated: 2026-05-13
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Mistral-Small-4-119B  # 模型名称
  slug: mistral-small-4-119b  # 模型标识
  provider: Mistral AI  # 提供者/厂商
  description: "Mistral Small 4 (119B MoE, 6.5B active) — multimodal hybrid instruct + reasoning model with native FP8 weights and 256K context"  # 模型描述
  model_id: mistralai/Mistral-Small-4-119B-2603-NVFP4  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 119B  # 总参数量
  active_parameters: 6.5B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 72  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.20.0"  # 最低引擎版本要求
  date_updated: 2026-05-13  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)mistral[-.]?small[-.]?4[-.]?119b"
  variant_name: Mistral-Small-4-119B-2603-nvfp4

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 1440
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: "Mistral tool-call parser with automatic tool choice — emits [TOOL_CALLS] / [ARGS] from the chat template"
    args: [--enable-auto-tool-choice, --tool-call-parser, mistral]
  reasoning:
    description: "Mistral reasoning parser extracts [THINK]...[/THINK] into message.reasoning_content (emitted when reasoning_effort='high')"
    args: [--reasoning-parser, mistral]
  spec_decoding:
    description: EAGLE speculative decoding via the mistralai/Mistral-Small-4-119B-2603-eagle 2-layer draft head
    args: [--speculative-config, "{\"model\":\"mistralai/Mistral-Small-4-119B-2603-eagle\",\"num_speculative_tokens\":3,\"method\":\"eagle\",\"max_model_len\":\"65536\"}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_mistral-small-4-119b#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: mistralai/Mistral-Small-4-119B-2603-NVFP4
          max_model_len: 262144
          attention_backend: TRITON_MLA
          tensor_parallel_size: 2
        env: {}
  multi_node:
    source_ref: "vllm_recipe_mistral-small-4-119b#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: mistralai/Mistral-Small-4-119B-2603-NVFP4
            max_model_len: 262144
            attention_backend: TRITON_MLA
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: mistralai/Mistral-Small-4-119B-2603-NVFP4
            max_model_len: 262144
            attention_backend: TRITON_MLA
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
  pd_disaggregation:
    source_ref: "vllm_recipe_mistral-small-4-119b#pd_cluster"
    match:
      distributed: true
      pd_role: null
    # PD分离：1P×1D  # 根据官网默认配置
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill  # P1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: mistralai/Mistral-Small-4-119B-2603-NVFP4
              max_model_len: 262144
              attention_backend: TRITON_MLA
              port: 8001
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_producer
                kv_load_failure_policy: fail
              enforce_eager: true
              tensor_parallel_size: 8
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5557
              VLLM_NIXL_SIDE_CHANNEL_HOST: $PREFILL_NODE_1
              CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
          - role: decode  # D1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: mistralai/Mistral-Small-4-119B-2603-NVFP4
              max_model_len: 262144
              attention_backend: TRITON_MLA
              port: 8002
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_consumer
                kv_load_failure_policy: fail
              compilation_config:
                cudagraph_mode: FULL_DECODE_ONLY
              tensor_parallel_size: 8
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5558
              VLLM_NIXL_SIDE_CHANNEL_HOST: $DECODE_NODE_1
              CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
