# 来源追溯
upstream_sources:
  - id: vllm_ascend_gpt-oss-120b
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/gpt-oss-120b.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.21.0rc/docs/source/tutorials/models/gpt-oss-120b.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: gpt-oss-120b  # 模型名称
  provider: unsloth  # 提供者/厂商
  model_id: unsloth/gpt-oss-120b-BF16  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)gpt[-.]?oss[-.]?120b"
  variant_name: gpt-oss-120b-BF16  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_gpt-oss-120b#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: unsloth/gpt-oss-120b-BF16
          served_model_name: gpt-oss-120b-bf16
          port: 8000
          trust_remote_code: true
          max_num_seqs: 4
          gpu_memory_utilization: 0.9
          tensor_parallel_size: 4
          max_model_len: 4096
          max_num_batched_tokens: 4096
          enable_expert_parallel: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
            cudagraph_capture_sizes: [1, 2, 3, 4]
        env:
          VLLM_USE_MODELSCOPE: "True"
          HCCL_OP_EXPANSION_MODE: AIV
          HCCL_BUFFSIZE: 512
          NPU_MEMORY_FRACTION: "0.95"
          ASCEND_RT_VISIBLE_DEVICES: "0,1,2,3"
          OMP_PROC_BIND: "false"
          VLLM_USE_V1: 1
          TASK_QUEUE_ENABLE: 1
          OMP_NUM_THREADS: 1
          TIKTOKEN_ENCODINGS_BASE: "/${PWD}/tiktoken_encodings"
