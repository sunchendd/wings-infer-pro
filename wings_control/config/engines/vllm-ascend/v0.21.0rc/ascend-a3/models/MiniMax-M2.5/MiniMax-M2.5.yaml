# 来源追溯
upstream_sources:
  - id: vllm_ascend_minimax-m2.5
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/MiniMax-M2.5.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.21.0rc/docs/source/tutorials/models/MiniMax-M2.5.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: MiniMax-M2.5  # 模型名称
  provider: MiniMax  # 提供者/厂商
  model_id: MiniMax/MiniMax-M2.5  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)minimax[-.]?m2.5"
  variant_name: MiniMax-M2.5-w8a8-QuaRot  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 支持单节点及多节点场景

# 可选功能列表
features:
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"enforce_eager\":true,\"method\":\"eagle3\",\"model\":\"/path/to/weight/Eagle3/\",\"num_speculative_tokens\":3}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_minimax-m2.5#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: /path/to/weight/MiniMax-M2.5-w8a8-QuaRot
          served_model_name: MiniMax-M2.5
          host: "0.0.0.0"
          port: 8000
          trust_remote_code: true
          quantization: ascend
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          additional_config:
            enable_cpu_binding: true
          enable_expert_parallel: true
          tensor_parallel_size: 4
          data_parallel_size: 4
          max_num_seqs: 48
          max_model_len: 40690
          max_num_batched_tokens: 16384
          gpu_memory_utilization: 0.85
        env:
          HCCL_OP_EXPANSION_MODE: AIV
          HCCL_BUFFSIZE: 1024
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          OMP_NUM_THREADS: 1
          LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2${LD_PRELOAD:+:$LD_PRELOAD}"
          TASK_QUEUE_ENABLE: 1
          VLLM_ASCEND_ENABLE_FUSED_MC2: 1
          VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
          VLLM_ASCEND_BALANCE_SCHEDULING: 1
        system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
          sysctls:
            vm.swappiness: 0
            kernel.numa_balancing: 0
            kernel.sched_migration_cost_ns: 50000
          sysfs_writes:
            - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
              value: performance

  multi_node:
    source_ref: vllm_ascend_minimax-m2.5#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        head:
          engine_config:
            model: /path/to/weight/MiniMax-M2.5-w8a8-QuaRot
            served_model_name: MiniMax-M2.5
            host: 0.0.0.0
            port: 8000
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: $local_ip
            data_parallel_rpc_port: 12321
            trust_remote_code: true
            quantization: ascend
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            additional_config:
              enable_cpu_binding: true
            enable_expert_parallel: true
            tensor_parallel_size: 16
            max_num_seqs: 48
            max_model_len: 40690
            max_num_batched_tokens: 16384
            gpu_memory_utilization: 0.85
          env:
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_BUFFSIZE: 1024
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
            OMP_NUM_THREADS: 1
            LD_PRELOAD: /usr/lib/aarch64-linux-gnu/libjemalloc.so.2${LD_PRELOAD:+:$LD_PRELOAD}
            TASK_QUEUE_ENABLE: 1
            VLLM_ASCEND_ENABLE_FUSED_MC2: 1
            VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
            VLLM_ASCEND_BALANCE_SCHEDULING: 1
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
          system_setup:
            sysctls:
              vm.swappiness: 0
              kernel.numa_balancing: 0
              kernel.sched_migration_cost_ns: 50000
            sysfs_writes: [{path: /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor, value: performance}]
        worker:
          engine_config:
            model: /path/to/weight/MiniMax-M2.5-w8a8-QuaRot
            served_model_name: MiniMax-M2.5
            host: 0.0.0.0
            port: 8000
            headless: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 12321
            trust_remote_code: true
            quantization: ascend
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            additional_config:
              enable_cpu_binding: true
            enable_expert_parallel: true
            tensor_parallel_size: 16
            max_num_seqs: 48
            max_model_len: 40690
            max_num_batched_tokens: 16384
            gpu_memory_utilization: 0.85
          env:
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_BUFFSIZE: 1024
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
            OMP_NUM_THREADS: 1
            LD_PRELOAD: /usr/lib/aarch64-linux-gnu/libjemalloc.so.2${LD_PRELOAD:+:$LD_PRELOAD}
            TASK_QUEUE_ENABLE: 1
            VLLM_ASCEND_ENABLE_FUSED_MC2: 1
            VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
            VLLM_ASCEND_BALANCE_SCHEDULING: 1
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
          system_setup:
            sysctls:
              vm.swappiness: 0
              kernel.numa_balancing: 0
              kernel.sched_migration_cost_ns: 50000
            sysfs_writes: [{path: /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor, value: performance}]
