# 来源追溯
upstream_sources:
  - id: minimax_m2.7_nvfp4_manual
    kind: manual
    repo: null
    file: null
    url: https://huggingface.co/nvidia/MiniMax-M2.7-NVFP4
    date_updated: 2026-07-14
    note: 手工录入

# 模型基本信息
model:
  name: MiniMax-M2.7  # 模型名称
  slug: minimax-m2.7  # 模型标识
  provider: MiniMax  # 提供者/厂商
  description: "MiniMax-M2.7 MoE 模型（230B 总参 / 10B 激活），NVFP4 量化，面向编码、agent 工具链与长上下文推理。"  # 模型描述
  model_id: nvidia/MiniMax-M2.7-NVFP4  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 230B  # 总参数量
  active_parameters: 10B  # 激活参数量（MoE 模型）
  context_length: 196608  # 最大上下文长度
  vram_minimum_gb: 384  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求（实测 vLLM 0.23.0）
  date_updated: 2026-07-14  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)minimax[-.]?m2.7"
  variant_name: MiniMax-M2.7-nvfp4  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU 数量
  vram_gb: 576  # 单节点总显存(GB)（8 × 72GB）
  multi_node: true  # 支持单节点及多节点场景

# 可选功能列表（不进 engine_config）
features:
  tool_calling:
    description: Enable tool calling with MiniMax M2 tool parser.
    args: ["--tool-call-parser", "minimax_m2", "--enable-auto-tool-choice"]
  reasoning:
    description: Enable reasoning/thinking mode via MiniMax M2 reasoning parser.
    args: ["--reasoning-parser", "minimax_m2"]
  spec_decoding:
    description: Suffix-based speculative decoding.
    args: ["--speculative-config", "{\"method\":\"suffix\",\"num_speculative_tokens\":10}"]
  lmcache:
    description: LMCache KV cache acceleration.
    kv_transfer:
      description: KV transfer configuration for LMCache.
      args: ["--kv-transfer-config", "{\"kv_connector\":\"LMCacheConnectorV1\",\"kv_role\":\"kv_both\",\"kv_load_failure_policy\":\"recompute\"}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "minimax_m2.7_nvfp4_manual#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: "nvidia/MiniMax-M2.7-NVFP4"
          trust_remote_code: true
          kv_cache_dtype: "fp8"
          tensor_parallel_size: 4
          port: 5611
          moe_backend: "flashinfer_cutlass"
        env:
          PYTHONHASHSEED: "0"
          VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "900"
          LMCACHE_MAX_LOCAL_CPU_SIZE: "15"
          LMCACHE_LOCAL_CPU: "True"
          LMCACHE_CHUNK_SIZE: "256"
          LMCACHE_EXTRA_CONFIG: "{\"use_odirect\": true}"
          LMCACHE_PRE_CACHING_HASH_ALGORITHM: "sha256_cbor_64bit"
          LMCACHE_LOCAL_DISK: "/mnt/kvcache_offload/kvcache"
          LMCACHE_MAX_LOCAL_DISK_SIZE: "600.0"
          NCCL_P2P_LEVEL: SYS
          NCCL_SHM_DISABLE: 1

  multi_node:
    source_ref: minimax_m2.7_nvfp4_manual#multi_node_tp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:
          engine_config:
            model: nvidia/MiniMax-M2.7-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            port: 5611
            moe_backend: flashinfer_cutlass
          env:
            PYTHONHASHSEED: '0'
            VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '900'
            LMCACHE_MAX_LOCAL_CPU_SIZE: '15'
            LMCACHE_LOCAL_CPU: 'True'
            LMCACHE_CHUNK_SIZE: '256'
            LMCACHE_EXTRA_CONFIG: '{"use_odirect": true}'
            LMCACHE_PRE_CACHING_HASH_ALGORITHM: sha256_cbor_64bit
            LMCACHE_LOCAL_DISK: /mnt/kvcache_offload/kvcache
            LMCACHE_MAX_LOCAL_DISK_SIZE: '600.0'
            NCCL_P2P_LEVEL: SYS
            NCCL_SHM_DISABLE: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:
          engine_config:
            model: nvidia/MiniMax-M2.7-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            port: 5611
            moe_backend: flashinfer_cutlass
          env:
            PYTHONHASHSEED: '0'
            VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '900'
            LMCACHE_MAX_LOCAL_CPU_SIZE: '15'
            LMCACHE_LOCAL_CPU: 'True'
            LMCACHE_CHUNK_SIZE: '256'
            LMCACHE_EXTRA_CONFIG: '{"use_odirect": true}'
            LMCACHE_PRE_CACHING_HASH_ALGORITHM: sha256_cbor_64bit
            LMCACHE_LOCAL_DISK: /mnt/kvcache_offload/kvcache
            LMCACHE_MAX_LOCAL_DISK_SIZE: '600.0'
            NCCL_P2P_LEVEL: SYS
            NCCL_SHM_DISABLE: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
