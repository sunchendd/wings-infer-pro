# Source provenance
upstream_sources:
  - id: vllm_ascend_glm-5.3-w8a8c8
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/GLM5.3.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/v0.23.0/docs/source/tutorials/models/GLM5.3.md"
    note: Official A3 two-node GLM-5.3-w8a8c8 deployment commands; upstream validation is limited to v0.23.0 multi-node co-located deployment.
  - id: vllm_ascend_glm-5.2-pd-roce
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/GLM5.2.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/v0.23.0/docs/source/tutorials/models/GLM5.2.md"
    note: GLM-5.3 PD has not been upstream-validated; its A3 P=DP4/TP8 and D=DP32/TP1 reference topology and RoCE MC2 requirements are taken from the GLM-5.2 guide.

# Model metadata
model:
  name: GLM-5.3
  provider: Eco-Tech
  model_id: Eco-Tech/GLM-5.3-w8a8c8
  min_engine_version: v0.26.0rc1
  match:
    - name_pattern: "(?i)^glm[-.]?5[.]3[-.]?w8a8c8$"
  variant_name: GLM-5.3-w8a8c8

# Per-node A3 hardware profile
hardware_profile:
  gpu_count: 16
  vram_gb: 1024
  multi_node: true

# Feature declarations shared by the two deployment scenarios
features:
  tool_calling:
    description: Enable automatic tool/function calling through the GLM tool-call parser.
    args: [--tool-call-parser, glm47, --enable-auto-tool-choice]
  reasoning:
    description: Enable the GLM reasoning-content parser.
    args: [--reasoning-parser, glm45]
  spec_decoding:
    description: Enable checkpoint-integrated DeepSeek MTP speculative decoding.
    args: [--speculative-config, "{\"num_speculative_tokens\":3,\"method\":\"deepseek_mtp\",\"enforce_eager\":true}"]

scenarios:
  multi_node:
    source_ref: "vllm_ascend_glm-5.3-w8a8c8#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        orientation: throughput
        default_strategy: true
        head:
          engine_config:
            model: Eco-Tech/GLM-5.3-w8a8c8
            host: "0.0.0.0"
            port: 8077
            api_server_count: 1
            data_parallel_size: 8
            data_parallel_start_rank: 0
            data_parallel_size_local: 4
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 12980
            tensor_parallel_size: 4
            enable_expert_parallel: true
            seed: 1024
            served_model_name: glm-5
            max_num_seqs: 6
            max_model_len: 202752
            max_num_batched_tokens: 4096
            trust_remote_code: true
            gpu_memory_utilization: 0.9
            quantization: ascend
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            additional_config:
              enable_dsa_cp: true
              enable_sparse_sfa_c8: true
              enable_sparse_li_c8: true
              enable_balance_scheduling: true
              enable_fused_mc2: 0
              enable_flashcomm1: true
              enable_mc2_hierarchy_comm: true
          env:
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            HCCL_TRANSFER_TIMEOUT: 600
            HCCL_EXEC_TIMEOUT: 3600
            HCCL_CONNECT_TIMEOUT: 3600
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 1
            HCCL_BUFFSIZE: 1024
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            VLLM_ASCEND_ENABLE_MLAPO: 1
            HCCL_INTER_HCCS_DISABLE: true
            HCCL_INTRA_ROCE_ENABLE: 1
          system_setup:
            commands: ["nic_name=\"xxxx\" # change to the NIC that owns local_ip", "local_ip=\"xx.xx.xx.x\" # use the IP of Node0", "node0_ip=\"xx.xx.xx.x\" # use Node0 local_ip"]
        worker:
          engine_config:
            model: Eco-Tech/GLM-5.3-w8a8c8
            host: "0.0.0.0"
            port: 8077
            headless: true
            data_parallel_size: 8
            data_parallel_start_rank: 4
            data_parallel_size_local: 4
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 12980
            tensor_parallel_size: 4
            enable_expert_parallel: true
            seed: 1024
            served_model_name: glm-5
            max_num_seqs: 6
            max_model_len: 202752
            max_num_batched_tokens: 4096
            trust_remote_code: true
            gpu_memory_utilization: 0.92
            quantization: ascend
            enable_chunked_prefill: true
            enable_prefix_caching: true
            async_scheduling: true
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            additional_config:
              enable_dsa_cp: true
              enable_sparse_sfa_c8: true
              enable_sparse_li_c8: true
              enable_balance_scheduling: true
              enable_fused_mc2: 0
              enable_flashcomm1: true
              enable_mc2_hierarchy_comm: true
          env:
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            HCCL_TRANSFER_TIMEOUT: 600
            HCCL_EXEC_TIMEOUT: 3600
            HCCL_CONNECT_TIMEOUT: 3600
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 1
            HCCL_BUFFSIZE: 1024
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            VLLM_ASCEND_ENABLE_MLAPO: 1
            HCCL_INTER_HCCS_DISABLE: true
            HCCL_INTRA_ROCE_ENABLE: 1
          system_setup:
            commands: ["nic_name=\"xxxx\" # change to the NIC that owns local_ip", "local_ip=\"xx.xx.xx.x\" # use the IP of Node1", "node0_ip=\"xx.xx.xx.x\" # use Node0 local_ip"]

  # The exact PD path currently rejects
  # ENABLE_SPECULATIVE_DECODE, so the upstream role-specific MTP configuration
  # remains in the base recipe; the matching SmartAccel decode definition is
  # retained for a future PD SmartAccel implementation.
  pd_disaggregation:
    source_ref: "vllm_ascend_glm-5.2-pd-roce#pd_cluster"
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill
            index: 0
            engine_config:
              model: Eco-Tech/GLM-5.3-w8a8c8
              host: "0.0.0.0"
              port: $2
              safetensors_load_strategy: prefetch
              data_parallel_size: $3
              data_parallel_rank: $4
              data_parallel_address: $5
              data_parallel_rpc_port: 16591
              tensor_parallel_size: $7
              enable_expert_parallel: true
              speculative_config:
                num_speculative_tokens: 1
                method: deepseek_mtp
                enforce_eager: true
              seed: 1024
              served_model_name: glm-5
              max_model_len: 133120
              additional_config:
                enable_dsa_cp: true
                enable_sparse_li_c8: true
                enable_fused_mc2: 0
                enable_mc2_hierarchy_comm: true
              max_num_batched_tokens: 8192
              trust_remote_code: true
              max_num_seqs: 64
              quantization: ascend
              gpu_memory_utilization: 0.92
              enforce_eager: true
              kv_transfer_config:
                kv_connector: MooncakeConnectorV1
                kv_role: kv_producer
                kv_port: 30000
                engine_id: 0
                kv_connector_extra_config:
                  use_ascend_direct: true
                  prefill:
                    dp_size: 4
                    tp_size: 8
                  decode:
                    dp_size: 32
                    tp_size: 1
            env:
              HCCL_OP_EXPANSION_MODE: AIV
              HCCL_IF_IP: $local_ip
              GLOO_SOCKET_IFNAME: $nic_name
              TP_SOCKET_IFNAME: $nic_name
              HCCL_SOCKET_IFNAME: $nic_name
              HCCL_TRANSFER_TIMEOUT: 600
              HCCL_EXEC_TIMEOUT: 3600
              HCCL_CONNECT_TIMEOUT: 3600
              OMP_PROC_BIND: "false"
              OMP_NUM_THREADS: 1
              PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
              HCCL_BUFFSIZE: 1024
              ACL_OP_INIT_MODE: 1
              ASCEND_A3_ENABLE: 1
              LD_LIBRARY_PATH: "$LD_LIBRARY_PATH:/usr/local/lib"
              VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
              ASCEND_BUFFER_POOL: "4:8"
              HCCL_INTER_HCCS_DISABLE: true
              HCCL_INTRA_ROCE_ENABLE: 1
          - role: prefill
            index: 1
            engine_config:
              model: Eco-Tech/GLM-5.3-w8a8c8
              host: "0.0.0.0"
              port: $2
