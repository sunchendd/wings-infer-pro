model:
  name: Qwen3.6-35B-A3B
  provider: Eco-Tech
  model_id: Eco-Tech/Qwen3.6-35B-A3B-w8a8
  min_engine_version: v0.26.0rc1
  match:
  - name_pattern: (?i)^Qwen3\.6-35B?-A3B?-w8a8$
  variant_name: Qwen3.6-35B-A3B-w8a8
hardware_profile:
  gpu_count: 8
  vram_gb: 512
  multi_node: true
features:
  spec_decoding:
    args: [--speculative-config, "{\"method\":\"qwen3_5_mtp\",\"num_speculative_tokens\":3,\"enforce_eager\":true}"]
scenarios:
  standalone:
    source_ref: ascend_qwen3.6-35b-a3b-w8a8#single_node
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Eco-Tech/Qwen3.6-35B-A3B-w8a8
          host: "0.0.0.0"
          port: 8000
          data_parallel_size: 1
          tensor_parallel_size: 2
          enable_expert_parallel: true
          seed: 1024
          quantization: ascend
          served_model_name: qwen3.6
          max_num_seqs: 128
          max_model_len: 262144
          max_num_batched_tokens: 16384
          trust_remote_code: true
          gpu_memory_utilization: 0.9
          enable_prefix_caching: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          additional_config:
            enable_cpu_binding: true
            multistream_overlap_shared_expert: true
        env:
          VLLM_USE_MODELSCOPE: 'True'
          HCCL_BUFFSIZE: '1024'
          HCCL_OP_EXPANSION_MODE: AIV
          LD_PRELOAD: /usr/lib/aarch64-linux-gnu/libjemalloc.so.2${LD_PRELOAD:+:$LD_PRELOAD}
          PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
        system_setup:
          sysctls:
            vm.swappiness: 0
            kernel.numa_balancing: 0
            kernel.sched_migration_cost_ns: 50000
          sysfs_writes:
          - path: /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor
            value: performance
