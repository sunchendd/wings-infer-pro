# SmartAccel 加速配置(decoding=mtp[moe_backend=triton] / kv_offload=cpu)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: Qwen3.6-35B-A3B
  variant_name: "Qwen3.6-35B-A3B"
  match:
    - name_pattern: "(?i)qwen3[-.]?6[-.]?35b[-.]?a3b"
smart_accel:
  decoding:
    - name: mtp
      cli_params:
        speculative_config:
          method: mtp
          num_speculative_tokens: 3
          moe_backend: triton
      envs: {}
  kv_offload:
    - name: cpu
      cli_params:
        kv_transfer_config:
          kv_connector: OffloadingConnector
          kv_role: kv_both
          kv_connector_extra_config:
            cpu_bytes_to_use: "{mem_gb_to_bytes}"
      envs: {}
