# 来源追溯
upstream_sources:
  - id: sglang_ling-2.6
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/InclusionAI/Ling-2.6.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/InclusionAI/Ling-2.6.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Ling-2.6  # 模型名称
  provider: inclusionAI  # 提供者/厂商
  model_id: inclusionAI/Ling-2.6-flash  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)ling[-.]?2.6"
  variant_name: Ling-2.6  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1440  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, qwen]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_ling-2.6#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: inclusionAI/Ling-2.6-1T
          model_path: inclusionAI/Ling-2.6-1T
          tp_size: 4
          trust_remote_code: true
          host: "0.0.0.0"
          port: 30000
          model_loader_extra_config:
            enable_multithread_load: "true"
            num_threads: 64
        env: {}
        default_strategy: true
