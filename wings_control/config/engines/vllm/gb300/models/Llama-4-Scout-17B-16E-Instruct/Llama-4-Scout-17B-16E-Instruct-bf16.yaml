            data_parallel_address: $HEAD_IP
            async_scheduling: true
            no_enable_prefix_caching: true
            max_num_batched_tokens: 8192
            compilation_config:
              pass_config:
                fuse_allreduce_rms: true
                eliminate_noops: true
          env:
