# 来源追溯
upstream_sources:
  - id: sglang_minicpm-v-4.6
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/OpenBMB/MiniCPM-V-4_6.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/OpenBMB/MiniCPM-V-4_6.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: MiniCPM-V 4.6  # 模型名称
  provider: openbmb  # 提供者/厂商
  model_id: openbmb/MiniCPM-V-4.6  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)minicpm[-.]?v[-.]?4.6"
  variant_name: MiniCPM-V 4.6  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 640  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_minicpm-v-4.6#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: openbmb/MiniCPM-V-4.6
          model_path: openbmb/MiniCPM-V-4.6
          trust_remote_code: true
          dtype: bfloat16
          mem_fraction_static: 0.15
          mamba_scheduler_strategy: extra_buffer
          page_size: 64
          host: "0.0.0.0"
          port: 30000
        env: {}
        default_strategy: true
