# 来源追溯
upstream_sources:
  - id: vllm_recipe_ling-2.6-1t
    kind: official_recipe
    repo: recipes
    file: models/inclusionAI/Ling-2.6-1T.yaml
    url: "https://recipes.vllm.ai/inclusionAI/Ling-2.6-1T"
    date_updated: 2026-05-13
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Ling-2.6-1T  # 模型名称
  slug: ling-2.6-1t  # 模型标识
  provider: inclusionAI  # 提供者/厂商
  description: "Ling-2.6-1T (BailingMoeV2_5) FP8 instruct model with 1T total / 50B active params, hybrid linear + MLA attention, 262K context"  # 模型描述
  model_id: inclusionAI/Ling-2.6-1T  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 1T  # 总参数量
  active_parameters: 50B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 1200  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.20.2"  # 最低引擎版本要求
  date_updated: 2026-05-13  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)ling[-.]?2.6[-.]?1t"
  variant_name: Ling-2.6-1T-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 1536
  multi_node: false

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_ling-2.6-1t#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: inclusionAI/Ling-2.6-1T
          trust_remote_code: true
          tensor_parallel_size: 8
        env:
          VLLM_ROCM_USE_AITER: 1
  multi_node:
    source_ref: "vllm_recipe_ling-2.6-1t#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: inclusionAI/Ling-2.6-1T
            trust_remote_code: true
            tensor_parallel_size: 8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: inclusionAI/Ling-2.6-1T
            trust_remote_code: true
            tensor_parallel_size: 8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: inclusionAI/Ling-2.6-1T
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: inclusionAI/Ling-2.6-1T
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
