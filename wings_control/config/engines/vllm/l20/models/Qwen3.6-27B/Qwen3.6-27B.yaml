# 来源追溯
upstream_sources:
  - id: vllm_qwen3.6-27b_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/Qwen/Qwen3.6-27B"
    date_updated: 2026-07-17
    note: 用户提供 vLLM 启动命令，手工录入。

# 模型基本信息
model:
  name: Qwen3.6-27B  # 模型名称
  slug: qwen3.6-27b  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: "Qwen3.6 dense multimodal model (27B) with gated delta networks hybrid attention, MTP, and 262K context."  # 模型描述
  model_id: Qwen/Qwen3.6-27B  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 27B  # 总参数量
  active_parameters: 27B  # 激活参数量
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 96  # 最低显存需求(GB)
  tasks: [multimodal, text]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-07-17  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3.6[-.]?27b"
  variant_name: Qwen3.6-27B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 2  # 单节点 GPU 数量
  vram_gb: 96  # 单节点总显存(GB)
  multi_node: true  # 支持单节点及多节点场景

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool choice with Qwen3 Coder parser.
    args: [--enable-auto-tool-choice, --tool-call-parser, qwen3_coder]
  reasoning:
    description: Enable chain-of-thought reasoning with Qwen3 parser.
    args: [--reasoning-parser, qwen3]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode; avoids TP communication overhead on the small encoder.
    args: [--mm-encoder-tp-mode, data]
  kv_offloading:
    description: KV cache native offloading to reduce GPU memory usage.
    args: [--kv-offloading-backend, native, --kv-offloading-size, '20']
  spec_decoding:
    description: Multi-token prediction speculative decoding for lower latency.
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":1}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_qwen3.6-27b_manual#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3.6-27B
          trust_remote_code: true
          tensor_parallel_size: 2
          kv_cache_dtype: fp8
          enable_prefix_caching: true
        env: {}

  multi_node:
    source_ref: vllm_qwen3.6-27b_manual#multi_node_tp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:
          engine_config:
            model: Qwen/Qwen3.6-27B
            trust_remote_code: true
            tensor_parallel_size: 4
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            kv_cache_dtype: fp8
            enable_prefix_caching: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:
          engine_config:
            model: Qwen/Qwen3.6-27B
            trust_remote_code: true
            tensor_parallel_size: 4
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            kv_cache_dtype: fp8
            enable_prefix_caching: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
