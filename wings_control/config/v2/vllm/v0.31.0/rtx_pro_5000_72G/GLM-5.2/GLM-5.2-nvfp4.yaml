# vLLM 0.31.0 / RTX PRO 5000 72GB unified recipe and SmartAccel.
schema: v2
profile:
  engine: vllm
  version: v0.31.0
  hardware:
  - RTX-PRO-5000-72GB-Blackwell_72G
  model: GLM-5.2-nvfp4
upstream_sources:
- id: glm52_vllm0280_sm120_tp4dp4
  kind: manual
  repo: null
  file: glm52/perf_start_glm52_tp16ep_lmcache_mp.sh
  url: https://huggingface.co/nvidia/GLM-5.2-NVFP4
  note: GLM-5.2-NVFP4 vLLM 0.28.0 单机 16 卡 TP4×DP4×EP+LMCache MP 实测配置。
model:
  name: GLM-5.2
  slug: glm-5.2
  provider: GLM (Z-AI)
  description: GLM-5.2 MoE model using the NVIDIA NVFP4 checkpoint.
  model_id: nvidia/GLM-5.2-NVFP4
  architecture: moe
  parameter_count: 743B
  active_parameters: 39B
  context_length: 1048576
  vram_minimum_gb: 558
  tasks:
  - text
  min_engine_version: 0.31.0
  match:
  - name_pattern: (?i)glm[-.]?5.2[-.]?nvfp4
  variant_name: GLM-5.2-nvfp4
hardware_profile:
  gpu_count: 16
  vram_gb: 1152
  multi_node: false
features:
  tool_calling:
    description: Enable GLM-4.7 tool parsing with automatic tool choice.
    args:
    - --tool-call-parser
    - glm47
    - --enable-auto-tool-choice
  reasoning:
    description: Enable GLM-4.5-compatible reasoning parsing.
    args:
    - --reasoning-parser
    - glm45
  spec_decoding:
    description: Enable five-token MTP speculative decoding.
    args:
    - --speculative-config
    - '{"method":"mtp","num_speculative_tokens":5}'
  lmcache:
    description: Enable LMCache MP KV cache acceleration.
    kv_transfer:
      description: Connect every vLLM rank to the colocated LMCache MP server.
      args:
      - --kv-transfer-config
      - '{"kv_connector":"LMCacheMPConnector","kv_role":"kv_both","kv_connector_extra_config":{"lmcache.mp.port":5555,"lmcache.mp.mq_timeout":300}}'
scenarios:
  standalone:
    source_ref: glm52_vllm0280_sm120_tp4dp4#single_node_dep
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Tensor + Data + Expert Parallel
        orientation: throughput
        default_strategy: true
        engine_config:
          model: nvidia/GLM-5.2-NVFP4
          host: 0.0.0.0
          port: 8001
          tensor_parallel_size: 4
          data_parallel_size: 4
          enable_expert_parallel: true
          all2all_backend: allgather_reducescatter
          kv_cache_dtype: fp8_e4m3
          gpu_memory_utilization: 0.85
          max_model_len: 150000
          max_num_seqs: 64
          max_num_batched_tokens: 8192
          watermark: 0.1
          compilation_config:
            mode: 0
            cudagraph_mode: FULL_DECODE_ONLY
            max_cudagraph_capture_size: 64
        env:
          NCCL_P2P_LEVEL: SYS
          NCCL_SHM_DISABLE: 1
          NCCL_CUMEM_ENABLE: 0
smart_accel:
  standalone:
    source_ref: glm52/glm52_sm120_sparse_mla_fix/README.md#validated-result
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: mtp
          packages:
            flashinfer-sm120: 0.7.0.post1+sm120.1
          cli_params:
            speculative_config:
              method: mtp
              num_speculative_tokens: 5
          envs: {}
        kv_offload:
        - name: cpu
          packages:
            lmcache: 0.5.5+sm120.mp
            flashinfer-sm120: 0.7.0.post1+sm120.1
          cli_params:
            kv_transfer_config:
              kv_connector: LMCacheMPConnector
              kv_role: kv_both
              kv_connector_extra_config:
                lmcache.mp.port: 5555
                lmcache.mp.mq_timeout: 300
          envs: {}
          files:
          - path: start_kv_serve.sh
            mode: '0755'
            scope: master
            content: "#!/usr/bin/env bash\nexec lmcache server \\\n  --port 5555 \\\n  --http-port 8080\
              \ \\\n  --l1-size-gb {memory_capacity_gb} \\\n  --l1-init-size-gb 64 \\\n  --max-gpu-workers\
              \ 16 \\\n  --max-cpu-workers 16 \\\n  --chunk-size 1024 \\\n  --l1-align-bytes 16384 \\\n\
              \  --eviction-trigger-watermark 0.85 \\\n  --eviction-ratio 0.05 \\\n  --eviction-policy\
              \ LRU \\\n  --supported-transfer-mode lmcache_driven\n"
