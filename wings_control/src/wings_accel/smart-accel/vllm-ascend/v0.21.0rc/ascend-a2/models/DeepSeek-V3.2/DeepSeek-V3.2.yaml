# SmartAccel 加速配置(decoding=deepseek_mtp)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# 由 features.spec_decoding 自动生成;仅 decoding,无 kv_offload/sparse。
model:
  name: DeepSeek-V3.2
  variant_name: "DeepSeek-V3.2-W8A8"
  match:
    - name_pattern: "(?i)deepseek[-.]?v3.2"
smart_accel:
  decoding:
    - name: deepseek_mtp
      cli_params:
        speculative_config:
          method: deepseek_mtp
          num_speculative_tokens: 3
      envs: {}
