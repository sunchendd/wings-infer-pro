# 来源追溯
upstream_sources:
  - id: vllm_recipe_laguna-m.1
    kind: official_recipe
    repo: recipes
    file: models/poolside/Laguna-M.1.yaml
    url: "https://recipes.vllm.ai/poolside/Laguna-M.1"
    date_updated: 2026-06-18
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Laguna M.1  # 模型名称
  slug: laguna-m.1  # 模型标识
  provider: Poolside  # 提供者/厂商
  description: "Poolside's 225B total / 23B activated MoE coding model with global attention, native interleaved reasoning, and 256K context — designed for agentic coding and long-horizon work."  # 模型描述
  model_id: poolside/Laguna-M.1  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 225B  # 总参数量
  active_parameters: 23B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 540  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.21.0"  # 最低引擎版本要求
  date_updated: 2026-06-18  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)laguna[-.]?m.1"
  variant_name: Laguna-M.1-bf16

# 硬件信息
hardware_profile:
  gpu_count: 4
  vram_gb: 768
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool choice with Poolside's tool-call parser
    args: [--enable-auto-tool-choice, --tool-call-parser, poolside_v1]
  reasoning:
    description: Enable interleaved thinking (on by default) with Poolside's reasoning parser
    args: [--reasoning-parser, poolside_v1, --default-chat-template-kwargs, "{\"enable_thinking\": true}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_laguna-m.1#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: poolside/Laguna-M.1
          enable_expert_parallel: true
          data_parallel_size: 4
        env: {}
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: poolside/Laguna-M.1
          enable_expert_parallel: true
          tensor_parallel_size: 4
        env: {}
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: poolside/Laguna-M.1
          tensor_parallel_size: 4
        env: {}
  multi_node:
    source_ref: "vllm_recipe_laguna-m.1#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: poolside/Laguna-M.1
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 8
            data_parallel_size_local: 4
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: poolside/Laguna-M.1
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 8
            data_parallel_size_local: 4
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 4
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: poolside/Laguna-M.1
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: poolside/Laguna-M.1
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: poolside/Laguna-M.1
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: poolside/Laguna-M.1
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
