# vLLM 0.31.0 / RTX PRO 5000 72GB unified recipe and SmartAccel.
schema: v2
profile:
  engine: vllm
  version: v0.31.0
  hardware:
  - RTX-PRO-5000-72GB-Blackwell_72G
  model: Qwen-AgentWorld-35B-A3B
upstream_sources:
- id: qwen_agentworld_35b_a3b_bf16_manual
  kind: manual
  repo: null
  file: null
  url: null
  date_updated: 2026-07-14
  note: 手工录入
model:
  name: Qwen-AgentWorld-35B-A3B
  slug: qwen-agentworld-35b-a3b
  provider: Qwen
  description: Qwen-AgentWorld-35B-A3B 模型（本地权重），bf16 版本，支持推理、投机解码与 LMCache 分布式 KV 缓存加速。
  model_id: Qwen/Qwen-AgentWorld-35B-A3B
  architecture: null
  parameter_count: null
  active_parameters: null
  context_length: 262144
  vram_minimum_gb: 384
  tasks:
  - text
  min_engine_version: 0.31.0
  date_updated: 2026-07-14
  match:
  - name_pattern: (?i)qwen[-.]?agentworld[-.]?35b[-.]?a3b
  variant_name: Qwen-AgentWorld-35B-A3B
hardware_profile:
  gpu_count: 8
  vram_gb: 576
  multi_node: true
features:
  reasoning:
    description: Enable reasoning/thinking mode with Qwen3 reasoning parser.
    args:
    - --reasoning-parser
    - qwen3
  spec_decoding:
    description: Suffix-based speculative decoding.
    args:
    - --speculative-config
    - '{"method": "suffix", "num_speculative_tokens": 32}'
  lmcache:
    description: LMCache KV cache acceleration.
    lmcache_server:
      description: Start LMCache server for distributed KV cache.
      args:
      - lmcache
      - server
      - --l1-size-gb
      - '60'
      - --eviction-policy
      - LRU
      - --max-workers
      - '4'
      - --port
      - '5555'
      - --chunk-size
      - '528'
    kv_transfer:
      description: KV transfer configuration for LMCache.
      args:
      - --kv-transfer-config
      - '{"kv_connector": "LMCacheMPConnector", "kv_role": "kv_both"}'
scenarios:
  standalone:
    source_ref: qwen_agentworld_35b_a3b_bf16_manual#single_node_tp
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/Qwen-AgentWorld-35B-A3B
          host: 0.0.0.0
          port: 16000
          max_num_batched_tokens: 1024
          tensor_parallel_size: 4
          max_model_len: 262144
          language_model_only: true
          enable_prefix_caching: true
          model_loader_extra_config:
            enable_multithread_load: 'true'
            num_threads: 128
          trust_remote_code: true
        env:
          PYTHONHASHSEED: '0'
          NCCL_P2P_LEVEL: SYS
          NCCL_SHM_DISABLE: 1
  multi_node:
    source_ref: qwen_agentworld_35b_a3b_bf16_manual#multi_node_tp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:
          engine_config:
            model: Qwen/Qwen-AgentWorld-35B-A3B
            host: 0.0.0.0
            port: 16000
            max_num_batched_tokens: 1024
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            max_model_len: 262144
            language_model_only: true
            enable_prefix_caching: true
            model_loader_extra_config:
              enable_multithread_load: 'true'
              num_threads: 128
            trust_remote_code: true
          env:
            PYTHONHASHSEED: '0'
            NCCL_P2P_LEVEL: SYS
            NCCL_SHM_DISABLE: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:
          engine_config:
            model: Qwen/Qwen-AgentWorld-35B-A3B
            host: 0.0.0.0
            port: 16000
            max_num_batched_tokens: 1024
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            max_model_len: 262144
            language_model_only: true
            enable_prefix_caching: true
            model_loader_extra_config:
              enable_multithread_load: 'true'
              num_threads: 128
            trust_remote_code: true
          env:
            PYTHONHASHSEED: '0'
            NCCL_P2P_LEVEL: SYS
            NCCL_SHM_DISABLE: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: suffix
          cli_params:
            speculative_config:
              method: suffix
              num_speculative_tokens: 32
          envs:
            ARCTIC_INFERENCE_ENABLED: '0'
          packages:
            arctic-inference: 0.1.1
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: suffix
          cli_params:
            speculative_config:
              method: suffix
              num_speculative_tokens: 32
          envs:
            ARCTIC_INFERENCE_ENABLED: '0'
          packages:
            arctic-inference: 0.1.1
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: decode
          index: 0
          decoding:
          - name: suffix
            cli_params:
              speculative_config:
                method: suffix
                num_speculative_tokens: 32
            envs:
              ARCTIC_INFERENCE_ENABLED: '0'
            packages:
              arctic-inference: 0.1.1
