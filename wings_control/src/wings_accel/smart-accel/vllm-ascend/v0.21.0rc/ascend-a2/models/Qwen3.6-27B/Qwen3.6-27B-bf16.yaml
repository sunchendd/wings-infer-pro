model:
  name: Qwen3.6-27B
  variant_name: "Qwen3.6-27B"
  match:
    - name_pattern: "(?i)^qwen3[.-]6[-.]?27b$"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match: {distributed: false, pd_role: null}
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: qwen3_5_mtp
          cli_params:
            speculative_config:
              method: qwen3_5_mtp
              num_speculative_tokens: 3
              enforce_eager: true
          envs: {}
  multi_node:
    source_ref: smart_accel#multi_node
    match: {distributed: true, pd_role: null}
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: qwen3_5_mtp
          cli_params:
            speculative_config:
              method: qwen3_5_mtp
              num_speculative_tokens: 3
              enforce_eager: true
          envs: {}
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match: {distributed: true, pd_role: null}
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: decode
          index: 0
          decoding:
          - name: qwen3_5_mtp
            cli_params:
              speculative_config:
                method: qwen3_5_mtp
                num_speculative_tokens: 3
                enforce_eager: true
            envs: {}