# 来源追溯
upstream_sources:
  - id: sglang_glm-5.1
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/GLM/GLM-5.1.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/GLM/GLM-5.1.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: GLM-5.1  # 模型名称
  provider: zai-org  # 提供者/厂商
  model_id: zai-org/GLM-5.1  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?5.1"
  variant_name: GLM-5.1  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1536  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, glm47]
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, glm45]
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algorithm, EAGLE, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_glm-5.1#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: zai-org/GLM-5.1-FP8
          model_path: zai-org/GLM-5.1-FP8
          tp: 4
          mem_fraction_static: 0.85
          host: "0.0.0.0"
          port: 30000
        env: {}
        default_strategy: true
