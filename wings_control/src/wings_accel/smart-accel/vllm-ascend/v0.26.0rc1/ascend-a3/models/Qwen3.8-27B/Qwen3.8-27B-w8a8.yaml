model:
  name: Qwen3.8-27B
  variant_name: Qwen3.8-27B-w8a8
  match:
    - name_pattern: '(?i)^Qwen3\.8\-27B\-w8a8$'
smart_accel:
  standalone:
    source_ref: "vllm_ascend_qwen3.8-27b_w8a8_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
          - name: qwen3_5_mtp
            cli_params:
              speculative_config:
                method: qwen3_5_mtp
                num_speculative_tokens: 2
                enforce_eager: true
            envs: {}
        kv_offload:
          - name: cpu
            cli_params:
              kv_offloading_backend: native
              kv_offloading_size: "{memory_capacity_gb}"
            envs:
              VLLM_USE_SIMPLE_KV_OFFLOAD: "1"
