# 来源追溯
upstream_sources:
  - id: vllm_recipe_minicpm-v-4-6
    kind: official_recipe
    repo: recipes
    file: models/openbmb/MiniCPM-V-4.6.yaml
    url: "https://recipes.vllm.ai/openbmb/MiniCPM-V-4.6"
    date_updated: 2026-06-02
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: MiniCPM-V 4.6  # 模型名称
  slug: minicpm-v-4-6  # 模型标识
  provider: MiniCPM (OpenBMB)  # 提供者/厂商
  description: "MiniCPM-V 4.6 (1.3B) — pocket-sized multimodal LLM for ultra-efficient single-image, multi-image, and video understanding, built on SigLIP2-400M + a Qwen3.5-0.8B hybrid-attention backbone"  # 模型描述
  model_id: openbmb/MiniCPM-V-4.6  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 1.3B  # 总参数量
  active_parameters: 1.3B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 4  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.22.0"  # 最低引擎版本要求
  date_updated: 2026-06-02  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)minicpm[-.]?v[-.]?4[-.]?6"
  variant_name: MiniCPM-V-4.6-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 1440
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: "Function/tool calling via the qwen3_coder parser (the v4.6 chat template emits Qwen3-Coder-style <tool_call> blocks)"
    args: [--enable-auto-tool-choice, --tool-call-parser, qwen3_coder]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_minicpm-v-4-6#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: openbmb/MiniCPM-V-4.6
          trust_remote_code: true
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_minicpm-v-4-6#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: openbmb/MiniCPM-V-4.6
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: openbmb/MiniCPM-V-4.6
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
