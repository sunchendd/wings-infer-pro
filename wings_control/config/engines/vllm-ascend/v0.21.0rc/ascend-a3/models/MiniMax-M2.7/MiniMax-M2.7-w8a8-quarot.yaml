# 来源追溯
upstream_sources:
  - id: vllm_ascend_minimax-m2.7_w8a8-quarot_manual
    kind: manual
    repo: null
    file: null
    url: "https://modelscope.cn/models/Eco-Tech/MiniMax-M2.7-w8a8-QuaRot"
    note: 用户提供 vLLM Ascend 启动命令，手工录入。

# 模型基本信息
model:
  name: MiniMax-M2.7  # 模型名称
  provider: MiniMax  # 提供者/厂商
  model_id: Eco-Tech/MiniMax-M2.7-w8a8-QuaRot  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)minimax[-.]?m2.7"
  variant_name: MiniMax-M2.7-w8a8-QuaRot  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool/function calling via the model's tool-call parser.
    args: [--enable-auto-tool-choice, --tool-call-parser, minimax_m2]
  reasoning:
    description: Enable the model's reasoning-content parser.
    args: [--reasoning-parser, minimax_m2_append_think]
  spec_decoding:
    description: Eagle3 speculative decoding to accelerate generation.
    args: [--speculative_config, "{\"enforce_eager\":true,\"method\":\"eagle3\",\"model\":\"/path/to/weight/Eagle3/\",\"num_speculative_tokens\":3}"]
  mooncake_offloading:
    description: Enable Mooncake-backed KV transfer/offloading for prefill/decode cache sharing.
    args: [--kv-transfer-config, "{\"kv_connector\":\"AscendStoreConnector\",\"kv_role\":\"kv_both\",\"kv_load_failure_policy\":\"recompute\",\"kv_connector_extra_config\":{\"lookup_rpc_port\":\"1\",\"backend\":\"mooncake\"}}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_minimax-m2.7_w8a8-quarot_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Eco-Tech/MiniMax-M2.7-w8a8-QuaRot
          served_model_name: MiniMax-M2.7
          host: "0.0.0.0"
          port: 8800
          trust_remote_code: true
          no_enable_prefix_caching: true
          quantization: ascend
          async_scheduling: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          additional_config:
            enable_cpu_binding: true
            enable_fused_mc2: true
            enable_flashcomm1: true
            weight_nz_mode: true
          enable_expert_parallel: true
          tensor_parallel_size: 8
          data_parallel_size: 2
          max_num_seqs: 48
          max_model_len: 40690
          max_num_batched_tokens: 16384
          gpu_memory_utilization: 0.9
          kv_cache_memory_bytes: 4G
        env:
          VLLM_LOGGING_LEVEL: INFO
          HCCL_OP_EXPANSION_MODE: AIV
          HCCL_BUFFSIZE: 1024
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          OMP_NUM_THREADS: 1
          LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2${LD_PRELOAD:+:$LD_PRELOAD}"
          TASK_QUEUE_ENABLE: 1
          ASCEND_BUFFER_POOL: "4:8"
          VLLM_ASCEND_BALANCE_SCHEDULING: 0
          LD_LIBRARY_PATH: "/usr/local/Ascend/ascend-toolkit/latest/python/site-packages:/usr/local/lib:${LD_LIBRARY_PATH:-}"
          MOONCAKE_CONFIG_PATH: /shared-volume/mooncake.json
          PYTHONHASHSEED: 0
          ACL_OP_INIT_MODE: 1
        system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
          sysctls:
            vm.swappiness: 0
            kernel.numa_balancing: 0
            kernel.sched_migration_cost_ns: 50000
          sysfs_writes:
            - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
              value: performance
