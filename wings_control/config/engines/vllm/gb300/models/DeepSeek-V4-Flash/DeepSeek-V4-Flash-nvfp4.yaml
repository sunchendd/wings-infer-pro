# 来源追溯
upstream_sources:
  - id: vllm_recipe_deepseek-v4-flash
    kind: official_recipe
    repo: recipes
    file: models/deepseek-ai/DeepSeek-V4-Flash.yaml
    url: "https://recipes.vllm.ai/deepseek-ai/DeepSeek-V4-Flash"
    date_updated: 2026-05-01
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: DeepSeek-V4-Flash  # 模型名称
  slug: deepseek-v4-flash  # 模型标识
  provider: DeepSeek  # 提供者/厂商
  description: "DeepSeek V4 MoE model with hybrid CSA+HCA attention, manifold-constrained hyper-connections, and three-tier reasoning (Non-think / Think High / Think Max)."  # 模型描述
  model_id: nvidia/DeepSeek-V4-Flash-NVFP4  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 284B  # 总参数量
  active_parameters: 13B  # 激活参数量（MoE 模型）
  context_length: 1048576  # 最大上下文长度
  vram_minimum_gb: 170  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.20.0"  # 最低引擎版本要求
  date_updated: 2026-05-01  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?flash"
  variant_name: DeepSeek-V4-Flash-nvfp4

# 硬件信息
hardware_profile:
  gpu_count: 4
  vram_gb: 1152
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Enable tool calling with DeepSeek V4 chat template support.
    args: [--tokenizer-mode, deepseek_v4, --tool-call-parser, deepseek_v4, --enable-auto-tool-choice]
  reasoning:
    description: Enable reasoning/thinking mode with the DeepSeek V4 reasoning parser.
    args: [--reasoning-parser, deepseek_v4]
  spec_decoding:
    description: Multi-Token Prediction speculative decoding with 2 speculative tokens (1 on Hopper).
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":2}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_deepseek-v4-flash#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: nvidia/DeepSeek-V4-Flash-NVFP4
          trust_remote_code: true
          kv_cache_dtype: fp8
          block_size: 256
          enable_expert_parallel: true
          data_parallel_size: 4
          compilation_config:
            cudagraph_mode: FULL_AND_PIECEWISE
            custom_ops: [all]
          attention_config_use_fp4_indexer_cache: true
          moe_backend: deep_gemm_mega_moe
        env: {}
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        default_strategy: true
        engine_config:
          model: nvidia/DeepSeek-V4-Flash-NVFP4
          trust_remote_code: true
          kv_cache_dtype: fp8
          block_size: 256
          enable_expert_parallel: true
          tensor_parallel_size: 4
          attention_config_use_fp4_indexer_cache: true
          moe_backend: deep_gemm_mega_moe
        env: {}
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        engine_config:
          model: nvidia/DeepSeek-V4-Flash-NVFP4
          trust_remote_code: true
          kv_cache_dtype: fp8
          block_size: 256
          tensor_parallel_size: 4
          attention_config_use_fp4_indexer_cache: true
          no_enable_flashinfer_autotune: true
        env: {}
  multi_node:
    source_ref: "vllm_recipe_deepseek-v4-flash#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: nvidia/DeepSeek-V4-Flash-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            block_size: 256
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 8
            data_parallel_size_local: 4
            data_parallel_address: $HEAD_IP
            compilation_config:
              cudagraph_mode: FULL_AND_PIECEWISE
              custom_ops: [all]
            attention_config_use_fp4_indexer_cache: true
            moe_backend: deep_gemm_mega_moe
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: nvidia/DeepSeek-V4-Flash-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            block_size: 256
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 8
            data_parallel_size_local: 4
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 4
            compilation_config:
              cudagraph_mode: FULL_AND_PIECEWISE
              custom_ops: [all]
            attention_config_use_fp4_indexer_cache: true
            moe_backend: deep_gemm_mega_moe
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
  pd_disaggregation:
    source_ref: "vllm_recipe_deepseek-v4-flash#pd_cluster"
    match:
      distributed: true
      pd_role: null
    # PD分离：1P×1D  # 根据官网默认配置
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill  # P1 节点配置
            index: 1
            parallelism: dep
            engine_config:
              model: nvidia/DeepSeek-V4-Flash-NVFP4
              trust_remote_code: true
              kv_cache_dtype: fp8
              block_size: 256
              port: 8001
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_producer
                kv_load_failure_policy: fail
              data_parallel_size: 4
              data_parallel_size_local: 4
              data_parallel_start_rank: 0
              data_parallel_address: $PREFILL_NODE_1
              data_parallel_rpc_port: $PREFILL_DP_RPC_PORT
              enable_expert_parallel: true
              enforce_eager: true
              max_num_seqs: 8
              max_num_batched_tokens: 65536
              no_disable_hybrid_kv_cache_manager: true
              enable_sleep_mode: true
              attention_config_use_fp4_indexer_cache: true
              moe_backend: deep_gemm_mega_moe
            env:
              VLLM_USE_NCCL_SYMM_MEM: 1
              NCCL_CUMEM_ENABLE: 1
              NCCL_MNNVL_ENABLE: 1
              NCCL_NVLS_ENABLE: 1
              UCX_NET_DEVICES: all
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5557
              VLLM_NIXL_SIDE_CHANNEL_HOST: $PREFILL_NODE_1
              CUDA_VISIBLE_DEVICES: "0,1,2,3"
          - role: decode  # D1 节点配置
            index: 1
            parallelism: dep
            engine_config:
              model: nvidia/DeepSeek-V4-Flash-NVFP4
              trust_remote_code: true
              kv_cache_dtype: fp8
              block_size: 256
              port: 8002
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_consumer
                kv_load_failure_policy: fail
              data_parallel_size: 4
              data_parallel_size_local: 4
              data_parallel_start_rank: 0
              data_parallel_address: $DECODE_NODE_1
              data_parallel_rpc_port: $DECODE_DP_RPC_PORT
              enable_expert_parallel: true
              max_num_seqs: 1536
              max_num_batched_tokens: 1536
              max_cudagraph_capture_size: 1536
              compilation_config:
                cudagraph_mode: FULL_DECODE_ONLY
              no_disable_hybrid_kv_cache_manager: true
              enable_sleep_mode: true
              attention_config_use_fp4_indexer_cache: true
              moe_backend: deep_gemm_mega_moe
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5558
              VLLM_NIXL_SIDE_CHANNEL_HOST: $DECODE_NODE_1
              CUDA_VISIBLE_DEVICES: "0,1,2,3"
              VLLM_USE_NCCL_SYMM_MEM: 1
              NCCL_CUMEM_ENABLE: 1
              NCCL_MNNVL_ENABLE: 1
              NCCL_NVLS_ENABLE: 1
