# SmartAccel 加速配置(decoding=mtp / sparse / kv_offload=lmcache)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# 0day 验证补:sparse(indexcache perf=8/acc=4) + lmcache-ascend 卸载。
model:
  name: DeepSeek-V4-Flash
  variant_name: "DeepSeek-V4-Flash-w8a8-mtp"
  match:
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?flash"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: mtp
          cli_params:
            speculative_config:
              method: mtp
              num_speculative_tokens: 1
              enforce_eager: true
          envs: {}
        kv_offload:
        - name: cpu
          cli_params:
            no_disable_hybrid_kv_cache_manager: true
            kv_transfer_config:
              kv_connector: LMCacheAscendConnectorV1Dynamic
              kv_role: kv_both
              kv_connector_module_path: lmcache_ascend.integration.vllm.lmcache_ascend_connector_v1
          packages:
            lmcache-ascend: v0.4.5
          envs:
            PYTHONHASHSEED: '0'
            LMCACHE_TRACK_USAGE: 'false'
            LMCACHE_LOCAL_CPU: 'True'
            LMCACHE_MAX_LOCAL_CPU_SIZE: '{= memory_capacity_gb // (tp_size * dp_size)}'
            LMCACHE_LOG_LEVEL: INFO
            LMCACHE_USE_LAYERWISE: 'False'
            LMCACHE_NUMA_MODE: auto
            LMCACHE_CHUNK_SIZE: '1024'
            LMCACHE_EXTRA_CONFIG: '{"save_only_first_rank": false}'
            LMCACHE_LOOKUP_SERVER_WORKER_IDS: '{lookup_server_worker_ids}'
        sparse:
        - name: performance_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: mtp
          cli_params:
            speculative_config:
              method: mtp
              num_speculative_tokens: 1
              enforce_eager: true
          envs: {}
        kv_offload:
        - name: cpu
          cli_params:
            no_disable_hybrid_kv_cache_manager: true
            kv_transfer_config:
              kv_connector: LMCacheAscendConnectorV1Dynamic
              kv_role: kv_both
              kv_connector_module_path: lmcache_ascend.integration.vllm.lmcache_ascend_connector_v1
          packages:
            lmcache-ascend: v0.4.5
          envs:
            PYTHONHASHSEED: '0'
            LMCACHE_TRACK_USAGE: 'false'
            LMCACHE_LOCAL_CPU: 'True'
            LMCACHE_MAX_LOCAL_CPU_SIZE: '{= memory_capacity_gb // (tp_size * dp_size)}'
            LMCACHE_LOG_LEVEL: INFO
            LMCACHE_USE_LAYERWISE: 'False'
            LMCACHE_NUMA_MODE: auto
            LMCACHE_CHUNK_SIZE: '1024'
            LMCACHE_EXTRA_CONFIG: '{"save_only_first_rank": false}'
            LMCACHE_LOOKUP_SERVER_WORKER_IDS: '{lookup_server_worker_ids}'
        sparse:
        - name: performance_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: prefill
          index: 0
          sparse:
          - name: performance_first
            cli_params:
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 8
            envs: {}
          - name: accuracy_first
            cli_params:
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 4
            envs: {}
        - role: decode
          index: 0
          decoding:
          - name: mtp
            cli_params:
              speculative_config:
                method: mtp
                num_speculative_tokens: 1
                enforce_eager: true
            envs: {}
          sparse:
          - name: performance_first
            cli_params:
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 8
            envs: {}
          - name: accuracy_first
            cli_params:
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 4
            envs: {}
