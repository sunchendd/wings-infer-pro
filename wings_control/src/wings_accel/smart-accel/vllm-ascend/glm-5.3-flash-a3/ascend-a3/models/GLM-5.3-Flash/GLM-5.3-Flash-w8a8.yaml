# SmartAccel configuration (decoding=deepseek_mtp)
# The speculative parameters are sourced from the engine recipe features.spec_decoding.
model:
  name: GLM-5.3-Flash
  variant_name: "GLM-5.3-Flash-w8a8"
  match:
    - name_pattern: "(?i)^glm[-.]?5[.]3[-.]?flash[-.]?w8a8$"
smart_accel:
  standalone:
    source_ref: "vllm_ascend_glm-5.3-flash_w8a8_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
          - name: deepseek_mtp
            cli_params:
              speculative_config:
                num_speculative_tokens: 3
                method: deepseek_mtp
                enforce_eager: true
            envs: {}
