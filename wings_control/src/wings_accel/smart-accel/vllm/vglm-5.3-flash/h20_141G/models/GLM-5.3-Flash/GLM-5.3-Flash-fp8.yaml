model:
  name: GLM-5.3-Flash
  variant_name: GLM-5.3-Flash
  match:
    - name_pattern: "(?i)^glm[-.]?5[-.]?3[-.]?flash$"

smart_accel:
  standalone:
    source_ref: "glm53_flash_h20_mtp3_cpu_offload_20260920#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
          - name: mtp
            cli_params:
              speculative_config:
                method: mtp
                num_speculative_tokens: 3
            envs: {}
        kv_offload:
          - name: cpu
            cli_params:
              kv_transfer_config:
                kv_connector: SimpleCPUOffloadConnector
                kv_role: kv_both
                kv_connector_extra_config:
                  cpu_bytes_to_use_per_rank: "{= (memory_capacity_gb // tp_size) * 1073741824}"
                  lazy_offload: false
            envs: {}
