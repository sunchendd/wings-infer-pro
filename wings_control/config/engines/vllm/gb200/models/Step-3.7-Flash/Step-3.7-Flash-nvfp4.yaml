            NCCL_SOCKET_IFNAME: $IFACE_NAME
  pd_disaggregation:
    source_ref: "vllm_recipe_step-3.7-flash#pd_cluster"
    match:
      distributed: true
      pd_role: null
    # PD分离：1P×1D  # 根据官网默认配置
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill  # P1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: stepfun-ai/Step-3.7-Flash-NVFP4
              trust_remote_code: true
              enable_expert_parallel: true
              disable_cascade_attn: true
              quantization: modelopt
              kv_cache_dtype: fp8
              gpu_memory_utilization: 0.9
              async_scheduling: true
              port: 8001
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_producer
                kv_load_failure_policy: fail
              enforce_eager: true
              tensor_parallel_size: 4
            env:
              VLLM_USE_NCCL_SYMM_MEM: 1
              NCCL_CUMEM_ENABLE: 1
              NCCL_MNNVL_ENABLE: 1
              NCCL_NVLS_ENABLE: 1
              UCX_NET_DEVICES: all
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5557
              VLLM_NIXL_SIDE_CHANNEL_HOST: $PREFILL_NODE_1
          - role: decode  # D1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: stepfun-ai/Step-3.7-Flash-NVFP4
              trust_remote_code: true
              enable_expert_parallel: true
              disable_cascade_attn: true
              quantization: modelopt
              kv_cache_dtype: fp8
              gpu_memory_utilization: 0.9
              async_scheduling: true
              port: 8002
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_consumer
                kv_load_failure_policy: fail
              compilation_config:
                cudagraph_mode: FULL_DECODE_ONLY
              tensor_parallel_size: 4
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5558
              VLLM_NIXL_SIDE_CHANNEL_HOST: $DECODE_NODE_1
