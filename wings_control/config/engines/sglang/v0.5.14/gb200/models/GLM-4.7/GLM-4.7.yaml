# 来源追溯
upstream_sources:
  - id: sglang_glm-4.7
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/GLM/GLM-4.7.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/GLM/GLM-4.7.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: GLM-4.7  # 模型名称
  provider: zai-org  # 提供者/厂商
  model_id: zai-org/GLM-4.7  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?4.7"
  variant_name: GLM-4.7  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1536  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, glm47]
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, glm45]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_glm-4.7#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: nvidia/GLM-4.7-NVFP4
          tp_size: 2
          mem_fraction_static: 0.85
        env: {}
        default_strategy: true
