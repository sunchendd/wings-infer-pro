# 来源追溯
upstream_sources:
  - id: vllm_ascend_hunyuan-a13b-instruct
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/Hunyuan-A13B-Instruct.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.21.0rc/docs/source/tutorials/models/Hunyuan-A13B-Instruct.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: Hunyuan-A13B-Instruct  # 模型名称
  provider: Tencent-Hunyuan  # 提供者/厂商
  model_id: Tencent-Hunyuan/Hunyuan-A13B-Instruct  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)hunyuan[-.]?a13b[-.]?instruct"
  variant_name: Hunyuan-A13B-Instruct  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_hunyuan-a13b-instruct#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: "${MODEL_PATH}"
          trust_remote_code: true
          host: "0.0.0.0"
          port: 8000
          served_model_name: Hunyuan
          tensor_parallel_size: 4
          max_model_len: 32768
          gpu_memory_utilization: 0.9
        env:
          HCCL_INTRA_ROCE_ENABLE: 1
          HF_HOME: /data
          MODEL_PATH: Hunyuan-A13B-Instruct
