# SmartAccel 加速配置(decoding=eagle3 [model_based])
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# 由 features.spec_decoding 自动生成;仅 decoding,无 kv_offload/sparse。
model:
  name: MiniMax-M3
  variant_name: "MiniMax-M3-mxfp8"
  match:
    - name_pattern: "(?i)minimax[-.]?m3"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: eagle3
          requires_model_path: true
          draft_arch:
            - eagle3
          cli_params:
            speculative_config:
              method: eagle3
              model: $path
              num_speculative_tokens: 3
              attention_backend: FLASH_ATTN
          envs: {}
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: eagle3
          requires_model_path: true
          draft_arch:
            - eagle3
          cli_params:
            speculative_config:
              method: eagle3
              model: $path
              num_speculative_tokens: 3
              attention_backend: FLASH_ATTN
          envs: {}
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: decode
          index: 0
          decoding:
          - name: eagle3
            requires_model_path: true
            draft_arch:
              - eagle3
            cli_params:
              speculative_config:
                method: eagle3
                model: $path
                num_speculative_tokens: 3
                attention_backend: FLASH_ATTN
            envs: {}
