# SmartAccel 加速配置(decoding=mtp / kv_offload=cpu)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: Qwen3.5-397B-A17B
  variant_name: "Qwen3.5-397B-A17B-nvfp4"
  match:
    - name_pattern: "(?i)qwen3[-.]?5[-.]?397b[-.]?a17b"
smart_accel:
  decoding:
    - name: mtp
      cli_params:
        speculative_config:
          method: mtp
          num_speculative_tokens: 3
      envs: {}
  kv_offload:
    - name: cpu
      cli_params:
        kv_offloading_backend: native
        kv_offloading_size: "{memory_capacity_gb}"
      envs: {}
