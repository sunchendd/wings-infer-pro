# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwen3-next-80b-a3b-instruct
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/Qwen3-Next.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.21.0rc/docs/source/tutorials/models/Qwen3-Next.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: Qwen3-Next-80B-A3B-Instruct  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3-Next-80B-A3B-Instruct  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?next[-.]?80b[-.]?a3b[-.]?instruct"
  variant_name: Qwen3-Next-80B-A3B-Instruct  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 支持单节点及多节点场景

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen3-next-80b-a3b-instruct#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3-Next-80B-A3B-Instruct
          tensor_parallel_size: 4
          max_model_len: 32768
          gpu_memory_utilization: 0.8
          max_num_batched_tokens: 4096
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
        env: {}

  multi_node:
    source_ref: vllm_ascend_qwen3-next-80b-a3b-instruct#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        head:
          engine_config:
            model: Qwen/Qwen3-Next-80B-A3B-Instruct
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: $local_ip
            data_parallel_rpc_port: 12321
            tensor_parallel_size: 16
            max_model_len: 32768
            gpu_memory_utilization: 0.8
            max_num_batched_tokens: 4096
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
          env:
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            HCCL_OP_EXPANSION_MODE: AIV
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
        worker:
          engine_config:
            model: Qwen/Qwen3-Next-80B-A3B-Instruct
            headless: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 12321
            tensor_parallel_size: 16
            max_model_len: 32768
            gpu_memory_utilization: 0.8
            max_num_batched_tokens: 4096
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
          env:
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            HCCL_OP_EXPANSION_MODE: AIV
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
