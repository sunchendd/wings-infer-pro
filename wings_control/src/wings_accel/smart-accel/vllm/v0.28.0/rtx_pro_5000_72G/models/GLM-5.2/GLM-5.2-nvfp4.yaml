# SmartAccel configuration for the vLLM v0.28.0 SM120 TP4×DP4 delivery.
model:
  name: GLM-5.2
  variant_name: "GLM-5.2-nvfp4"
  match:
    - name_pattern: "(?i)glm[-.]?5.2"
smart_accel:
  standalone:
    source_ref: glm52/glm52_sm120_sparse_mla_fix/README.md#validated-result
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
          - name: mtp
            packages:
              flashinfer-sm120: 0.6.16.post3+sm120.9dc1b249.tp4
            cli_params:
              speculative_config:
                method: mtp
                num_speculative_tokens: 5
            envs: {}
        kv_offload:
          - name: cpu
            packages:
              lmcache: 0.5.4+sm120.mp
            cli_params:
              kv_transfer_config:
                kv_connector: LMCacheMPConnector
                kv_role: kv_both
                kv_connector_extra_config:
                  lmcache.mp.port: 5555
                  lmcache.mp.mq_timeout: 300
            envs: {}
            files:
              - path: start_kv_serve.sh
                mode: "0755"
                scope: master
                content: |
                  #!/usr/bin/env bash
                  exec lmcache server \
                    --port 5555 \
                    --http-port 8080 \
                    --l1-size-gb {memory_capacity_gb} \
                    --l1-init-size-gb 64 \
                    --max-gpu-workers 16 \
                    --max-cpu-workers 16 \
                    --chunk-size 1024 \
                    --l1-align-bytes 16384 \
                    --eviction-trigger-watermark 0.85 \
                    --eviction-ratio 0.05 \
                    --eviction-policy LRU \
                    --supported-transfer-mode lmcache_driven
