            VLLM_ROCM_USE_AITER: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: inclusionAI/Ling-2.6-1T
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: inclusionAI/Ling-2.6-1T
            trust_remote_code: true
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
