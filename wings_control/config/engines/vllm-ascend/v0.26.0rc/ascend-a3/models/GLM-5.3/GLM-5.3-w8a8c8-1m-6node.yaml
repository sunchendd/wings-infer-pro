upstream_sources:
- id: vllm_ascend_glm-5.3_w8a8c8_1m_6node_a3_derived
  kind: manual
  repo: null
  file: 20260908_1M.zip
  url: null
  note: 'Ascend A3 six-node 1M topology derived from the four-node role parameters: two independent DP2/TP16 Prefill instances
    and one DP4/TP8 Decode instance.'
model:
  name: GLM-5.3
  provider: Eco-Tech
  model_id: Eco-Tech/GLM-5.3-w8a8c8
  min_engine_version: v0.26.0rc
  match:
  - name_pattern: (?i)^GLM\-5\.3\-w8a8c8\-1m\-6node$
  variant_name: GLM-5.3-w8a8c8-1m-6node
hardware_profile:
  gpu_count: 16
  vram_gb: 1024
  multi_node: true
features:
  tool_calling:
    description: Enable automatic tool/function calling via the GLM parser.
    args:
    - --enable-auto-tool-choice
    - --tool-call-parser
    - glm47
  reasoning:
    description: Enable reasoning-content parsing.
    args:
    - --reasoning-parser
    - glm45
  spec_decoding:
    description: MTP speculative decoding capability used by the verified P/D recipe.
    args:
    - --speculative-config
    - '{"num_speculative_tokens":5,"method":"deepseek_mtp","enforce_eager":true}'
scenarios:
  pd_disaggregation:
    source_ref: vllm_ascend_glm-5.3_w8a8c8_1m_6node_a3_derived#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        runtime:
          prefill:
            engine_id_policy: from_pd_index
          decode:
            engine_id_policy: from_pd_index
        nodes:
        - role: prefill
          index: 0
          engine_config:
            model: /weights/GLM-5.3-w8a8c8
            host: 0.0.0.0
            port: 17000
            tensor_parallel_size: 16
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_rpc_port: 16591
            data_parallel_external_lb: false
            enable_expert_parallel: true
            prefill_context_parallel_size: 1
            decode_context_parallel_size: 16
            cp_kv_cache_interleave_size: 128
            speculative_config:
              num_speculative_tokens: 1
              method: deepseek_mtp
              enforce_eager: true
            additional_config:
              fuse_muls_add: true
              recompute_scheduler_enable: false
              multistream_overlap_shared_expert: true
              enable_dsa_cp: true
              enable_cpu_binding: false
            seed: 1024
            served_model_name: GLM-5.3-w8a8c8
            max_model_len: 1048576
            safetensors_load_strategy: prefetch
            max_num_batched_tokens: 8192
            max_num_seqs: 64
            enable_prefix_caching: true
            quantization: ascend
            gpu_memory_utilization: 0.9
            enforce_eager: true
            trust_remote_code: true
            kv_transfer_config:
              kv_connector: MultiConnector
              kv_role: kv_producer
              kv_connector_extra_config:
                connectors:
                - kv_connector: MooncakeConnectorV1
                  kv_role: kv_producer
                  kv_port: 30000
                  kv_connector_extra_config:
                    use_ascend_direct: true
                    prefill:
                      dp_size: 2
                      tp_size: 16
                    decode:
                      dp_size: 4
                      tp_size: 8
                - kv_connector: AscendStoreConnector
                  kv_role: kv_producer
                  kv_connector_extra_config:
                    backend: memcache
                    lookup_rpc_port: 0
          env:
            PYTHONHASHSEED: '0'
            MMC_LOCAL_CONFIG_PATH: /wings-deploy/rendered/model-client/mmc-local.conf
            MF_GROUP_JOIN_MAX_TIMEOUT: '1200'
            VLLM_ASCEND_ENABLE_FUSED_MC2: '1'
            VLLM_ASCEND_ENABLE_FLASHCOMM1: '1'
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_TRANSFER_TIMEOUT: '600'
            HCCL_EXEC_TIMEOUT: '3600'
            HCCL_CONNECT_TIMEOUT: '3600'
            OMP_PROC_BIND: 'false'
            OMP_NUM_THREADS: '1'
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
            HCCL_BUFFSIZE: '400'
            ACL_OP_INIT_MODE: '1'
            ASCEND_A3_ENABLE: '1'
            LD_LIBRARY_PATH: ${LD_LIBRARY_PATH:-}:/usr/local/lib
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
