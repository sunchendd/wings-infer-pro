# 来源追溯
upstream_sources:
  - id: sglang_deepseek-v4-pro
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/DeepSeek/DeepSeek-V4.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/DeepSeek/DeepSeek-V4.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。
  - id: sglang_deepseek-v4-pro_config
    kind: official_config
    repo: sglang
    file: docs_new/src/snippets/configs/deepseek-ai/deepseek-v4.jsx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/src/snippets/configs/deepseek-ai/deepseek-v4.jsx"
    note: SGLang 官网 Deployment 面板配置矩阵。自动生成。

# 模型基本信息
model:
  name: DeepSeek-V4-Pro  # 模型名称
  provider: deepseek-ai  # 提供者/厂商
  model_id: deepseek-ai/DeepSeek-V4-Pro  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?pro"
  variant_name: DeepSeek-V4-Pro-fp4  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 2304  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algorithm, EAGLE, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_deepseek-v4-pro#single_node_low_latency"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_low_latency:
        display_name: Low-Latency
        orientation: latency
        engine_config:
          model: deepseek-ai/DeepSeek-V4-Pro
          trust_remote_code: true
          model_path: deepseek-ai/DeepSeek-V4-Pro
          tp: 8
          attention_backend: dsv4
          page_size: 256
          mem_fraction_static: 0.9
          swa_full_tokens_ratio: 0.1
          disable_shared_experts_fusion: true
          kv_cache_dtype: fp8_e4m3
          chunked_prefill_size: 8192
          host: $HOST_IP
          port: $PORT
        env:
          SGLANG_USE_ROCM700A: 0
          SGLANG_HACK_FLASHMLA_BACKEND: unified_kv_triton
          AITER_BF16_FP8_MOE_BOUND: 0
      single_node_balanced:
        display_name: Balanced
        orientation: balanced
        engine_config:
          model: deepseek-ai/DeepSeek-V4-Pro
          trust_remote_code: true
          model_path: deepseek-ai/DeepSeek-V4-Pro
          tp: 8
          dp: 8
          enable_dp_attention: true
          enable_prefill_delayer: true
          prefill_delayer_max_delay_ms: 5000
          attention_backend: dsv4
          page_size: 256
          mem_fraction_static: 0.9
          swa_full_tokens_ratio: 0.1
          disable_shared_experts_fusion: true
          kv_cache_dtype: fp8_e4m3
          chunked_prefill_size: 65536
          host: $HOST_IP
          port: $PORT
        env:
          SGLANG_USE_ROCM700A: 0
          SGLANG_DP_USE_GATHERV: 1
          SGLANG_HACK_FLASHMLA_BACKEND: unified_kv_triton
          AITER_BF16_FP8_MOE_BOUND: 0
        default_strategy: true
      single_node_high_throughput:
        display_name: High-Throughput
        orientation: throughput
        engine_config:
          model: deepseek-ai/DeepSeek-V4-Pro
          trust_remote_code: true
          model_path: deepseek-ai/DeepSeek-V4-Pro
          tp: 8
          dp: 8
          enable_dp_attention: true
          enable_prefill_delayer: true
          prefill_delayer_max_delay_ms: 5000
          attention_backend: dsv4
          page_size: 256
          mem_fraction_static: 0.9
          swa_full_tokens_ratio: 0.1
          disable_shared_experts_fusion: true
          kv_cache_dtype: fp8_e4m3
          chunked_prefill_size: 65536
          host: $HOST_IP
          port: $PORT
        env:
          SGLANG_USE_ROCM700A: 0
          SGLANG_DP_USE_GATHERV: 1
          SGLANG_HACK_FLASHMLA_BACKEND: unified_kv_triton
          AITER_BF16_FP8_MOE_BOUND: 0
