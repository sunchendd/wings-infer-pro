# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwen3-235b-a22b
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/Qwen3-235B-A22B.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.21.0rc/docs/source/tutorials/models/Qwen3-235B-A22B.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: Qwen3-235B-A22B  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3-235B-A22B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?235b[-.]?a22b"
  variant_name: Qwen3-235B-A22B-w8a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen3-235b-a22b#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: vllm-ascend/Qwen3-235B-A22B-w8a8
          host: "0.0.0.0"
          port: 8000
          tensor_parallel_size: 8
          data_parallel_size: 1
          seed: 1024
          quantization: ascend
          served_model_name: qwen3
          max_num_seqs: 32
          max_model_len: 133000
          max_num_batched_tokens: 8096
          enable_expert_parallel: true
          trust_remote_code: true
          gpu_memory_utilization: 0.95
          hf_overrides:
            rope_parameters:
              rope_type: yarn
              rope_theta: 1000000
              factor: 4
              original_max_position_embeddings: 32768
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
        env:
          VLLM_USE_MODELSCOPE: "True"
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          HCCL_BUFFSIZE: 512
          OMP_PROC_BIND: "false"
          OMP_NUM_THREADS: 1
          VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
          TASK_QUEUE_ENABLE: 1
  multi_node:
    source_ref: "vllm_ascend_qwen3-235b-a22b#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        nodes:
          - role: head
            engine_config:
              model: Qwen/Qwen3-235B-A22B
              host: "0.0.0.0"
              port: 8000
              data_parallel_size: 2
              api_server_count: 2
              data_parallel_size_local: 1
              data_parallel_address: $local_ip
              data_parallel_rpc_port: 13389
              seed: 1024
              served_model_name: qwen3
              tensor_parallel_size: 8
              enable_expert_parallel: true
              max_num_seqs: 16
              max_model_len: 32768
              max_num_batched_tokens: 4096
              trust_remote_code: true
              gpu_memory_utilization: 0.9
            env:
              VLLM_USE_MODELSCOPE: "True"
              PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
              HCCL_IF_IP: $local_ip
              GLOO_SOCKET_IFNAME: $nic_name
              TP_SOCKET_IFNAME: $nic_name
              HCCL_SOCKET_IFNAME: $nic_name
              OMP_PROC_BIND: "false"
              OMP_NUM_THREADS: 1
              HCCL_BUFFSIZE: 1024
              TASK_QUEUE_ENABLE: 1
            system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
              commands: ["nic_name=\"xxxx\"", "local_ip=\"xxxx\""]
          - role: worker
            engine_config:
              model: Qwen/Qwen3-235B-A22B
              host: "0.0.0.0"
              port: 8000
              headless: true
              data_parallel_size: 2
              data_parallel_size_local: 1
              data_parallel_start_rank: 1
              data_parallel_address: $node0_ip
              data_parallel_rpc_port: 13389
              seed: 1024
              tensor_parallel_size: 8
              served_model_name: qwen3
              max_num_seqs: 16
              max_model_len: 32768
              max_num_batched_tokens: 4096
              enable_expert_parallel: true
              trust_remote_code: true
              gpu_memory_utilization: 0.9
            env:
              VLLM_USE_MODELSCOPE: "True"
              PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
              HCCL_IF_IP: $local_ip
              GLOO_SOCKET_IFNAME: $nic_name
              TP_SOCKET_IFNAME: $nic_name
              HCCL_SOCKET_IFNAME: $nic_name
              OMP_PROC_BIND: "false"
              OMP_NUM_THREADS: 1
              HCCL_BUFFSIZE: 1024
              TASK_QUEUE_ENABLE: 1
            system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
              commands: ["nic_name=\"xxxx\"", "local_ip=\"xxxx\"", "node0_ip=\"xxxx\""]
