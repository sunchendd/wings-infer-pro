model:
  name: qwen3.5-0.8b
  match:
    - name_pattern: "(?i)qwen3\\.?5.?0\\.?8b"
  min_engine_version: "0.17.0"

# Step3.2 FeatureOverlay 测试用:tool_calling 仅在 features 块(非 inline),
# 故开关 OFF 时 argv 无变化、ON 时由 feature_overlay 注入(走 strategy_feature 层)。
features:
  tool_calling:
    description: "test tool call parser + auto choice"
    args: [--tool-call-parser, qwen3_coder, --enable-auto-tool-choice]

upstream_sources:
  - id: "vllm_recipe_qwen3.5-0.8b"
    kind: "official_recipe"
    url: "https://recipes.vllm.ai/Qwen/Qwen3.5-0.8B"
    note: "vLLM 官方 recipe。standalone 朴素命令;MTP 变体见 scenarios.standalone_mtp(后续)。"

scenarios:
  standalone:
    source_ref: "vllm_recipe_qwen3.5-0.8b#single-gpu"
    match:
      distributed: false
      pd_role: null
    engine_config:
      model: "Qwen/Qwen3.5-0.8B"
      tensor_parallel_size: 1
      max_model_len: 262144
      reasoning_parser: "qwen3"
      host: "0.0.0.0"
      port: 8000
      trust_remote_code: true
    env: {}
