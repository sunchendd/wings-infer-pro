# 来源追溯
upstream_sources:
  - id: vllm_ascend_deepseek-v3.2
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/DeepSeek-V3.2.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.18.0/docs/source/tutorials/models/DeepSeek-V3.2.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: DeepSeek-V3.2  # 模型名称
  provider: vllm-ascend  # 提供者/厂商
  model_id: vllm-ascend/DeepSeek-V3.2-Exp-W8A8  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.18.0  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)deepseek[-.]?v3.2"
  variant_name: DeepSeek-V3.2-w8a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"num_speculative_tokens\":3,\"method\":\"deepseek_mtp\"}"]
    strategy_overrides:  # 该特性默认用上面的 args；此处仅列出 spec 参数与默认不一致、需按部署场景覆盖的项
      pd_disaggregation.pd_cluster:
        args: [--speculative-config, "{\"num_speculative_tokens\":2,\"method\":\"deepseek_mtp\"}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_deepseek-v3.2#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: /root/.cache/modelscope/hub/models/vllm-ascend/DeepSeek-V3.2-W8A8
          host: "0.0.0.0"
          port: 8000
          data_parallel_size: 2
          tensor_parallel_size: 8
          quantization: ascend
          seed: 1024
          served_model_name: deepseek_v3_2
          enable_expert_parallel: true
          max_num_seqs: 16
          max_model_len: 8192
          max_num_batched_tokens: 4096
          trust_remote_code: true
          no_enable_prefix_caching: true
          gpu_memory_utilization: 0.92
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
        env:
          HCCL_OP_EXPANSION_MODE: AIV
          OMP_PROC_BIND: "false"
          OMP_NUM_THREADS: 10
          VLLM_USE_V1: 1
          HCCL_BUFFSIZE: 200
          VLLM_ASCEND_ENABLE_MLAPO: 1
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
  pd_disaggregation:
    source_ref: "vllm_ascend_deepseek-v3.2#pd_cluster"
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
          - role: prefill  # Prefill Node 0
            index: 0
            engine_config:
              model: /root/.cache/Eco-Tech/DeepSeek-V3.2-w8a8-mtp-QuaRot
              host: "0.0.0.0"
              port: $2
              data_parallel_size: $3
              data_parallel_rank: $4
              data_parallel_address: $5
              data_parallel_rpc_port: $6
              tensor_parallel_size: $7
              enable_expert_parallel: true
              profiler_config:
                profiler: torch
                torch_profiler_dir: ./vllm_profile
                torch_profiler_with_stack: false
              seed: 1024
              served_model_name: dsv3
              max_model_len: 68000
              max_num_batched_tokens: 32560
              trust_remote_code: true
              max_num_seqs: 64
              gpu_memory_utilization: 0.82
              quantization: ascend
              enforce_eager: true
              no_enable_prefix_caching: true
              additional_config:
                layer_sharding: [q_b_proj, o_proj]
              kv_transfer_config:
                kv_connector: MooncakeLayerwiseConnector
                kv_role: kv_producer
                kv_port: 30000
                engine_id: 0
                kv_connector_extra_config:
                  prefill:
                    dp_size: 2
                    tp_size: 16
                  decode:
                    dp_size: 8
                    tp_size: 4
            env:
              HCCL_OP_EXPANSION_MODE: AIV
              HCCL_IF_IP: $local_ip
              GLOO_SOCKET_IFNAME: $nic_name
              TP_SOCKET_IFNAME: $nic_name
              HCCL_SOCKET_IFNAME: $nic_name
              OMP_PROC_BIND: "false"
              OMP_NUM_THREADS: 10
              PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
              VLLM_USE_V1: 1
              HCCL_BUFFSIZE: 256
              ASCEND_AGGREGATE_ENABLE: 1
              ASCEND_TRANSPORT_PRINT: 1
              ACL_OP_INIT_MODE: 1
              ASCEND_A3_ENABLE: 1
              VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT: 480
              VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
            system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
              commands: ["nic_name=\"enp48s3u1u1\" # change to your own nic name", "local_ip=141.61.39.105 # change to your own ip"]
          - role: prefill  # Prefill Node 1
            index: 1
            engine_config:
              model: /root/.cache/Eco-Tech/DeepSeek-V3.2-w8a8-mtp-QuaRot
