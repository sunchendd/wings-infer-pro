  slug: nemotron-3-nano-omni-30b-a3b-reasoning  # 模型标识
  provider: NVIDIA  # 提供者/厂商
  description: "Mamba2-Transformer hybrid MoE omnimodal model (31B total / 3B active) with unified video, audio, image, and text understanding; reasoning + tool calling; BF16, FP8, and NVFP4 variants"  # 模型描述
  model_id: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-FP8  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
