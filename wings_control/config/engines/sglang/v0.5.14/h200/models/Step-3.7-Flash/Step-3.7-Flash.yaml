# 来源追溯
upstream_sources:
  - id: sglang_step-3.7-flash
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/StepFun/Step-3.7-Flash.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/StepFun/Step-3.7-Flash.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Step-3.7-Flash  # 模型名称
  provider: stepfun-ai  # 提供者/厂商
  model_id: stepfun-ai/Step-3.7-Flash  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)step[-.]?3.7[-.]?flash"
  variant_name: Step-3.7-Flash  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, step3p5]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_step-3.7-flash#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: stepfun-ai/Step-3.7-Flash
          model_path: stepfun-ai/Step-3.7-Flash
          tp: 4
          trust_remote_code: true
        env: {}
        default_strategy: true
