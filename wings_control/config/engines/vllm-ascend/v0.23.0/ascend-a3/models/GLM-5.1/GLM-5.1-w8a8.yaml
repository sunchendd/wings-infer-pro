# 来源追溯
upstream_sources:
  - id: vllm_ascend_glm-5.1
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/GLM5.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.23.0/docs/source/tutorials/models/GLM5.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: GLM-5.1  # 模型名称
  provider: Eco-Tech  # 提供者/厂商
  model_id: Eco-Tech/GLM-5.1-w8a8  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.23.0  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?5.1"
  variant_name: GLM-5.1-w8a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool/function calling via the model's tool-call parser.
    args: [--enable-auto-tool-choice, --tool-call-parser, glm47]
  reasoning:
    description: Enable the model's reasoning-content parser.
    args: [--reasoning-parser, glm45]
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"num_speculative_tokens\":3,\"method\":\"deepseek_mtp\",\"enforce_eager\":true}"]
    strategy_overrides:  # 该特性默认用上面的 args；此处仅列出 spec 参数与默认不一致、需按部署场景覆盖的项
      pd_disaggregation.pd_cluster.prefill0:
        args: [--speculative-config, "{\"num_speculative_tokens\":1,\"method\":\"deepseek_mtp\",\"enforce_eager\":true}"]
      pd_disaggregation.pd_cluster.prefill1:
        args: [--speculative-config, "{\"num_speculative_tokens\":1,\"method\":\"deepseek_mtp\",\"enforce_eager\":true}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_glm-5.1#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: /root/.cache/modelscope/hub/models/vllm-ascend/GLM5-w8a8
          host: "0.0.0.0"
          port: 8077
          data_parallel_size: 1
          tensor_parallel_size: 16
          enable_expert_parallel: true
          seed: 1024
          served_model_name: glm-5
          max_num_seqs: 16
          max_model_len: 40960
          max_num_batched_tokens: 4096
          trust_remote_code: true
          gpu_memory_utilization: 0.95
          quantization: ascend
          enable_chunked_prefill: true
          enable_prefix_caching: true
          additional_config:
            multistream_overlap_shared_expert: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          hf_overrides:
            use_index_cache: true
            index_topk_freq: 4
        env:
          HCCL_OP_EXPANSION_MODE: AIV
          OMP_PROC_BIND: "false"
          OMP_NUM_THREADS: 1
          HCCL_BUFFSIZE: 200
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          VLLM_ASCEND_BALANCE_SCHEDULING: 1
          VLLM_ASCEND_ENABLE_MLAPO: 1
          VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
  pd_disaggregation:
    source_ref: "vllm_ascend_glm-5.1#pd_cluster"
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
          - role: prefill  # Prefill Node 0
            index: 0
            engine_config:
              model: /root/.cache/modelscope/hub/models/vllm-ascend/GLM5-w8a8
              host: "0.0.0.0"
              port: $2
              data_parallel_size: $3
              data_parallel_rank: $4
              data_parallel_address: $5
              data_parallel_rpc_port: $6
              tensor_parallel_size: $7
              enable_expert_parallel: true
              seed: 1024
              served_model_name: glm-5
              max_model_len: 131072
              additional_config:
                enable_dsa_cp: true
              max_num_batched_tokens: 4096
              trust_remote_code: true
              max_num_seqs: 64
              enable_chunked_prefill: true
              quantization: ascend
              gpu_memory_utilization: 0.95
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 4
              enforce_eager: true
              kv_transfer_config:
                kv_connector: MooncakeConnectorV1
                kv_role: kv_producer
                kv_port: 30000
                kv_connector_extra_config:
                  use_ascend_direct: true
                  prefill:
                    dp_size: 2
                    tp_size: 16
                  decode:
                    dp_size: 16
                    tp_size: 4
            env:
              HCCL_OP_EXPANSION_MODE: AIV
              HCCL_IF_IP: $local_ip
              GLOO_SOCKET_IFNAME: $nic_name
              TP_SOCKET_IFNAME: $nic_name
              HCCL_SOCKET_IFNAME: $nic_name
              OMP_PROC_BIND: "false"
              OMP_NUM_THREADS: 1
              PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
              HCCL_BUFFSIZE: 256
              ASCEND_AGGREGATE_ENABLE: 1
              ASCEND_TRANSPORT_PRINT: 1
              ACL_OP_INIT_MODE: 1
              ASCEND_A3_ENABLE: 1
              VLLM_MOONCAKE_ABORT_REQUEST_TIMEOUT: 480
              VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
              VLLM_ASCEND_ENABLE_FUSED_MC2: 1
              LD_LIBRARY_PATH: "$LD_LIBRARY_PATH:/usr/local/lib"
