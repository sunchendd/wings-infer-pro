# 来源追溯
upstream_sources:
  - id: vllm_qwen3-8b_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/Qwen/Qwen3-8B"
    date_updated: 2026-07-24
    note: 用户提供 vLLM OpenAI API Server 启动命令，手工录入。

# 模型基本信息
model:
  name: Qwen3-8B  # 模型名称
  slug: qwen3-8b  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: "Qwen3 8B dense 模型，支持 thinking/non-thinking 混合模式。"  # 模型描述
  model_id: Qwen/Qwen3-8B  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 8B
  active_parameters: 8B
  context_length: 40960
  vram_minimum_gb: 48  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-07-24  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)Qwen3[-.]?8B"
  variant_name: Qwen3-8B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 1  # 单节点 GPU 数量
  vram_gb: 48  # 单节点总显存(GB)（1 × 48GB）
  multi_node: true

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_qwen3-8b_manual#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3-8B
          trust_remote_code: true
          max_model_len: 4096
          host: 0.0.0.0
          port: 17000
          tensor_parallel_size: 1
        env: {}

  multi_node:
    source_ref: "vllm_qwen3-8b_manual#multi_node_dp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        display_name: "Multi-Node Data Parallel"
        orientation: throughput
        default_strategy: true
        head:
          engine_config:
            model: Qwen/Qwen3-8B
            trust_remote_code: true
            max_model_len: 4096
            host: 0.0.0.0
            port: 17000
            tensor_parallel_size: 1
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"
        worker:
          engine_config:
            model: Qwen/Qwen3-8B
            trust_remote_code: true
            max_model_len: 4096
            host: 0.0.0.0
            port: 17000
            tensor_parallel_size: 1
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
            headless: true
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"