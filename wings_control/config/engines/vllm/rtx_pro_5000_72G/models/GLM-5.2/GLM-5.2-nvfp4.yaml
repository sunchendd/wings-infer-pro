# 来源追溯
upstream_sources:
  - id: glm52_vllm0280_sm120_tp4dp4
    kind: manual
    repo: null
    file: glm52/perf_start_glm52_tp16ep_lmcache_mp.sh
    url: https://huggingface.co/nvidia/GLM-5.2-NVFP4
    note: GLM-5.2-NVFP4 vLLM 0.28.0 单机 16 卡 TP4×DP4×EP+LMCache MP 实测配置。

# 模型基本信息
model:
  name: GLM-5.2
  slug: glm-5.2
  provider: GLM (Z-AI)
  description: GLM-5.2 MoE model using the NVIDIA NVFP4 checkpoint.
  model_id: nvidia/GLM-5.2-NVFP4
  architecture: moe
  parameter_count: 743B
  active_parameters: 39B
  context_length: 1048576
  vram_minimum_gb: 558
  tasks: [text]
  min_engine_version: "0.28.0"
  match:
    - name_pattern: "(?i)glm[-.]?5.2[-.]?nvfp4"
  variant_name: GLM-5.2-nvfp4

# 硬件信息
hardware_profile:
  gpu_count: 16
  vram_gb: 1152
  multi_node: false

# 可选功能列表（不进 engine_config）
features:
  tool_calling:
    description: Enable GLM-4.7 tool parsing with automatic tool choice.
    args: [--tool-call-parser, glm47, --enable-auto-tool-choice]
  reasoning:
    description: Enable GLM-4.5-compatible reasoning parsing.
    args: [--reasoning-parser, glm45]
  spec_decoding:
    description: Enable five-token MTP speculative decoding.
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":5}"]
  lmcache:
    description: Enable LMCache MP KV cache acceleration.
    kv_transfer:
      description: Connect every vLLM rank to the colocated LMCache MP server.
      args: [--kv-transfer-config, "{\"kv_connector\":\"LMCacheMPConnector\",\"kv_role\":\"kv_both\",\"kv_connector_extra_config\":{\"lmcache.mp.port\":5555,\"lmcache.mp.mq_timeout\":300}}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "glm52_vllm0280_sm120_tp4dp4#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Tensor + Data + Expert Parallel
        orientation: throughput
        default_strategy: true
        engine_config:
          model: nvidia/GLM-5.2-NVFP4
          host: "0.0.0.0"
          port: 8001
          tensor_parallel_size: 4
          data_parallel_size: 4
          enable_expert_parallel: true
          all2all_backend: allgather_reducescatter
          kv_cache_dtype: fp8_e4m3
          gpu_memory_utilization: 0.85
          max_model_len: 150000
          max_num_seqs: 64
          max_num_batched_tokens: 8192
          watermark: 0.10
          compilation_config:
            mode: 0
            cudagraph_mode: FULL_DECODE_ONLY
            max_cudagraph_capture_size: 64
        env:
          NCCL_P2P_LEVEL: SYS
          NCCL_SHM_DISABLE: 1
          NCCL_CUMEM_ENABLE: 0
