# 来源追溯
upstream_sources:
  - id: sglang_glm45
    kind: official_doc
    repo: sglang
    file: docs/basic_usage/glm45.md
    url: "https://github.com/sgl-project/sglang/blob/main/docs/basic_usage/glm45.md"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: GLM-4.6-FP8  # 模型名称
  provider: zai-org  # 提供者/厂商
  model_id: zai-org/GLM-4.6-FP8  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.10  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: (?i)glm45
  variant_name: GLM-4.6-FP8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_glm45#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: zai-org/GLM-4.6-FP8
          tp: 8
        env: {}
        default_strategy: true
