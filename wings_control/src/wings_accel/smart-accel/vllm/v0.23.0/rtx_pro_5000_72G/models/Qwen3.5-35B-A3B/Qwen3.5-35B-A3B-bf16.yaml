# SmartAccel 加速配置(kv_offload=cpu;decoding 不启用,speculative_config=None)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: Qwen3.5-35B-A3B
  variant_name: "Qwen3.5-35B-A3B-bf16"
  match:
    - name_pattern: "(?i)qwen3[-.]?5[-.]?35b[-.]?a3b"
smart_accel:
  kv_offload:
    - name: cpu
      cli_params:
        kv_offloading_backend: native
        kv_offloading_size: "{memory_capacity_gb}"
      envs: {}
