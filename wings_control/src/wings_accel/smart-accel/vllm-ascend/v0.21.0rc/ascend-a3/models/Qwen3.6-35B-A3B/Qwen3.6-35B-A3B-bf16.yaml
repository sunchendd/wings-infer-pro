# SmartAccel 加速配置(decoding=qwen3_5_mtp)
# variant_name 必须等于 MaaS 下发的完整 --model-name;loader 按 variant_name 精确匹配优先,
# name_pattern 仅作家族兜底。
# engine 侧 bf16 文件的 variant_name 为无后缀规范身份 "Qwen3.6-35B-A3B"(w8a8 身份由
# 同目录 base 文件声明),smart 侧镜像对齐。
# 投机参数与引擎 features.spec_decoding 同源:qwen3_5_mtp,num_speculative_tokens=3,enforce_eager。
# 该模型不声明 KV 卸载(Ascend 上无已验证的 KV offload 方案)。
# 引擎 recipe 仅声明 standalone 场景,本资产不声明其它拓扑。
model:
  name: Qwen3.6-35B-A3B
  variant_name: "Qwen3.6-35B-A3B"
  match:
    - name_pattern: "(?i)^qwen3.6[-.]?35b[-.]?a3b$"
smart_accel:
  standalone:
    source_ref: vllm_ascend_qwen3.6-35b-a3b_bf16_manual#single_node
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: qwen3_5_mtp
          cli_params:
            speculative_config:
              method: qwen3_5_mtp
              num_speculative_tokens: 3
              enforce_eager: true
          envs: {}
