# 来源追溯
upstream_sources:
  - id: vllm_recipe_qwen3guard-gen-8b
    kind: official_recipe
    repo: recipes
    file: models/Qwen/Qwen3Guard-Gen-8B.yaml
    url: "https://recipes.vllm.ai/Qwen/Qwen3Guard-Gen-8B"
    date_updated: 2026-04-30
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Qwen3Guard-Gen-8B  # 模型名称
  slug: qwen3guard-gen-8b  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: Lightweight text-only guardrail/safety classifier model in the Qwen3Guard family.  # 模型描述
  model_id: Qwen/Qwen3Guard-Gen-8B  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 8B  # 总参数量
  active_parameters: 8B  # 激活参数量（MoE 模型）
  context_length: 32768  # 最大上下文长度
  vram_minimum_gb: 19  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.10.0"  # 最低引擎版本要求
  date_updated: 2026-04-30  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3guard[-.]?gen[-.]?8b"
  variant_name: Qwen3Guard-Gen-8B-bf16

# 硬件信息
hardware_profile:
  gpu_count: 4
  vram_gb: 1152
  multi_node: false

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_qwen3guard-gen-8b#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3Guard-Gen-8B
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_qwen3guard-gen-8b#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: Qwen/Qwen3Guard-Gen-8B
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: Qwen/Qwen3Guard-Gen-8B
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
