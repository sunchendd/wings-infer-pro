# 来源追溯
upstream_sources:
  - id: sglang_glm-glyph
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/GLM/GLM-Glyph.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/GLM/GLM-Glyph.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: GLM Glyph  # 模型名称
  provider: zai-org  # 提供者/厂商
  model_id: zai-org/Glyph  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?glyph"
  variant_name: GLM Glyph  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, glm45]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_glm-glyph#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: zai-org/Glyph
          model_path: zai-org/Glyph
          tp: 4
        env: {}
        default_strategy: true
