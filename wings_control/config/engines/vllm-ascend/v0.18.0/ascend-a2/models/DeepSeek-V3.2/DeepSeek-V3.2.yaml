# 来源追溯
upstream_sources:
  - id: vllm_ascend_deepseek-v3.2
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/DeepSeek-V3.2.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.18.0/docs/source/tutorials/models/DeepSeek-V3.2.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: DeepSeek-V3.2  # 模型名称
  provider: vllm-ascend  # 提供者/厂商
  model_id: vllm-ascend/DeepSeek-V3.2-Exp-W8A8  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.18.0  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)deepseek[-.]?v3.2"
  variant_name: DeepSeek-V3.2-W8A8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"num_speculative_tokens\":3,\"method\":\"deepseek_mtp\"}"]

# 部署场景
scenarios:
  multi_node:
    source_ref: "vllm_ascend_deepseek-v3.2#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        head:
          engine_config:
            model: /root/.cache/modelscope/hub/models/vllm-ascend/DeepSeek-V3.2-W8A8
            host: "0.0.0.0"
            port: 8077
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 13389
            tensor_parallel_size: 8
            quantization: ascend
            seed: 1024
            served_model_name: deepseek_v3_2
            enable_expert_parallel: true
            max_num_seqs: 16
            max_model_len: 8192
            max_num_batched_tokens: 4096
            trust_remote_code: true
            no_enable_prefix_caching: true
            gpu_memory_utilization: 0.92
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
              cudagraph_capture_sizes: [8, 16, 24, 32, 40, 48]
          env:
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 100
            VLLM_USE_V1: 1
            HCCL_BUFFSIZE: 200
            VLLM_ASCEND_ENABLE_MLAPO: 1
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
            HCCL_CONNECT_TIMEOUT: 120
            HCCL_INTRA_PCIE_ENABLE: 1
            HCCL_INTRA_ROCE_ENABLE: 0
          system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
            commands: ["nic_name=\"xxx\"", "local_ip=\"xxx\"", "node0_ip=\"xxxx\""]
        worker:
          engine_config:
            model: /root/.cache/modelscope/hub/models/vllm-ascend/DeepSeek-V3.2-W8A8
            host: "0.0.0.0"
            port: 8077
            headless: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 13389
            tensor_parallel_size: 8
            quantization: ascend
            seed: 1024
            served_model_name: deepseek_v3_2
            enable_expert_parallel: true
            max_num_seqs: 16
            max_model_len: 8192
            max_num_batched_tokens: 4096
            trust_remote_code: true
            no_enable_prefix_caching: true
            gpu_memory_utilization: 0.92
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
              cudagraph_capture_sizes: [8, 16, 24, 32, 40, 48]
          env:
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 100
            VLLM_USE_V1: 1
            HCCL_BUFFSIZE: 200
            VLLM_ASCEND_ENABLE_MLAPO: 1
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
            HCCL_CONNECT_TIMEOUT: 120
            HCCL_INTRA_PCIE_ENABLE: 1
            HCCL_INTRA_ROCE_ENABLE: 0
          system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
            commands: ["nic_name=\"xxx\"", "local_ip=\"xxx\"", "node0_ip=\"xxxx\""]
