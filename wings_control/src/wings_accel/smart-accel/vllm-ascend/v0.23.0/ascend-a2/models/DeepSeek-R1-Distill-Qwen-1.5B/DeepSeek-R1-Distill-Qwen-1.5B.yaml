# vLLM-Ascend v0.23.0 / Ascend A2 分布式 Mooncake KV 卸载 demo。
# Mooncake client 仍由受控 mooncake_npu fallback 资产在每个 engine Pod 中独立拉起；
# 该 YAML 仅声明 vLLM-Ascend 的 connector、运行时选择和两种支持拓扑。
model:
  name: DeepSeek-R1-Distill-Qwen-1.5B
  variant_name: "DeepSeek-R1-Distill-Qwen-1.5B"
  match:
    - name_pattern: "(?i)deepseek[-.]?r1[-.]?distill[-.]?qwen[-.]?1[-.]?5b"
smart_accel:
  standalone:
    source_ref: vllm_ascend_deepseek-r1-distill-qwen-1.5b_manual#single_node
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        default_strategy: true
        distributed_kv_offload:
          - name: mooncake_standalone_store
            runtime: mooncake_npu
            delivery:
              mode: fallback
            client:
              rpc_port: 50052
              master_rpc_port: 50051
              metadata_port: 10080
              metadata_path: /metadata
              device_names: ""
            cli_params:
              kv_transfer_config:
                kv_connector: AscendStoreConnector
                kv_role: kv_both
                kv_load_failure_policy: recompute
                kv_connector_extra_config:
                  backend: mooncake
                  lookup_rpc_port: "0"
                  register_buffer: true
                  use_layerwise: false
            envs: {}

  multi_node:
    source_ref: vllm_ascend_deepseek-r1-distill-qwen-1.5b_manual#multi_node_dp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        distributed_kv_offload:
          - name: mooncake_standalone_store
            runtime: mooncake_npu
            delivery:
              mode: fallback
            client:
              rpc_port: 50052
              master_rpc_port: 50051
              metadata_port: 10080
              metadata_path: /metadata
              device_names: ""
            cli_params:
              kv_transfer_config:
                kv_connector: AscendStoreConnector
                kv_role: kv_both
                kv_load_failure_policy: recompute
                kv_connector_extra_config:
                  backend: mooncake
                  lookup_rpc_port: "0"
                  register_buffer: true
                  use_layerwise: false
            envs: {}
