  repo: null
  file: 41-42-43-44-45-46-glm5.3-w8a8c8-mtp-128k.zip
  url: null
  note: 'Ascend A3 six-node 128K parameters: two independent DP2/TP16 Prefill instances and one DP8/TP4 Decode instance.'
model:
  name: GLM-5.3
  provider: Eco-Tech
  model_id: Eco-Tech/GLM-5.3-w8a8c8
  min_engine_version: v0.26.0rc
  match:
  - name_pattern: (?i)^GLM\-5\.3\-w8a8c8\-128k\-6node$
  variant_name: GLM-5.3-w8a8c8-128k-6node
hardware_profile:
  gpu_count: 16
  vram_gb: 1024
  multi_node: true
features:
  tool_calling:
    description: Enable automatic tool/function calling via the GLM parser.
    args:
    - --enable-auto-tool-choice
    - --tool-call-parser
    - glm47
  reasoning:
    description: Enable reasoning-content parsing.
    args:
    - --reasoning-parser
    - glm45
  spec_decoding:
    description: MTP speculative decoding capability used by the verified P/D recipe.
    args:
    - --speculative-config
    - '{"num_speculative_tokens":3,"method":"deepseek_mtp","enforce_eager":true}'
  sparse_index:
    description: IndexCache sparse attention capability used by the verified P/D recipe.
    args:
    - --hf-overrides
    - '{"use_index_cache":true,"index_topk_freq":4}'
scenarios:
  pd_disaggregation:
    source_ref: vllm_ascend_glm-5.3_w8a8c8_128k_6node_a3_manual#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        runtime:
          prefill:
            engine_id_policy: from_pd_index
          decode:
            engine_id_policy: from_pd_index
        nodes:
        - role: prefill
          index: 0
          engine_config:
            model: /weights/GLM-5.3-w8a8c8
            host: 0.0.0.0
            port: 17000
            tensor_parallel_size: 16
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_rpc_port: 12321
            data_parallel_external_lb: false
            enable_expert_parallel: true
            speculative_config:
              num_speculative_tokens: 1
              method: deepseek_mtp
              enforce_eager: true
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
            additional_config:
              fuse_muls_add: true
              recompute_scheduler_enable: false
              multistream_overlap_shared_expert: true
              enable_dsa_cp: true
              enable_sparse_sfa_c8: true
              enable_sparse_li_c8: true
              c8_enable_reshape_optim: true
            seed: 1024
            served_model_name: GLM-5.3-w8a8c8
            max_model_len: 131072
            max_num_batched_tokens: 8192
            max_num_seqs: 64
            enable_prefix_caching: true
            quantization: ascend
            gpu_memory_utilization: 0.92
            enforce_eager: true
            trust_remote_code: true
            kv_transfer_config:
              kv_connector: MultiConnector
              kv_role: kv_producer
              kv_connector_extra_config:
                connectors:
                - kv_connector: MooncakeConnectorV1
                  kv_role: kv_producer
                  kv_port: 30000
                  kv_connector_extra_config:
                    use_ascend_direct: true
                    prefill: {dp_size: 2, tp_size: 16}
                    decode: {dp_size: 8, tp_size: 4}
                - kv_connector: AscendStoreConnector
                  kv_role: kv_producer
                  kv_connector_extra_config: {backend: memcache, lookup_rpc_port: 0}
          env:
            PYTHONHASHSEED: '0'
            MMC_LOCAL_CONFIG_PATH: /wings-deploy/rendered/model-client/mmc-local.conf
            MF_GROUP_JOIN_MAX_TIMEOUT: '1200'
            VLLM_ASCEND_ENABLE_FUSED_MC2: '1'
            VLLM_ASCEND_ENABLE_FLASHCOMM1: '1'
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_TRANSFER_TIMEOUT: '600'
            HCCL_EXEC_TIMEOUT: '3600'
            HCCL_CONNECT_TIMEOUT: '3600'
            OMP_PROC_BIND: 'false'
            OMP_NUM_THREADS: '1'
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
            HCCL_BUFFSIZE: '400'
            ACL_OP_INIT_MODE: '1'
            ASCEND_A3_ENABLE: '1'
            LD_LIBRARY_PATH: ${LD_LIBRARY_PATH:-}:/usr/local/lib
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
