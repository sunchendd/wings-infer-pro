# 来源追溯
upstream_sources:
  - id: vllm_recipe_paddleocr-vl
    kind: official_recipe
    repo: recipes
    file: models/PaddlePaddle/PaddleOCR-VL.yaml
    url: "https://recipes.vllm.ai/PaddlePaddle/PaddleOCR-VL"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: PaddleOCR-VL  # 模型名称
  slug: paddleocr-vl  # 模型标识
  provider: PaddlePaddle  # 提供者/厂商
  description: "PaddleOCR-VL (0.9B) — compact vision-language model for document parsing, OCR, tables, formulas, charts"  # 模型描述
  model_id: PaddlePaddle/PaddleOCR-VL  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 0.9B  # 总参数量
  active_parameters: 0.9B  # 激活参数量（MoE 模型）
  context_length: 131072  # 最大上下文长度
  vram_minimum_gb: 2  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.11.1"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)paddleocr[-.]?vl"
  variant_name: PaddleOCR-VL-bf16

# 硬件信息
hardware_profile:
  gpu_count: 4
  vram_gb: 768
  multi_node: false

# 可选功能列表
features:
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only.
    args: [--mm-encoder-tp-mode, data]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_paddleocr-vl#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: PaddlePaddle/PaddleOCR-VL
          trust_remote_code: true
          max_num_batched_tokens: 16384
          no_enable_prefix_caching: true
          mm_processor_cache_gb: 0
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_paddleocr-vl#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: PaddlePaddle/PaddleOCR-VL
            trust_remote_code: true
            max_num_batched_tokens: 16384
            no_enable_prefix_caching: true
            mm_processor_cache_gb: 0
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: PaddlePaddle/PaddleOCR-VL
            trust_remote_code: true
            max_num_batched_tokens: 16384
            no_enable_prefix_caching: true
            mm_processor_cache_gb: 0
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
