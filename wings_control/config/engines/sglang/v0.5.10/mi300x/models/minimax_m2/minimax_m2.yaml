# 来源追溯
upstream_sources:
  - id: sglang_minimax-m2
    kind: official_doc
    repo: sglang
    file: docs/basic_usage/minimax_m2.md
    url: "https://github.com/sgl-project/sglang/blob/main/docs/basic_usage/minimax_m2.md"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: MiniMax-M2.5  # 模型名称
  provider: MiniMaxAI  # 提供者/厂商
  model_id: MiniMaxAI/MiniMax-M2.5  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.10  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)minimax[-.]?m2"
  variant_name: MiniMax-M2.5  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1536  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, minimax-m2]
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, minimax-append-think]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_minimax-m2#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: MiniMaxAI/MiniMax-M2.5
          model_path: MiniMaxAI/MiniMax-M2.5
          tp_size: 8
          ep_size: 8
          attention_backend: aiter
          host: "0.0.0.0"
          trust_remote_code: true
          port: 8000
          mem_fraction_static: 0.85
        env:
          SGLANG_USE_AITER: 1
        default_strategy: true
