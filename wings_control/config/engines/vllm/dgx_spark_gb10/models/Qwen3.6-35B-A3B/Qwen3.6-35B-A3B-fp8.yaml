# 来源追溯
upstream_sources:
  - id: vllm_recipe_qwen3.6-35b-a3b
    kind: official_recipe
    repo: recipes
    file: models/Qwen/Qwen3.6-35B-A3B.yaml
    url: "https://recipes.vllm.ai/Qwen/Qwen3.6-35B-A3B"
    date_updated: 2026-06-03
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Qwen3.6-35B-A3B  # 模型名称
  slug: qwen3.6-35b-a3b  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: "Smaller Qwen3.6 multimodal MoE model (35B total / 3B active) with BF16, FP8, and NVIDIA NVFP4 variants"  # 模型描述
  model_id: Qwen/Qwen3.6-35B-A3B-FP8  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 35B  # 总参数量
  active_parameters: 3B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 42  # 最低显存需求(GB)
  tasks: [multimodal, text]  # 支持的任务类型
  min_engine_version: "0.17.0"  # 最低引擎版本要求
  date_updated: 2026-06-03  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3.6[-.]?35b[-.]?a3b"
  variant_name: Qwen3.6-35B-A3B-fp8

# 硬件信息
hardware_profile:
  gpu_count: 1
  vram_gb: 128
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool choice with Qwen3 XML parser
    args: [--enable-auto-tool-choice, --tool-call-parser, qwen3_xml]
  reasoning:
    description: Enable chain-of-thought reasoning with Qwen3 parser
    args: [--reasoning-parser, qwen3]
  spec_decoding:
    description: Multi-token prediction speculative decoding for lower latency
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":3,\"moe_backend\":\"triton\"}"]
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only.
    args: [--mm-encoder-tp-mode, data]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_qwen3.6-35b-a3b#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: Qwen/Qwen3.6-35B-A3B-FP8
          trust_remote_code: true
          enable_expert_parallel: true
          data_parallel_size: 1
        env: {}
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: Qwen/Qwen3.6-35B-A3B-FP8
          trust_remote_code: true
          enable_expert_parallel: true
          tensor_parallel_size: 1
        env: {}
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3.6-35B-A3B-FP8
          trust_remote_code: true
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_qwen3.6-35b-a3b#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: Qwen/Qwen3.6-35B-A3B-FP8
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: Qwen/Qwen3.6-35B-A3B-FP8
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 1
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: Qwen/Qwen3.6-35B-A3B-FP8
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 2
