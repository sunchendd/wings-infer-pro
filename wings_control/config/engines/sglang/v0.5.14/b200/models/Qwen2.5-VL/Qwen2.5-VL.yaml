# 来源追溯
upstream_sources:
  - id: sglang_qwen2.5-vl
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Qwen/Qwen2.5-VL.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Qwen/Qwen2.5-VL.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen2.5-VL  # 模型名称
  provider: collections  # 提供者/厂商
  model_id: collections/Qwen  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen2.5[-.]?vl"
  variant_name: Qwen2.5-VL  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1440  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen2.5-vl#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: Qwen/Qwen2.5-VL-72B-Instruct
          tp: 8
          host: "0.0.0.0"
          port: 30000
        env: {}
        default_strategy: true
