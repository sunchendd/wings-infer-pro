# 来源追溯
upstream_sources:
  - id: vllm_qwen2.5-vl-72b-instruct_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/Qwen/Qwen2.5-VL-72B-Instruct"
    date_updated: 2026-07-24
    note: 用户提供 vLLM OpenAI API Server 启动命令，手工录入。

# 模型基本信息
model:
  name: Qwen2.5-VL-72B-Instruct  # 模型名称
  slug: qwen2.5-vl-72b-instruct  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: "Qwen2.5-VL 72B dense 视觉语言指令模型，支持图像和视频理解。"  # 模型描述
  model_id: Qwen/Qwen2.5-VL-72B-Instruct  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 72B
  active_parameters: 72B
  context_length: 128000
  vram_minimum_gb: 384  # 最低显存需求(GB)
  tasks: [multimodal, text]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-07-24  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)Qwen2[-.]?5[-.]?VL[-.]?72B[-.]?Instruct"
  variant_name: Qwen2.5-VL-72B-Instruct  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU 数量
  vram_gb: 384  # 单节点总显存(GB)（8 × 48GB）
  multi_node: false  # 仅支持单节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_qwen2.5-vl-72b-instruct_manual#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/Qwen2.5-VL-72B-Instruct
          trust_remote_code: true
          max_model_len: 4096
          host: 0.0.0.0
          port: 17000
          tensor_parallel_size: 8
        env: {}
