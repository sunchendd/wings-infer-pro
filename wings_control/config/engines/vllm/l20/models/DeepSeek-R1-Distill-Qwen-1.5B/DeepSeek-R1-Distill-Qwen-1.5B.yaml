# 来源追溯
upstream_sources:
  - id: vllm_deepseek-r1-distill-qwen-1.5b_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    date_updated: 2026-07-24
    note: 用户提供 vLLM OpenAI API Server 启动命令，手工录入。

# 模型基本信息
model:
  name: DeepSeek-R1-Distill-Qwen-1.5B  # 模型名称
  slug: deepseek-r1-distill-qwen-1.5b  # 模型标识
  provider: DeepSeek  # 提供者/厂商
  description: "DeepSeek-R1 蒸馏到 Qwen 1.5B 的 dense 推理模型。"  # 模型描述
  model_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 1.5B
  active_parameters: 1.5B
  context_length: null  # 待补充：最大上下文长度
  vram_minimum_gb: 48  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-07-24  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)DeepSeek[-.]?R1[-.]?Distill[-.]?Qwen[-.]?1[-.]?5B"
  variant_name: DeepSeek-R1-Distill-Qwen-1.5B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 1  # 单节点 GPU 数量
  vram_gb: 48  # 单节点总显存(GB)（1 × 48GB）
  multi_node: true  # 仅支持单节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_deepseek-r1-distill-qwen-1.5b_manual#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
          trust_remote_code: true
          max_model_len: 4096
          host: 0.0.0.0
          port: 17000
          tensor_parallel_size: 1
        env: {}

  multi_node:
    source_ref: "vllm_deepseek-r1-distill-qwen-1.5b_manual#multi_node_dp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        display_name: "Multi-Node Data Parallel"
        orientation: throughput
        default_strategy: true
        head:
          engine_config:
            model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
            trust_remote_code: true
            max_model_len: 4096
            host: 0.0.0.0
            port: 17000
            tensor_parallel_size: 1
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"
        worker:
          engine_config:
            model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
            trust_remote_code: true
            max_model_len: 4096
            host: 0.0.0.0
            port: 17000
            tensor_parallel_size: 1
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: "$HEAD_IP"
            data_parallel_rpc_port: 13389
            headless: true
          env:
            GLOO_SOCKET_IFNAME: "$IFACE_NAME"
            NCCL_SOCKET_IFNAME: "$IFACE_NAME"