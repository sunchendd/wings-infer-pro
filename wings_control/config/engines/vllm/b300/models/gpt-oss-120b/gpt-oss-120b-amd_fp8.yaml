# 来源追溯
upstream_sources:
  - id: vllm_recipe_gpt-oss
    kind: official_recipe
    repo: recipes
    file: models/openai/gpt-oss-120b.yaml
    url: "https://recipes.vllm.ai/openai/gpt-oss-120b"
    date_updated: 2026-05-10
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: GPT-OSS  # 模型名称
  slug: gpt-oss  # 模型标识
  provider: OpenAI  # 提供者/厂商
  description: "OpenAI's gpt-oss family (20B / 120B) with MXFP4 MoE, attention-sinks, built-in tools via Responses API"  # 模型描述
  model_id: amd/gpt-oss-120b-w-mxfp4-a-fp8  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 120B  # 总参数量
  active_parameters: 5.1B  # 激活参数量（MoE 模型）
  context_length: 131072  # 最大上下文长度
  vram_minimum_gb: 80  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.10.0"  # 最低引擎版本要求
  date_updated: 2026-05-10  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)gpt[-.]?oss"
  variant_name: gpt-oss-120b-amd_fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2144
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: OpenAI harmony tool-call parser with automatic tool choice
    args: [--tool-call-parser, openai, --enable-auto-tool-choice]
  spec_decoding:
    description: EAGLE3 speculative decoding for accelerated inference
    args: [--speculative-config, "{\"model\":\"nvidia/gpt-oss-120b-Eagle3-v3\",\"num_speculative_tokens\":7,\"method\":\"eagle3\",\"draft_tensor_parallel_size\":1}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_gpt-oss#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: amd/gpt-oss-120b-w-mxfp4-a-fp8
          tensor_parallel_size: 1
        env:
          VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: 1
  multi_node:
    source_ref: "vllm_recipe_gpt-oss#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: amd/gpt-oss-120b-w-mxfp4-a-fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: amd/gpt-oss-120b-w-mxfp4-a-fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: 1
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: amd/gpt-oss-120b-w-mxfp4-a-fp8
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: amd/gpt-oss-120b-w-mxfp4-a-fp8
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: 1
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: amd/gpt-oss-120b-w-mxfp4-a-fp8
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: amd/gpt-oss-120b-w-mxfp4-a-fp8
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: 1
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: amd/gpt-oss-120b-w-mxfp4-a-fp8
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: amd/gpt-oss-120b-w-mxfp4-a-fp8
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_USE_FLASHINFER_MOE_MXFP4_MXFP8: 1
