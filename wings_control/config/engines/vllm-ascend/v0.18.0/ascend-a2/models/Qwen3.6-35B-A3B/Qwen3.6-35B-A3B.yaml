# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwen3.6-35b-a3b
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/Qwen3.6-35B-A3B.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.18.0/docs/source/tutorials/models/Qwen3.6-35B-A3B.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: Qwen3.6-35B-A3B  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3.6-35B-A3B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.18.0  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3.6[-.]?35b[-.]?a3b"
  variant_name: Qwen3.6-35B-A3B-w8a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"method\":\"qwen3_5_mtp\",\"num_speculative_tokens\":3,\"enforce_eager\":true}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen3.6-35b-a3b#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Eco-Tech/Qwen3.6-35B-A3B-w8a8
          host: "0.0.0.0"
          port: 8000
          data_parallel_size: 1
          tensor_parallel_size: 2
          enable_expert_parallel: true
          seed: 1024
          quantization: ascend
          served_model_name: qwen3.6
          max_num_seqs: 128
          max_model_len: 262144
          max_num_batched_tokens: 16384
          trust_remote_code: true
          gpu_memory_utilization: 0.9
          enable_prefix_caching: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          additional_config:
            enable_cpu_binding: true
            multistream_overlap_shared_expert: true
          async_scheduling: true
        env:
          VLLM_USE_MODELSCOPE: "True"
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          HCCL_OP_EXPANSION_MODE: AIV
          HCCL_BUFFSIZE: 1024
          OMP_NUM_THREADS: 1
          TASK_QUEUE_ENABLE: 1
          LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2${LD_PRELOAD:+:$LD_PRELOAD}"
          VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
        system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
          sysctls:
            vm.swappiness: 0
            kernel.numa_balancing: 0
            kernel.sched_migration_cost_ns: 50000
          sysfs_writes:
            - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
              value: performance
