# 来源追溯
upstream_sources:
  - id: vllm_recipe_intern-s2-preview
    kind: official_recipe
    repo: recipes
    file: models/internlm/Intern-S2-Preview.yaml
    url: "https://recipes.vllm.ai/internlm/Intern-S2-Preview"
    date_updated: 2026-05-15
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Intern-S2-Preview  # 模型名称
  slug: intern-s2-preview  # 模型标识
  provider: InternLM  # 提供者/厂商
  description: "Scientific multimodal MoE (36B total / 3B active) continued pre-trained from Qwen3.5 — hybrid linear/full attention, 262K context, MTP-accelerated reasoning. BF16 and FP8 checkpoints."  # 模型描述
  model_id: internlm/Intern-S2-Preview  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 36B  # 总参数量
  active_parameters: 3B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 87  # 最低显存需求(GB)
  tasks: [multimodal, text]  # 支持的任务类型
  min_engine_version: "0.22.0"  # 最低引擎版本要求
  date_updated: 2026-05-15  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)intern[-.]?s2[-.]?preview"
  variant_name: Intern-S2-Preview-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2144
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool choice with the Qwen3 Coder parser (per official deployment guide)
    args: [--enable-auto-tool-choice, --tool-call-parser, qwen3_coder]
  reasoning:
    description: "Extract <think>...</think> chain-of-thought via the Qwen3 reasoning parser"
    args: [--reasoning-parser, qwen3]
  spec_decoding:
    description: Shared-weight MTP speculative decoding — 4 draft tokens (recommended in the deployment guide)
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":4}"]
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only.
    args: [--mm-encoder-tp-mode, data]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_intern-s2-preview#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: internlm/Intern-S2-Preview
          trust_remote_code: true
          enable_expert_parallel: true
          data_parallel_size: 8
        env: {}
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: internlm/Intern-S2-Preview
          trust_remote_code: true
          enable_expert_parallel: true
          tensor_parallel_size: 8
        env: {}
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: internlm/Intern-S2-Preview
          trust_remote_code: true
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_intern-s2-preview#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: internlm/Intern-S2-Preview
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: internlm/Intern-S2-Preview
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: internlm/Intern-S2-Preview
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: internlm/Intern-S2-Preview
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: internlm/Intern-S2-Preview
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: internlm/Intern-S2-Preview
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
