# 来源追溯
upstream_sources:
  - id: vllm_recipe_minimax-m2.7
    kind: official_recipe
    repo: recipes
    file: models/MiniMaxAI/MiniMax-M2.7.yaml
    url: "https://recipes.vllm.ai/MiniMaxAI/MiniMax-M2.7"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: MiniMax-M2.7  # 模型名称
  slug: minimax-m2.7  # 模型标识
  provider: MiniMax  # 提供者/厂商
  description: "MiniMax M2.7 MoE language model (230B total / 10B active) — latest M2 release for coding, agent toolchains, and long-context reasoning with native FP8"  # 模型描述
  model_id: MiniMaxAI/MiniMax-M2.7  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 230B  # 总参数量
  active_parameters: 10B  # 激活参数量（MoE 模型）
  context_length: 196608  # 最大上下文长度
  vram_minimum_gb: 276  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.20.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)minimax[-.]?m2.7"
  variant_name: MiniMax-M2.7-fp8

# 硬件信息
hardware_profile:
  gpu_count: 1
  vram_gb: 252
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: MiniMax M2 tool call parser with automatic tool choice
    args: [--tool-call-parser, minimax_m2, --enable-auto-tool-choice]
  reasoning:
    description: MiniMax M2 reasoning parser for chain-of-thought extraction
    args: [--reasoning-parser, minimax_m2]

# 部署场景
scenarios:
  multi_node:
    source_ref: "vllm_recipe_minimax-m2.7#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: MiniMaxAI/MiniMax-M2.7
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: MiniMaxAI/MiniMax-M2.7
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 1
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: MiniMaxAI/MiniMax-M2.7
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: MiniMaxAI/MiniMax-M2.7
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: MiniMaxAI/MiniMax-M2.7
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: MiniMaxAI/MiniMax-M2.7
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: MiniMaxAI/MiniMax-M2.7
            trust_remote_code: true
            tensor_parallel_size: 1
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: MiniMaxAI/MiniMax-M2.7
            trust_remote_code: true
            tensor_parallel_size: 1
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
  pd_disaggregation:
    source_ref: "vllm_recipe_minimax-m2.7#pd_cluster"
    match:
      distributed: true
      pd_role: null
    # PD分离：1P×1D  # 根据官网默认配置
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill  # P1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: MiniMaxAI/MiniMax-M2.7
              trust_remote_code: true
              port: 8001
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_producer
                kv_load_failure_policy: fail
              enforce_eager: true
              tensor_parallel_size: 1
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5557
              VLLM_NIXL_SIDE_CHANNEL_HOST: $PREFILL_NODE_1
          - role: decode  # D1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: MiniMaxAI/MiniMax-M2.7
              trust_remote_code: true
              port: 8002
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_consumer
                kv_load_failure_policy: fail
              compilation_config:
                cudagraph_mode: FULL_DECODE_ONLY
              tensor_parallel_size: 1
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5558
              VLLM_NIXL_SIDE_CHANNEL_HOST: $DECODE_NODE_1
