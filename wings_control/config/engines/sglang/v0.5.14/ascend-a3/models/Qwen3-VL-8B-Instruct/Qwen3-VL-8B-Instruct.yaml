# 来源追溯
upstream_sources:
  - id: sglang_qwen3-vl-8b-instruct
    kind: official_doc
    repo: sglang
    file: docs/platforms/ascend/ascend_npu_qwen3_examples.md
    url: "https://github.com/sgl-project/sglang/blob/main/docs/platforms/ascend/ascend_npu_qwen3_examples.md"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen3-VL-8B-Instruct  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3-VL-8B-Instruct  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?vl[-.]?8b[-.]?instruct"
  variant_name: Qwen3-VL-8B-Instruct  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen3-vl-8b-instruct#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: Qwen/Qwen3-VL-8B-Instruct
          enable_multimodal: true
          attention_backend: ascend
          mm_attention_backend: ascend_attn
          trust_remote_code: true
          tp_size: 4
          model_path: Qwen/Qwen3-VL-8B-Instruct
          mem_fraction_static: 0.8
        env:
          SGLANG_SET_CPU_AFFINITY: 1
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          STREAMS_PER_DEVICE: 32
          HCCL_BUFFSIZE: 1536
          HCCL_OP_EXPANSION_MODE: AIV
        default_strategy: true
