# 来源追溯
upstream_sources:
  - id: sglang_llama-3.1
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Llama/Llama3.1.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Llama/Llama3.1.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Llama-3.1  # 模型名称
  provider: yuhuili  # 提供者/厂商
  model_id: yuhuili/EAGLE3-LLaMA3.1-Instruct-8B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)llama[-.]?3.1"
  variant_name: Llama-3.1  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 640  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_llama-3.1#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: Meta-Llama/Llama-3.1-70B
          backend: sglang
          dataset_name: random
          random_input_len: 1000
          random_output_len: 1000
          num_prompts: 10
          max_concurrency: 1
        env: {}
        default_strategy: true
