# 来源追溯
upstream_sources:
  - id: vllm_ascend_glm-5.1_w8a8_manual
    kind: manual
    repo: null
    file: null
    url: "https://docs.vllm.ai/projects/ascend/en/v0.21.0rc/tutorials/models/GLM5.html"
    date_updated: 2026-07-27
    note: 用户提供 vLLM-Ascend 多节点启动命令，手工录入；模型资料参考 vLLM Ascend GLM-5/GLM-5.1 教程。

# 模型基本信息
model:
  name: GLM-5.1  # 模型名称
  provider: Eco-Tech  # 提供者/厂商
  model_id: Eco-Tech/GLM-5.1-w8a8  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc1  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?5.1"
  variant_name: GLM-5.1-w8a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  sparse_index:
    description: Sparse attention index cache configuration via HF overrides.
    args: [--hf-overrides, "{\"use_index_cache\": true, \"index_topk_freq\": 8}"]
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"num_speculative_tokens\": 3, \"method\": \"deepseek_mtp\"}"]

# 部署场景
scenarios:
  multi_node:
    source_ref: "vllm_ascend_glm-5.1_w8a8_manual#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        head:
          engine_config:
            model: /usr/local/serving/models/
            host: "0.0.0.0"
            port: 18000
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 12890
            tensor_parallel_size: 8
            enable_expert_parallel: true
            seed: 1024
            served_model_name: glm-5.1
            max_num_seqs: 16
            max_model_len: 24000
            max_num_batched_tokens: 4096
            trust_remote_code: true
            gpu_memory_utilization: 0.95
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            quantization: ascend
          env:
            VLLM_ENGINE_READY_TIMEOUT_S: 1800
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 1
            HCCL_BUFFSIZE: 200
            VLLM_ASCEND_BALANCE_SCHEDULING: 1
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
            commands: ["nic_name=\"eth0\"", "local_ip=$RANK_IP", "node0_ip=$MASTER_IP"]
        worker:
          engine_config:
            model: /usr/local/serving/models/
            host: "0.0.0.0"
            port: 18000
            headless: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 12890
            enable_expert_parallel: true
            tensor_parallel_size: 8
            seed: 1024
            served_model_name: glm-5.1
            max_num_seqs: 16
            max_model_len: 24000
            max_num_batched_tokens: 4096
            trust_remote_code: true
            gpu_memory_utilization: 0.95
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            quantization: ascend
          env:
            VLLM_ENGINE_READY_TIMEOUT_S: 1800
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 1
            HCCL_BUFFSIZE: 200
            VLLM_ASCEND_BALANCE_SCHEDULING: 1
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
            commands: ["nic_name=\"eth0\"", "local_ip=$RANK_IP", "node0_ip=$MASTER_IP"]
