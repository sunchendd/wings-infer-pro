# 来源追溯
upstream_sources:
  - id: vllm_recipe_unlimited-ocr
    kind: official_recipe
    repo: recipes
    file: models/baidu/Unlimited-OCR.yaml
    url: "https://recipes.vllm.ai/baidu/Unlimited-OCR"
    date_updated: 2026-06-28
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Unlimited-OCR  # 模型名称
  slug: unlimited-ocr  # 模型标识
  provider: Ernie (Baidu)  # 提供者/厂商
  description: "Baidu's state-of-the-art document-parsing model with Reference Sliding Window Attention (R-SWA), optimized for full-page OCR and markdown generation."  # 模型描述
  model_id: baidu/Unlimited-OCR  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 3B  # 总参数量
  active_parameters: 3B  # 激活参数量（MoE 模型）
  context_length: 32768  # 最大上下文长度
  vram_minimum_gb: 8  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.25.0"  # 最低引擎版本要求
  date_updated: 2026-06-28  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)unlimited[-.]?ocr"
  variant_name: Unlimited-OCR-bf16

# 硬件信息
hardware_profile:
  gpu_count: 4
  vram_gb: 768
  multi_node: false

# 可选功能列表
features:
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder.
    args: [--mm-encoder-tp-mode, data]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_unlimited-ocr#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: baidu/Unlimited-OCR
          trust_remote_code: true
          logits_processors: "vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor"
          no_enable_prefix_caching: true
          mm_processor_cache_gb: 0
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_unlimited-ocr#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: baidu/Unlimited-OCR
            trust_remote_code: true
            logits_processors: "vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor"
            no_enable_prefix_caching: true
            mm_processor_cache_gb: 0
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: baidu/Unlimited-OCR
            trust_remote_code: true
            logits_processors: "vllm.model_executor.models.unlimited_ocr:NGramPerReqLogitsProcessor"
            no_enable_prefix_caching: true
            mm_processor_cache_gb: 0
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
