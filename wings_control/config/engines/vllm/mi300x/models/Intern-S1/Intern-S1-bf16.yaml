# 来源追溯
upstream_sources:
  - id: vllm_recipe_intern-s1
    kind: official_recipe
    repo: recipes
    file: models/internlm/Intern-S1.yaml
    url: "https://recipes.vllm.ai/internlm/Intern-S1"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Intern-S1  # 模型名称
  slug: intern-s1  # 模型标识
  provider: InternLM  # 提供者/厂商
  description: Intern-S1 vision-language model from Shanghai AI Lab with BF16/FP8 variants and thinking/non-thinking modes  # 模型描述
  model_id: internlm/Intern-S1  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 241B  # 总参数量
  active_parameters: 28B  # 激活参数量（MoE 模型）
  context_length: 65536  # 最大上下文长度
  vram_minimum_gb: 578  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.10.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)intern[-.]?s1"
  variant_name: Intern-S1-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 1536
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: InternLM tool-call parser with automatic tool choice
    args: [--enable-auto-tool-choice, --tool-call-parser, internlm]
  reasoning:
    description: "DeepSeek-R1 reasoning parser extracts <think>...</think>"
    args: [--reasoning-parser, deepseek_r1]
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only.
    args: [--mm-encoder-tp-mode, data]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_intern-s1#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: internlm/Intern-S1
          trust_remote_code: true
          tensor_parallel_size: 8
        env:
          VLLM_ROCM_USE_AITER: 1
          VLLM_ROCM_USE_AITER_MOE: 0
  multi_node:
    source_ref: "vllm_recipe_intern-s1#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: internlm/Intern-S1
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 0
        worker:  # Node 1 节点配置
          engine_config:
            model: internlm/Intern-S1
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 0
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: internlm/Intern-S1
            trust_remote_code: true
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 0
        worker:  # Node 1 节点配置
          engine_config:
            model: internlm/Intern-S1
            trust_remote_code: true
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 0
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: internlm/Intern-S1
            trust_remote_code: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 0
        worker:  # Node 1 节点配置
          engine_config:
            model: internlm/Intern-S1
            trust_remote_code: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 0
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: internlm/Intern-S1
            trust_remote_code: true
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 0
        worker:  # Node 1 节点配置
          engine_config:
            model: internlm/Intern-S1
            trust_remote_code: true
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 0
