# 来源追溯
upstream_sources:
  - id: vllm_recipe_glm-5
    kind: official_recipe
    repo: recipes
    file: models/zai-org/GLM-5.yaml
    url: "https://recipes.vllm.ai/zai-org/GLM-5"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: GLM-5  # 模型名称
  slug: glm-5  # 模型标识
  provider: GLM (Z-AI)  # 提供者/厂商
  description: "GLM-5 frontier-scale MoE language model (~744B total parameters, 28.5T training tokens) with asynchronous RL infrastructure for reasoning, coding, and agentic tasks"  # 模型描述
  model_id: zai-org/GLM-5-FP8  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 744B  # 总参数量
  active_parameters: 40B  # 激活参数量（MoE 模型）
  context_length: 202752  # 最大上下文长度
  vram_minimum_gb: 893  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.16.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?5"
  variant_name: GLM-5-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 1536
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: GLM-4.7 tool call parser with automatic tool choice
    args: [--tool-call-parser, glm47, --enable-auto-tool-choice]
  reasoning:
    description: GLM-4.5 reasoning parser — thinking mode enabled by default on requests
    args: [--reasoning-parser, glm45]
  spec_decoding:
    description: Multi-Token Prediction speculative decoding (3 draft tokens)
    args: [--speculative-config.method, mtp, --speculative-config.num_speculative_tokens, 3]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_glm-5#single_node_tep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: zai-org/GLM-5-FP8
          trust_remote_code: true
          chat_template_content_format: string
          enable_expert_parallel: true
          tensor_parallel_size: 8
        env: {}
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: zai-org/GLM-5-FP8
          trust_remote_code: true
          chat_template_content_format: string
          tensor_parallel_size: 8
        env: {}
  multi_node:
    source_ref: "vllm_recipe_glm-5#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: zai-org/GLM-5-FP8
            trust_remote_code: true
            chat_template_content_format: string
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: zai-org/GLM-5-FP8
            trust_remote_code: true
            chat_template_content_format: string
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: zai-org/GLM-5-FP8
            trust_remote_code: true
            chat_template_content_format: string
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: zai-org/GLM-5-FP8
            trust_remote_code: true
            chat_template_content_format: string
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: zai-org/GLM-5-FP8
            trust_remote_code: true
            chat_template_content_format: string
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: zai-org/GLM-5-FP8
            trust_remote_code: true
            chat_template_content_format: string
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: zai-org/GLM-5-FP8
            trust_remote_code: true
            chat_template_content_format: string
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: zai-org/GLM-5-FP8
            trust_remote_code: true
            chat_template_content_format: string
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
  pd_disaggregation:
    source_ref: "vllm_recipe_glm-5#pd_cluster"
    match:
      distributed: true
      pd_role: null
    # PD分离：1P×1D  # 根据官网默认配置
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill  # P1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: zai-org/GLM-5-FP8
              trust_remote_code: true
              chat_template_content_format: string
              port: 8001
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_producer
                kv_load_failure_policy: fail
              enforce_eager: true
              tensor_parallel_size: 8
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5557
              VLLM_NIXL_SIDE_CHANNEL_HOST: $PREFILL_NODE_1
          - role: decode  # D1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: zai-org/GLM-5-FP8
              trust_remote_code: true
              chat_template_content_format: string
              port: 8002
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_consumer
                kv_load_failure_policy: fail
              compilation_config:
                cudagraph_mode: FULL_DECODE_ONLY
              tensor_parallel_size: 8
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5558
              VLLM_NIXL_SIDE_CHANNEL_HOST: $DECODE_NODE_1
