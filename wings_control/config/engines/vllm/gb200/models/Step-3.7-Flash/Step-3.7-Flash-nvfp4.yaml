# 模型基本信息
model:
  name: Step-3.7-Flash  # 模型名称
  slug: step-3.7-flash  # 模型标识
  provider: StepFun  # 提供者/厂商
  description: "Production-grade vision-language MoE (~198B total / 11B active parameters) combining a 196B sparse language backbone with a 1.8B perception encoder, hybrid SWA/Global attention, and 3-way Multi-Token Prediction"  # 模型描述
  model_id: stepfun-ai/Step-3.7-Flash-NVFP4  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 198B  # 总参数量
  active_parameters: 11B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 119  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-05-30  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)step[-.]?3.7[-.]?flash"
  variant_name: Step-3.7-Flash-nvfp4

# 硬件信息
hardware_profile:
  gpu_count: 4
  vram_gb: 768
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Step-3.5 tool call parser with automatic tool choice
    args: [--tool-call-parser, step3p5, --enable-auto-tool-choice]
  reasoning:
    description: Step-3.5 reasoning parser for chain-of-thought extraction
    args: [--reasoning-parser, step3p5]
  spec_decoding:
    description: 3-layer Multi-Token Prediction speculative decoding (MTP-3)
    args: [--speculative-config, "{\"method\": \"mtp\", \"num_speculative_tokens\": 3}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_step-3.7-flash#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: stepfun-ai/Step-3.7-Flash-NVFP4
          trust_remote_code: true
          disable_cascade_attn: true
          quantization: modelopt
          kv_cache_dtype: fp8
          gpu_memory_utilization: 0.9
          async_scheduling: true
          enable_expert_parallel: true
          data_parallel_size: 4
        env: {}
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: stepfun-ai/Step-3.7-Flash-NVFP4
          trust_remote_code: true
          disable_cascade_attn: true
          quantization: modelopt
          kv_cache_dtype: fp8
          gpu_memory_utilization: 0.9
          async_scheduling: true
          enable_expert_parallel: true
          tensor_parallel_size: 4
        env: {}
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: stepfun-ai/Step-3.7-Flash-NVFP4
          trust_remote_code: true
