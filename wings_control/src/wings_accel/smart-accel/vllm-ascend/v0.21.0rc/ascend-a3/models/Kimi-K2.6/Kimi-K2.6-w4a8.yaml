# SmartAccel 加速配置(decoding=dflash [model_based])
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# issue47:Kimi-K2.6 不支持 memcache 卸载,移除 kv_offload,仅保留 decoding。
model:
  name: Kimi-K2.6
  variant_name: "Kimi-K2.6-w4a8"
  match:
    - name_pattern: "(?i)kimi[-.]?k2.6"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: dflash
          requires_model_path: true
          draft_arch:
            - dflash
          cli_params:
            speculative_config:
              method: dflash
              model: $path
              num_speculative_tokens: 15
          envs: {}
