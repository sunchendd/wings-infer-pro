# Wings YAML v2 demo — cpu_arch 集合偏序：多架构泛化资产
#
# 本文件演示 `cpu_arch` 集合的泛化/特化偏序：
#   - 泛化资产声明 `cpu_arch: {aarch64, x86_64}`（大集合），匹配两种 CPU 架构，
#     使用通用启动参数；
#   - 同目录 `ArchDemo-x86.yaml`（特化资产，`cpu_arch: {x86_64}`）只匹配 x86_64，
#     使用该架构专用参数。
#
# 偏序判定：`{x86_64}` ⊆ `{aarch64, x86_64}`，故特化资产更特化；
# 运行时 `platform.machine()` 探测为 x86_64（或 amd64）时特化资产胜出，
# 探测为 aarch64 时只有泛化资产命中。
#
# 说明：`_demo` 目录下的资产会被 v2 扫描器递归遍历。模型名 `ArchDemo` 为演示专用，
# 不会与真实模型冲突；如需真实使用，请按 `config/v2/{engine}/{version}/{hardware}/{model}/{variant}.yaml`
# 约定组织并补充 hardware_table.yaml 登记。
schema: v2
profile:
  engine: vllm-ascend
  version: "v0.99.0"
  hardware: {Ascend910C_64G}
  model: ArchDemo
  cpu_arch: {aarch64, x86_64}
model:
  name: ArchDemo
  variant_name: ArchDemo
  match:
    - name_pattern: "(?i)archdemo"
scenarios:
  standalone:
    source_ref: "demo#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: /root/.cache/modelscope/hub/models/ArchDemo
          max_model_len: 4096
          max_num_batched_tokens: 1024
          served_model_name: archdemo
          gpu_memory_utilization: 0.8
          max_num_seqs: 32
          tensor_parallel_size: 4
          data_parallel_size: 1
          quantization: ascend
          port: 8900
          block_size: 128
        env:
          OMP_NUM_THREADS: 4
          HCCL_BUFFSIZE: 512
