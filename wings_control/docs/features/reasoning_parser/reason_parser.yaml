# Reasoning Parser 公共能力与对外支持表
#
# 本文件是项目对外公布的 reasoning parser 支持范围和公共能力配置表。
# 它不依赖旧仓库的 _LLM_MODELS，也不要求与某个全局模型注册表一一对应。
# 当前重构仓库的运行时 resolver 负责读取本表，并在 FeatureOverlay 之前生成标准化
# features.reasoning；本次实现仅使用 models 中的精确模型配置。
#
# 范围: vllm / vllm_ascend。
#   - vllm_ascend 是运行时 canonical engine 名称；输入 vllm_ascend 时由 resolver 归一化。
#   - sglang 不纳入本表的 reasoning parser 支持范围；其 function call 配置不受影响。
#   - mindie 不纳入本表；其思维解析由服务端能力负责。
#
# 开关: reasoning_parser 与 function call 解耦，由独立开关
#   --enable-auto-think-choice 驱动。
#   - 开关开启且模型 YAML override 或本表精确模型配置命中 parser → 注入启动命令。
#   - 开关开启但未匹配 → 不主动推断 parser，并记录告警。
#   - 开关关闭 → 运行时移除 reasoning parser 参数；模型仍可能输出 <think>，
#     但输出不会被 reasoning parser 拆解。
#
# 数据职责:
#   - models: 已验证的精确模型名或模型变体配置；大小写不敏感，但不使用子串匹配。
#   - config: 预留字段；当前 resolver 不读取架构默认或精确例外。
#   - 模型 YAML 使用 features.reasoning 表达部署级显式 override。
#
# 取值约定:
#   <string> 或完整对象  表示该引擎下已验证的 parser；完整对象可携带 args/plugin。
#   null                 表示该模型/架构在该引擎下不支持 reasoning parser；公共表不注入 parser，
#                        也不删除或覆盖模型 YAML/场景中的已有配置。
#   省略 engine 键         表示该模型在该引擎下不启用 parser。
#
# 匹配规则（由新仓库 Reasoning Resolver 实现）:
#   1) 模型 YAML 的 features.reasoning.args 优先；
#   2) 未提供模型 YAML override 时，在 models 中按完整模型名精确匹配（忽略大小写）；
#   3) 无精确匹配时不注入。当前不使用 config[engine] 的 default 或精确例外，
#      也不使用未经声明的名称子串匹配。
#
# 解析结果区分 matched、unmatched 和 invalid；null 或省略 engine 键均不生成 parser。
#
feature: reasoning_parser
field: reasoning_parser
engines: [vllm, vllm_ascend]

architectures:

  - name: DeepseekV3ForCausalLM
    config:
      vllm:        {default: deepseek_v3}
