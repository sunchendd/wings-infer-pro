# 模型基本信息
model:
  name: Llama-4-Scout  # 模型名称
  slug: llama-4-scout  # 模型标识
  provider: Meta  # 提供者/厂商
  description: "Llama 4 Scout 17B-16E MoE model with NVIDIA FP8/FP4 variants, fits on a single GPU with quantization"  # 模型描述
  model_id: nvidia/Llama-4-Scout-17B-16E-Instruct-FP8  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 109B  # 总参数量
  active_parameters: 17B  # 激活参数量（MoE 模型）
  context_length: 10485760  # 最大上下文长度
  vram_minimum_gb: 131  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.12.0"  # 最低引擎版本要求
  date_updated: 2026-04-16  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)llama[-.]?4[-.]?scout"
  variant_name: Llama-4-Scout-17B-16E-Instruct-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2304
  multi_node: false

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_llama-4-scout#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: nvidia/Llama-4-Scout-17B-16E-Instruct-FP8
          kv_cache_dtype: fp8
          enable_expert_parallel: true
          data_parallel_size: 8
          no_enable_prefix_caching: true
          max_num_batched_tokens: 16384
          max_num_seqs: 64
          max_model_len: 32000
        env:
          VLLM_ROCM_USE_AITER: 1
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: nvidia/Llama-4-Scout-17B-16E-Instruct-FP8
          kv_cache_dtype: fp8
          enable_expert_parallel: true
          tensor_parallel_size: 8
          no_enable_prefix_caching: true
          max_num_batched_tokens: 16384
          max_num_seqs: 64
          max_model_len: 32000
        env:
          VLLM_ROCM_USE_AITER: 1
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: nvidia/Llama-4-Scout-17B-16E-Instruct-FP8
          kv_cache_dtype: fp8
          tensor_parallel_size: 1
          no_enable_prefix_caching: true
          max_num_batched_tokens: 16384
          max_num_seqs: 64
          max_model_len: 32000
        env:
          VLLM_ROCM_USE_AITER: 1
  multi_node:
    source_ref: "vllm_recipe_llama-4-scout#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: nvidia/Llama-4-Scout-17B-16E-Instruct-FP8
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            no_enable_prefix_caching: true
            max_num_batched_tokens: 16384
            max_num_seqs: 64
            max_model_len: 32000
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
        worker:  # Node 1 节点配置
