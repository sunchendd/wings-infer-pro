# 来源追溯
upstream_sources:
  - id: vllm_recipe_kimi-k2-instruct
    kind: official_recipe
    repo: recipes
    file: models/moonshotai/Kimi-K2-Instruct.yaml
    url: "https://recipes.vllm.ai/moonshotai/Kimi-K2-Instruct"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Kimi-K2-Instruct  # 模型名称
  slug: kimi-k2-instruct  # 模型标识
  provider: Moonshot AI  # 提供者/厂商
  description: Moonshot AI's Kimi-K2 is a trillion-parameter MoE instruction model (~32B active) with native FP8 weights and strong tool-calling capabilities.  # 模型描述
  model_id: moonshotai/Kimi-K2-Instruct  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 1T  # 总参数量
  active_parameters: 32B  # 激活参数量（MoE 模型）
  context_length: 131072  # 最大上下文长度
  vram_minimum_gb: 1200  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.12.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)kimi[-.]?k2[-.]?instruct"
  variant_name: Kimi-K2-Instruct-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2304
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Enable Kimi K2 tool calling with the kimi_k2 tool-call parser.
    args: [--enable-auto-tool-choice, --tool-call-parser, kimi_k2]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_kimi-k2-instruct#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: moonshotai/Kimi-K2-Instruct
          trust_remote_code: true
          tokenizer_mode: auto
          enable_expert_parallel: true
          data_parallel_size: 8
        env:
          SAFETENSORS_FAST_GPU: 1
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: moonshotai/Kimi-K2-Instruct
          trust_remote_code: true
          tokenizer_mode: auto
          enable_expert_parallel: true
          tensor_parallel_size: 8
        env:
          SAFETENSORS_FAST_GPU: 1
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: moonshotai/Kimi-K2-Instruct
          trust_remote_code: true
          tokenizer_mode: auto
          tensor_parallel_size: 8
        env:
          SAFETENSORS_FAST_GPU: 1
  multi_node:
    source_ref: "vllm_recipe_kimi-k2-instruct#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: moonshotai/Kimi-K2-Instruct
            trust_remote_code: true
            tokenizer_mode: auto
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            SAFETENSORS_FAST_GPU: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: moonshotai/Kimi-K2-Instruct
            trust_remote_code: true
            tokenizer_mode: auto
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            SAFETENSORS_FAST_GPU: 1
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: moonshotai/Kimi-K2-Instruct
            trust_remote_code: true
            tokenizer_mode: auto
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            SAFETENSORS_FAST_GPU: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: moonshotai/Kimi-K2-Instruct
            trust_remote_code: true
            tokenizer_mode: auto
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            SAFETENSORS_FAST_GPU: 1
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: moonshotai/Kimi-K2-Instruct
            trust_remote_code: true
            tokenizer_mode: auto
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            SAFETENSORS_FAST_GPU: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: moonshotai/Kimi-K2-Instruct
            trust_remote_code: true
            tokenizer_mode: auto
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            SAFETENSORS_FAST_GPU: 1
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: moonshotai/Kimi-K2-Instruct
            trust_remote_code: true
            tokenizer_mode: auto
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            dtype: bfloat16
            quantization: fp8
            kv_cache_dtype: fp8
            decode_context_parallel_size: 8
            enable_chunked_prefill: true
            max_model_len: 65536
            max_num_batched_tokens: 1024
            max_num_seqs: 1
            disable_log_requests: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            SAFETENSORS_FAST_GPU: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: moonshotai/Kimi-K2-Instruct
            trust_remote_code: true
            tokenizer_mode: auto
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            dtype: bfloat16
            quantization: fp8
            kv_cache_dtype: fp8
            decode_context_parallel_size: 8
            enable_chunked_prefill: true
            max_model_len: 65536
            max_num_batched_tokens: 1024
            max_num_seqs: 1
            disable_log_requests: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            SAFETENSORS_FAST_GPU: 1
  pd_disaggregation:
    source_ref: "vllm_recipe_kimi-k2-instruct#pd_cluster"
    match:
      distributed: true
      pd_role: null
    # PD分离：1P×1D  # 根据官网默认配置
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill  # P1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: moonshotai/Kimi-K2-Instruct
              trust_remote_code: true
              tokenizer_mode: auto
              port: 8001
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_producer
                kv_load_failure_policy: fail
              enforce_eager: true
              tensor_parallel_size: 8
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5557
              VLLM_NIXL_SIDE_CHANNEL_HOST: $PREFILL_NODE_1
              SAFETENSORS_FAST_GPU: 1
          - role: decode  # D1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: moonshotai/Kimi-K2-Instruct
              trust_remote_code: true
              tokenizer_mode: auto
              port: 8002
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_consumer
                kv_load_failure_policy: fail
              compilation_config:
                cudagraph_mode: FULL_DECODE_ONLY
              tensor_parallel_size: 8
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5558
              VLLM_NIXL_SIDE_CHANNEL_HOST: $DECODE_NODE_1
              SAFETENSORS_FAST_GPU: 1
