# 来源追溯
upstream_sources:
  - id: vllm_recipe_mistral-medium-3.5
    kind: official_recipe
    repo: recipes
    file: models/mistralai/Mistral-Medium-3.5-128B.yaml
    url: "https://recipes.vllm.ai/mistralai/Mistral-Medium-3.5-128B"
    date_updated: 2026-05-26
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Mistral-Medium-3.5  # 模型名称
  slug: mistral-medium-3.5  # 模型标识
  provider: Mistral AI  # 提供者/厂商
  description: Mistral Medium 3.5 (128B) dense vision-language model with native FP8 weights and 256K context  # 模型描述
  model_id: mistralai/Mistral-Medium-3.5-128B  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 128B  # 总参数量
  active_parameters: 128B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 154  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.18.0"  # 最低引擎版本要求
  date_updated: 2026-05-26  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)mistral[-.]?medium[-.]?3.5"
  variant_name: Mistral-Medium-3.5-128B-fp8

# 硬件信息
hardware_profile:
  gpu_count: 4
  vram_gb: 1152
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Mistral tool-call parser with automatic tool choice
    args: [--enable-auto-tool-choice, --tool-call-parser, mistral]
  reasoning:
    description: "Mistral reasoning parser extracts [THINK]...[/THINK] into message.reasoning (emitted when reasoning_effort='high')"
    args: [--reasoning-parser, mistral]
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only.
    args: [--mm-encoder-tp-mode, data]
  spec_decoding:
    description: EAGLE speculative decoding via mistralai/Mistral-Medium-3.5-128B-EAGLE draft head
    args: [--speculative-config, "{\"model\":\"mistralai/Mistral-Medium-3.5-128B-EAGLE\",\"num_speculative_tokens\":3,\"method\":\"eagle\",\"max_model_len\":\"65536\"}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_mistral-medium-3.5#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: mistralai/Mistral-Medium-3.5-128B
          tokenizer_mode: mistral
          config_format: mistral
          load_format: mistral
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_mistral-medium-3.5#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: mistralai/Mistral-Medium-3.5-128B
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: mistralai/Mistral-Medium-3.5-128B
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 8
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
