# 来源追溯
upstream_sources:
  - id: vllm_qwq-32b_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/Qwen/QwQ-32B"
    date_updated: 2026-07-24
    note: 用户提供 vLLM OpenAI API Server 启动命令，手工录入。

# 模型基本信息
model:
  name: QwQ-32B  # 模型名称
  slug: qwq-32b  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: "QwQ-32B dense 推理模型，面向复杂推理任务。"  # 模型描述
  model_id: Qwen/QwQ-32B  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 32B
  active_parameters: 32B
  context_length: 131072
  vram_minimum_gb: 96  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-07-24  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)QwQ[-.]?32B"
  variant_name: QwQ-32B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 2  # 单节点 GPU 数量
  vram_gb: 96  # 单节点总显存(GB)（2 × 48GB）
  multi_node: true  # 支持单节点及多节点场景

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_qwq-32b_manual#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: Qwen/QwQ-32B
          trust_remote_code: true
          max_model_len: 4096
          host: 0.0.0.0
          port: 17000
          tensor_parallel_size: 2
        env: {}

  multi_node:
    source_ref: vllm_qwq-32b_manual#multi_node_tp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:
          engine_config:
            model: Qwen/QwQ-32B
            trust_remote_code: true
            max_model_len: 4096
            host: 0.0.0.0
            port: 17000
            tensor_parallel_size: 4
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:
          engine_config:
            model: Qwen/QwQ-32B
            trust_remote_code: true
            max_model_len: 4096
            host: 0.0.0.0
            port: 17000
            tensor_parallel_size: 4
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
