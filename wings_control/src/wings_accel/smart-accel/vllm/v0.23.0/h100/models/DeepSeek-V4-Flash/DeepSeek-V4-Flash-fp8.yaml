# SmartAccel 加速配置(decoding=mtp)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# 由 features.spec_decoding 自动生成;仅 decoding,无 kv_offload/sparse。
model:
  name: DeepSeek-V4-Flash
  variant_name: "DeepSeek-V4-Flash-fp8"
  match:
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?flash"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: mtp
          cli_params:
            speculative_config:
              method: mtp
              num_speculative_tokens: 1
          envs: {}
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: mtp
          cli_params:
            speculative_config:
              method: mtp
              num_speculative_tokens: 1
          envs: {}
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: decode
          index: 0
          decoding:
          - name: mtp
            cli_params:
              speculative_config:
                method: mtp
                num_speculative_tokens: 1
            envs: {}
