# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwen3guard-gen-8b_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/Qwen/Qwen3Guard-Gen-8B"
    note: 用户提供 vLLM Ascend 启动命令，手工录入。

# 模型基本信息
model:
  name: Qwen3Guard-Gen-8B  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3Guard-Gen-8B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3guard[-.]?gen[-.]?8b"
  variant_name: Qwen3Guard-Gen-8B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen3guard-gen-8b_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Qwen/Qwen3Guard-Gen-8B
          max_model_len: 32768
          gpu_memory_utilization: 0.9
          data_parallel_size: 1
          tensor_parallel_size: 8
          port: 18000
        env: {}
