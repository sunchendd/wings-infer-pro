# 来源追溯
upstream_sources:
  - id: sglang_deepseek-v3.2
    kind: official_doc
    repo: sglang
    file: docs/basic_usage/deepseek_v32.md
    url: "https://github.com/sgl-project/sglang/blob/main/docs/basic_usage/deepseek_v32.md"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: DeepSeek-V3.2-Exp  # 模型名称
  provider: deepseek-ai  # 提供者/厂商
  model_id: deepseek-ai/DeepSeek-V3.2-Exp  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.10  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)deepseek[-.]?v3.2"
  variant_name: DeepSeek-V3.2-Exp  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1536  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, deepseekv31, --chat-template, ./examples/chat_template/tool_chat_template_deepseekv32.jinja]
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, deepseek-v3]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_deepseek-v3.2#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: deepseek-ai/DeepSeek-V3.2-Exp
          model_path: deepseek-ai/DeepSeek-V3.2-Exp
          trust_remote_code: true
          tp_size: 8
          dp_size: 8
          enable_dp_attention: true
        env: {}
        default_strategy: true
