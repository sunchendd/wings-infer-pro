# Mooncake client 环境变量默认值(wings-control 侧唯一集中定义)。
#
# 链路:wings-control 加载本文件作默认值层 → MaaS 下发 env 覆盖(同名)→ 渲染成
# 同目录 client.env(export XXX=xxx 形式)→ engine 侧 pre-serve 段 source
# client.env 后再执行 creat_mooncake_json.sh / start_mooncake_store.sh。
#
# 变量在实际 engine Pod 内执行(不在 wings-control 容器内),所以必须经
# client.env 显式传递。
#
# 与平台下发的 MaaS env **同名透传**(不派生中间名):
#   - ENABLE_KV_OFFLOAD / ENABLE_DISTRIBUTED_KV_OFFLOAD:并列且互斥的两套卸载方案
#     一级开关(本地 KV 卸载 vs Mooncake 分布式 KV);
#   - ENABLE_KV_MEM_OFFLOAD / ENABLE_KV_DISK_OFFLOAD:各方案内的介质二级开关;
#   - KV_MEM_OFFLOAD_SIZE / KV_DISK_OFFLOAD_SIZE:容量,GB;
#   - KV_DISK_OFFLOAD_PATH:磁盘卸载落盘路径;
#   - KV_PROTOCOL:传输协议(rdma/tcp/ascend);
#   - SERVING_CONFIG_ID:拼 mooncake-service-${SERVING_CONFIG_ID}
#     得 metadata-server 与 master-server(端口写死在脚本里:10080/50051)。
ENABLE_KV_OFFLOAD: "false"
ENABLE_DISTRIBUTED_KV_OFFLOAD: "false"
ENABLE_KV_DISK_OFFLOAD: "false"
ENABLE_KV_MEM_OFFLOAD: "false"
KV_DISK_OFFLOAD_PATH: /mnt/kvcache_offload
KV_DISK_OFFLOAD_SIZE: "11"
KV_MEM_OFFLOAD_SIZE: "11"
KV_LOCAL_BUFFER_SIZE: "4G"
KV_PROTOCOL: "rdma"
SERVING_CONFIG_ID: ""
MOONCAKE_CONFIG_PATH: "/shared-volume/mooncake/mooncake.json"

# master 拉起配置(engine 层执行,经 master.env 透传):
MOONCAKE_MASTER_PORT: "50051"
MOONCAKE_MASTER_EVICTION_HIGH_WATERMARK_RATIO: "0.9"
MOONCAKE_MASTER_EVICTION_RATIO: "0.1"
MOONCAKE_MASTER_DEFAULT_KV_LEASE_TTL: "11000"
MOONCAKE_MASTER_LOG_PATH: /var/log/wings
