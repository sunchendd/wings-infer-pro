# 来源追溯
upstream_sources:
  - id: sglang_qwen3.5
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Qwen/Qwen3.5.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Qwen/Qwen3.5.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen3.5  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3.5-397B-A17B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: (?i)qwen3.5
  variant_name: Qwen3.5  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, qwen3_coder]
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, qwen3]
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algo, NEXTN, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen3.5#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: Qwen/Qwen3.5-397B-A17B
          model_path: Qwen/Qwen3.5-397B-A17B
          tp: 8
          mem_fraction_static: 0.8
          host: "0.0.0.0"
          port: 30000
        env: {}
        default_strategy: true
