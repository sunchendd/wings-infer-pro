# 来源追溯
upstream_sources:
  - id: sglang_gpt-oss
    kind: official_doc
    repo: sglang
    file: docs/basic_usage/gpt_oss.md
    url: "https://github.com/sgl-project/sglang/blob/main/docs/basic_usage/gpt_oss.md"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: gpt-oss-120b  # 模型名称
  provider: openai  # 提供者/厂商
  model_id: openai/gpt-oss-120b  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.10  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)gpt[-.]?oss"
  variant_name: gpt-oss-120b  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 640  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_gpt-oss#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          tool_server: "ip-1:port-1,ip-2:port-2"
        env: {}
        system_setup:
          commands: ["mcp run -t sse browser_server.py:mcp", "mcp run -t sse python_server.py:mcp"]
        default_strategy: true
