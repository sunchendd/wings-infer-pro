# 来源追溯
upstream_sources:
  - id: vllm_ascend_glm-5
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/GLM5.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.21.0rc/docs/source/tutorials/models/GLM5.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: GLM-5  # 模型名称
  provider: Eco-Tech  # 提供者/厂商
  model_id: Eco-Tech/GLM-5-w4a8  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?5"
  variant_name: GLM-5-w4a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"num_speculative_tokens\":3,\"method\":\"deepseek_mtp\"}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_glm-5#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: /root/.cache/modelscope/hub/models/vllm-ascend/GLM5-w4a8
          host: "0.0.0.0"
          port: 8077
          data_parallel_size: 1
          tensor_parallel_size: 16
          enable_expert_parallel: true
          seed: 1024
          served_model_name: glm-5
          max_num_seqs: 8
          max_model_len: 200000
          max_num_batched_tokens: 4096
          trust_remote_code: true
          gpu_memory_utilization: 0.95
          quantization: ascend
          enable_chunked_prefill: true
          enable_prefix_caching: true
          additional_config:
            fuse_muls_add: true
            multistream_overlap_shared_expert: true
            ascend_compilation_config:
              enable_npugraph_ex: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
        env:
          HCCL_OP_EXPANSION_MODE: AIV
          OMP_PROC_BIND: "false"
          OMP_NUM_THREADS: 1
          HCCL_BUFFSIZE: 200
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          VLLM_ASCEND_BALANCE_SCHEDULING: 1
          VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
