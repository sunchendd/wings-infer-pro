model:
  name: DeepSeek-R1-Distill-Qwen-1.5B
  variant_name: "DeepSeek-R1-Distill-Qwen-1.5B"
  match:
    - name_pattern: "(?i)DeepSeek[-.]?R1[-.]?Distill[-.]?Qwen[-.]?1[-.]?5B"
smart_accel:
  standalone:
    source_ref: "vllm_deepseek-r1-distill-qwen-1.5b_manual#single_node_tp"
    match: {distributed: false, pd_role: null}
    strategies:
      single_node_tp:
        default_strategy: true
        distributed_kv_offload:
          - name: mooncake_standalone_store
            client:
              rpc_port: 50052
              master_rpc_port: 50051
              metadata_port: 10080
              metadata_path: /metadata
              device_names: ""
            cli_params:
              kv_transfer_config:
                kv_connector: MooncakeStoreConnector
                kv_role: kv_both
                kv_load_failure_policy: recompute
            envs: {}
  multi_node:
    source_ref: "vllm_deepseek-r1-distill-qwen-1.5b_manual#multi_node_dp"
    match: {distributed: true, pd_role: null}
    strategies:
      multi_node_dp:
        default_strategy: true
        distributed_kv_offload:
          - name: mooncake_standalone_store
            client:
              rpc_port: 50052
              master_rpc_port: 50051
              metadata_port: 10080
              metadata_path: /metadata
              device_names: ""
            cli_params:
              kv_transfer_config:
                kv_connector: MooncakeStoreConnector
                kv_role: kv_both
                kv_load_failure_policy: recompute
            envs: {}
