# 来源追溯
upstream_sources:
  - id: vllm_ascend_deepseek-r1-distill-qwen-1.5b_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B"
    date_updated: 2026-10-19
    note: 基于 vLLM-Ascend v0.23.0 Ascend A2 部署约定及 vLLM L20 同名 demo 模型配置整理。

# 模型基本信息
model:
  name: DeepSeek-R1-Distill-Qwen-1.5B
  slug: deepseek-r1-distill-qwen-1.5b
  provider: DeepSeek
  description: "DeepSeek-R1 蒸馏到 Qwen 1.5B 的 dense 推理模型。"
  model_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
  model_path: null
  architecture: dense
  parameter_count: 1.5B
  active_parameters: 1.5B
  context_length: 131072
  vram_minimum_gb: 8
  tasks:
    - text
  min_engine_version: v0.23.0
  match:
    - name_pattern: "(?i)deepseek[-.]?r1[-.]?distill[-.]?qwen[-.]?1[-.]?5b"
  variant_name: DeepSeek-R1-Distill-Qwen-1.5B

# 硬件信息
hardware_profile:
  name: ascend-a2
  display_name: Ascend A2
  gpu_count: 8
  vram_gb: 512
  multi_node: true

# 部署场景
scenarios:
  standalone:
    source_ref: vllm_ascend_deepseek-r1-distill-qwen-1.5b_manual#single_node
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Standalone
        orientation: latency
        default_strategy: true
        engine_config:
          model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
          trust_remote_code: true
          max_model_len: 4096
          host: 0.0.0.0
          port: 17000
          served_model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
          tensor_parallel_size: 1
        env:
          HCCL_IF_IP: $local_ip
          GLOO_SOCKET_IFNAME: $nic_name
          TP_SOCKET_IFNAME: $nic_name
          HCCL_SOCKET_IFNAME: $nic_name
          HCCL_INTRA_ROCE_ENABLE: 1
          HCCL_OP_EXPANSION_MODE: AIV
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"

  multi_node:
    source_ref: vllm_ascend_deepseek-r1-distill-qwen-1.5b_manual#multi_node_dp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        display_name: Multi-Node Data Parallel
        orientation: throughput
        default_strategy: true
        head:
          engine_config:
            model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
            trust_remote_code: true
            max_model_len: 4096
            host: 0.0.0.0
            port: 17000
            served_model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
            tensor_parallel_size: 1
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: $HEAD_IP
            data_parallel_rpc_port: 13389
          env:
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            HCCL_INTRA_ROCE_ENABLE: 1
            HCCL_OP_EXPANSION_MODE: AIV
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
        worker:
          engine_config:
            model: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
            trust_remote_code: true
            max_model_len: 4096
            host: 0.0.0.0
            port: 17000
            served_model_name: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
            tensor_parallel_size: 1
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: $HEAD_IP
            data_parallel_rpc_port: 13389
            headless: true
          env:
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            HCCL_INTRA_ROCE_ENABLE: 1
            HCCL_OP_EXPANSION_MODE: AIV
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
