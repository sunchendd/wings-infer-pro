# SmartAccel 加速配置(decoding=ernie_mtp [no_model])
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# 由 features.spec_decoding 自动生成;仅 decoding,无 kv_offload/sparse。
model:
  name: ERNIE-4.5
  variant_name: "ERNIE-4.5-21B-A3B-PT-bf16"
  match:
    - name_pattern: "(?i)ernie[-.]?4.5"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: ernie_mtp
          cli_params:
            speculative_config:
              method: ernie_mtp
              num_speculative_tokens: 1
          envs: {}
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: ernie_mtp
          cli_params:
            speculative_config:
              method: ernie_mtp
              num_speculative_tokens: 1
          envs: {}
