# 来源追溯
upstream_sources:
  - id: vllm_ascend_glm-4.7
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/GLM4.x.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.18.0/docs/source/tutorials/models/GLM4.x.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: GLM-4.7  # 模型名称
  provider: zai-org  # 提供者/厂商
  model_id: zai-org/GLM-4.7  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.18.0  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?4.7"
  variant_name: GLM-4.7-W8A8-floatmtp  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool/function calling via the model's tool-call parser.
    args: [--enable-auto-tool-choice, --tool-call-parser, glm47]
  reasoning:
    description: Enable the model's reasoning-content parser.
    args: [--reasoning-parser, glm45]
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"num_speculative_tokens\":3,\"method\":\"mtp\"}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_glm-4.7#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Eco-Tech/GLM-4.7-W8A8-floatmtp
          data_parallel_size: 2
          tensor_parallel_size: 8
          enable_expert_parallel: true
          seed: 1024
          served_model_name: glm
          max_model_len: 133000
          max_num_batched_tokens: 8192
          max_num_seqs: 16
          async_scheduling: true
          quantization: ascend
          trust_remote_code: true
          gpu_memory_utilization: 0.9
          compilation_config:
            cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
            cudagraph_mode: FULL_DECODE_ONLY
          additional_config:
            enable_shared_expert_dp: true
            ascend_fusion_config:
              fusion_ops_gmmswigluquant: false
        env:
          HCCL_BUFFSIZE: 512
          OMP_PROC_BIND: "false"
          OMP_NUM_THREADS: 1
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          HCCL_OP_EXPANSION_MODE: AIV
          VLLM_ASCEND_BALANCE_SCHEDULING: 1
          VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE: 1
  multi_node:
    source_ref: "vllm_ascend_glm-4.7#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        nodes:
          - role: head
            engine_config:
              model: Eco-Tech/GLM-4.7-W8A8-floatmtp
              host: "0.0.0.0"
              port: 8004
              data_parallel_size: 2
              data_parallel_size_local: 1
              data_parallel_start_rank: 0
              data_parallel_address: $local_ip
              data_parallel_rpc_port: 13389
              tensor_parallel_size: 8
              enable_expert_parallel: true
              seed: 1024
              max_model_len: 140000
              max_num_batched_tokens: 8192
              max_num_seqs: 16
              async_scheduling: true
              quantization: ascend
              trust_remote_code: true
              gpu_memory_utilization: 0.9
              served_model_name: glm47
              compilation_config:
                cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
                cudagraph_mode: FULL_DECODE_ONLY
              additional_config:
                enable_shared_expert_dp: true
                ascend_fusion_config:
                  fusion_ops_gmmswigluquant: false
            env:
              HCCL_IF_IP: $local_ip
              GLOO_SOCKET_IFNAME: $nic_name
              TP_SOCKET_IFNAME: $nic_name
              HCCL_SOCKET_IFNAME: $nic_name
              HCCL_BUFFSIZE: 512
              OMP_PROC_BIND: "false"
              OMP_NUM_THREADS: 1
              PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
              HCCL_OP_EXPANSION_MODE: AIV
              VLLM_ASCEND_BALANCE_SCHEDULING: 1
              VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE: 1
            system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
              commands: ["nic_name=\"xxxx\"", "local_ip=\"xxxx\""]
          - role: worker
            engine_config:
              model: Eco-Tech/GLM-4.7-W8A8-floatmtp
              host: "0.0.0.0"
              port: 8004
              headless: true
              data_parallel_size: 2
              data_parallel_size_local: 1
              data_parallel_start_rank: 1
              data_parallel_address: $node0_ip
              data_parallel_rpc_port: 13389
              tensor_parallel_size: 8
              enable_expert_parallel: true
              seed: 1024
              max_model_len: 140000
              max_num_batched_tokens: 8192
              max_num_seqs: 16
              async_scheduling: true
              quantization: ascend
              trust_remote_code: true
              gpu_memory_utilization: 0.9
              served_model_name: glm47
              compilation_config:
                cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512]
                cudagraph_mode: FULL_DECODE_ONLY
              additional_config:
                enable_shared_expert_dp: true
                ascend_fusion_config:
                  fusion_ops_gmmswigluquant: false
            env:
              HCCL_IF_IP: $local_ip
              GLOO_SOCKET_IFNAME: $nic_name
              TP_SOCKET_IFNAME: $nic_name
              HCCL_SOCKET_IFNAME: $nic_name
              HCCL_BUFFSIZE: 512
              OMP_PROC_BIND: "false"
              OMP_NUM_THREADS: 1
              PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
              HCCL_OP_EXPANSION_MODE: AIV
              VLLM_ASCEND_BALANCE_SCHEDULING: 1
              VLLM_ASCEND_ENABLE_TOPK_OPTIMIZE: 1
            system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
              commands: ["nic_name=\"xxxx\"", "local_ip=\"xxxx\"", "node0_ip=\"xxxx\" # same as the local_IP address in node 0"]
