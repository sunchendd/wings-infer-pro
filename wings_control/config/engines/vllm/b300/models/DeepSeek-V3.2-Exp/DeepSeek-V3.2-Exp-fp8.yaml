# 来源追溯
upstream_sources:
  - id: vllm_recipe_deepseek-v3.2-exp
    kind: official_recipe
    repo: recipes
    file: models/deepseek-ai/DeepSeek-V3.2-Exp.yaml
    url: "https://recipes.vllm.ai/deepseek-ai/DeepSeek-V3.2-Exp"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: DeepSeek-V3.2-Exp  # 模型名称
  slug: deepseek-v3.2-exp  # 模型标识
  provider: DeepSeek  # 提供者/厂商
  description: Experimental DeepSeek-V3.2 preview with sparse attention (MQA-like logits) and FP8 KV cache; architecture matches DeepSeek-V3.1 except for the sparse attention mechanism.  # 模型描述
  model_id: deepseek-ai/DeepSeek-V3.2-Exp  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 671B  # 总参数量
  active_parameters: 37B  # 激活参数量（MoE 模型）
  context_length: 163840  # 最大上下文长度
  vram_minimum_gb: 805  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.12.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)deepseek[-.]?v3.2[-.]?exp"
  variant_name: DeepSeek-V3.2-Exp-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2144
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Enable tool calling with DeepSeek V3.2 chat template support.
    args: [--tokenizer-mode, deepseek_v32, --tool-call-parser, deepseek_v32, --enable-auto-tool-choice]
  reasoning:
    description: "Dynamic thinking mode via chat_template_kwargs, same as DeepSeek-V3.1."
    args: [--reasoning-parser, deepseek_v3]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_deepseek-v3.2-exp#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: deepseek-ai/DeepSeek-V3.2-Exp
          trust_remote_code: true
          enable_expert_parallel: true
          data_parallel_size: 8
        env: {}
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: deepseek-ai/DeepSeek-V3.2-Exp
          trust_remote_code: true
          enable_expert_parallel: true
          tensor_parallel_size: 8
        env: {}
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: deepseek-ai/DeepSeek-V3.2-Exp
          trust_remote_code: true
          tensor_parallel_size: 8
        env: {}
  multi_node:
    source_ref: "vllm_recipe_deepseek-v3.2-exp#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2-Exp
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2-Exp
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2-Exp
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2-Exp
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2-Exp
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2-Exp
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2-Exp
            trust_remote_code: true
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2-Exp
            trust_remote_code: true
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
