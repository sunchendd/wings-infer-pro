# SmartAccel asset derived from the validated dual-node launch command and the
# official A3 single-node colocated recipe. The colocated standalone recipe
# runs without speculative decoding, so its strategy stays a no-op.
model:
  name: DeepSeek-V4.1-Flash
  variant_name: "DeepSeek-V4.1-Flash-w8a8"
  match:
    - name_pattern: '(?i)^deepseek-v4\.1-flash-w8a8$'
smart_accel:
  standalone:
    source_ref: "vllm_ascend_deepseek_v41_flash_a3_official#single_node_colocated"
    match: {distributed: false, pd_role: null}
    strategies:
      single_node:
        default_strategy: true
  multi_node:
    source_ref: "vllm_ascend_deepseek_v41_flash_w8a8_manual#multi_node"
    match: {distributed: true, pd_role: null}
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
          - name: dspark
            cli_params:
              speculative_config:
                method: dspark
                num_speculative_tokens: 6
                enforce_eager: true
            envs: {}
