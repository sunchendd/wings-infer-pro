# 模型基本信息
model:
  name: Qwen3-ASR-1.7B  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3-ASR-1.7B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?asr[-.]?1.7b"
  variant_name: Qwen3-ASR-1.7B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen3-asr-1.7b#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: "Qwen/Qwen3-ASR-1.7B"
          tensor_parallel_size: 1
          max_model_len: 4096
          gpu_memory_utilization: 0.9
          enforce_eager: true
          port: 8000
        env: {}
