# vLLM 0.31.0 / RTX PRO 5000 72GB unified recipe and SmartAccel.
schema: v2
profile:
  engine: vllm
  version: v0.31.0
  hardware:
  - RTX-PRO-5000-72GB-Blackwell_72G
  model: MiniMax-M3-mxfp8
upstream_sources:
- id: minimax_m3_vllm0280_sm120_tp4dp2
  kind: manual
  repo: null
  file: minimax_m3/8_perf_start_minimax.sh
  url: https://huggingface.co/MiniMaxAI/MiniMax-M3-MXFP8
  note: MiniMax-M3-MXFP8 vLLM 0.28.0 单机 8 卡 TP4×DP2×EP 实测容量配置。
model:
  name: MiniMax-M3
  slug: minimax-m3
  provider: MiniMax
  description: MiniMax-M3 MoE language model using the MXFP8 checkpoint.
  model_id: MiniMaxAI/MiniMax-M3-MXFP8
  architecture: moe
  parameter_count: 428B
  active_parameters: 23B
  context_length: 1048576
  vram_minimum_gb: 384
  tasks:
  - text
  min_engine_version: 0.31.0
  match:
  - name_pattern: (?i)minimax[-.]?m3[-.]?mxfp8
  variant_name: MiniMax-M3-mxfp8
hardware_profile:
  gpu_count: 8
  vram_gb: 576
  multi_node: false
features:
  tool_calling:
    description: Enable MiniMax M3 tool parsing with automatic tool choice.
    args:
    - --tool-call-parser
    - minimax_m3
    - --enable-auto-tool-choice
  reasoning:
    description: Enable MiniMax M3 reasoning parsing.
    args:
    - --reasoning-parser
    - minimax_m3
  sparse_index:
    description: Enable cross-layer sparse index caching for MiniMax M3.
    args:
    - --hf-overrides
    - '{"use_index_cache":true,"index_topk_freq":4}'
scenarios:
  standalone:
    source_ref: minimax_m3_vllm0280_sm120_tp4dp2#single_node_dep
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Tensor + Data + Expert Parallel
        orientation: throughput
        default_strategy: true
        engine_config:
          model: MiniMaxAI/MiniMax-M3-MXFP8
          host: 0.0.0.0
          port: 8001
          tensor_parallel_size: 4
          pipeline_parallel_size: 1
          data_parallel_size: 2
          enable_expert_parallel: true
          language_model_only: true
          max_model_len: auto
          max_num_seqs: 128
          max_num_batched_tokens: 4096
          gpu_memory_utilization: 0.97
          kv_cache_dtype: fp8
          attention_backend: B12X
          block_size: 128
          compilation_config:
            mode: 0
            cudagraph_mode: FULL_DECODE_ONLY
            max_cudagraph_capture_size: 128
          kernel_config:
            enable_cutedsl_warmup: false
            enable_flashinfer_autotune: false
            enable_jit_warmup: false
        env:
          NCCL_P2P_LEVEL: SYS
          NCCL_SHM_DISABLE: 1
  multi_node:
    source_ref: minimax_m3_mxfp8_manual#multi_node_tp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:
          engine_config:
            model: MiniMaxAI/MiniMax-M3-MXFP8
            host: 0.0.0.0
            port: 16000
            block_size: 128
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            max_model_len: 80000
            gpu_memory_utilization: 0.95
            model_loader_extra_config:
              enable_multithread_load: 'true'
              num_threads: 128
            trust_remote_code: true
          env:
            PYTHONHASHSEED: '0'
            NCCL_P2P_LEVEL: SYS
            NCCL_SHM_DISABLE: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:
          engine_config:
            model: MiniMaxAI/MiniMax-M3-MXFP8
            host: 0.0.0.0
            port: 16000
            block_size: 128
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            max_model_len: 80000
            gpu_memory_utilization: 0.95
            model_loader_extra_config:
              enable_multithread_load: 'true'
              num_threads: 128
            trust_remote_code: true
          env:
            PYTHONHASHSEED: '0'
            NCCL_P2P_LEVEL: SYS
            NCCL_SHM_DISABLE: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
smart_accel:
  standalone:
    source_ref: minimax_m3_vllm0280_sm120_tp4dp2#single_node_dep
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: suffix
          cli_params:
            speculative_config:
              method: suffix
              num_speculative_tokens: 32
          envs:
            ARCTIC_INFERENCE_ENABLED: '0'
          packages:
            arctic-inference: 0.1.1
        kv_offload:
        - name: cpu
          cli_params:
            kv_offloading_backend: native
            kv_offloading_size: '{memory_capacity_gb}'
          envs: {}
        sparse:
        - name: performance_first
          packages:
            b12x: v1.5.0
          cli_params:
            kv_cache_dtype: fp8
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          packages:
            b12x: v1.5.0
          cli_params:
            kv_cache_dtype: fp8
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
  multi_node:
    source_ref: minimax_m3_mxfp8_manual#multi_node_tp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        default_strategy: true
        sparse:
        - name: performance_first
          packages:
            b12x: v1.5.0
          cli_params:
            kv_cache_dtype: fp8
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          packages:
            b12x: v1.5.0
          cli_params:
            kv_cache_dtype: fp8
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
        decoding:
        - name: suffix
          cli_params:
            speculative_config:
              method: suffix
              num_speculative_tokens: 32
          envs:
            ARCTIC_INFERENCE_ENABLED: '0'
          packages:
            arctic-inference: 0.1.1
        kv_offload:
        - name: cpu
          cli_params:
            kv_offloading_backend: native
            kv_offloading_size: '{memory_capacity_gb}'
          envs: {}
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: decode
          index: 0
          decoding:
          - name: suffix
            cli_params:
              speculative_config:
                method: suffix
                num_speculative_tokens: 32
            envs:
              ARCTIC_INFERENCE_ENABLED: '0'
            packages:
              arctic-inference: 0.1.1
