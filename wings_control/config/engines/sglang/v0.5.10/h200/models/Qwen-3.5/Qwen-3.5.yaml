# 来源追溯
upstream_sources:
  - id: sglang_qwen-3.5
    kind: official_doc
    repo: sglang
    file: docs/basic_usage/qwen3_5.md
    url: "https://github.com/sgl-project/sglang/blob/main/docs/basic_usage/qwen3_5.md"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen3.5-397B-A17B  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3.5-397B-A17B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.10  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen[-.]?3.5"
  variant_name: Qwen3.5-397B-A17B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen-3.5#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: Qwen/Qwen3.5-397B-A17B
          model_path: Qwen/Qwen3.5-397B-A17B
          tp: 8
          trust_remote_code: true
        env: {}
        default_strategy: true
