# 来源追溯
upstream_sources:
  - id: glm_5_fp8_manual
    kind: manual
    repo: null
    file: null
    url: "https://recipes.vllm.ai/zai-org/GLM-5"
    date_updated: 2026-07-10
    note: 手工录入

# 模型基本信息
model:
  name: GLM-5
  slug: glm-5
  provider: GLM (Z-AI)
  description: "GLM-5 frontier-scale MoE language model (~744B total parameters, 28.5T training tokens) native FP8 checkpoint"
  model_id: zai-org/GLM-5-FP8
  architecture: moe
  parameter_count: 744B
  active_parameters: 40B
  context_length: 202752
  vram_minimum_gb: 893
  tasks: [text]
  min_engine_version: "0.23.0"
  date_updated: 2026-07-10
  match:
    - name_pattern: "(?i)glm[-.]?5"
  variant_name: GLM-5-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 768
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: GLM-4.7 tool call parser with automatic tool choice
    args: [--tool-call-parser, glm47, --enable-auto-tool-choice]
  reasoning:
    description: GLM-4.5 reasoning parser — thinking mode enabled by default on requests
    args: [--reasoning-parser, glm45]
  kv_offloading:
    description: KV cache native offloading to reduce GPU memory usage
    args: [--kv-offloading-backend, native, --kv-offloading-size, 200]
  spec_decoding:
    description: Multi-Token Prediction speculative decoding (3 draft tokens)
    args: [--speculative-config.method, mtp, --speculative-config.num_speculative_tokens, 3]

# 部署场景
scenarios:
  multi_node:
    source_ref: "glm_5_fp8_manual#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: zai-org/GLM-5-FP8
            trust_remote_code: true
            chat_template_content_format: string
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: zai-org/GLM-5-FP8
            trust_remote_code: true
            chat_template_content_format: string
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
