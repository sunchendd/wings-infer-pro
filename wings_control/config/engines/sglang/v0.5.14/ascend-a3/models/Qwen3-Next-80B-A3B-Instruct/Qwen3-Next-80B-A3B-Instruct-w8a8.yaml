# 来源追溯
upstream_sources:
  - id: sglang_qwen3-next-80b-a3b-instruct
    kind: official_doc
    repo: sglang
    file: docs_new/docs/hardware-platforms/ascend-npus/best_practice/qwen3_next_80b_a3b_instruct.mdx
    url: "https://github.com/sgl-project/sglang/blob/v0.5.14/docs_new/docs/hardware-platforms/ascend-npus/best_practice/qwen3_next_80b_a3b_instruct.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen3-Next-80B-A3B-Instruct  # 模型名称
  provider: ""  # 提供者/厂商
  model_id: Qwen3-Next-80B-A3B-Instruct  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?next[-.]?80b[-.]?a3b[-.]?instruct"
  variant_name: Qwen3-Next-80B-A3B-Instruct-w8a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algorithm, NEXTN, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4, --speculative-draft-model-quantization, unquant, --speculative-draft-model-path, $DRAFT_MODEL_PATH]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen3-next-80b-a3b-instruct#single_node_pd-mixed_low_latency"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_pd-mixed_low_latency:
        display_name: Qwen3-Next-80B-A3B-Instruct W8A8 2P IN3K5 OUT1K5 20ms
        orientation: latency
        default_strategy: true
        engine_config:
          model: $MODEL_PATH
          model_path: $MODEL_PATH
          host: "0.0.0.0"
          port: 6688
          trust_remote_code: true
          attention_backend: ascend
          device: npu
          quantization: modelslim
          page_size: 128
          tp_size: 2
          watchdog_timeout: 9000
          mem_fraction_static: 0.85
          disable_radix_cache: true
          max_prefill_tokens: 28672
          context_length: 26384
          max_total_tokens: 122304
          chunked_prefill_size: -1
          max_running_requests: 2
          cuda_graph_bs: 2
          mamba_ssm_dtype: bfloat16
        env:
          ASCEND_USE_FIA: 1
          DEEPEP_NORMAL_LONG_SEQ_PER_ROUND_TOKENS: 2048
          DEEPEP_NORMAL_LONG_SEQ_ROUND: 10
          FORCE_DRAFT_MODEL_NON_QUANT: 1
          GLOO_SOCKET_IFNAME: "<network-interface>"
          HCCL_BUFFSIZE: 2000
          HCCL_OP_EXPANSION_MODE: AIV
          HCCL_SOCKET_IFNAME: "<network-interface>"
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: 400
          SGLANG_ENABLE_OVERLAP_PLAN_STREAM: 1
          SGLANG_ENABLE_SPEC_V2: 1
          SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: 0
          SGLANG_NPU_USE_MULTI_STREAM: 0
          SGLANG_SET_CPU_AFFINITY: 1
          SGLANG_WARMUP_TIMEOUT: 3600
          STREAMS_PER_DEVICE: 32
          TASK_QUEUE_ENABLE: 1
          ZBCCL_BOOTSTRAP_URL: "tcp://127.0.0.1:24669"
          ZBCCL_ENABLE_GRAPH: 1
          ZBCCL_LOCAL_MEM_SIZE: 60416
          ZBCCL_NPU_ALLOC_CONF: "use_vmm_for_static_memory:True"
        system_setup:
          sysctls:
            vm.swappiness: 0
            kernel.numa_balancing: 0
            kernel.sched_migration_cost_ns: 50000
          sysfs_writes:
            - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
              value: performance
          commands: [MODEL_PATH=/path/to/model-weights, DRAFT_MODEL_PATH=/path/to/draft-model-weights, unset https_proxy, unset http_proxy, unset HTTPS_PROXY, unset HTTP_PROXY, unset ASCEND_LAUNCH_BLOCKING, source /usr/local/Ascend/ascend-toolkit/set_env.sh, source /usr/local/Ascend/nnal/atb/set_env.sh]
      single_node_pd-mixed_high_throughput:
        display_name: Qwen3-Next-80B-A3B-Instruct W8A8 2P IN3K5 OUT1K5 50ms
        orientation: throughput
        engine_config:
          model: $MODEL_PATH
          model_path: $MODEL_PATH
          host: "0.0.0.0"
          port: 6688
          trust_remote_code: true
          attention_backend: ascend
          device: npu
          quantization: modelslim
          page_size: 128
          tp_size: 4
          watchdog_timeout: 9000
          mem_fraction_static: 0.75
          disable_radix_cache: true
          max_prefill_tokens: 14080
          context_length: 26384
          chunked_prefill_size: -1
          max_running_requests: 300
          mamba_ssm_dtype: bfloat16
          dp_size: 2
          enable_dp_attention: true
          enable_dp_lm_head: true
          moe_a2a_backend: deepep
          deepep_mode: auto
          cuda_graph_bs: 1
        env:
          ASCEND_USE_FIA: 1
          DEEP_NORMAL_MODE_USE_INT8_QUANT: 1
          FORCE_DRAFT_MODEL_NON_QUANT: 1
          GLOO_SOCKET_IFNAME: "<network-interface>"
          HCCL_BUFFSIZE: 64
          HCCL_OP_EXPANSION_MODE: AIV
          HCCL_SOCKET_IFNAME: "<network-interface>"
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: 330
          SGLANG_ENABLE_OVERLAP_PLAN_STREAM: 1
          SGLANG_ENABLE_SPEC_V2: 1
          SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: 0
          SGLANG_NPU_USE_MULTI_STREAM: 0
          SGLANG_SET_CPU_AFFINITY: 1
          SGLANG_WARMUP_TIMEOUT: 3600
          SGLANG_ZBAL_BOOTSTRAP_URL: "tcp://127.0.0.1:24669"
          SGLANG_ZBAL_LOCAL_MEM_SIZE: 59648
          STREAMS_PER_DEVICE: 32
          ZBAL_ENABLE_GRAPH: 1
          ZBAL_HCCL_OP: "allreduce,_allgather_base,allgather,broadcast,scatter,reduce_scatter,_reduce_scatter_base,alltoall_base"
          ZBAL_NPU_ALLOC_CONF: "use_vmm_for_static_memory:True"
        system_setup:
          sysctls:
            vm.swappiness: 0
            kernel.numa_balancing: 0
            kernel.sched_migration_cost_ns: 50000
          sysfs_writes:
            - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
              value: performance
          commands: [MODEL_PATH=/path/to/model-weights, DRAFT_MODEL_PATH=/path/to/draft-model-weights, unset https_proxy, unset http_proxy, unset HTTPS_PROXY, unset HTTP_PROXY, unset ASCEND_LAUNCH_BLOCKING, source /usr/local/Ascend/ascend-toolkit/set_env.sh, source /usr/local/Ascend/nnal/atb/set_env.sh]
