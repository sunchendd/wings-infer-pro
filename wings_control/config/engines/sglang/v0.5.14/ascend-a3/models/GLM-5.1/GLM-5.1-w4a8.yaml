# 来源追溯
upstream_sources:
  - id: sglang_glm-5.1
    kind: official_doc
    repo: sglang
    file: docs_new/docs/hardware-platforms/ascend-npus/best_practice/glm5_1.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/docs/hardware-platforms/ascend-npus/best_practice/glm5_1.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: GLM-5.1  # 模型名称
  provider: ""  # 提供者/厂商
  model_id: GLM-5.1  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?5.1"
  variant_name: GLM-5.1-w4a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-draft-model-quantization, unquant, --speculative-algorithm, NEXTN, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4]
    strategy_overrides:  # 该特性默认用上面的 args；此处仅列出 spec 参数与默认不一致、需按部署场景覆盖的项
      pd_disaggregation.pd_cluster_glm-5-1-w4a8-1p1d-32p-in128k-out1k-20ms:
        args: [--speculative-draft-model-quantization, unquant]
      pd_disaggregation.pd_cluster_glm-5-1-w4a8-1p1d-32p-in64k-out1k-20ms:
        args: [--speculative-draft-model-quantization, unquant]
      pd_disaggregation.pd_cluster_glm-5-1-w4a8-1p1d-32p-in64k-out1k-50ms:
        args: [--speculative-draft-model-quantization, unquant]
      pd_disaggregation.pd_cluster_glm-5-1-w4a8-2p1d-48p-in128k-out1k-prefix90-50ms.prefill0:
        args: [--speculative-draft-model-quantization, unquant]
      pd_disaggregation.pd_cluster_glm-5-1-w4a8-4p1d-48p-in64k-out1k-prefix90-50ms.prefill0:
        args: [--speculative-draft-model-quantization, unquant]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_glm-5.1#single_node_pd-mixed"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_pd-mixed:
        display_name: GLM-5.1 W4A8 16P IN3K5 OUT1K5 50ms
        orientation: throughput
        nodes:
          - role: mixed
            index: 0
            engine_config:
              model: $MODEL_PATH
              model_path: $MODEL_PATH
              host: "${NODE_IPS[$i]}"
              port: 6688
              nnodes: 2
              dist_init_addr: "${NODE_IPS[0]}:5000"
              node_rank: $i
              attention_backend: ascend
              device: npu
              tp_size: 32
              dp_size: 16
              enable_dp_attention: true
              chunked_prefill_size: 65536
              max_prefill_tokens: 280000
              trust_remote_code: true
              mem_fraction_static: 0.65
              served_model_name: glm-5
              cuda_graph_max_bs: 16
              max_running_requests: 256
              quantization: modelslim
              moe_a2a_backend: deepep
              deepep_mode: auto
              load_balance_method: round_robin
            env:
              DEEP_NORMAL_MODE_USE_INT8_QUANT: 1
              GLOO_SOCKET_IFNAME: "<network-interface>"
              HCCL_BUFFSIZE: 2500
              HCCL_SOCKET_IFNAME: "<network-interface>"
              SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: 32
              SGLANG_DISAGGREGATION_BOOTSTRAP_TIMEOUT: 600
              SGLANG_ENABLE_OVERLAP_PLAN_STREAM: 1
              SGLANG_ENABLE_SPEC_V2: 1
              SGLANG_SET_CPU_AFFINITY: 1
              STREAMS_PER_DEVICE: 32
            system_setup:
              sysctls:
                vm.swappiness: 0
                kernel.numa_balancing: 0
                kernel.sched_migration_cost_ns: 50000
              sysfs_writes:
                - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
                  value: performance
              commands: [MODEL_PATH=/path/to/model-weights, "NODE_IPS=('<your node1 ip>' '<your node2 ip>')", unset https_proxy, unset http_proxy, unset HTTPS_PROXY, unset HTTP_PROXY, unset ASCEND_LAUNCH_BLOCKING, source /usr/local/Ascend/ascend-toolkit/set_env.sh, source /usr/local/Ascend/nnal/atb/set_env.sh]
        default_strategy: true
