# SmartAccel 加速配置(ascend:decoding=eagle3 / kv_offload=mooncake)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# KV 存储后端由 yaml 声明、按 connector 内容路由(AscendStoreConnector);本文件内存工具 = mooncake。
# 启用:ENABLE_KV_OFFLOAD + ENABLE_KV_MEM_OFFLOAD + KV_MEM_OFFLOAD_SIZE(MaaS);master pod 内起 daemon。
model:
  name: MiniMax-M2.7
  variant_name: "MiniMax-M2.7-w8a8-QuaRot"
  match:
    - name_pattern: "(?i)minimax[-.]?m2.7"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: eagle3
          requires_model_path: true
          draft_arch:
            - eagle3
          cli_params:
            speculative_config:
              method: eagle3
              model: $path
              num_speculative_tokens: 3
              enforce_eager: true
          envs: {}
        kv_offload:
        - name: cpu
          cli_params:
            kv_transfer_config:
              kv_connector: AscendStoreConnector
              kv_role: kv_both
              kv_load_failure_policy: recompute
              kv_connector_extra_config:
                lookup_rpc_port: '1'
                backend: mooncake
          envs:
            MOONCAKE_CONFIG_PATH: /shared-volume/mooncake.json
            LD_LIBRARY_PATH: /usr/local/lib:${LD_LIBRARY_PATH:-}
          files:
          - path: mooncake.json
            scope: all
            content: |
              {
                "local_hostname": "{rank_ip}",
                "metadata_server": "P2PHANDSHAKE",
                "protocol": "ascend",
                "device_name": "",
                "master_server_address": "{master_ip}:50088",
                "global_segment_size": "{= memory_capacity_gb // gpu_count}GB",
                "preferred_segment": false,
                "prefer_alloc_in_same_node": true
              }
          - path: start_kv_serve.sh
            mode: '0755'
            content: |
              #!/usr/bin/env bash
              # mooncake master daemon(仅 master 节点起;framework 自动 bash <path> &)。
              /usr/local/bin/mooncake_master --port 50088 \
                  --eviction_high_watermark_ratio 0.9 \
                  --eviction_ratio 0.1 \
                  --default_kv_lease_ttl 11000
