# 来源追溯
upstream_sources:
  - id: glm_5.3-flash_fp8_manual
    kind: manual
    repo: null
    file: null
    url: null
    date_updated: 2026-08-31
    note: 用户提供启动命令，手工录入。引擎版本 glm53-flash 为用户确认的 special/custom release，未做 semver 校验。

# 模型基本信息
model:
  name: GLM-5.3-Flash
  slug: glm-5.3-flash
  provider: GLM (Z-AI)
  description: null  # 待补充
  model_id: zai-org/GLM-5.3-Flash
  architecture: null  # 待补充
  parameter_count: null  # 待补充
  active_parameters: null  # 待补充
  context_length: null  # 待补充
  vram_minimum_gb: null  # 待补充
  tasks: [text]
  min_engine_version: "glm53-flash"  # user-confirmed special/custom release，未做 semver 校验
  date_updated: 2026-08-31
  match:
    - name_pattern: "(?i)glm[-.]?5.3[-.]?flash"
  variant_name: GLM-5.3-Flash

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 1128
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: GLM-4.7 tool call parser with automatic tool choice
    args: [--tool-call-parser, glm47, --enable-auto-tool-choice]
  reasoning:
    description: GLM-4.5 reasoning parser — thinking mode enabled by default on requests
    args: [--reasoning-parser, glm45]

# 部署场景
scenarios:
  standalone:
    source_ref: "glm_5.3-flash_fp8_manual#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: zai-org/GLM-5.3-Flash
          host: "0.0.0.0"
          tensor_parallel_size: 8
          max_num_seqs: 512
          no_enable_flashinfer_autotune: true
        env: {}