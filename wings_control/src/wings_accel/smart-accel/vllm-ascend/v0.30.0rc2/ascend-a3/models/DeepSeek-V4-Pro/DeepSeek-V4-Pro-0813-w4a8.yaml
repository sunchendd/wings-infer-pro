# runtime_validated: false
# Dual-910C Mooncake offload reuses the shared mooncake_npu fallback assets.
model:
  name: DeepSeek-V4-Pro
  variant_name: "DeepSeek-V4-Pro-0813-w4a8"
  match:
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?pro[-.]?0813[-.]?w4a8"
smart_accel:
  multi_node:
    source_ref: wings_rc2_xcache_standalone_store_dual_20261017#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        default_strategy: true
        decoding:
        - name: dspark
          cli_params:
            speculative_config:
              method: dspark
              num_speculative_tokens: 5
              enforce_eager: true
          envs: {}
        sparse:
        - name: performance_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          cli_params:
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
        distributed_kv_offload:
        - name: mooncake_standalone_store
          packages:
            xcache_npu: v0.3.12.post1
          runtime: mooncake_npu
          delivery:
            mode: fallback
            envs:
              ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config.listen_port":16666,"comm_resource_config.protocol_desc":["roce:device"]}'
          client:
            rpc_port: 50052
            master_rpc_port: 50051
            metadata_port: 10080
            metadata_path: /metadata
            device_names: ''
          cli_params:
            kv_transfer_config:
              kv_connector: AscendStoreConnector
              kv_role: kv_both
              kv_load_failure_policy: recompute
              kv_connector_extra_config:
                backend: mooncake
                lookup_rpc_port: '0'
                register_buffer: true
                use_layerwise: false
          envs:
            MOONCAKE_GLOBAL_SEGMENT_SIZE: '0'

  pd_disaggregation:
    source_ref: vllm_ascend_deepseek-v4-pro-0813-w4a8#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
          - role: prefill
            index: 0
            sparse:
              - name: performance_first
                cli_params:
                  hf_overrides:
                    use_index_cache: true
                    index_topk_freq: 8
                envs: {}
              - name: accuracy_first
                cli_params:
                  hf_overrides:
                    use_index_cache: true
                    index_topk_freq: 4
                envs: {}
          - role: prefill
            index: 1
            sparse:
              - name: performance_first
                cli_params:
                  hf_overrides:
                    use_index_cache: true
                    index_topk_freq: 8
                envs: {}
              - name: accuracy_first
                cli_params:
                  hf_overrides:
                    use_index_cache: true
                    index_topk_freq: 4
                envs: {}
          - role: decode
            index: 0
            decoding:
              - name: dspark
                cli_params:
                  speculative_config:
                    num_speculative_tokens: 5
                    method: dspark
                    enforce_eager: true
                envs: {}
            sparse:
              - name: performance_first
                cli_params:
                  hf_overrides:
                    use_index_cache: true
                    index_topk_freq: 8
                envs: {}
              - name: accuracy_first
                cli_params:
                  hf_overrides:
                    use_index_cache: true
                    index_topk_freq: 4
                envs: {}
          - role: decode
            index: 1
            decoding:
              - name: dspark
                cli_params:
                  speculative_config:
                    num_speculative_tokens: 5
                    method: dspark
                    enforce_eager: true
                envs: {}
            sparse:
              - name: performance_first
                cli_params:
                  hf_overrides:
                    use_index_cache: true
                    index_topk_freq: 8
                envs: {}
              - name: accuracy_first
                cli_params:
                  hf_overrides:
                    use_index_cache: true
                    index_topk_freq: 4
                envs: {}
