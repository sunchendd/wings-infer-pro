# SmartAccel 加速配置(decoding=draft_model [model_based])
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# 由 features.spec_decoding 自动生成;仅 decoding,无 kv_offload/sparse。
model:
  name: Gemma 4 26B-A4B IT
  variant_name: "gemma-4-26B-A4B-it-fp8"
  match:
    - name_pattern: "(?i)gemma[-.]?4[-.]?26b[-.]?a4b[-.]?it"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: draft_model
          requires_model_path: true
          cli_params:
            speculative_config:
              model: $path
              num_speculative_tokens: 4
          envs: {}
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: draft_model
          requires_model_path: true
          cli_params:
            speculative_config:
              model: $path
              num_speculative_tokens: 4
          envs: {}
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: decode
          index: 0
          decoding:
          - name: draft_model
            requires_model_path: true
            cli_params:
              speculative_config:
                model: $path
                num_speculative_tokens: 4
            envs: {}
