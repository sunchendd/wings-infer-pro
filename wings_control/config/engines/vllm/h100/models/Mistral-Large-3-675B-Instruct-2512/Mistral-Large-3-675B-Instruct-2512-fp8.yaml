# 模型基本信息
model:
  name: Mistral-Large-3-675B-Instruct  # 模型名称
  slug: mistral-large-3-675b-instruct  # 模型标识
  provider: Mistral AI  # 提供者/厂商
  description: Mistral Large 3 (675B) with FP8 and NVFP4 weights for 8xH200 / 4xB200 deployments  # 模型描述
  model_id: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 675B  # 总参数量
  active_parameters: 22B  # 激活参数量（MoE 模型）
  context_length: 294912  # 最大上下文长度
  vram_minimum_gb: 810  # 最低显存需求(GB)
  tasks: [multimodal]  # 支持的任务类型
  min_engine_version: "0.11.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)mistral[-.]?large[-.]?3[-.]?675b[-.]?instruct"
  variant_name: Mistral-Large-3-675B-Instruct-2512-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 640
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Mistral tool-call parser with automatic tool choice
    args: [--enable-auto-tool-choice, --tool-call-parser, mistral]
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only.
    args: [--mm-encoder-tp-mode, data]

# 部署场景
scenarios:
  multi_node:
    source_ref: "vllm_recipe_mistral-large-3-675b-instruct#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            kv_cache_dtype: fp8
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            kv_cache_dtype: fp8
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            kv_cache_dtype: fp8
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8
            tokenizer_mode: mistral
            config_format: mistral
            load_format: mistral
            kv_cache_dtype: fp8
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
  pd_disaggregation:
    source_ref: "vllm_recipe_mistral-large-3-675b-instruct#pd_cluster"
    match:
      distributed: true
      pd_role: null
    # PD分离：1P×1D  # 根据官网默认配置
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill  # P1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8
              tokenizer_mode: mistral
              config_format: mistral
              load_format: mistral
              kv_cache_dtype: fp8
              port: 8001
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_producer
                kv_load_failure_policy: fail
              enforce_eager: true
              tensor_parallel_size: 8
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5557
              VLLM_NIXL_SIDE_CHANNEL_HOST: $PREFILL_NODE_1
          - role: decode  # D1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: mistralai/Mistral-Large-3-675B-Instruct-2512-FP8
              tokenizer_mode: mistral
              config_format: mistral
              load_format: mistral
              kv_cache_dtype: fp8
              port: 8002
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_consumer
                kv_load_failure_policy: fail
              compilation_config:
                cudagraph_mode: FULL_DECODE_ONLY
              tensor_parallel_size: 8
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5558
              VLLM_NIXL_SIDE_CHANNEL_HOST: $DECODE_NODE_1
