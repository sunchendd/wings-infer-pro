# 来源追溯
upstream_sources:
  - id: sglang_glm-5.2
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/GLM/GLM-5.2.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/GLM/GLM-5.2.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。
  - id: sglang_glm-5-2_config
    kind: official_config
    repo: sglang
    file: docs_new/src/snippets/configs/zai-org/glm-5.2.jsx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/src/snippets/configs/zai-org/glm-5.2.jsx"
    note: SGLang 官网 Deployment 面板配置矩阵。自动生成。

# 模型基本信息
model:
  name: GLM-5.2  # 模型名称
  provider: zai-org  # 提供者/厂商
  model_id: zai-org/GLM-5.2  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)glm[-.]?5.2"
  variant_name: GLM-5.2-bf16  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algorithm, EAGLE, --speculative-num-steps, 5, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 6]
    strategy_overrides:  # 该特性默认用上面的 args；此处仅列出 spec 参数与默认不一致、需按部署场景覆盖的项
      multi_node.multi_node_balanced:
        args: [--speculative-algorithm, EAGLE, --speculative-num-steps, 1, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 2]

# 部署场景
scenarios:
  multi_node:
    source_ref: "sglang_glm-5.2#multi_node_low_latency"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_low_latency:
        display_name: Low-Latency
        orientation: latency
        engine_config:
          model: zai-org/GLM-5.2
          model_path: zai-org/GLM-5.2
          tp: 16
          mem_fraction_static: 0.85
          cuda_graph_max_bs: 32
          host: $HOST_IP
          port: $PORT
        env: {}
      multi_node_balanced:
        display_name: Balanced
        orientation: balanced
        engine_config:
          model: zai-org/GLM-5.2
          model_path: zai-org/GLM-5.2
          tp: 16
          mem_fraction_static: 0.85
          cuda_graph_max_bs: 128
          chunked_prefill_size: 32768
          max_running_requests: 80
          host: $HOST_IP
          port: $PORT
        env: {}
        default_strategy: true
      multi_node_high_throughput:
        display_name: High-Throughput
        orientation: throughput
        engine_config:
          model: zai-org/GLM-5.2
          model_path: zai-org/GLM-5.2
          tp: 16
          mem_fraction_static: 0.85
          cuda_graph_max_bs: 256
          max_running_requests: 256
          host: $HOST_IP
          port: $PORT
        env: {}
