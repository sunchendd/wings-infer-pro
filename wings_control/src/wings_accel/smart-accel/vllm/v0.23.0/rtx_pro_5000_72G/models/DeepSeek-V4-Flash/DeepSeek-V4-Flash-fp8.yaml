# SmartAccel 加速配置(RTX PRO 5000 SM120:decoding=mtp / sparse DSV4)
# 依赖 vLLM v0.23.0 的 XFUSION_DSV4_ON_SM120 补丁。
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: DeepSeek-V4-Flash
  variant_name: "DeepSeek-V4-Flash"
  match:
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?flash"
smart_accel:
  standalone:
    source_ref: "deepseek-v4-flash_fp8_manual#single_node_tep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: mtp
          cli_params:
            speculative_config:
              method: mtp
              num_speculative_tokens: 2
          envs: {}
        sparse:
        - name: performance_first
          cli_params:
            hf_overrides:
              index_topk_freq: 4
          envs: {}
        - name: accuracy_first
          cli_params:
            hf_overrides:
              index_topk_freq: 8
          envs: {}
        custom_features:
        - name: sm120_dsv4_patch
          packages:
            flashinfer: v0.6.12
            deepgemm: nv_dev_a6b593d
          cli_params: {}
          envs:
            XFUSION_DSV4_ON_SM120: "1"
