# 来源追溯
upstream_sources:
  - id: sglang_nemotron3-nano
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/NVIDIA/Nemotron3-Nano.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/NVIDIA/Nemotron3-Nano.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Nemotron3-Nano  # 模型名称
  provider: nvidia  # 提供者/厂商
  model_id: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)nemotron3[-.]?nano"
  variant_name: Nemotron3-Nano  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 640  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_nemotron3-nano#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
          model_path: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-FP8
          trust_remote_code: true
          max_running_requests: 1024
          host: "0.0.0.0"
          port: 30000
        env: {}
        default_strategy: true
