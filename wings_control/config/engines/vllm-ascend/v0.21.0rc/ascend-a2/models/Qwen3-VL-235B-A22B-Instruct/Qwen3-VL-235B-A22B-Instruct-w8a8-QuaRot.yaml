# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwen3-vl-235b-a22b-instruct_manual
    kind: manual
    repo: null
    file: null
    url: null
    note: 用户提供 vLLM Ascend 单机配置，手工录入。
  - id: vllm_ascend_qwen3-vl-235b-a22b-instruct
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/Qwen3-VL-235B-A22B-Instruct.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.21.0rc/docs/source/tutorials/models/Qwen3-VL-235B-A22B-Instruct.md"
    note: vLLM Ascend 官方教程文档。

# 模型基本信息
model:
  name: Qwen3-VL-235B-A22B-Instruct  # 模型名称
  provider: Eco-Tech  # 提供者/厂商
  model_id: Eco-Tech/Qwen3-VL-235B-A22B-Instruct  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)^qwen3[-.]?vl[-.]?235b[-.]?a22b[-.]?instruct[-.]?w8a8[-.]?quarot$"
  variant_name: Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 支持单机和多节点部署

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen3-vl-235b-a22b-instruct_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot
          trust_remote_code: true
          max_model_len: 4096
          host: "0.0.0.0"
          port: 17000
          gpu_memory_utilization: 0.9
          served_model_name: Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot
          default_chat_template_kwargs:
            enable_thinking: false
          tensor_parallel_size: 8
        env:
          HCCL_BUFFSIZE: 1024
          OMP_PROC_BIND: "false"
          OMP_NUM_THREADS: 1
          TASK_QUEUE_ENABLE: 1
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          HCCL_OP_EXPANSION_MODE: AIV

  multi_node:
    source_ref: "vllm_ascend_qwen3-vl-235b-a22b-instruct#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        head:
          engine_config:
            model: Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot
            host: "0.0.0.0"
            port: 8000
            data_parallel_size: 2
            api_server_count: 2
            data_parallel_size_local: 1
            data_parallel_address: $local_ip
            data_parallel_rpc_port: 13389
            seed: 1024
            served_model_name: Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot
            tensor_parallel_size: 8
            enable_expert_parallel: true
            max_num_seqs: 16
            max_model_len: 262144
            max_num_batched_tokens: 4096
            trust_remote_code: true
            gpu_memory_utilization: 0.9
          env:
            VLLM_USE_MODELSCOPE: "True"
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 1
            HCCL_BUFFSIZE: 1024
            TASK_QUEUE_ENABLE: 1
            HCCL_OP_EXPANSION_MODE: AIV
          system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
            commands: ["nic_name=\"xxxx\"", "local_ip=\"xxxx\""]
        worker:
          engine_config:
            model: Eco-Tech/Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot
            host: "0.0.0.0"
            port: 8000
            headless: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 13389
            seed: 1024
            tensor_parallel_size: 8
            served_model_name: Qwen3-VL-235B-A22B-Instruct-w8a8-QuaRot
            max_num_seqs: 16
            max_model_len: 262144
            max_num_batched_tokens: 4096
            enable_expert_parallel: true
            trust_remote_code: true
            gpu_memory_utilization: 0.9
          env:
            VLLM_USE_MODELSCOPE: "True"
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 1
            HCCL_BUFFSIZE: 1024
            TASK_QUEUE_ENABLE: 1
            HCCL_OP_EXPANSION_MODE: AIV
          system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
            commands: ["nic_name=\"xxxx\"", "local_ip=\"xxxx\"", "node0_ip=\"xxxx\""]
