# 来源追溯
upstream_sources:
  - id: vllm_deepseek-v4-pro_fp8_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/deepseek-ai/DeepSeek-V4-Pro"
    date_updated: 2026-08-05
    note: 用户提供 vLLM 启动命令，手工录入。

# 模型基本信息
model:
  name: DeepSeek-V4-Pro  # 模型名称
  slug: deepseek-v4-pro  # 模型标识
  provider: DeepSeek  # 提供者/厂商
  description: "DeepSeek V4 flagship MoE (1.6T total / 49B active) with hybrid CSA+HCA attention, manifold-constrained hyper-connections, Muon-trained on 32T+ tokens, and three-tier reasoning."  # 模型描述
  model_id: deepseek-ai/DeepSeek-V4-Pro  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 1600B  # 总参数量
  active_parameters: 49B  # 激活参数量（MoE 模型）
  context_length: 1048576  # 最大上下文长度
  vram_minimum_gb: 960  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-08-05  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?pro"
  variant_name: DeepSeek-V4-Pro  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU 数量
  vram_gb: 1128  # 单节点总显存(GB)（8 × 141GB）
  multi_node: false  # 仅支持单节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool calling with DeepSeek V4 chat template support.
    args: [--tokenizer-mode, deepseek_v4, --tool-call-parser, deepseek_v4, --enable-auto-tool-choice]
  reasoning:
    description: Enable reasoning/thinking mode with the DeepSeek V4 reasoning parser.
    args: [--reasoning-parser, deepseek_v4]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_deepseek-v4-pro_fp8_manual#single_node_tep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        default_strategy: true
        engine_config:
          model: deepseek-ai/DeepSeek-V4-Pro
          port: 18000
          trust_remote_code: true
          tensor_parallel_size: 8
          enable_expert_parallel: true
          kv_cache_dtype: fp8
          gpu_memory_utilization: 0.9
          max_model_len: 135936
          max_num_seqs: 256
          max_num_batched_tokens: 8192
          block_size: 256
          enable_chunked_prefill: true
          no_enable_flashinfer_autotune: true
          compilation_config:
            mode: 0
            cudagraph_mode: FULL_DECODE_ONLY
        env:
          VLLM_ENGINE_READY_TIMEOUT_S: 3600
          VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: 0
          VLLM_MXFP4_BACKEND: marlin
