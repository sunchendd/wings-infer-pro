# 来源追溯
upstream_sources:
  - id: vllm_recipe_hy3-preview
    kind: official_recipe
    repo: recipes
    file: models/tencent/Hy3-preview.yaml
    url: "https://recipes.vllm.ai/tencent/Hy3-preview"
    date_updated: 2026-04-23
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Hy3-preview  # 模型名称
  slug: hy3-preview  # 模型标识
  provider: Hunyuan (Tencent)  # 提供者/厂商
  description: "Tencent Hunyuan Hy3-preview — scaled-up MoE language model (295B total / 21B active) with a 3.8B MTP layer for speculative decoding, 256K context, and hy_v3 tool/reasoning parsers"  # 模型描述
  model_id: tencent/Hy3-preview  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 295B  # 总参数量
  active_parameters: 21B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 708  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.20.0"  # 最低引擎版本要求
  date_updated: 2026-04-23  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)hy3[-.]?preview"
  variant_name: Hy3-preview-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2304
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Hunyuan v3 tool call parser with automatic tool choice
    args: [--tool-call-parser, hy_v3, --enable-auto-tool-choice]
  reasoning:
    description: Hunyuan v3 reasoning parser for thinking-mode chain-of-thought extraction
    args: [--reasoning-parser, hy_v3]
  spec_decoding:
    description: Multi-Token Prediction speculative decoding using the model's built-in MTP layer
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":1}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_hy3-preview#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: tencent/Hy3-preview
          trust_remote_code: true
          enable_expert_parallel: true
          data_parallel_size: 8
        env:
          VLLM_ROCM_USE_AITER: 1
          VLLM_ROCM_USE_AITER_MOE: 1
          VLLM_ROCM_USE_AITER_MHA: 1
          VLLM_ROCM_USE_AITER_RMSNORM: 1
          VLLM_ROCM_USE_AITER_LINEAR: 1
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: tencent/Hy3-preview
          trust_remote_code: true
          enable_expert_parallel: true
          tensor_parallel_size: 8
        env:
          VLLM_ROCM_USE_AITER: 1
          VLLM_ROCM_USE_AITER_MOE: 1
          VLLM_ROCM_USE_AITER_MHA: 1
          VLLM_ROCM_USE_AITER_RMSNORM: 1
          VLLM_ROCM_USE_AITER_LINEAR: 1
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: tencent/Hy3-preview
          trust_remote_code: true
          tensor_parallel_size: 8
        env:
          VLLM_ROCM_USE_AITER: 1
          VLLM_ROCM_USE_AITER_MOE: 1
          VLLM_ROCM_USE_AITER_MHA: 1
          VLLM_ROCM_USE_AITER_RMSNORM: 1
          VLLM_ROCM_USE_AITER_LINEAR: 1
  multi_node:
    source_ref: "vllm_recipe_hy3-preview#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: tencent/Hy3-preview
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 1
            VLLM_ROCM_USE_AITER_MHA: 1
            VLLM_ROCM_USE_AITER_RMSNORM: 1
            VLLM_ROCM_USE_AITER_LINEAR: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: tencent/Hy3-preview
            trust_remote_code: true
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 1
            VLLM_ROCM_USE_AITER_MHA: 1
            VLLM_ROCM_USE_AITER_RMSNORM: 1
            VLLM_ROCM_USE_AITER_LINEAR: 1
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: tencent/Hy3-preview
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 1
            VLLM_ROCM_USE_AITER_MHA: 1
            VLLM_ROCM_USE_AITER_RMSNORM: 1
            VLLM_ROCM_USE_AITER_LINEAR: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: tencent/Hy3-preview
            trust_remote_code: true
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 1
            VLLM_ROCM_USE_AITER_MHA: 1
            VLLM_ROCM_USE_AITER_RMSNORM: 1
            VLLM_ROCM_USE_AITER_LINEAR: 1
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: tencent/Hy3-preview
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
            VLLM_ROCM_USE_AITER_MOE: 1
            VLLM_ROCM_USE_AITER_MHA: 1
            VLLM_ROCM_USE_AITER_RMSNORM: 1
            VLLM_ROCM_USE_AITER_LINEAR: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: tencent/Hy3-preview
            trust_remote_code: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
