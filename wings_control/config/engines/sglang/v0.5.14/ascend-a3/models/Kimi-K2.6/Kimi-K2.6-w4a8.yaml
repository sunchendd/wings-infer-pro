# 来源追溯
upstream_sources:
  - id: sglang_kimi-k2.6
    kind: official_doc
    repo: sglang
    file: docs_new/docs/hardware-platforms/ascend-npus/best_practice/kimi_k2_6.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/docs/hardware-platforms/ascend-npus/best_practice/kimi_k2_6.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Kimi-K2.6  # 模型名称
  provider: ""  # 提供者/厂商
  model_id: Kimi-K2.6  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)kimi[-.]?k2.6"
  variant_name: Kimi-K2.6-w4a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algorithm, EAGLE3, --speculative-draft-model-path, $DRAFT_MODEL_PATH, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4, --speculative-draft-model-quantization, unquant]
    strategy_overrides:  # 该特性默认用上面的 args；此处仅列出 spec 参数与默认不一致、需按部署场景覆盖的项
      pd_disaggregation.pd_cluster_kimi-k2-6-w4a8-1p1d-16p-in64k-out1k5-100ms:
        args: [--speculative-algorithm, EAGLE3, --speculative-draft-model-path, $DRAFT_MODEL_PATH, --speculative-num-steps, 4, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 5, --speculative-draft-model-quantization, unquant]
      pd_disaggregation.pd_cluster_kimi-k2-6-w4a8-1p1d-16p-in64k-out1k5-prefix90-100ms:
        args: [--speculative-algorithm, EAGLE3, --speculative-draft-model-path, $DRAFT_MODEL_PATH, --speculative-num-steps, 4, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 5, --speculative-draft-model-quantization, unquant]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_kimi-k2.6#single_node_pd-mixed"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_pd-mixed:
        display_name: Kimi-K2.6 W4A8 16P IN64K OUT1K 100ms
        orientation: latency
        nodes:
          - role: mixed
            index: 0
            engine_config:
              model: $MODEL_PATH
              model_path: $MODEL_PATH
              host: "${NODE_IPS[$i]}"
              port: 6688
              nnodes: 2
              dist_init_addr: "${NODE_IPS[0]}:5000"
              node_rank: $i
              trust_remote_code: true
              attention_backend: ascend
              device: npu
              quantization: modelslim
              dtype: bfloat16
              tp_size: 32
              mem_fraction_static: 0.55
              max_running_requests: 32
              chunked_prefill_size: 262144
              context_length: 75000
              enable_multimodal: true
              mm_attention_backend: ascend_attn
              sampling_backend: ascend
              enable_dp_attention: true
              dp_size: 32
              moe_a2a_backend: deepep
              deepep_mode: auto
              cuda_graph_bs: 1
              disable_radix_cache: true
            env:
              DEEP_NORMAL_MODE_USE_INT8_QUANT: 1
              GLOO_SOCKET_IFNAME: "<network-interface>"
              HCCL_BUFFSIZE: 4400
              HCCL_SOCKET_IFNAME: "<network-interface>"
              PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
              SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: 64
              SGLANG_ENABLE_OVERLAP_PLAN_STREAM: 1
              SGLANG_ENABLE_SPEC_V2: 1
              SGLANG_SET_CPU_AFFINITY: 1
              STREAMS_PER_DEVICE: 32
            system_setup:
              sysctls:
                vm.swappiness: 0
                kernel.numa_balancing: 0
                kernel.sched_migration_cost_ns: 50000
              sysfs_writes:
                - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
                  value: performance
              commands: [MODEL_PATH=/path/to/model-weights, DRAFT_MODEL_PATH=/path/to/draft-model-weights, "NODE_IPS=('<your node1 ip>' '<your node2 ip>')", unset https_proxy, unset http_proxy, unset HTTPS_PROXY, unset HTTP_PROXY, unset ASCEND_LAUNCH_BLOCKING, source /usr/local/Ascend/ascend-toolkit/set_env.sh, source /usr/local/Ascend/nnal/atb/set_env.sh]
        default_strategy: true
