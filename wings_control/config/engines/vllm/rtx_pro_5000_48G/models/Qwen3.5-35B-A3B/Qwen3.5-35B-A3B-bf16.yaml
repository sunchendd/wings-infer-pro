# 来源追溯
upstream_sources:
  - id: qwen3.5_35b_a3b_manual
    kind: manual
    repo: null
    file: null
    url: null
    date_updated: 2026-07-14
    note: 手工录入

# 模型基本信息
model:
  name: Qwen3.5-35B-A3B  # 模型名称
  slug: qwen3.5-35b-a3b  # 模型标识
  provider: Qwen  # 提供者/厂商
  description: "Qwen3.5-35B-A3B 模型（本地权重），支持工具调用与投机解码。"  # 模型描述
  model_id: Qwen/Qwen3.5-35B-A3B  # HuggingFace 模型 ID
  architecture: null  # 待补充
  parameter_count: null  # 待补充
  active_parameters: null  # 待补充
  context_length: null  # 待补充
  vram_minimum_gb: 384  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求（实测 vLLM 0.23.0）
  date_updated: 2026-07-14  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3.5[-.]?35b[-.]?a3b"
  variant_name: Qwen3.5-35B-A3B-bf16  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU 数量
  vram_gb: 384  # 单节点总显存(GB)（8 × 48GB）
  multi_node: false  # 仅支持单节点

# 可选功能列表（不进 engine_config）
features:
  tool_calling:
    description: Enable tool calling with Hermes tool parser.
    args: ["--enable-auto-tool-choice", "--tool-call-parser", "hermes"]
  spec_decoding:
    description: Qwen3.5 MTP speculative decoding.
    args: ["--speculative-config", "{\"method\":\"qwen3_5_mtp\",\"num_speculative_tokens\":1}"]
  kv_offloading:
    description: KV cache native offloading to reduce GPU memory usage.
    args: ["--kv-offloading-backend", "native", "--kv-offloading-size", "40"]

# 部署场景
scenarios:
  standalone:
    source_ref: "qwen3.5_35b_a3b_manual#single_node_tep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        default_strategy: true
        engine_config:
          model: "Qwen/Qwen3.5-35B-A3B"
          host: "0.0.0.0"
          port: 7906
          tensor_parallel_size: 2
          data_parallel_size: 1
          enable_expert_parallel: true
          max_num_seqs: 200
          max_model_len: 65536
          max_num_batched_tokens: 16384
          gpu_memory_utilization: 0.95
          seed: 1024
          trust_remote_code: true
          async_scheduling: true
          enable_prefix_caching: true
        env:
          VLLM_USE_V1: "1"
          PYTHONHASHSEED: "0"
