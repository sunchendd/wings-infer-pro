# 来源追溯
upstream_sources:
  - id: sglang_qwen3.5-397b
    kind: official_doc
    repo: sglang
    file: docs_new/docs/hardware-platforms/ascend-npus/best_practice/qwen3_5_397b.mdx
    url: "https://github.com/sgl-project/sglang/blob/v0.5.14/docs_new/docs/hardware-platforms/ascend-npus/best_practice/qwen3_5_397b.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen3.5-397B  # 模型名称
  provider: ""  # 提供者/厂商
  model_id: Qwen3.5-397B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3.5[-.]?397b"
  variant_name: Qwen3.5-397B-w4a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algorithm, NEXTN, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4, --speculative-draft-model-quantization, unquant]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen3.5-397b#single_node_pd-mixed_low_latency"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_pd-mixed_low_latency:
        display_name: Qwen3.5-397B W4A8 8P IN128K OUT1K 20ms
        orientation: latency
        default_strategy: true
        engine_config:
          model: $MODEL_PATH
          model_path: $MODEL_PATH
          host: "127.0.0.1"
          port: 6688
          attention_backend: ascend
          device: npu
          tp_size: 16
          chunked_prefill_size: -1
          max_prefill_tokens: 131072
          prefill_max_requests: 1
          disable_radix_cache: true
          trust_remote_code: true
          max_running_requests: 16
          mem_fraction_static: 0.6
          cuda_graph_bs: 2
          quantization: modelslim
          enable_multimodal: true
          moe_a2a_backend: deepep
          deepep_mode: auto
          mm_attention_backend: ascend_attn
          dtype: bfloat16
          mamba_ssm_dtype: bfloat16
        env:
          ASCEND_USE_FIA: 1
          DEEPEP_NORMAL_LONG_SEQ_PER_ROUND_TOKENS: 4096
          DEEPEP_NORMAL_LONG_SEQ_ROUND: 32
          DEEP_NORMAL_MODE_USE_INT8_QUANT: 1
          GDN_ATTN_BACKEND_TRITON: 1
          GLOO_SOCKET_IFNAME: "<network-interface>"
          HCCL_BUFFSIZE: 0
          HCCL_OP_EXPANSION_MODE: AIV
          HCCL_SOCKET_IFNAME: "<network-interface>"
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: 128
          SGLANG_ENABLE_OVERLAP_PLAN_STREAM: 1
          SGLANG_ENABLE_SPEC_V2: 1
          SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: 0
          SGLANG_SET_CPU_AFFINITY: 1
          SGLANG_ZBAL_BOOTSTRAP_URL: "tcp://127.0.0.1:24669"
          SGLANG_ZBAL_LOCAL_MEM_SIZE: 60672
          STREAMS_PER_DEVICE: 32
          ZBAL_ENABLE_GRAPH: 1
          ZBAL_NPU_ALLOC_CONF: "use_vmm_for_static_memory:True"
        system_setup:
          sysctls:
            vm.swappiness: 0
            kernel.numa_balancing: 0
            kernel.sched_migration_cost_ns: 50000
          sysfs_writes:
            - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
              value: performance
          commands: [MODEL_PATH=/path/to/model-weights, unset https_proxy, unset http_proxy, unset HTTPS_PROXY, unset HTTP_PROXY, unset ASCEND_LAUNCH_BLOCKING, source /usr/local/Ascend/ascend-toolkit/set_env.sh, source /usr/local/Ascend/nnal/atb/set_env.sh]
      single_node_pd-mixed_high_throughput:
        display_name: Qwen3.5-397B W4A8 8P IN128K OUT1K 50ms
        orientation: throughput
        engine_config:
          model: $MODEL_PATH
          model_path: $MODEL_PATH
          host: "127.0.0.1"
          port: 6688
          attention_backend: ascend
          device: npu
          tp_size: 16
          chunked_prefill_size: -1
          max_prefill_tokens: 131072
          prefill_max_requests: 1
          disable_radix_cache: true
          trust_remote_code: true
          max_running_requests: 16
          mem_fraction_static: 0.6
          cuda_graph_bs: 2
          quantization: modelslim
          enable_multimodal: true
          moe_a2a_backend: deepep
          deepep_mode: auto
          mm_attention_backend: ascend_attn
          dtype: bfloat16
          mamba_ssm_dtype: bfloat16
        env:
          ASCEND_USE_FIA: 1
          DEEPEP_NORMAL_LONG_SEQ_PER_ROUND_TOKENS: 4096
          DEEPEP_NORMAL_LONG_SEQ_ROUND: 32
          DEEP_NORMAL_MODE_USE_INT8_QUANT: 1
          GDN_ATTN_BACKEND_TRITON: 1
          GLOO_SOCKET_IFNAME: "<network-interface>"
          HCCL_BUFFSIZE: 0
          HCCL_OP_EXPANSION_MODE: AIV
          HCCL_SOCKET_IFNAME: "<network-interface>"
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          SGLANG_DEEPEP_NUM_MAX_DISPATCH_TOKENS_PER_RANK: 128
          SGLANG_ENABLE_OVERLAP_PLAN_STREAM: 1
          SGLANG_ENABLE_SPEC_V2: 1
          SGLANG_ENABLE_TP_MEMORY_INBALANCE_CHECK: 0
          SGLANG_SET_CPU_AFFINITY: 1
          SGLANG_ZBAL_BOOTSTRAP_URL: "tcp://127.0.0.1:24669"
          SGLANG_ZBAL_LOCAL_MEM_SIZE: 60672
          STREAMS_PER_DEVICE: 32
          ZBAL_ENABLE_GRAPH: 1
          ZBAL_NPU_ALLOC_CONF: "use_vmm_for_static_memory:True"
        system_setup:
          sysctls:
            vm.swappiness: 0
            kernel.numa_balancing: 0
            kernel.sched_migration_cost_ns: 50000
          sysfs_writes:
            - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
              value: performance
          commands: [MODEL_PATH=/path/to/model-weights, unset https_proxy, unset http_proxy, unset HTTPS_PROXY, unset HTTP_PROXY, unset ASCEND_LAUNCH_BLOCKING, source /usr/local/Ascend/ascend-toolkit/set_env.sh, source /usr/local/Ascend/nnal/atb/set_env.sh]
