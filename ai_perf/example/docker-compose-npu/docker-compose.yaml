version: "3.8"

# AI Perf example — 昇腾 NPU (vllm-ascend) + wings-infer-pro
#
# 三容器:
#   accel-init:     加速包镜像 /opt/packages/ → accel-vol
#   aiperf-control: wings-control(wings-infer-pro) 生成 start_command.sh 到 shared-vol
#   aiperf-engine:  等 start_command.sh 出现后 exec 拉起 vllm-ascend
#
# License 挂载已内置本文件(证书目录 / SafeTime 状态 / docker.sock / DMI),
# 无需叠加任何 override。前提: IMAGE_CONTROL 必须是 -license 后缀 tag 的
# wings-control 镜像(build/build.sh --enable-license 产出),否则 License
# 校验直通放行。

services:
  accel-init:
    image: ${IMAGE_ACCEL}
    container_name: aiperf-accel-${SERVICE_SUFFIX}
    restart: "no"
    entrypoint: ["cp", "-a", "/opt/packages/.", "/accel-volume/"]
    volumes:
      - accel-vol:/accel-volume

  aiperf-control:
    image: ${IMAGE_CONTROL}
    container_name: aiperf-control-${SERVICE_SUFFIX}
    network_mode: host
    restart: "no"
    depends_on:
      accel-init:
        condition: service_completed_successfully
    environment:
      WINGS_SKIP_PID_CHECK: "true"
      ENGINE: "${ENGINE}"
      # ENGINE_VERSION 选择 wings-infer-pro 配置资产版本树(config/engines/<engine>/<version>/)
      ENGINE_VERSION: "${ENGINE_VERSION}"
      MODEL_NAME: "${MODEL_NAME}"
      MODEL_PATH: "${MODEL_PATH}/"
      DEVICE_COUNT: "${DEVICE_COUNT}"
      # hardware_family 定位配置目录 config/engines/<engine>/<version>/<HARDWARE_FAMILY>/
      HARDWARE_FAMILY: "${HARDWARE_FAMILY}"
      WINGS_ACCEL_DIR: "/accel-volume"
      # 特性开关: 新版 wings_ctl 无 --enable-speculative-decode 等 flag,
      # 由 SmartAccel 子系统直接读以下环境变量
      ENABLE_ACCEL: "${ENABLE_ACCEL:-false}"
      ENABLE_REASON_PROXY: "${ENABLE_REASON_PROXY:-false}"
      ENABLE_SPECULATIVE_DECODE: "${ENABLE_SPECULATIVE_DECODE:-false}"
      SPECULATIVE_DECODE_MODEL_PATH: "${SPECULATIVE_DECODE_MODEL_PATH:-}"
      ENABLE_SPARSE: "${ENABLE_SPARSE:-false}"
      SPARSE_LEVEL: "${SPARSE_LEVEL:-}"
      AVAILABLE_POD_MEM_SIZE: "${AVAILABLE_POD_MEM_SIZE:-}"
      ENABLE_KV_OFFLOAD: "${ENABLE_KV_OFFLOAD:-false}"
      ENABLE_KV_MEM_OFFLOAD: "${ENABLE_KV_MEM_OFFLOAD:-false}"
      KV_MEM_OFFLOAD_SIZE: "${KV_MEM_OFFLOAD_SIZE:-}"
      ENABLE_KV_DISK_OFFLOAD: "${ENABLE_KV_DISK_OFFLOAD:-false}"
      KV_DISK_OFFLOAD_PATH: "${KV_DISK_OFFLOAD_PATH:-}"
      KV_DISK_OFFLOAD_SIZE: "${KV_DISK_OFFLOAD_SIZE:-0}"
      # 端口: ENGINE_PORT=backend 真实监听; PORT=proxy 对外; HEALTH_PORT 健康检查
      # (License 状态查询 GET /license_status 也走 HEALTH_PORT,不独立占端口)
      ENGINE_PORT: "${ENGINE_PORT}"
      PORT: "${CONTROL_PORT}"
      HEALTH_PORT: "${HEALTH_PORT}"
      MONITOR_PROXY_PORT: "${MONITOR_PROXY_PORT}"
      BACKEND_URL: "http://127.0.0.1:${ENGINE_PORT}"
      # 引擎参数(透传给 wings_start.sh CLI)
      GPU_MEMORY_UTILIZATION: "${GPU_MEMORY_UTILIZATION}"
      QUANTIZATION: "${QUANTIZATION}"
      INPUT_LENGTH: "${INPUT_LENGTH}"
      OUTPUT_LENGTH: "${OUTPUT_LENGTH}"
      MAX_NUM_SEQS: "${MAX_NUM_SEQS}"
      MAX_NUM_BATCHED_TOKENS: "${MAX_NUM_BATCHED_TOKENS:-}"
      KV_CACHE_DTYPE: "${KV_CACHE_DTYPE}"
      BLOCK_SIZE: "${BLOCK_SIZE}"
      DTYPE: "${DTYPE}"
      TRUST_REMOTE_CODE: "${TRUST_REMOTE_CODE}"
    volumes:
      - ./aiperf-control-entrypoint.sh:/aiperf-control-entrypoint.sh:ro
      - shared-vol:/shared-volume
      - accel-vol:/accel-volume
      - ${MODEL_PATH}:${MODEL_PATH}:ro
      # License 证书目录:宿主机放且只放一份 *.xml,容器内只读验签
      - /etc/aiperf/license:/etc/aiperf/license:ro
      # SafeTime 状态(时钟回拨检测水印):须持久化,重建容器不丢
      - /var/lib/aiperf/license/adaptivelm:/var/lib/aiperf/license/adaptivelm
      # 已用卡数自查:只读 sock,枚举 aiperf-engine 容器计数,不可用 env 伪造
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # ESN 防伪:checker 校验 DMI 目录确为真 sysfs 挂载,防 bind-mount 顶替
      - /sys/class/dmi/id:/host-sys/class/dmi/id:ro
    entrypoint: ["/aiperf-control-entrypoint.sh"]

  aiperf-engine:
    image: ${IMAGE_ENGINE}
    container_name: aiperf-engine-${SERVICE_SUFFIX}
    network_mode: host
    restart: "no"
    shm_size: "${SHM_SIZE}"
    runtime: ascend
    depends_on:
      accel-init:
        condition: service_completed_successfully
    environment:
      ASCEND_VISIBLE_DEVICES: "${XPU_VISIBLE_DEVICES}"
    volumes:
      - ./aiperf-engine-entrypoint.sh:/aiperf-engine-entrypoint.sh:ro
      - shared-vol:/shared-volume
      - accel-vol:/accel-volume
      - ${MODEL_PATH}:${MODEL_PATH}:ro
    entrypoint: ["/aiperf-engine-entrypoint.sh"]

volumes:
  shared-vol:
  accel-vol:
