# 来源追溯
upstream_sources:
  - id: sglang_qwen3-coder
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Qwen/Qwen3-Coder.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Qwen/Qwen3-Coder.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen3-Coder  # 模型名称
  provider: collections  # 提供者/厂商
  model_id: collections/Qwen  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?coder"
  variant_name: Qwen3-Coder  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1440  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen3-coder#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: Qwen/Qwen3-Coder-480B-A35B-Instruct-FP8
          tp: 8
          ep: 2
          context_length: 8192
          page_size: 32
          trust_remote_code: true
        env:
          SGLANG_USE_AITER: 0
        default_strategy: true
