# SmartAccel 加速配置(decoding=eagle3 [model_based])
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# 由 features.spec_decoding 自动生成;仅 decoding,无 kv_offload/sparse。
model:
  name: MiniMax-M2.5
  variant_name: "MiniMax-M2.5-w8a8-QuaRot"
  match:
    - name_pattern: "(?i)minimax[-.]?m2.5"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: eagle3
          requires_model_path: true
          draft_arch:
            - eagle3
          cli_params:
            speculative_config:
              method: eagle3
              model: $path
              num_speculative_tokens: 3
          envs: {}
