# 来源追溯
upstream_sources:
  - id: sglang_nemotron-3-nano-omni
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/NVIDIA/Nemotron3-Nano-Omni.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/NVIDIA/Nemotron3-Nano-Omni.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Nemotron 3 Nano Omni  # 模型名称
  provider: nvidia  # 提供者/厂商
  model_id: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)nemotron[-.]?3[-.]?nano[-.]?omni"
  variant_name: Nemotron 3 Nano Omni  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, qwen3_coder]
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, deepseek-r1]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_nemotron-3-nano-omni#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
          model_path: nvidia/Nemotron-3-Nano-Omni-30B-A3B-Reasoning-BF16
          host: "0.0.0.0"
          port: 30000
          tp: 4
          trust_remote_code: true
        env: {}
        default_strategy: true
