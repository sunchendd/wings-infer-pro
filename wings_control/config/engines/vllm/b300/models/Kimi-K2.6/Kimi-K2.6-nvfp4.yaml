# 来源追溯
upstream_sources:
  - id: vllm_recipe_kimi-k2.6
    kind: official_recipe
    repo: recipes
    file: models/moonshotai/Kimi-K2.6.yaml
    url: "https://recipes.vllm.ai/moonshotai/Kimi-K2.6"
    date_updated: 2026-05-14
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Kimi-K2.6  # 模型名称
  slug: kimi-k2.6  # 模型标识
  provider: Moonshot AI  # 提供者/厂商
  description: "Open-source native multimodal agentic MoE model with vision-language understanding, tool calling, and thinking modes"  # 模型描述
  model_id: nvidia/Kimi-K2.6-NVFP4  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 1T  # 总参数量
  active_parameters: 32B  # 激活参数量（MoE 模型）
  context_length: 262144  # 最大上下文长度
  vram_minimum_gb: 600  # 最低显存需求(GB)
  tasks: [multimodal, text]  # 支持的任务类型
  min_engine_version: "0.19.1"  # 最低引擎版本要求
  date_updated: 2026-05-14  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)kimi[-.]?k2.6"
  variant_name: Kimi-K2.6-nvfp4

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2144
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Kimi K2 tool-call parser with automatic tool choice
    args: [--tool-call-parser, kimi_k2, --enable-auto-tool-choice]
  reasoning:
    description: Kimi K2 reasoning parser for extracting chain-of-thought content
    args: [--reasoning-parser, kimi_k2]
  spec_decoding:
    description: Eagle3 speculative decoding for accelerated inference
    args: [--speculative-config, "{\"model\":\"lightseekorg/kimi-k2.6-eagle3-mla\",\"method\":\"eagle3\",\"num_speculative_tokens\":3}"]
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  encoder_parallel:
    description: Run the vision encoder in data-parallel mode — avoids TP comm overhead on the small encoder. Mutually exclusive with text_only.
    args: [--mm-encoder-tp-mode, data]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_kimi-k2.6#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: nvidia/Kimi-K2.6-NVFP4
          trust_remote_code: true
          kv_cache_dtype: fp8
          enable_expert_parallel: true
          data_parallel_size: 8
          attention_config_use_trtllm_ragged_deepseek_prefill: true
        env:
          VLLM_USE_FLASHINFER_MOE_FP4: 1
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: nvidia/Kimi-K2.6-NVFP4
          trust_remote_code: true
          kv_cache_dtype: fp8
          enable_expert_parallel: true
          tensor_parallel_size: 8
          attention_config_use_trtllm_ragged_deepseek_prefill: true
        env:
          VLLM_USE_FLASHINFER_MOE_FP4: 1
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: nvidia/Kimi-K2.6-NVFP4
          trust_remote_code: true
          kv_cache_dtype: fp8
          tensor_parallel_size: 8
          attention_config_use_trtllm_ragged_deepseek_prefill: true
        env:
          VLLM_USE_FLASHINFER_MOE_FP4: 1
  multi_node:
    source_ref: "vllm_recipe_kimi-k2.6#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: nvidia/Kimi-K2.6-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            attention_config_use_trtllm_ragged_deepseek_prefill: true
          env:
            VLLM_USE_FLASHINFER_MOE_FP4: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: nvidia/Kimi-K2.6-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
            attention_config_use_trtllm_ragged_deepseek_prefill: true
          env:
            VLLM_USE_FLASHINFER_MOE_FP4: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: nvidia/Kimi-K2.6-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            attention_config_use_trtllm_ragged_deepseek_prefill: true
          env:
            VLLM_USE_FLASHINFER_MOE_FP4: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: nvidia/Kimi-K2.6-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            attention_config_use_trtllm_ragged_deepseek_prefill: true
          env:
            VLLM_USE_FLASHINFER_MOE_FP4: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: nvidia/Kimi-K2.6-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            attention_config_use_trtllm_ragged_deepseek_prefill: true
          env:
            VLLM_USE_FLASHINFER_MOE_FP4: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: nvidia/Kimi-K2.6-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            attention_config_use_trtllm_ragged_deepseek_prefill: true
          env:
            VLLM_USE_FLASHINFER_MOE_FP4: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: nvidia/Kimi-K2.6-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            attention_config_use_trtllm_ragged_deepseek_prefill: true
          env:
            VLLM_USE_FLASHINFER_MOE_FP4: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: nvidia/Kimi-K2.6-NVFP4
            trust_remote_code: true
            kv_cache_dtype: fp8
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            attention_config_use_trtllm_ragged_deepseek_prefill: true
          env:
            VLLM_USE_FLASHINFER_MOE_FP4: 1
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
  pd_disaggregation:
    source_ref: "vllm_recipe_kimi-k2.6#pd_cluster"
    match:
      distributed: true
      pd_role: null
    # PD分离：1P×1D  # 根据官网默认配置
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill  # P1 节点配置
            index: 1
            parallelism: dep
            engine_config:
              model: nvidia/Kimi-K2.6-NVFP4
              trust_remote_code: true
              kv_cache_dtype: fp8
              port: 8001
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_producer
                kv_load_failure_policy: fail
              data_parallel_size: 8
              data_parallel_size_local: 8
              data_parallel_start_rank: 0
              data_parallel_address: $PREFILL_NODE_1
              data_parallel_rpc_port: $PREFILL_DP_RPC_PORT
              enable_expert_parallel: true
              enforce_eager: true
              max_num_batched_tokens: 16384
              block_size: 64
              attention_config_use_trtllm_ragged_deepseek_prefill: true
            env:
              VLLM_USE_FLASHINFER_MOE_FP4: 1
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5557
              VLLM_NIXL_SIDE_CHANNEL_HOST: $PREFILL_NODE_1
          - role: decode  # D1 节点配置
            index: 1
            parallelism: dep
            engine_config:
              model: nvidia/Kimi-K2.6-NVFP4
              trust_remote_code: true
              kv_cache_dtype: fp8
              port: 8002
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_consumer
                kv_load_failure_policy: fail
              data_parallel_size: 8
              data_parallel_size_local: 8
              data_parallel_start_rank: 0
              data_parallel_address: $DECODE_NODE_1
              data_parallel_rpc_port: $DECODE_DP_RPC_PORT
              enable_expert_parallel: true
              compilation_config:
                cudagraph_mode: FULL_DECODE_ONLY
              block_size: 64
              all2all_backend: flashinfer_nvlink_one_sided
              attention_config_use_trtllm_ragged_deepseek_prefill: true
            env:
              VLLM_USE_FLASHINFER_MOE_FP4: 1
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5558
              VLLM_NIXL_SIDE_CHANNEL_HOST: $DECODE_NODE_1
