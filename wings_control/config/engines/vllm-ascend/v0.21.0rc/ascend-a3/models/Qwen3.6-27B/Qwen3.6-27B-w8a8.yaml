# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwen3.6-27b_w8a8_manual
    kind: manual
    repo: null
    file: null
    url: "https://modelscope.cn/models/Eco-Tech/Qwen3.6-27B-w8a8"
    note: 用户提供 vLLM Ascend 启动命令，手工录入。

# 模型基本信息
model:
  name: Qwen3.6-27B  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Eco-Tech/Qwen3.6-27B-w8a8  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3.6[-.]?27b"
  variant_name: Qwen3.6-27B-w8a8  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool/function calling via the model's tool-call parser.
    args: [--enable-auto-tool-choice, --tool-call-parser, hermes]
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"method\":\"qwen3_5_mtp\",\"num_speculative_tokens\":3,\"enforce_eager\":true}"]
# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen3.6-27b_w8a8_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Eco-Tech/Qwen3.6-27B-w8a8
          host: "0.0.0.0"
          port: 7899
          served_model_name: qwen36
          tensor_parallel_size: 2
          data_parallel_size: 1
          max_num_seqs: 32
          max_model_len: 140000
          max_num_batched_tokens: 8192
          gpu_memory_utilization: 0.9
          seed: 1024
          trust_remote_code: true
          quantization: ascend
          additional_config:
            enable_cpu_binding: true
            ascend_compilation_config:
              enable_npugraph_ex: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          no_disable_hybrid_kv_cache_manager: true
          async_scheduling: true
        env:
          ACL_OP_INIT_MODE: 1
          PYTHONHASHSEED: 0
          HCCL_BUFFSIZE: 512
          OMP_PROC_BIND: "false"
          OMP_NUM_THREADS: 1
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          VLLM_USE_V1: 1
          LD_PRELOAD: "/usr/lib/aarch64-linux-gnu/libjemalloc.so.2${LD_PRELOAD:+:$LD_PRELOAD}"
          TASK_QUEUE_ENABLE: 1
          HCCL_OP_EXPANSION_MODE: AIV
          MMC_LOCAL_CONFIG_PATH: "/shared-volume/mmc_local.conf"
