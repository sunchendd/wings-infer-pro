# 来源追溯
upstream_sources:
  - id: vllm_ascend_minimax-m2
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/MiniMax-M2.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.18.0/docs/source/tutorials/models/MiniMax-M2.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: MiniMax-M2  # 模型名称
  provider: MiniMax  # 提供者/厂商
  model_id: MiniMax/MiniMax-M2.5  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.18.0  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)minimax[-.]?m2"
  variant_name: MiniMax-M2  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool/function calling via the model's tool-call parser.
    args: [--enable-auto-tool-choice, --tool-call-parser, minimax_m2]
  reasoning:
    description: Enable the model's reasoning-content parser.
    args: [--reasoning-parser, minimax_m2_append_think]

# 部署场景
scenarios:
  multi_node:
    source_ref: "vllm_ascend_minimax-m2#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        head:
          engine_config:
            model: /opt/data/verification/models/MiniMax-M2.5/
            served_model_name: minimax25
            host: "{PrimaryNodeIP}"
            port: 20004
            tensor_parallel_size: 8
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: "{PrimaryNodeIP}"
            data_parallel_rpc_port: 2347
            max_num_seqs: 128
            max_num_batched_tokens: 65536
            gpu_memory_utilization: 0.92
            enable_expert_parallel: true
            trust_remote_code: true
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            mm_processor_cache_type: shm
            async_scheduling: true
            additional_config:
              enable_cpu_binding: true
          env:
            HCCL_IF_IP: "{PrimaryNodeIP}"
            GLOO_SOCKET_IFNAME: "{NIC}"
            TP_SOCKET_IFNAME: "{NIC}"
            HCCL_SOCKET_IFNAME: "{NIC}"
            HCCL_BUFFSIZE: 1024
            HCCL_OP_EXPANSION_MODE: AIV
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 1
            VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
            HCCL_INTRA_PCIE_ENABLE: 1
            HCCL_INTRA_ROCE_ENABLE: 0
            VLLM_TORCH_PROFILER_WITH_STACK: 0
            VLLM_TORCH_PROFILER_DIR: "{profiling_dir}"
        worker:
          engine_config:
            model: /opt/data/verification/models/MiniMax-M2.5/
            served_model_name: minimax25
            host: "{SecondaryNodeIP}"
            port: 20004
            headless: true
            tensor_parallel_size: 8
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: "{PrimaryNodeIP}"
            data_parallel_rpc_port: 2347
            max_num_seqs: 128
            max_num_batched_tokens: 65536
            gpu_memory_utilization: 0.92
            enable_expert_parallel: true
            trust_remote_code: true
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            mm_processor_cache_type: shm
            async_scheduling: true
            additional_config:
              enable_cpu_binding: true
          env:
            HCCL_IF_IP: "{SecondaryNodeIP}"
            GLOO_SOCKET_IFNAME: "{NIC}"
            TP_SOCKET_IFNAME: "{NIC}"
            HCCL_SOCKET_IFNAME: "{NIC}"
            HCCL_BUFFSIZE: 1024
            HCCL_OP_EXPANSION_MODE: AIV
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 1
            VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
            HCCL_INTRA_PCIE_ENABLE: 1
            HCCL_INTRA_ROCE_ENABLE: 0
            VLLM_TORCH_PROFILER_WITH_STACK: 0
            VLLM_TORCH_PROFILER_DIR: "{profiling_dir}"
