# Kimi-K3 Full W4A8 on four Ascend 910C nodes.
#
# This is a DP-across-node deployment: each node owns one DP rank and all of its
# 16 NPUs form a local TP=16 group. The caller supplies the local model path.
schema: v2
profile:
  engine: vllm-ascend
  version: "v0.30.0rc2"
  hardware: {Ascend910C_64G}
  model: Kimi-K3-w4a8
  cpu_arch: {aarch64}

upstream_sources:
  - id: vllm_ascend_kimi_k3_w4a8_4node
    kind: manual
    repo: null
    file: null
    url: null
    note: Four-node Ascend 910C launch command supplied for vLLM-Ascend v0.30.0rc2.

model:
  name: Kimi-K3
  provider: moonshotai
  model_id: moonshotai/Kimi-K3-w4a8
  min_engine_version: v0.30.0rc2
  match:
    - name_pattern: "(?i)kimi[-.]?k3"
  variant_name: Kimi-K3-w4a8

hardware_profile:
  gpu_count: 16
  vram_gb: 1024
  multi_node: true

features:
  tool_calling:
    description: Enable Kimi K3 automatic tool calling.
    args: [--enable-auto-tool-choice, --tool-call-parser, kimi_k3]
  reasoning:
    description: Enable Kimi K3 reasoning parser.
    args: [--reasoning-parser, kimi_k3]

scenarios:
  multi_node:
    source_ref: "vllm_ascend_kimi_k3_w4a8_4node#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Four-node DP=4 / TP=16
        default_strategy: true
        head:
          engine_config:
            host: 0.0.0.0
            port: 8000
            served_model_name: kimi-k3
            tokenizer_mode: kimi_k3
            quantization: ascend
            safetensors_load_strategy: lazy
            tensor_parallel_size: 16
            data_parallel_size: 4
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: $local_ip
            data_parallel_rpc_port: 13345
            enable_expert_parallel: true
            enable_prefix_caching: true
            max_model_len: 133120
            max_num_seqs: 16
            max_num_batched_tokens: 8192
            gpu_memory_utilization: 0.85
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
          env:
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $NIC_NAME
            TP_SOCKET_IFNAME: $NIC_NAME
            HCCL_SOCKET_IFNAME: $NIC_NAME
            VLLM_ENGINE_READY_TIMEOUT_S: 7200
            VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: 3000
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            HCCL_BUFFSIZE: 1024
            HCCL_BUFFSIZE_EP: 2048
            HCCL_INTRA_PCIE_ENABLE: 1
            HCCL_INTRA_ROCE_ENABLE: 0
            HCCL_OP_EXPANSION_MODE: AIV
            OMP_PROC_BIND: "false"
            OPENBLAS_NUM_THREADS: 1
        worker:
          engine_config:
            headless: true
            host: 0.0.0.0
            port: 8000
            served_model_name: kimi-k3
            tokenizer_mode: kimi_k3
            quantization: ascend
            safetensors_load_strategy: lazy
            tensor_parallel_size: 16
            data_parallel_size: 4
            data_parallel_size_local: 1
            # Presence enables worker expansion to start ranks 1, 2, and 3.
            data_parallel_start_rank: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 13345
            enable_expert_parallel: true
            enable_prefix_caching: true
            max_model_len: 133120
            max_num_seqs: 16
            max_num_batched_tokens: 8192
            gpu_memory_utilization: 0.85
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
          env:
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $NIC_NAME
            TP_SOCKET_IFNAME: $NIC_NAME
            HCCL_SOCKET_IFNAME: $NIC_NAME
            VLLM_ENGINE_READY_TIMEOUT_S: 7200
            VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: 3000
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            HCCL_BUFFSIZE: 1024
            HCCL_BUFFSIZE_EP: 2048
            HCCL_INTRA_PCIE_ENABLE: 1
            HCCL_INTRA_ROCE_ENABLE: 0
            HCCL_OP_EXPANSION_MODE: AIV
            OMP_PROC_BIND: "false"
            OPENBLAS_NUM_THREADS: 1
