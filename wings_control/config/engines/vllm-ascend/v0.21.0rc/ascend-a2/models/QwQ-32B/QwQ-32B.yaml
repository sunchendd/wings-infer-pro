# 来源追溯
upstream_sources:
  - id: vllm_ascend_qwq-32b_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/Qwen/QwQ-32B"
    note: 用户提供 vLLM Ascend 启动命令，手工录入。

# 模型基本信息
model:
  name: QwQ-32B  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/QwQ-32B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwq[-.]?32b"
  variant_name: QwQ-32B  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 512  # 单节点总显存(GB)
  multi_node: true  # 支持单节点及多节点场景

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_qwq-32b_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: Qwen/QwQ-32B
          trust_remote_code: true
          max_model_len: 4096
          host: "0.0.0.0"
          port: 17000
          tensor_parallel_size: 2
        env: {}

  multi_node:
    source_ref: vllm_ascend_qwq-32b_manual#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        head:
          engine_config:
            model: Qwen/QwQ-32B
            trust_remote_code: true
            max_model_len: 4096
            host: 0.0.0.0
            port: 17000
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: $local_ip
            data_parallel_rpc_port: 12321
            tensor_parallel_size: 8
          env:
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            HCCL_OP_EXPANSION_MODE: AIV
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
        worker:
          engine_config:
            model: Qwen/QwQ-32B
            trust_remote_code: true
            max_model_len: 4096
            host: 0.0.0.0
            port: 17000
            headless: true
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_start_rank: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 12321
            tensor_parallel_size: 8
          env:
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            HCCL_OP_EXPANSION_MODE: AIV
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
