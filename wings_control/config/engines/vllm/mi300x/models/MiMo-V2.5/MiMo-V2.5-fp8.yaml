# 来源追溯
upstream_sources:
  - id: vllm_recipe_mimo-v2-5
    kind: official_recipe
    repo: recipes
    file: models/XiaomiMiMo/MiMo-V2.5.yaml
    url: "https://recipes.vllm.ai/XiaomiMiMo/MiMo-V2.5"
    date_updated: 2026-04-27
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: MiMo-V2.5  # 模型名称
  slug: mimo-v2-5  # 模型标识
  provider: MiMo (Xiaomi)  # 提供者/厂商
  description: "MiMo-V2.5 is a native omnimodal model with strong agentic capabilities, supporting text, image, video, and audio understanding within a unified architecture"  # 模型描述
  model_id: XiaomiMiMo/MiMo-V2.5  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 311B  # 总参数量
  active_parameters: 15B  # 激活参数量（MoE 模型）
  context_length: 1048576  # 最大上下文长度
  vram_minimum_gb: 374  # 最低显存需求(GB)
  tasks: [multimodal, text]  # 支持的任务类型
  min_engine_version: "0.21.0"  # 最低引擎版本要求
  date_updated: 2026-04-27  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)mimo[-.]?v2[-.]?5"
  variant_name: MiMo-V2.5-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 1536
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: MiMo tool-call parser
    args: [--tool-call-parser, mimo, --enable-auto-tool-choice]
  reasoning:
    description: MiMo reasoning parser
    args: [--reasoning-parser, mimo]
  spec_decoding:
    description: Multi-Token Prediction
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":1}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_mimo-v2-5#single_node_tep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: XiaomiMiMo/MiMo-V2.5
          trust_remote_code: true
          generation_config: vllm
          enable_expert_parallel: true
          tensor_parallel_size: 8
        env: {}
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: XiaomiMiMo/MiMo-V2.5
          trust_remote_code: true
          generation_config: vllm
          tensor_parallel_size: 4
        env: {}
  multi_node:
    source_ref: "vllm_recipe_mimo-v2-5#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: XiaomiMiMo/MiMo-V2.5
            trust_remote_code: true
            generation_config: vllm
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: XiaomiMiMo/MiMo-V2.5
            trust_remote_code: true
            generation_config: vllm
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: XiaomiMiMo/MiMo-V2.5
            trust_remote_code: true
            generation_config: vllm
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: XiaomiMiMo/MiMo-V2.5
            trust_remote_code: true
            generation_config: vllm
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: XiaomiMiMo/MiMo-V2.5
            trust_remote_code: true
            generation_config: vllm
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: XiaomiMiMo/MiMo-V2.5
            trust_remote_code: true
            generation_config: vllm
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
  pd_disaggregation:
    source_ref: "vllm_recipe_mimo-v2-5#pd_cluster"
    match:
      distributed: true
      pd_role: null
    # PD分离：1P×1D  # 根据官网默认配置
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        nodes:
          - role: prefill  # P1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: XiaomiMiMo/MiMo-V2.5
              trust_remote_code: true
              generation_config: vllm
              port: 8001
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_producer
                kv_load_failure_policy: fail
              enforce_eager: true
              tensor_parallel_size: 8
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5557
              VLLM_NIXL_SIDE_CHANNEL_HOST: $PREFILL_NODE_1
          - role: decode  # D1 节点配置
            index: 1
            parallelism: tp
            engine_config:
              model: XiaomiMiMo/MiMo-V2.5
              trust_remote_code: true
              generation_config: vllm
              port: 8002
              kv_transfer_config:
                kv_connector: NixlConnector
                kv_role: kv_consumer
                kv_load_failure_policy: fail
              compilation_config:
                cudagraph_mode: FULL_DECODE_ONLY
              tensor_parallel_size: 8
            env:
              VLLM_NIXL_SIDE_CHANNEL_PORT: 5558
              VLLM_NIXL_SIDE_CHANNEL_HOST: $DECODE_NODE_1
