# 来源追溯
upstream_sources:
  - id: vllm_recipe_plamo-3-nict-31b-base
    kind: official_recipe
    repo: recipes
    file: models/pfnet/plamo-3-nict-31b-base.yaml
    url: "https://recipes.vllm.ai/pfnet/plamo-3-nict-31b-base"
    date_updated: 2026-06-02
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: PLaMo 3 NICT 31B Base  # 模型名称
  slug: plamo-3-nict-31b-base  # 模型标识
  provider: Preferred Networks  # 提供者/厂商
  description: Largest PLaMo 3 NICT Japanese/English base model with interleaved sliding-window and full attention.  # 模型描述
  model_id: pfnet/plamo-3-nict-31b-base  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: 32B  # 总参数量
  active_parameters: 32B  # 激活参数量（MoE 模型）
  context_length: 4096  # 最大上下文长度
  vram_minimum_gb: 77  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.12.0"  # 最低引擎版本要求
  date_updated: 2026-06-02  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)plamo[-.]?3[-.]?nict[-.]?31b[-.]?base"
  variant_name: plamo-3-nict-31b-base-bf16

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2048
  multi_node: false

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_plamo-3-nict-31b-base#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: pfnet/plamo-3-nict-31b-base
          trust_remote_code: true
          max_model_len: 4096
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_plamo-3-nict-31b-base#multi_node_tp"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: pfnet/plamo-3-nict-31b-base
            trust_remote_code: true
            max_model_len: 4096
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: pfnet/plamo-3-nict-31b-base
            trust_remote_code: true
            max_model_len: 4096
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp_pp:
        display_name: Multi-Node TP + Pipeline Parallel
        head:  # Head Node 节点配置
          engine_config:
            model: pfnet/plamo-3-nict-31b-base
            trust_remote_code: true
            max_model_len: 4096
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: pfnet/plamo-3-nict-31b-base
            trust_remote_code: true
            max_model_len: 4096
            tensor_parallel_size: 8
            pipeline_parallel_size: 2
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
