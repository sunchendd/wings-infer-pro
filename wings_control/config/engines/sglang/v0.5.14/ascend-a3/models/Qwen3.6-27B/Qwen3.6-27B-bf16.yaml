# 来源追溯
upstream_sources:
  - id: sglang_qwen3.6-27b
    kind: official_doc
    repo: sglang
    file: docs_new/docs/hardware-platforms/ascend-npus/best_practice/qwen3_6_27b.mdx
    url: "https://github.com/sgl-project/sglang/blob/v0.5.14/docs_new/docs/hardware-platforms/ascend-npus/best_practice/qwen3_6_27b.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen3.6-27B  # 模型名称
  provider: ""  # 提供者/厂商
  model_id: Qwen3.6-27B  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3.6[-.]?27b"
  variant_name: Qwen3.6-27B-bf16  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algorithm, NEXTN, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen3.6-27b#single_node_pd-mixed_high_throughput"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_pd-mixed_high_throughput:
        display_name: Qwen3.6-27B 1P IN1024X1024 30 OUT1024 50ms
        orientation: throughput
        engine_config:
          model: $MODEL_PATH
          model_path: $MODEL_PATH
          host: "127.0.0.1"
          port: 6688
          tp_size: 2
          nnodes: 1
          attention_backend: ascend
          device: npu
          chunked_prefill_size: -1
          max_prefill_tokens: 52000
          disable_radix_cache: true
          trust_remote_code: true
          max_running_requests: 50
          max_mamba_cache_size: 60
          mem_fraction_static: 0.76
          cuda_graph_bs: 2
          enable_multimodal: true
          mm_attention_backend: ascend_attn
          dtype: bfloat16
          mamba_ssm_dtype: bfloat16
          mm_enable_dp_encoder: true
        env:
          ASCEND_USE_FIA: 1
          GLOO_SOCKET_IFNAME: "<network-interface>"
          HCCL_OP_EXPANSION_MODE: AIV
          HCCL_SOCKET_IFNAME: "<network-interface>"
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          SGLANG_ENABLE_OVERLAP_PLAN_STREAM: 1
          SGLANG_ENABLE_SPEC_V2: 1
          SGLANG_NPU_PROFILING: 1
          SGLANG_NPU_PROFILING_STAGE: prefill
          SGLANG_PREFILL_DELAYER_MAX_DELAY_PASSES: 150
          SGLANG_SCHEDULER_DECREASE_PREFILL_IDLE: 1
          SGLANG_SET_CPU_AFFINITY: 1
          SGLANG_VIT_ENABLE_CUDA_GRAPH: 1
          STREAMS_PER_DEVICE: 32
        system_setup:
          sysctls:
            vm.swappiness: 0
            kernel.numa_balancing: 0
            kernel.sched_migration_cost_ns: 50000
          sysfs_writes:
            - path: "/sys/devices/system/cpu/cpu*/cpufreq/scaling_governor"
              value: performance
          commands: [MODEL_PATH=/path/to/model-weights, unset https_proxy, unset http_proxy, unset HTTPS_PROXY, unset HTTP_PROXY, unset ASCEND_LAUNCH_BLOCKING, source /usr/local/Ascend/ascend-toolkit/set_env.sh, source /usr/local/Ascend/nnal/atb/set_env.sh]
        default_strategy: true
