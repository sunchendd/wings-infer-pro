upstream_sources:
- id: vllm_ascend_deepseek-v4-pro_w4a8_1m_4node_a3_manual
  kind: manual
  repo: null
  file: 33-34-35-36-dsv4pro-1m
  url: null
  note: 'Ascend A3 four-node 1M PD parameters from Li Zhengde (2026-09): DP2/TP16 Prefill
    plus DP2/TP16 Decode, MooncakeHybridConnector KV transfer, MTP single-token
    speculative decoding. Deviation from the raw package: kv_transfer_config.engine_id
    (hardcoded 1/8 there) is derived per PD role via engine_id_policy=from_pd_index
    (prefill instance 0, decode instance 1), matching the GLM 4-node template. The
    stock v0.23.0-a3 image needs six PR backports applied before serving; they ship
    as ai_perf/example/ascend-a3/deepseek-v4-pro-w4a8-1m-4node/patches/.'
model:
  name: DeepSeek-V4-Pro
  provider: Eco-Tech
  model_id: Eco-Tech/DeepSeek-V4-Pro-w4a8-mtp
  min_engine_version: v0.23.0
  match:
  - name_pattern: (?i)^DeepSeek\-V4\-Pro\-w4a8\-1m\-4node$
  variant_name: DeepSeek-V4-Pro-w4a8-1m-4node
hardware_profile:
  gpu_count: 16
  vram_gb: 1024
  multi_node: true
features:
  tool_calling:
    description: Enable automatic tool/function calling via the DeepSeek-V4 tool-call parser.
    args:
    - --enable-auto-tool-choice
    - --tool-call-parser
    - deepseek_v4
    - --tokenizer-mode
    - deepseek_v4
  reasoning:
    description: Enable the DeepSeek-V4 reasoning-content parser.
    args:
    - --reasoning-parser
    - deepseek_v4
  spec_decoding:
    description: MTP speculative decoding used by the verified P/D recipe (single token on both roles).
    args:
    - --speculative-config
    - '{"num_speculative_tokens":1,"method":"mtp","enforce_eager":true}'
scenarios:
  pd_disaggregation:
    source_ref: vllm_ascend_deepseek-v4-pro_w4a8_1m_4node_a3_manual#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        orientation: production
        default_strategy: true
        runtime:
          prefill:
            engine_id_policy: from_pd_index
          decode:
            engine_id_policy: from_pd_index
        nodes:
        - role: prefill
          index: 0
          engine_config:
            model: /mnt/model/DeepSeek-V4-Pro-w4a8-mtp
            host: 0.0.0.0
            port: 7100
            tensor_parallel_size: 16
            data_parallel_size: 2
            data_parallel_size_local: 1
            data_parallel_rpc_port: 12321
            data_parallel_external_lb: false
            enable_expert_parallel: true
            seed: 1024
            served_model_name: dsv4
            max_model_len: 1048576
            max_num_batched_tokens: 2048
            max_num_seqs: 16
            no_disable_hybrid_kv_cache_manager: true
            enable_prompt_tokens_details: true
            model_loader_extra_config:
              enable_multithread_load: true
              num_threads: 128
            trust_remote_code: true
            gpu_memory_utilization: 0.94
            api_server_count: 1
            quantization: ascend
            block_size: 128
            enforce_eager: true
            speculative_config:
              num_speculative_tokens: 1
              method: mtp
              enforce_eager: true
            additional_config:
              enable_cpu_binding: true
            kv_transfer_config:
              kv_connector: MooncakeHybridConnector
              kv_role: kv_producer
              kv_port: 30100
              kv_connector_extra_config:
                prefill:
                  dp_size: 2
                  tp_size: 16
                decode:
                  dp_size: 2
                  tp_size: 16
          env:
            VLLM_RPC_TIMEOUT: '3600000'
            VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: '30000'
            HCCL_EXEC_TIMEOUT: '204'
            HCCL_CONNECT_TIMEOUT: '6000'
            HCCL_OP_EXPANSION_MODE: AIV
            OMP_PROC_BIND: 'false'
            OMP_NUM_THREADS: '10'
            PYTORCH_NPU_ALLOC_CONF: expandable_segments:True
            HCCL_BUFFSIZE: '1024'
            TASK_QUEUE_ENABLE: '1'
            LD_PRELOAD: /usr/lib/aarch64-linux-gnu/libjemalloc.so.2${LD_PRELOAD:+:$LD_PRELOAD}
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
        - role: prefill
