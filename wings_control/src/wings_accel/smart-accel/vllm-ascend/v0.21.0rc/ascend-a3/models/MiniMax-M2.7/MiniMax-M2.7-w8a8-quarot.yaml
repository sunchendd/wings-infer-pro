# SmartAccel 加速配置(ascend:decoding=eagle3;kv_offload 不启用,去除 mooncake)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# ⚠️ §7:该模型 engine_config 设了 async_scheduling:true,decoding 不得声明 suffix;本块用 eagle3,合规。
model:
  name: MiniMax-M2.7
  variant_name: "MiniMax-M2.7-w8a8-QuaRot"
  match:
    - name_pattern: "(?i)minimax[-.]?m2.7"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: eagle3
          requires_model_path: true
          draft_arch:
            - eagle3
          cli_params:
            speculative_config:
              method: eagle3
              model: $path
              num_speculative_tokens: 3
              enforce_eager: true
          envs: {}
