# 来源追溯
upstream_sources:
  - id: sglang_hunyuan-3-preview
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Tencent/Hunyuan3-Preview.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Tencent/Hunyuan3-Preview.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Hunyuan 3 Preview  # 模型名称
  provider: tencent  # 提供者/厂商
  model_id: tencent/Hy3-preview  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)hunyuan[-.]?3[-.]?preview"
  variant_name: Hunyuan 3 Preview  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 1128  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable tool/function calling via SGLang parser flags.
    args: [--tool-call-parser, hunyuan]
  reasoning:
    description: Enable model reasoning parser.
    args: [--reasoning-parser, hunyuan]
  spec_decoding:
    description: Enable speculative decoding.
    args: [--speculative-algorithm, EAGLE, --speculative-num-steps, 3, --speculative-eagle-topk, 1, --speculative-num-draft-tokens, 4]

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_hunyuan-3-preview#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: tencent/Hy3-preview
          model_path: tencent/Hy3-preview
          tp: 8
          trust_remote_code: true
          mem_fraction_static: 0.85
        env: {}
        default_strategy: true
