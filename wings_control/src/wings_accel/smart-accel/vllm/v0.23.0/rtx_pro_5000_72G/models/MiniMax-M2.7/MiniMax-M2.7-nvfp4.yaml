# SmartAccel 加速配置(decoding=suffix / kv_offload=cpu_disk)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: MiniMax-M2.7
  variant_name: "MiniMax-M2.7-nvfp4"
  match:
    - name_pattern: "(?i)minimax[-.]?m2[-.]?7"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: suffix
          cli_params:
            speculative_config:
              method: suffix
              num_speculative_tokens: 10
          envs: {}
        kv_offload:
        - name: cpu
          cli_params:
            kv_transfer_config:
              kv_connector: LMCacheConnectorV1
              kv_role: kv_both
              kv_load_failure_policy: recompute
          envs:
            LMCACHE_LOCAL_CPU: 'True'
            LMCACHE_MAX_LOCAL_CPU_SIZE: '{= memory_capacity_gb // tp_size}'
            LMCACHE_CHUNK_SIZE: '256'
            LMCACHE_EXTRA_CONFIG: '{"use_odirect": true}'
            LMCACHE_PRE_CACHING_HASH_ALGORITHM: sha256_cbor_64bit
        - name: cpu_disk
          cli_params:
            kv_transfer_config:
              kv_connector: LMCacheConnectorV1
              kv_role: kv_both
              kv_load_failure_policy: recompute
          envs:
            LMCACHE_LOCAL_CPU: 'True'
            LMCACHE_MAX_LOCAL_CPU_SIZE: '{= memory_capacity_gb // tp_size}'
            LMCACHE_CHUNK_SIZE: '256'
            LMCACHE_EXTRA_CONFIG: '{"use_odirect": true}'
            LMCACHE_PRE_CACHING_HASH_ALGORITHM: sha256_cbor_64bit
            LMCACHE_LOCAL_DISK: '{disk_path}'
            LMCACHE_MAX_LOCAL_DISK_SIZE: '{= disk_capacity_gb // tp_size}'
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: suffix
          cli_params:
            speculative_config:
              method: suffix
              num_speculative_tokens: 10
          envs: {}
        kv_offload:
        - name: cpu
          cli_params:
            kv_transfer_config:
              kv_connector: LMCacheConnectorV1
              kv_role: kv_both
              kv_load_failure_policy: recompute
          envs:
            LMCACHE_LOCAL_CPU: 'True'
            LMCACHE_MAX_LOCAL_CPU_SIZE: '{= memory_capacity_gb // tp_size}'
            LMCACHE_CHUNK_SIZE: '256'
            LMCACHE_EXTRA_CONFIG: '{"use_odirect": true}'
            LMCACHE_PRE_CACHING_HASH_ALGORITHM: sha256_cbor_64bit
        - name: cpu_disk
          cli_params:
            kv_transfer_config:
              kv_connector: LMCacheConnectorV1
              kv_role: kv_both
              kv_load_failure_policy: recompute
          envs:
            LMCACHE_LOCAL_CPU: 'True'
            LMCACHE_MAX_LOCAL_CPU_SIZE: '{= memory_capacity_gb // tp_size}'
            LMCACHE_CHUNK_SIZE: '256'
            LMCACHE_EXTRA_CONFIG: '{"use_odirect": true}'
            LMCACHE_PRE_CACHING_HASH_ALGORITHM: sha256_cbor_64bit
            LMCACHE_LOCAL_DISK: '{disk_path}'
            LMCACHE_MAX_LOCAL_DISK_SIZE: '{= disk_capacity_gb // tp_size}'
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: decode
          index: 0
          decoding:
          - name: suffix
            cli_params:
              speculative_config:
                method: suffix
                num_speculative_tokens: 10
            envs: {}
