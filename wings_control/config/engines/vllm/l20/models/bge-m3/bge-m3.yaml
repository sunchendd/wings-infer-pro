# 来源追溯
upstream_sources:
  - id: vllm_bge-m3_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/BAAI/bge-m3"
    date_updated: 2026-07-24
    note: 用户提供 vLLM OpenAI API Server 启动命令，手工录入。

# 模型基本信息
model:
  name: bge-m3  # 模型名称
  slug: bge-m3  # 模型标识
  provider: BAAI  # 提供者/厂商
  description: "BAAI BGE-M3 多语言多功能文本向量模型，支持密集检索、多向量检索和稀疏检索。"  # 模型描述
  model_id: BAAI/bge-m3  # HuggingFace 模型 ID
  architecture: dense  # 模型架构（dense/moe）
  parameter_count: null  # 待补充：总参数量
  active_parameters: null  # 待补充：激活参数量
  context_length: 8192
  vram_minimum_gb: 48  # 最低显存需求(GB)
  tasks: [embedding]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-07-24  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)bge[-.]?m3"
  variant_name: bge-m3  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 1  # 单节点 GPU 数量
  vram_gb: 48  # 单节点总显存(GB)（1 × 48GB）
  multi_node: false  # 仅支持单节点

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_bge-m3_manual#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: BAAI/bge-m3
          trust_remote_code: true
          host: 0.0.0.0
          port: 17000
          tensor_parallel_size: 1
          runner: pooling
        env: {}
