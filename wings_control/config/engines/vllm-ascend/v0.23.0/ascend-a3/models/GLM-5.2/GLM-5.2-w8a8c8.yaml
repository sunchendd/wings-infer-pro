# 来源追溯
upstream_sources:
  - id: vllm_ascend_glm-5.2
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/GLM5.2.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.23.0/docs/source/tutorials/models/GLM5.2.md"
    note: vLLM Ascend 官方教程文档。根据 Atlas 800 A3 双节点 co-located GLM-5.2-w8a8c8 命令生成。

# 模型基本信息
model:
  name: GLM-5.2
  provider: Eco-Tech
  model_id: Eco-Tech/GLM-5.2-w8a8c8
  min_engine_version: v0.23.0
  match:
    - name_pattern: "(?i)glm[-.]?5.2"
  variant_name: GLM-5.2-w8a8c8

# 硬件信息
hardware_profile:
  gpu_count: 16
  vram_gb: 1024
  multi_node: true

# 可选功能列表
features:
  reasoning:
    description: Enable the model's reasoning-content parser.
    args: [--reasoning-parser, glm45]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_glm-5.2#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: /root/.cache/modelscope/hub/models/vllm-ascend/GLM-5.2-w8a8c8
          host: "0.0.0.0"
          port: 17000
          served_model_name: GLM-5.2-w8a8c8
          trust_remote_code: true
          dtype: auto
          kv_cache_dtype: auto
          gpu_memory_utilization: 0.9
          enable_chunked_prefill: true
          max_num_batched_tokens: 8192
          block_size: 16
          max_num_seqs: 16
          seed: 42
          enable_expert_parallel: true
          default_chat_template_kwargs:
            enable_thinking: true
          max_model_len: 8192
          additional_config:
            fuse_muls_add: true
            multistream_overlap_shared_expert: true
            ascend_compilation_config:
              enable_npugraph_ex: true
          async_scheduling: true
          tensor_parallel_size: 8
          data_parallel_size: 2
        env:
          HCCL_OP_EXPANSION_MODE: AIV
          HCCL_BUFFSIZE: 1024
          OMP_PROC_BIND: "false"
          OMP_NUM_THREADS: 1
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          VLLM_ASCEND_BALANCE_SCHEDULING: 1
          VLLM_ASCEND_ENABLE_FLASHCOMM1: 1  # 解决GLM5.2 v0.23.0 运行乱码问题
          VLLM_ASCEND_ENABLE_FUSED_MC2: 0  # 解决GLM5.2 v0.23.0 运行乱码问题
          VLLM_ASCEND_ENABLE_MLAPO: 1
  multi_node:
    source_ref: "vllm_ascend_glm-5.2#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        head:
          engine_config:
            model: /root/.cache/modelscope/hub/models/vllm-ascend/GLM-5.2-w8a8c8
            host: "0.0.0.0"
            port: 8077
            api_server_count: 1
            data_parallel_size: 8
            data_parallel_start_rank: 0
            data_parallel_size_local: 4
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 12980
            tensor_parallel_size: 4
            enable_expert_parallel: true
            seed: 1024
            served_model_name: glm-5
            max_num_seqs: 6
            max_model_len: 202752
            max_num_batched_tokens: 4096
            trust_remote_code: true
            gpu_memory_utilization: 0.92
            quantization: ascend
            enable_chunked_prefill: true
            enable_prefix_caching: true
            async_scheduling: true
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            additional_config:
              enable_dsa_cp: true
              enable_sparse_sfa_c8: true
              enable_sparse_li_c8: true
              enable_balance_scheduling: true
              fuse_muls_add: true
          env:
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            HCCL_TRANSFER_TIMEOUT: 600
            HCCL_EXEC_TIMEOUT: 3600
            HCCL_CONNECT_TIMEOUT: 3600
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 1
            HCCL_BUFFSIZE: 400
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            VLLM_ASCEND_ENABLE_MLAPO: 1
            VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
            VLLM_ASCEND_ENABLE_FUSED_MC2: 1
          system_setup:
            commands: [nic_name="xxxx", local_ip="xxxx", node0_ip="xxxx"]
        worker:
          engine_config:
            model: /root/.cache/modelscope/hub/models/vllm-ascend/GLM-5.2-w8a8c8
            host: "0.0.0.0"
            port: 8077
            headless: true
            data_parallel_size: 8
            data_parallel_start_rank: 4
            data_parallel_size_local: 4
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 12980
            tensor_parallel_size: 4
            enable_expert_parallel: true
            seed: 1024
            served_model_name: glm-5
            max_num_seqs: 6
            max_model_len: 202752
            max_num_batched_tokens: 4096
            trust_remote_code: true
            gpu_memory_utilization: 0.92
            quantization: ascend
            enable_chunked_prefill: true
            enable_prefix_caching: true
            async_scheduling: true
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            additional_config:
              enable_dsa_cp: true
              enable_sparse_sfa_c8: true
              enable_sparse_li_c8: true
              enable_balance_scheduling: true
              fuse_muls_add: true
          env:
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            TP_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
            HCCL_TRANSFER_TIMEOUT: 600
            HCCL_EXEC_TIMEOUT: 3600
            HCCL_CONNECT_TIMEOUT: 3600
            OMP_PROC_BIND: "false"
            OMP_NUM_THREADS: 1
            HCCL_BUFFSIZE: 400
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            VLLM_ASCEND_ENABLE_MLAPO: 1
            VLLM_ASCEND_ENABLE_FLASHCOMM1: 1
            VLLM_ASCEND_ENABLE_FUSED_MC2: 1
          system_setup:
            commands: [nic_name="xxxx", local_ip="xxxx", node0_ip="xxxx"]
