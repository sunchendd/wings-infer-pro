schema: v2
profile:
  engine: vllm-ascend
  version: "v0.30.0rc2"
  hardware: {Ascend910C_64G}
  model: Qwen3.8-27B-w8a8
  cpu_arch: {aarch64}

upstream_sources:
  - id: vllm_ascend_qwen3_8_27b_w8a8_910c_v030rc2_manual
    kind: manual
    repo: null
    file: null
    url: null
    note: Single-node Ascend 910C launch command supplied for quay.io/ascend/vllm-ascend:v0.30.0rc2-a3. Runtime device visibility, RANK_IP, and inherited Mooncake environment cleanup remain deployment inputs.

model:
  name: Qwen3.8-27B
  provider: Eco-Tech
  model_id: Eco-Tech/Qwen3.8-27B-w8a8
  min_engine_version: v0.30.0rc2
  match:
    - name_pattern: "(?i)^qwen3[.-]8-27b-w8a8$"
  variant_name: Qwen3.8-27B-w8a8

hardware_profile:
  gpu_count: 2
  vram_gb: 128
  multi_node: false

features:
  tool_calling:
    description: Enable Qwen automatic tool calling.
    args: [--enable-auto-tool-choice, --tool-call-parser, qwen3_xml]
  reasoning:
    description: Enable the Qwen reasoning-content parser.
    args: [--reasoning-parser, qwen3]
  spec_decoding:
    description: Enable Qwen MTP speculative decoding with three draft tokens.
    args: [--speculative-config, "{\"method\":\"qwen3_5_mtp\",\"num_speculative_tokens\":3,\"enforce_eager\":true}"]

scenarios:
  standalone:
    source_ref: "vllm_ascend_qwen3_8_27b_w8a8_910c_v030rc2_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Ascend 910C single node TP=2
        default_strategy: true
        engine_config:
          host: "0.0.0.0"
          port: 18000
          served_model_name: qwen3.8
          data_parallel_size: 1
          tensor_parallel_size: 2
          quantization: ascend
          enable_chunked_prefill: true
          enable_prefix_caching: true
          no_disable_hybrid_kv_cache_manager: true
          mamba_cache_mode: align
          max_num_seqs: 32
          max_model_len: 131072
          max_num_batched_tokens: 16384
          gpu_memory_utilization: 0.85
          trust_remote_code: true
          compilation_config:
            cudagraph_mode: FULL_DECODE_ONLY
          additional_config:
            enable_cpu_binding: true
          seed: 1024
        env:
          TZ: Asia/Shanghai
          PYTHONHASHSEED: "0"
          HCCL_BUFFSIZE: "512"
          PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
          VLLM_USE_V2_MODEL_RUNNER: "0"
          VLLM_SERVER_DEV_MODE: "1"
          HCCL_IF_IP: $RANK_IP
          GLOO_SOCKET_IFNAME: $IFACE_NAME
          TP_SOCKET_IFNAME: $IFACE_NAME
          HCCL_SOCKET_IFNAME: $IFACE_NAME
          ACL_OP_INIT_MODE: "1"
          HCCL_INTRA_ROCE_ENABLE: "1"
          ASCEND_GLOBAL_RESOURCE_CONFIG: '{"comm_resource_config.protocol_desc":["roce:device"]}'
        system_setup:
          commands:
            - source /usr/local/Ascend/ascend-toolkit/set_env.sh
            - source /usr/local/Ascend/nnal/atb/set_env.sh

smart_accel:
  standalone:
    source_ref: "vllm_ascend_qwen3_8_27b_w8a8_910c_v030rc2_manual#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
          - name: qwen3_5_mtp
            cli_params:
              speculative_config:
                method: qwen3_5_mtp
                num_speculative_tokens: 3
                enforce_eager: true
            envs: {}
