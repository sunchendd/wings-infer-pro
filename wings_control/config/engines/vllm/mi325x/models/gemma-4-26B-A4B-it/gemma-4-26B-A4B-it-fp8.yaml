# 来源追溯
upstream_sources:
  - id: vllm_recipe_gemma-4-26b-a4b-it
    kind: official_recipe
    repo: recipes
    file: models/Google/gemma-4-26B-A4B-it.yaml
    url: "https://recipes.vllm.ai/Google/gemma-4-26B-A4B-it"
    date_updated: 2026-05-11
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Gemma 4 26B-A4B IT  # 模型名称
  slug: gemma-4-26b-a4b-it  # 模型标识
  provider: Google  # 提供者/厂商
  description: "Google's Gemma 4 MoE multimodal model (26B total / 4B active) with 128 fine-grained experts, top-8 routing, thinking mode, and tool-use protocol."  # 模型描述
  model_id: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 26B  # 总参数量
  active_parameters: 4B  # 激活参数量（MoE 模型）
  context_length: 131072  # 最大上下文长度
  vram_minimum_gb: 32  # 最低显存需求(GB)
  tasks: [multimodal, text]  # 支持的任务类型
  min_engine_version: "0.19.1"  # 最低引擎版本要求
  date_updated: 2026-05-11  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)gemma[-.]?4[-.]?26b[-.]?a4b[-.]?it"
  variant_name: gemma-4-26B-A4B-it-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2048
  multi_node: false

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool choice with Gemma 4 parser and chat template
    args: [--enable-auto-tool-choice, --tool-call-parser, gemma4]
  reasoning:
    description: Enable structured thinking/reasoning output
    args: [--reasoning-parser, gemma4]
  text_only:
    description: Skip loading the vision encoder for text-only workloads — frees VRAM for KV cache. Mutually exclusive with encoder_parallel.
    args: [--language-model-only]
  spec_decoding:
    description: MTP speculative decoding for accelerated inference
    args: [--speculative-config, "{\"model\":\"google/gemma-4-26B-A4B-it-assistant\",\"num_speculative_tokens\":4}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_gemma-4-26b-a4b-it#single_node_dep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_dep:
        display_name: Data + Expert Parallel
        orientation: throughput
        engine_config:
          model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
          kv_cache_dtype: fp8
          enable_expert_parallel: true
          data_parallel_size: 8
        env: {}
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
          kv_cache_dtype: fp8
          enable_expert_parallel: true
          tensor_parallel_size: 8
        env: {}
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
          kv_cache_dtype: fp8
          tensor_parallel_size: 1
        env: {}
  multi_node:
    source_ref: "vllm_recipe_gemma-4-26b-a4b-it#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:  # Head Node 节点配置
          engine_config:
            model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
            kv_cache_dtype: fp8
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:  # Node 1 节点配置
          engine_config:
            model: RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic
            kv_cache_dtype: fp8
            cc.pass_config.fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
