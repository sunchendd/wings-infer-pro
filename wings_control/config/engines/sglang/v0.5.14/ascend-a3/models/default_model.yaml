# 硬件 + 引擎公共默认值

hardware:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

engine:
  name: sglang  # 推理引擎
  version: v0.5.14  # 引擎版本

scenarios:
  standalone:
    source_ref: default#single_node
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        default_strategy: true
        engine_config:
          trust_remote_code: true
          context_length: 4096
          tp_size: 16

  multi_node:
    source_ref: default#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Multi-Node
        default_strategy: true
        head:
          engine_config:
            trust_remote_code: true
            context_length: 4096
            tp_size: 32
            nnodes: 2
            node_rank: 0
            dist_init_addr: "${HEAD_IP}:5000"
          env:
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name
        worker:
          engine_config:
            trust_remote_code: true
            context_length: 4096
            tp_size: 32
            nnodes: 2
            node_rank: 1
            dist_init_addr: "${HEAD_IP}:5000"
          env:
            HCCL_IF_IP: $local_ip
            GLOO_SOCKET_IFNAME: $nic_name
            HCCL_SOCKET_IFNAME: $nic_name

  pd_disaggregation:
    source_ref: default#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
          - role: prefill
            index: 0
            engine_config:
              trust_remote_code: true
              context_length: 4096
              tp_size: 16
              disaggregation_mode: prefill
              disaggregation_transfer_backend: ascend
            env:
              HCCL_IF_IP: $local_ip
              GLOO_SOCKET_IFNAME: $nic_name
              HCCL_SOCKET_IFNAME: $nic_name
          - role: decode
            index: 0
            engine_config:
              trust_remote_code: true
              context_length: 4096
              tp_size: 16
              disaggregation_mode: decode
              disaggregation_transfer_backend: ascend
              dist_init_addr: "${DECODE_NODE_1}:5000"
            env:
              HCCL_IF_IP: $local_ip
              GLOO_SOCKET_IFNAME: $nic_name
              HCCL_SOCKET_IFNAME: $nic_name
