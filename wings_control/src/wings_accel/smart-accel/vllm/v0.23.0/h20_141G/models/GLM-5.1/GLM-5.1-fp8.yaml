# SmartAccel 加速配置(decoding=mtp / kv_offload=cpu / sparse)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
model:
  name: GLM-5.1
  variant_name: "GLM-5.1-fp8"
  match:
    - name_pattern: "(?i)glm[-.]?5[-.]?1"
smart_accel:
  decoding:
    - name: mtp
      cli_params:
        speculative_config:
          method: mtp
          num_speculative_tokens: 3
      envs: {}
  kv_offload:
    - name: cpu
      cli_params:
        kv_transfer_config:
          kv_connector: OffloadingConnector
          kv_role: kv_both
          kv_connector_extra_config:
            cpu_bytes_to_use: "{mem_gb_to_bytes}"
      envs: {}
  sparse:
    - name: performance_first
      cli_params:
        hf_overrides:
          use_index_cache: true
          index_topk_freq: 4
      envs: {}
    - name: accuracy_first
      cli_params:
        hf_overrides:
          use_index_cache: true
          index_topk_freq: 8
      envs: {}
