# SmartAccel 加速配置(decoding=dspark / kv_offload=cpu / sparse=indexcache)
# 模型身份(docs/48:variant_name 精确优先 + name_pattern 家族兜底;variant_name = MaaS 下发的完整 --model-name)
# 按 engine YAML features 生成:decoding=dspark / kv_offload=cpu(native) / sparse=indexcache。
model:
  name: DeepSeek-V4-Flash
  variant_name: "DeepSeek-V4-Flash-0731"
  match:
    - name_pattern: "(?i)deepseek[-.]?v4[-.]?flash-0731"
smart_accel:
  standalone:
    source_ref: smart_accel#standalone
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        default_strategy: true
        decoding:
        - name: dspark
          cli_params:
            speculative_config:
              method: dspark
              num_speculative_tokens: 2
              draft_sample_method: probabilistic
          envs: {}
        kv_offload:
        - name: cpu
          cli_params:
            kv_offloading_backend: native
            kv_offloading_size: '{memory_capacity_gb}'
          envs: {}
        sparse:
        - name: performance_first
          cli_params:
            kv_cache_dtype: fp8
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          cli_params:
            kv_cache_dtype: fp8
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
  multi_node:
    source_ref: smart_accel#multi_node
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
        - name: dspark
          cli_params:
            speculative_config:
              method: dspark
              num_speculative_tokens: 2
              draft_sample_method: probabilistic
          envs: {}
        kv_offload:
        - name: cpu
          cli_params:
            kv_offloading_backend: native
            kv_offloading_size: '{memory_capacity_gb}'
          envs: {}
        sparse:
        - name: performance_first
          cli_params:
            kv_cache_dtype: fp8
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 8
          envs: {}
        - name: accuracy_first
          cli_params:
            kv_cache_dtype: fp8
            hf_overrides:
              use_index_cache: true
              index_topk_freq: 4
          envs: {}
  pd_disaggregation:
    source_ref: smart_accel#pd_cluster
    match:
      distributed: true
      pd_role: null
    strategies:
      pd_cluster:
        display_name: Prefill/Decode Disaggregation
        default_strategy: true
        nodes:
        - role: prefill
          index: 0
          sparse:
          - name: performance_first
            cli_params:
              kv_cache_dtype: fp8
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 8
            envs: {}
          - name: accuracy_first
            cli_params:
              kv_cache_dtype: fp8
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 4
            envs: {}
        - role: decode
          index: 0
          decoding:
          - name: dspark
            cli_params:
              speculative_config:
                method: dspark
                num_speculative_tokens: 2
                draft_sample_method: probabilistic
            envs: {}
          sparse:
          - name: performance_first
            cli_params:
              kv_cache_dtype: fp8
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 8
            envs: {}
          - name: accuracy_first
            cli_params:
              kv_cache_dtype: fp8
              hf_overrides:
                use_index_cache: true
                index_topk_freq: 4
            envs: {}
