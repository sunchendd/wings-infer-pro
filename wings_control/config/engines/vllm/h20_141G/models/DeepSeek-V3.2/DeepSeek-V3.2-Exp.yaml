# 来源追溯
upstream_sources:
  - id: vllm_deepseek-v3.2_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/deepseek-ai/DeepSeek-V3.2"
    date_updated: 2026-07-17
    note: 用户提供 vLLM 启动命令，手工录入。

# 模型基本信息
model:
  name: DeepSeek-V3.2  # 模型名称
  slug: deepseek-v3.2  # 模型标识
  provider: DeepSeek  # 提供者/厂商
  description: "DeepSeek V3.2 MoE model with MLA attention, sparse attention, and scalable RL for strong reasoning and agent capabilities."  # 模型描述
  model_id: deepseek-ai/DeepSeek-V3.2  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 671B  # 总参数量
  active_parameters: 37B  # 激活参数量（MoE 模型）
  context_length: 163840  # 最大上下文长度
  vram_minimum_gb: 768  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-07-17  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)deepseek[-.]?v3.2"
  variant_name: DeepSeek-V3.2-Exp  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU 数量
  vram_gb: 1128  # 单节点总显存(GB)（8 × 141GB）
  multi_node: true  # 支持单节点及多节点场景

# 可选功能列表
features:
  tool_calling:
    description: Enable tool calling with DeepSeek V3.2 chat template support.
    args: [--tokenizer-mode, deepseek_v32, --tool-call-parser, deepseek_v32, --enable-auto-tool-choice]
  reasoning:
    description: Enable reasoning/thinking mode with the DeepSeek V3 reasoning parser.
    args: [--reasoning-parser, deepseek_v3]
  spec_decoding:
    description: Multi-Token Prediction speculative decoding with 3 speculative tokens.
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":3}"]
  sparse_index:
    description: Sparse attention index cache configuration via HF overrides.
    args: [--hf-overrides, "{\"use_index_cache\":true,\"index_topk_freq\":4}"]
  kv_offloading:
    description: KV cache native offloading to reduce GPU memory usage.
    args: [--kv_offloading_backend, "native", --kv_offloading_size, "200"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_deepseek-v3.2_manual#single_node_tp"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: deepseek-ai/DeepSeek-V3.2-Exp
          trust_remote_code: true
          kernel_config.enable_flashinfer_autotune: "False"  # vLLM 原型命令: --kernel-config.enable_flashinfer_autotune=False
          tensor_parallel_size: 8
          kv_cache_dtype: fp8
        env: {}

  multi_node:
    source_ref: vllm_deepseek-v3.2_manual#multi_node_tp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: latency
        default_strategy: true
        head:
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2-Exp
            trust_remote_code: true
            kernel_config.enable_flashinfer_autotune: 'False'
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            kv_cache_dtype: fp8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:
          engine_config:
            model: deepseek-ai/DeepSeek-V3.2-Exp
            trust_remote_code: true
            kernel_config.enable_flashinfer_autotune: 'False'
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            kv_cache_dtype: fp8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
