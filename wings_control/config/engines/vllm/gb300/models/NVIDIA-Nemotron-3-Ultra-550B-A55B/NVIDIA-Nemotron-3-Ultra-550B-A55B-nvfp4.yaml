  reasoning:
    description: Nemotron v3 reasoning parser
    args: [--reasoning-parser, nemotron_v3]
  spec_decoding:
    description: Multi-Token Prediction with 5 speculative tokens
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":5}"]

