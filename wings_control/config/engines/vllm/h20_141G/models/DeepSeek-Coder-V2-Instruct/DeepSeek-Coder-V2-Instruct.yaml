# 来源追溯
upstream_sources:
  - id: vllm_deepseek-coder-v2-instruct_manual
    kind: manual
    repo: null
    file: null
    url: "https://huggingface.co/deepseek-ai/DeepSeek-Coder-V2-Instruct"
    date_updated: 2026-07-27
    note: 用户提供 vLLM H20 141G 单节点启动命令，手工录入。

# 模型基本信息
model:
  name: DeepSeek-Coder-V2-Instruct  # 模型名称
  slug: deepseek-coder-v2-instruct  # 模型标识
  provider: DeepSeek  # 提供者/厂商
  description: "DeepSeek Coder V2 Instruct MoE 代码与通用指令模型。"  # 模型描述
  model_id: deepseek-ai/DeepSeek-Coder-V2-Instruct  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 236B
  active_parameters: 21B
  context_length: 128000
  vram_minimum_gb: 564  # 最低显存需求(GB)（4 × 141GB）
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.23.0"  # 最低引擎版本要求
  date_updated: 2026-07-27  # 录入日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)DeepSeek[-.]?Coder[-.]?V2[-.]?Instruct"
  variant_name: DeepSeek-Coder-V2-Instruct  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU 数量
  vram_gb: 1128  # 单节点总显存(GB)（8 × 141GB）
  multi_node: true  # 支持单节点及多节点场景

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_deepseek-coder-v2-instruct_manual#single_node_tep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        default_strategy: true
        engine_config:
          model: deepseek-ai/DeepSeek-Coder-V2-Instruct
          trust_remote_code: true
          dtype: bfloat16
          max_model_len: 4096
          tensor_parallel_size: 4
          enable_expert_parallel: true
          gpu_memory_utilization: 0.9
          host: "0.0.0.0"
          port: 17000
        env: {}

  multi_node:
    source_ref: vllm_deepseek-coder-v2-instruct_manual#multi_node_tp
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_tp:
        display_name: Multi-Node Tensor Parallel
        orientation: balanced
        default_strategy: true
        head:
          engine_config:
            model: deepseek-ai/DeepSeek-Coder-V2-Instruct
            trust_remote_code: true
            dtype: bfloat16
            max_model_len: 4096
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
            enable_expert_parallel: true
            gpu_memory_utilization: 0.9
            host: 0.0.0.0
            port: 17000
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
        worker:
          engine_config:
            model: deepseek-ai/DeepSeek-Coder-V2-Instruct
            trust_remote_code: true
            dtype: bfloat16
            max_model_len: 4096
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
            master_addr: $HEAD_IP
            headless: true
            enable_expert_parallel: true
            gpu_memory_utilization: 0.9
            host: 0.0.0.0
            port: 17000
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
