    url: "https://recipes.vllm.ai/tencent/Hunyuan-A13B-Instruct"
    date_updated: 2026-04-17
    note: vLLM 官方 recipe。自动生成。

# 模型基本信息
model:
  name: Hunyuan-A13B-Instruct  # 模型名称
  slug: hunyuan-a13b-instruct  # 模型标识
  provider: Hunyuan (Tencent)  # 提供者/厂商
  description: Tencent Hunyuan A13B instruct-tuned MoE language model with AITER-accelerated AMD ROCm deployment  # 模型描述
  model_id: tencent/Hunyuan-A13B-Instruct-FP8  # HuggingFace 模型 ID
  architecture: moe  # 模型架构（dense/moe）
  parameter_count: 80B  # 总参数量
  active_parameters: 13B  # 激活参数量（MoE 模型）
  context_length: 32768  # 最大上下文长度
  vram_minimum_gb: 96  # 最低显存需求(GB)
  tasks: [text]  # 支持的任务类型
  min_engine_version: "0.11.0"  # 最低引擎版本要求
  date_updated: 2026-04-17  # recipe 最后更新日期
  match:  # 模型名匹配规则
    - name_pattern: "(?i)hunyuan[-.]?a13b[-.]?instruct"
  variant_name: Hunyuan-A13B-Instruct-fp8

# 硬件信息
hardware_profile:
  gpu_count: 8
  vram_gb: 2048
  multi_node: false

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_recipe_hunyuan-a13b-instruct#single_node_tep"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node_tep:
        display_name: Tensor + Expert Parallel
        orientation: balanced
        engine_config:
          model: tencent/Hunyuan-A13B-Instruct-FP8
          trust_remote_code: true
          kv_cache_dtype: fp8
          enable_expert_parallel: true
          tensor_parallel_size: 8
        env:
          VLLM_ROCM_USE_AITER: 1
      single_node_tp:
        display_name: Tensor Parallel
        orientation: latency
        default_strategy: true
        engine_config:
          model: tencent/Hunyuan-A13B-Instruct-FP8
          trust_remote_code: true
          kv_cache_dtype: fp8
          tensor_parallel_size: 1
        env:
          VLLM_ROCM_USE_AITER: 1
  multi_node:
    source_ref: "vllm_recipe_hunyuan-a13b-instruct#multi_node_dep"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dep:
        display_name: Multi-Node Data + Expert Parallel
        orientation: throughput
        head:  # Head Node 节点配置
          engine_config:
            model: tencent/Hunyuan-A13B-Instruct-FP8
            trust_remote_code: true
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: tencent/Hunyuan-A13B-Instruct-FP8
            trust_remote_code: true
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            data_parallel_hybrid_lb: true
            data_parallel_size: 16
            data_parallel_size_local: 8
            data_parallel_address: $HEAD_IP
            data_parallel_start_rank: 8
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
      multi_node_tep:
        display_name: Multi-Node Tensor + Expert Parallel
        orientation: balanced
        head:  # Head Node 节点配置
          engine_config:
            model: tencent/Hunyuan-A13B-Instruct-FP8
            trust_remote_code: true
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 0
            master_addr: $HEAD_IP
          env:
            GLOO_SOCKET_IFNAME: $IFACE_NAME
            NCCL_SOCKET_IFNAME: $IFACE_NAME
            VLLM_ROCM_USE_AITER: 1
        worker:  # Node 1 节点配置
          engine_config:
            model: tencent/Hunyuan-A13B-Instruct-FP8
            trust_remote_code: true
            kv_cache_dtype: fp8
            enable_expert_parallel: true
            cc_pass_config_fuse_allreduce_rms: false
            tensor_parallel_size: 16
            nnodes: 2
            node_rank: 1
