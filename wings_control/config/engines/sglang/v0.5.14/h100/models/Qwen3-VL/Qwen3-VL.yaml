# 来源追溯
upstream_sources:
  - id: sglang_qwen3-vl
    kind: cookbook
    repo: sglang
    file: docs_new/cookbook/autoregressive/Qwen/Qwen3-VL.mdx
    url: "https://github.com/sgl-project/sglang/blob/main/docs_new/cookbook/autoregressive/Qwen/Qwen3-VL.mdx"
    note: SGLang 官方 Cookbook 文档。自动生成。

# 模型基本信息
model:
  name: Qwen3-VL  # 模型名称
  provider: Qwen  # 提供者/厂商
  model_id: Qwen/Qwen3-VL-235B-A22B-Instruct  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.5.14  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)qwen3[-.]?vl"
  variant_name: Qwen3-VL  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 8  # 单节点 GPU/NPU 数量
  vram_gb: 640  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 部署场景
scenarios:
  standalone:
    source_ref: "sglang_qwen3-vl#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Single Node
        engine_config:
          model: Qwen/Qwen3-VL-235B-A22B-Instruct
          model_path: Qwen/Qwen3-VL-235B-A22B-Instruct
          host: "0.0.0.0"
          port: 30000
          trust_remote_code: true
          tp_size: 8
          enable_cache_report: true
          log_level: info
          max_running_requests: 64
          mem_fraction_static: 0.65
          chunked_prefill_size: 8192
          attention_backend: fa3
          mm_attention_backend: fa3
          enable_metrics: true
        env:
          SGLANG_VLM_CACHE_SIZE_MB: 0
        default_strategy: true
