# 来源追溯
upstream_sources:
  - id: vllm_ascend_hy3-preview
    kind: official_doc
    repo: vllm-ascend
    file: docs/source/tutorials/models/Hy3-preview.md
    url: "https://github.com/vllm-project/vllm-ascend/blob/releases/v0.21.0rc/docs/source/tutorials/models/Hy3-preview.md"
    note: vLLM Ascend 官方教程文档。自动生成。

# 模型基本信息
model:
  name: Hy3-preview  # 模型名称
  provider: tencent  # 提供者/厂商
  model_id: tencent/Hy3-preview  # HuggingFace/ModelScope 模型 ID
  min_engine_version: v0.21.0rc  # 最低引擎版本要求
  match:  # 模型名匹配规则
    - name_pattern: "(?i)hy3[-.]?preview"
  variant_name: Hy3-preview  # 模型量化版本精确名称

# 硬件信息
hardware_profile:
  gpu_count: 16  # 单节点 GPU/NPU 数量
  vram_gb: 1024  # 单节点总显存(GB)
  multi_node: true  # 是否支持多节点

# 可选功能列表
features:
  tool_calling:
    description: Enable automatic tool/function calling via the model's tool-call parser.
    args: [--enable-auto-tool-choice, --tool-call-parser, hy_v3]
  reasoning:
    description: Enable the model's reasoning-content parser.
    args: [--reasoning-parser, hy_v3]
  spec_decoding:
    description: Speculative decoding (MTP draft) to accelerate generation.
    args: [--speculative-config, "{\"method\":\"mtp\",\"num_speculative_tokens\":1}"]

# 部署场景
scenarios:
  standalone:
    source_ref: "vllm_ascend_hy3-preview#single_node"
    match:
      distributed: false
      pd_role: null
    strategies:
      single_node:
        display_name: Standalone
        default_strategy: true
        engine_config:
          model: "${MODEL_PATH}"
          served_model_name: hy3-preview
          tensor_parallel_size: 16
          enable_expert_parallel: true
          enable_ep_weight_filter: true
          max_model_len: 32768
          max_num_seqs: 8
          host: "0.0.0.0"
          port: 8000
        env:
          MODEL_PATH: /models/Hy3-preview
          HCCL_OP_EXPANSION_MODE: AIV
        system_setup:  # 系统级设置（sysctl / sysfs / 其他命令）
          commands: [cd /workspace]
