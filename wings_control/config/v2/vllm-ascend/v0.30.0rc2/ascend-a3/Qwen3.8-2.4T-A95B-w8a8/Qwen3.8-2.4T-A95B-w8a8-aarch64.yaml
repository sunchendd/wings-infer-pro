# Qwen3.8-2.4T-A95B W8A8 on four Ascend 910C nodes.
#
# Each node owns one data-parallel rank and exposes all 16 local NPUs as a
# TP=16 group. The caller supplies the model path with --model-path; vLLM uses
# that path as the tokenizer default, so no separate tokenizer path is needed.
schema: v2
profile:
  engine: vllm-ascend
  version: "v0.30.0rc2"
  hardware: {Ascend910C_64G}
  model: Qwen3.8-2.4T-A95B-w8a8
  cpu_arch: {aarch64}

upstream_sources:
  - id: vllm_ascend_qwen3_8_2_4t_a95b_w8a8_4node
    kind: manual
    repo: null
    file: null
    url: null
    note: Four-node Ascend 910C launch command supplied for vLLM-Ascend v0.30.0rc2.

model:
  name: Qwen3.8-2.4T-A95B
  provider: Qwen
  model_id: null
  min_engine_version: v0.30.0rc2
  match:
    - name_pattern: "(?i)^qwen3[.-]8-2[.-]4t-a95b-w8a8$"
  variant_name: Qwen3.8-2.4T-A95B-w8a8

hardware_profile:
  gpu_count: 16
  vram_gb: 1024
  multi_node: true

scenarios:
  multi_node:
    source_ref: "vllm_ascend_qwen3_8_2_4t_a95b_w8a8_4node#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node:
        display_name: Four-node DP=4 / TP=16
        default_strategy: true
        head:
          engine_config:
            host: 0.0.0.0
            port: 8000
            served_model_name: qwen3.8
            trust_remote_code: true
            quantization: ascend
            safetensors_load_strategy: lazy
            tensor_parallel_size: 16
            data_parallel_size: 4
            data_parallel_size_local: 1
            data_parallel_start_rank: 0
            data_parallel_address: $local_ip
            data_parallel_rpc_port: 13345
            enable_prefix_caching: true
            enable_expert_parallel: true
            max_model_len: 131072
            max_num_seqs: 8
            max_num_batched_tokens: 16384
            gpu_memory_utilization: 0.85
            speculative_config:
              method: qwen3_5_mtp
              num_speculative_tokens: 1
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            additional_config:
              enable_cpu_binding: true
              enable_fused_mc2: 1
          env:
            HCCL_BUFFSIZE_EP: 2048
            VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: 3000
            HCCL_BUFFSIZE: 1024
            HCCL_IF_IP: $local_ip
            HCCL_INTRA_ROCE_ENABLE: 0
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_SOCKET_IFNAME: $NIC_NAME
            GLOO_SOCKET_IFNAME: $NIC_NAME
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            OPENBLAS_NUM_THREADS: 1
        worker:
          engine_config:
            headless: true
            host: 0.0.0.0
            port: 8000
            served_model_name: qwen3.8
            trust_remote_code: true
            quantization: ascend
            safetensors_load_strategy: lazy
            tensor_parallel_size: 16
            data_parallel_size: 4
            data_parallel_size_local: 1
            # Presence enables worker expansion to start ranks 1, 2, and 3.
            data_parallel_start_rank: 1
            data_parallel_address: $node0_ip
            data_parallel_rpc_port: 13345
            enable_prefix_caching: true
            enable_expert_parallel: true
            max_model_len: 131072
            max_num_seqs: 8
            max_num_batched_tokens: 16384
            gpu_memory_utilization: 0.85
            speculative_config:
              method: qwen3_5_mtp
              num_speculative_tokens: 1
            compilation_config:
              cudagraph_mode: FULL_DECODE_ONLY
            additional_config:
              enable_cpu_binding: true
              enable_fused_mc2: 1
          env:
            HCCL_BUFFSIZE_EP: 2048
            VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: 3000
            HCCL_BUFFSIZE: 1024
            HCCL_IF_IP: $local_ip
            HCCL_INTRA_ROCE_ENABLE: 0
            HCCL_OP_EXPANSION_MODE: AIV
            HCCL_SOCKET_IFNAME: $NIC_NAME
            GLOO_SOCKET_IFNAME: $NIC_NAME
            PYTORCH_NPU_ALLOC_CONF: "expandable_segments:True"
            OPENBLAS_NUM_THREADS: 1

smart_accel:
  multi_node:
    source_ref: "vllm_ascend_qwen3_8_2_4t_a95b_w8a8_4node#multi_node"
    match:
      distributed: true
      pd_role: null
    strategies:
      multi_node_dp:
        default_strategy: true
        decoding:
          - name: qwen3_5_mtp
            cli_params:
              speculative_config:
                method: qwen3_5_mtp
                num_speculative_tokens: 1
            envs: {}
